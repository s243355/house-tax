<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00843d">
<title>信義房仲 考試練習</title>
<style>
:root{
  --green:#00843d; --green-d:#006b31; --green-l:#e6f3ec;
  --ink:#1c1f1d; --sub:#5c6360; --line:#e3e6e4; --bg:#f6f7f6; --card:#ffffff;
  --ok:#0f8a43; --ok-bg:#e7f5ec; --no:#c62f3b; --no-bg:#fbeaeb;
  --star:#e0a400; --accent:#00843d;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
[data-app="agent"]{ --accent:#2557b0; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;transition:background .2s}
.top .brand{font-weight:800;letter-spacing:.5px;font-size:16px;display:flex;align-items:center;gap:8px}
.top .mark{width:22px;height:22px;border-radius:6px;background:#fff;color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:14px}
.top .spacer{flex:1}
.top button.link{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:14px;font-weight:700;padding:7px 12px;border-radius:8px}
.top button.link:active{background:rgba(255,255,255,.28)}
.main{flex:1;padding:16px}

.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));
  color:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.hero h1{margin:0 0 4px;font-size:20px;font-weight:800}
.hero p{margin:0;opacity:.92;font-size:14px}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:10px 8px;text-align:center}
.stat .n{font-size:22px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;opacity:.9;margin-top:2px}

.sec-title{font-size:14px;font-weight:700;color:var(--sub);margin:20px 4px 10px}
.menu{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;text-align:left;box-shadow:var(--sh);color:var(--ink);font-family:inherit;font-size:16px;cursor:pointer}
.mbtn:active{transform:scale(.99);background:#fafbfa}
.mbtn .ico{width:44px;height:44px;border-radius:12px;background:var(--green-l);color:var(--accent);
  display:grid;place-items:center;font-size:22px;flex-shrink:0;font-weight:800}
[data-app="agent"] .mbtn .ico{background:#e8eef9}
.mbtn .tx{flex:1;min-width:0}
.mbtn .tx .t{font-weight:700}
.mbtn .tx .d{font-size:13px;color:var(--sub);margin-top:1px}
.mbtn .cnt{font-size:13px;color:var(--sub);font-weight:700;white-space:nowrap}
.mbtn .arrow{color:var(--sub);font-size:20px}
.mbtn.wrong .ico{background:var(--no-bg);color:var(--no)}
.mbtn.review .ico{background:#fff6de;color:#b9860a}
.mbtn.big{background:var(--accent);border-color:var(--accent);color:#fff}
.mbtn.big .ico{background:rgba(255,255,255,.2);color:#fff}
.mbtn.big .tx .d{color:rgba(255,255,255,.85)}
.mbtn.big .cnt,.mbtn.big .arrow{color:rgba(255,255,255,.9)}
.mbtn:disabled{opacity:.5}

/* landing */
.land-hero{text-align:center;padding:30px 16px 10px}
.land-hero .mk{width:64px;height:64px;border-radius:18px;background:var(--green);color:#fff;display:grid;place-items:center;
  font-size:30px;font-weight:900;margin:0 auto 14px;box-shadow:var(--sh)}
.land-hero h1{margin:0 0 6px;font-size:22px;font-weight:800}
.land-hero p{margin:0;color:var(--sub);font-size:14px}
.pick{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.pcard{display:flex;align-items:center;gap:16px;width:100%;border:none;border-radius:18px;padding:22px 18px;
  text-align:left;color:#fff;font-family:inherit;cursor:pointer;box-shadow:var(--sh)}
.pcard:active{transform:scale(.99)}
.pcard.c1{background:linear-gradient(135deg,#00843d,#00612d)}
.pcard.c2{background:linear-gradient(135deg,#2557b0,#173a80)}
.pcard .pi{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:26px;flex-shrink:0}
.pcard .pt{flex:1}
.pcard .pt .a{font-size:19px;font-weight:800}
.pcard .pt .b{font-size:13px;opacity:.9;margin-top:2px}
.pcard .pa{font-size:24px;opacity:.9}

/* quiz */
.qhead{margin-bottom:12px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qmeta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub)}
.qmeta .tag{background:var(--green-l);color:var(--green-d);font-weight:700;padding:2px 10px;border-radius:99px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-app="agent"] .qmeta .tag{background:#e8eef9;color:#204a94}
.qmeta .live b{color:var(--ok)} .qmeta .live s{color:var(--no);text-decoration:none}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:#eef1ff;color:#204a94;padding:2px 10px;border-radius:99px;font-size:13px}
.timer.warn{background:var(--no-bg);color:var(--no);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.qtext{font-size:17px;font-weight:600;line-height:1.7;margin-bottom:16px}
.qtext .idx{color:var(--accent);font-weight:800;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:14px;text-align:left;font-family:inherit;font-size:15.5px;line-height:1.6;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:active{background:#f7f9f8}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--sub);flex-shrink:0;background:#fff;transition:all .15s}
.opt .otx{flex:1;padding-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.disabled{cursor:default} .opt.dim{opacity:.55}
.opt .badge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;align-self:center;flex-shrink:0}
.opt.correct .badge{background:var(--ok);color:#fff} .opt.wrong .badge{background:var(--no);color:#fff}
.explain{margin-top:16px;border-radius:12px;padding:14px;font-size:14.5px;line-height:1.75;display:none}
.explain.show{display:block;animation:fade .25s}
.explain.pass{background:var(--ok-bg);border:1px solid #bfe6cd}
.explain.fail{background:var(--no-bg);border:1px solid #f2c6ca}
.explain .r{font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:15px}
.explain.pass .r{color:var(--ok)} .explain.fail .r{color:var(--no)}
.explain .lbl{font-weight:800;color:var(--green-d);display:block;margin-bottom:2px}
[data-app="agent"] .explain .lbl{color:#204a94}
.explain .body{color:#25302a}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px}
#view-quiz{padding-bottom:104px}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:640px;margin:0 auto;display:flex;gap:10px;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(246,247,246,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(0,0,0,.06)}
.btn{flex:1;padding:16px;border-radius:12px;border:none;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);flex:0 0 auto;width:56px;font-size:22px}
.btn.ghost.on{color:var(--star);border-color:var(--star)}
.btn:disabled{opacity:.4}

/* result */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--sh);text-align:center}
.ring{width:150px;height:150px;margin:6px auto 14px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .p{font-size:32px;font-weight:900;line-height:1}
.ring .mid .l{font-size:13px;color:var(--sub);margin-top:2px}
.pass-badge{display:inline-block;font-weight:800;font-size:14px;padding:5px 16px;border-radius:99px;margin-bottom:8px}
.pass-badge.y{background:var(--ok-bg);color:var(--ok)} .pass-badge.n{background:var(--no-bg);color:var(--no)}
.rmsg{font-size:17px;font-weight:800;margin-bottom:4px}
.rsub{font-size:14px;color:var(--sub);margin-bottom:16px}
.rgrid{display:flex;gap:10px}
.rgrid .b{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}
.rgrid .b .n{font-size:22px;font-weight:800} .rgrid .b .l{font-size:12px;color:var(--sub)}
.rgrid .b.ok .n{color:var(--ok)} .rgrid .b.no .n{color:var(--no)}

/* browse */
.bfilter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bsel{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:var(--sh)}
.item .h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item .h .tag{font-size:11px;font-weight:800;background:var(--green-l);color:var(--green-d);padding:2px 8px;border-radius:99px}
[data-app="agent"] .item .h .tag{background:#e8eef9;color:#204a94}
.item .h .miss{font-size:11px;font-weight:800;background:var(--no-bg);color:var(--no);padding:2px 8px;border-radius:99px;margin-left:auto}
.item .q{font-weight:600;font-size:15px;line-height:1.6;margin-bottom:10px}
.item .ans{font-size:14px;line-height:1.6;background:var(--ok-bg);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.item .ans b{color:var(--ok)}
.item .ex{font-size:13px;color:#444;line-height:1.7}
.item .ex b{color:var(--green-d)}
.subrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-align:left;box-shadow:var(--sh);font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:8px}
.subrow:active{background:#fafbfa}
.subrow .sn{flex:1;font-weight:700}
.subrow .sc{font-size:13px;color:var(--sub);font-weight:700}
.subrow .miss{font-size:11px;font-weight:800;background:var(--no-bg);color:var(--no);padding:2px 8px;border-radius:99px}
.empty{text-align:center;color:var(--sub);padding:48px 20px}
.empty .e{font-size:44px;margin-bottom:10px}
.empty .t{font-weight:800;font-size:17px;color:var(--ink);margin-bottom:4px}
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.setrow>div:first-child{flex:1}.setrow .t{font-weight:700}.setrow .d{font-size:13px;color:var(--sub);margin-top:1px}
.switch{width:52px;height:30px;border-radius:99px;border:none;background:#d3d7d5;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)} .switch.on i{left:25px}
.foot{text-align:center;color:#9aa19d;font-size:12px;padding:18px 0 26px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark">信</span><span id="topTitle">房仲考試練習</span></div>
    <div class="spacer"></div>
    <button class="link" id="homeBtn" onclick="go('home')" style="display:none">選單</button>
    <button class="link" id="landBtn" onclick="go('landing')" style="display:none">切換考試</button>
  </div>
  <div class="main">

    <!-- LANDING -->
    <section id="view-landing">
      <div class="land-hero">
        <div class="mk">信</div>
        <h1>信義房仲 考試練習</h1>
        <p>選擇要練習的項目</p>
      </div>
      <div class="pick">
        <button class="pcard c1" onclick="openApp('cert')">
          <span class="pi">🏅</span>
          <span class="pt"><span class="a">專業力認證</span><span class="b">信義房仲模擬考 A／B．共 100 題</span></span>
          <span class="pa">›</span>
        </button>
        <button class="pcard c2" onclick="openApp('agent')">
          <span class="pi">📚</span>
          <span class="pt"><span class="a">營業員考試</span><span class="b">不動產營業員題庫．988 題．10 科目．及格 60 分</span></span>
          <span class="pa">›</span>
        </button>
      </div>
      <div class="foot">進度僅儲存於本機瀏覽器</div>
    </section>

    <!-- HOME (dynamic per app) -->
    <section id="view-home" class="hidden">
      <div id="homeBody"></div>
    </section>

    <!-- QUIZ -->
    <section id="view-quiz" class="hidden">
      <div class="qhead">
        <div class="progress"><i id="prog"></i></div>
        <div class="qmeta">
          <span><span class="tag" id="qTag"></span> <span id="qPos"></span></span>
          <span style="display:flex;gap:8px;align-items:center"><span class="timer hidden" id="qTimer"></span><span class="live">已答 <b id="liveOk">0</b> · <s id="liveNo">0</s></span></span>
        </div>
      </div>
      <div class="qcard">
        <div class="qtext" id="qText"></div>
        <div class="opts" id="qOpts"></div>
        <div class="explain" id="qExp">
          <div class="r" id="expR"></div>
          <div class="body"><span class="lbl" id="expLbl">觀念解析</span><span id="expBody"></span></div>
        </div>
      </div>
      <div class="qactions qbar">
        <button class="btn ghost" id="starToggle" onclick="toggleStar()">☆</button>
        <button class="btn primary" id="nextBtn" onclick="next()" disabled>選擇答案</button>
      </div>
    </section>

    <!-- RESULT -->
    <section id="view-result" class="hidden">
      <div class="rcard">
        <div class="ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="64" fill="none" stroke="#eef0ef" stroke-width="14"/>
            <circle id="ringFg" cx="75" cy="75" r="64" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402" style="color:var(--accent)"/>
          </svg>
          <div class="mid"><div class="p" id="rPct">0%</div><div class="l">答對率</div></div>
        </div>
        <div id="rBadge"></div>
        <div class="rmsg" id="rMsg"></div>
        <div class="rsub" id="rSub"></div>
        <div class="rgrid">
          <div class="b ok"><div class="n" id="rOk">0</div><div class="l">答對</div></div>
          <div class="b no"><div class="n" id="rNo">0</div><div class="l">答錯</div></div>
          <div class="b"><div class="n" id="rTot">0</div><div class="l">總題數</div></div>
        </div>
      </div>
      <div class="qactions" style="margin-top:16px">
        <button class="btn ghost" style="width:auto;flex:1;font-size:16px;font-weight:800" onclick="go('home')">回選單</button>
        <button class="btn primary" id="rRetry" onclick="retryWrong()">重練本次錯題</button>
      </div>
      <div id="rList" style="margin-top:16px"></div>
    </section>

    <!-- BROWSE -->
    <section id="view-browse" class="hidden">
      <div id="browseCtrl"></div>
      <div id="browseList"></div>
    </section>

  </div>
</div>

<script>
const CERT = [{"id": "cA1", "cat": "A", "n": 1, "q": "甲售屋給乙，交屋後乙發現房屋裡面有三個白蟻窩，於是向甲主張瑕疵權利，甲主張買賣契約清楚載明「現況交屋」，因此一定不必負責，請問有無理由？", "o": ["有理由", "無理由", "仲介公司認定", "法院認定"], "a": 1, "x": "一般合約書如記載現況交屋，不當然即有免除瑕疵擔保責任之意思，除非雙方有明確免除之意思。法院見解認為，所謂現況是指交屋時雙方共知的現況，題示買方簽約時並不知白蟻存在，因此賣方不可以主張以現況交屋而免除責任。"}, {"id": "cA2", "cat": "A", "n": 2, "q": "一般推估旅館的價格通常用收益法來推估，以下有關價格推估的主張，哪一位同仁有誤：", "o": ["小蕾：先以房間數×房價×365天×住房率＋其他收益來估計可能的毛收益，即可據此推估旅館價格", "小悟：如果旅館的滿租收益率有相對高的穩定性，推估的價格自然會比較高", "小川：旅館價格可依旅館營運者所經營創造的收益，或本身的建築物價值來做推算", "小平：需將旅館的毛收益，扣除人事管銷成本等後的淨收益，來據以推估旅館價格"], "a": 0, "x": "一般推估旅館的價格通常用收益法來推估，所謂的收益係指小平所主張的淨收益，而非小蕾主張的毛收益，因此小蕾的主張有誤。"}, {"id": "cA3", "cat": "A", "n": 3, "q": "申請補發土地所有權狀，依法應該公告多久？", "o": ["15天", "30天", "3個月", "6個月"], "a": 1, "x": "依土地登記規則第155條，申請補發土地所有權狀，依法應該公告30天。"}, {"id": "cA4", "cat": "A", "n": 4, "q": "甲出租房屋給乙，三天後乙搬入居住，並依約繳交房租，下列敘述何者最正確？", "o": ["關於房屋租金之請求權，其消滅時效期間為兩年", "租賃期間若甲將房屋出賣給丙，甲與乙之租賃關係即消滅", "甲若將房屋贈與丁，並移轉房屋所有權給丁，則乙之租賃契約對丁繼續存在", "甲若先後將房屋出賣給戊與辛，則基於優先性之考量，僅甲與戊之買賣契約生效"], "a": 2, "x": "租金請求權，依民法第126條規定為五年，而債權沒有成立時間先後的問題，一律平等。（買賣不破租賃，故租約對受讓人繼續存在）"}, {"id": "cA5", "cat": "A", "n": 5, "q": "以下有關強制執行的說明，何者有誤：", "o": ["係指債權人取得執行名義，向法院聲請強制執行", "強制執行在請求對債務人的財產進行查封、拍賣", "強制債務人履行債務", "私人借據可以作為強制執行的依據"], "a": 3, "x": "私人之間的借據並非政府發給的公文書，無法作為確認債權及強制執行的依據。"}, {"id": "cA6", "cat": "A", "n": 6, "q": "銷售帶租約的住宅產品時，下列敘述何者有誤？", "o": ["屋況概略看過即可，以不打擾承租方為優先", "要清楚知道租約的內容並告知買方", "須告知是否有增建進、以及了解鄰居間相處狀況", "換約時需釐清押金移交"], "a": 0, "x": "為確保每間房間屋況，若盡可能可以看到每間房屋的屋況最佳，以免後續爭議。"}, {"id": "cA7", "cat": "A", "n": 7, "q": "有關新成屋的經營方式何者為是？", "o": ["建立社區服務4.0，當尚未交屋時建立基本專業能力，才能即時有效提供客戶的問題", "交屋完即寄送賀卡，裏頭除介紹自己外，食衣住行育樂資訊都要有，並定錨在客戶心中", "綁定社區與門市的連結、行銷物傘架、魚、樹等，並美盡社區活動內容", "以上皆是"], "a": 3, "x": "選項皆是。"}, {"id": "cA8", "cat": "A", "n": 8, "q": "依據公司買賣契約之約定，如違章建築物部份在交屋前被通知須拆除（或被拆除）者，買賣雙方應如何辦理？", "o": ["由賣方向主管機關陳情", "由買方向主管機關陳情", "由公司委託估價師鑑價後辦理減少價金", "由賣方委託估價師鑑價後辦理減少價金"], "a": 2, "x": "依現行不動產買賣契約約定，若交屋前發生違建被拆除或通知拆除，由公司委託估價師鑑價後辦理減少價金。"}, {"id": "cA9", "cat": "A", "n": 9, "q": "買方交屋後發現有漏水，導致裝潢損失一百萬，請問屋主必須負責嗎？", "o": ["要", "不要", "故意不告知才要", "屋主需負一半費用"], "a": 2, "x": "裝潢損失屬於損害賠償範圍，法律上必須屋主故意不告知或特別保證無瑕疵才可以請求，此部分不是無過失責任。"}, {"id": "cA10", "cat": "A", "n": 10, "q": "以下有關禁止處分的說明，何者正確：", "o": ["發出禁止處分命令的機構有二，一是法院，另一是稅捐處", "為保護受害人受損害賠償的權益，可以向加害人發出禁止處分命令", "加害人發出禁止處分命令，可以是法官，也可以是檢察官", "一般而言，由法院發出禁止處分的情形比稅捐處發出的多"], "a": 3, "x": "由法院發出禁止處分的情形較少，比較多見的是因為積欠國稅或地方稅，而由國稅局或稅捐處發出禁止處分，由地政事務所在欠稅納稅義務人的土地或建物謄本上加註禁止處分，待納稅義務人繳稅後，再行塗銷。"}, {"id": "cA11", "cat": "A", "n": 11, "q": "如果使用遺產分割協議書，需要繳交印花稅多少費用（現值）？", "o": ["千分之一", "百分之一", "十分之一", "無須繳納"], "a": 0, "x": "遺產分割協議書（協議分割）要交印花稅（現值千分之一）。"}, {"id": "cA12", "cat": "A", "n": 12, "q": "買方謝小姐看了房子很喜歡，立即以支票支付斡旋金給小義，以下事項都是小義需加以檢視以避免款項兌現風險，其中哪一項才有符合公司要求：", "o": ["謝小姐開立支票的兌現日期是支付當下的日期，也是所謂的即期支票", "謝小姐開立沒有劃線的支票", "謝小姐開立沒有禁止背書轉讓的支票", "謝小姐沒有在憑證支付處註明收受人"], "a": 0, "x": "若無畫線，代表收受人可要求金融機構支付現金；若無禁背，該支票可背書轉讓；依公司規定以支票支付斡旋金，需載明收受人為安信建築經理股份有限公司或賣方。故只有「即期支票」符合斡旋金收受規定。"}, {"id": "cA13", "cat": "A", "n": 13, "q": "陳媽媽未依規定期限辦理申報房屋稅，因而發生漏稅，除責令補繳應納稅額外，還會照所漏稅額處多少罰鍰？", "o": ["處兩倍以下罰鍰", "處三倍以下罰鍰", "處五倍以下罰鍰", "處十倍以下罰鍰"], "a": 0, "x": "未依規定期限辦理申報房屋稅，因而發生漏稅，除責令補繳應納稅額外，還照所漏稅額處兩倍以下罰鍰。"}, {"id": "cA14", "cat": "A", "n": 14, "q": "斡旋金契約（或要約書）經賣方簽名同意出售後，但經紀人漏未於契約上載明簽立不動產買賣合約之日期，賣方嗣後有悔賣之意，遂主張簽約日未定，下列敘述何者為是？", "o": ["未載明簽約日，只要買方另定適當時間通知賣方出面簽約，作為補正即可", "未載明簽約日，賣方拒不出面簽約即不生違約問題", "因未載明簽約日，買方僅得接受一年後簽約", "因未載明簽約日，斡旋契約無效"], "a": 0, "x": "民法第229條第2項：給付無確定期限者，債務人於債權人得請求給付時，經其催告而未為給付，自受催告時起，負遲延責任。第3項：前項催告定有期限者，債務人自期限屆滿時起負遲延責任。"}, {"id": "cA15", "cat": "A", "n": 15, "q": "公寓大廈的一樓住戶王先生因為想要做個小本生意，經與全體住戶約定讓他在公寓大廈通往室外之庭院出入口擺置麵攤，經營賣麵生意，此舉是否合法？", "o": ["合法，因住戶約定就可以", "不合法，違反公寓大廈管理條例的約定專用限制", "合法，因麵攤不是定著在社區土地上隨時可以推走", "違反禁止任意設攤之相關法規，但沒有違反公寓大廈管理條例"], "a": 1, "x": "公寓大廈管理條例第7條規定，通往室外之通路或門廳等不得為約定專用部分。本題王先生縱使事先與其他住戶約定，仍不能在公寓大廈出入口處擺麵攤。"}, {"id": "cA16", "cat": "A", "n": 16, "q": "管委會主委針對不繳管理費或嚴重違反規約的住戶，是否可以逕行斷水斷電、鎖門、禁止（門禁卡消磁）住戶進住？", "o": ["可以，為了維護整體住戶的利益", "不可以，因為這不是主委的權責", "可以，這是公寓大廈管理條例賦予主委的權責", "可以，但要會同管委與里長"], "a": 1, "x": "公寓大廈管理條例並未賦予管理委員會有禁止住戶使用其所有權之權利，故擅自阻止住戶進入及斷水斷電行為，可能觸犯刑法上妨害他人行使權利之罪名（強制罪）。"}, {"id": "cA17", "cat": "A", "n": 17, "q": "當遇到客戶想要出售或購買的房子不在你的主商圈範圍內時，下列敘述何者錯誤？", "o": ["若要自己服務時，就要對該區域多做功課與了解", "一律拒絕客戶，或是請客戶自行連絡該區域的分店", "如果pass給友店同仁的話，要注意營績分配比例問題", "要pass客戶給友店同事時要做好交接"], "a": 1, "x": "一律拒絕客戶並不是信義人該有的服務態度。"}, {"id": "cA18", "cat": "A", "n": 18, "q": "買方甲交屋後發現房屋有滲水，心想反正暫不入住，等二個月回國後再處理，請問甲回國後再向屋主主張瑕疵擔保，是否有理？", "o": ["有", "沒有", "要看雙方背景", "法院認定"], "a": 1, "x": "買受人應按物之性質，依通常程序從速檢查其所受領之物（民法第356條）。買受人怠於通知者，除依通常檢查不能發見之瑕疵外，視為承認其所受領之物，即喪失瑕疵擔保之權利。"}, {"id": "cA19", "cat": "A", "n": 19, "q": "有關遺產繼承的敘述，下列何者錯誤？", "o": ["配偶不能單獨繼承", "六個月內需申報遺產稅、辦戶繼承登記", "繼承／贈與／遺產稅皆以實際買賣價格計算", "媳婦原則上不能繼承公公遺產"], "a": 2, "x": "繼承／贈與／遺產稅皆以現值計算，非實價登入。"}, {"id": "cA20", "cat": "A", "n": 20, "q": "買方透過本公司成交一房屋，買賣合約書內之成交價為新台幣1000萬元整；買方企圖超貸，乃私下製作一份買賣合約書成交價為新台幣1200萬元整，買方之行為觸犯刑法何罪？", "o": ["偽造變造私文書罪", "偽造變造公文書罪", "妨害信用罪", "誹謗罪"], "a": 0, "x": "刑法第210條規定（偽造變造私文書）：偽造、變造私文書，足以生損害於公眾或他人者，處五年以下有期徒刑。"}, {"id": "cA21", "cat": "A", "n": 21, "q": "關於既成道路下列敘述何者有誤？", "o": ["既成道路是供不特定人通行", "不能任意廢止", "因為是私人的土地所以可以加設圍籬物"], "a": 2, "x": "因為是既成道路，有公用地役權存在，所以不可以任意廢止，不能私自占用，不可以加設圍籬物來阻礙通行。"}, {"id": "cA22", "cat": "A", "n": 22, "q": "房屋稅之納稅義務人未依規定之期限申報，因而發生漏稅者，除責令補繳應納稅額外，並按所漏稅額處幾倍以下罰鍰？", "o": ["一倍", "二倍", "三倍", "四倍"], "a": 1, "x": "處二倍以下罰鍰。"}, {"id": "cA23", "cat": "A", "n": 23, "q": "下列哪一情形，可免徵房屋稅：", "o": ["業經立案之私立學校及學術研究機構，完成財團法人登記者，其供校舍或辦公使用之自有房屋", "業經立案之私立慈善救濟事業，不以營利為目的，完成財團法人登記者，其直接供辦理事業所使用之自有房屋", "無償供政府機關公用或供軍用之房屋", "以上皆是"], "a": 3, "x": "皆符合免徵稅條件。"}, {"id": "cA24", "cat": "A", "n": 24, "q": "「朱太太，我是信義的Mike啦！他們這樣說其實是想辦法『不讓我們成交』！是不是還告訴您手頭上已經有人可以出價更高？或是折讓服務費退給您。所以，朱太太我早說過…」從這段對話中，你可以判斷Mike早就做過哪一點？", "o": ["落實做好回報", "與客戶誠懇溝通", "多聽客戶心聲", "預應同業破壞"], "a": 3, "x": "Mike告訴朱太太『我早說過』，代表有做好預應同業破壞的準備。這題要選「預應同業破壞」。"}, {"id": "cA25", "cat": "A", "n": 25, "q": "阿義無法親自服務時，在做好客戶交接上，應注意事項中，以下何者正確？", "o": ["最好的交接方式是透過電話或通訊軟體來做交接", "要將客戶資訊給友店同仁之前，一定要告知客戶原因並取得同意", "最好的交接方式是由交接方同仁自行面訪客戶", "兩家分店對業績比例的分配，在成交時再行討論確定即可"], "a": 1, "x": "最好的交接方式是與交接方同仁親自面訪客戶以示尊重；業績比例分配兩家分店一開始就要先有共識，並建議留下文字或訊息為證，以避免爭議。"}, {"id": "cA26", "cat": "A", "n": 26, "q": "斡轉定後，買方向左右鄰居詢問，竟得知所承買之標的物3年前曾發生跳樓自殺案件，但賣方認為死亡結果未發生於標的物內，故不同意解約，下列何者正確？", "o": ["買賣雙方必須先簽立不動產買賣合約書後始可辦理解約", "雖然並非死在屋內，但是仍屬於現場之一，故買方可以要求解約", "看跳樓原因，如果是家庭因素才可以", "需當事人死亡於室內始可要求解約"], "a": 1, "x": "依據內政部之解釋，跳樓自殺屬於求死行為，一旦在屋內有求死行為，縱非死於屋內，仍屬於非自然身故之標的。"}, {"id": "cA27", "cat": "A", "n": 27, "q": "商用產品的不動產說明書注意事項上會有很多需要在轉定前約定的提醒項目，以下哪一項不需在轉定前確認：", "o": ["先到建管處申請竣工圖、使照圖、結構圖，查詢違章現況是否有違建增改或被報拆紀錄", "買方公司登記遷出的時間或過往公司來註銷的營業登記", "商用不動產的價格漲跌趨勢以及租金行情", "排除租約或繼受租約"], "a": 2, "x": "「商用不動產的價格漲跌趨勢以及租金行情」係促成交易期間的努力重點，以便買賣雙方成交價格靠近，非屬轉定前的提醒項目。"}, {"id": "cA28", "cat": "A", "n": 28, "q": "住戶規約已明定頂樓平台歸頂樓住戶專有使用，其他住戶能否要求拆除頂樓加蓋？", "o": ["因為規約已明定，故不得要求拆除", "約定由某一戶專用頂樓平台，不代表其可以加蓋建造，故住戶仍可要求拆除", "若有影響結構安全就可以要求拆除，若無影響就不能要求拆除", "頂樓加蓋若有出租就能要求拆除，若無出租就不能要求拆除"], "a": 1, "x": "約定專用限於符合法規限制之利用方式，於頂樓平台加蓋屬於違建行為，顯然已超過住戶合意之權限範圍，故仍得請求拆除。"}, {"id": "cA29", "cat": "A", "n": 29, "q": "請問有關遺產轉移的敘述，下列何者錯誤？", "o": ["配偶不能單獨繼承", "遺產繼承人除配偶外，繼承順序為1.直系血親卑親屬 2.父母 3.兄弟姊妹 4.祖父母", "兩個月內需申報遺產稅、過戶繼承登記", "以協議分割處理可以方便以房養老"], "a": 2, "x": "六個月內需申報遺產稅、過戶繼承登記。"}, {"id": "cA30", "cat": "A", "n": 30, "q": "異業合作你覺得要注意的事情有哪些？", "o": ["找出合作對象的癢點協助解決", "雙向增客", "活動簡單明瞭，異業不用付出大量的人力、成本", "以上皆是"], "a": 3, "x": "選項皆是。"}, {"id": "cA31", "cat": "A", "n": 31, "q": "假設母親有遺產3000萬＋ABC三間房，若以「協議分割」方式處理，請問家中的爸爸、兒子、女兒會如何分到這些財產？", "o": ["三個人各拿1000萬，ABC三間房三位皆有名分", "三個人各拿1000萬，ABC三間房一人一間", "三個人各拿1000萬，ABC三間房三位協議平分", "三個人各拿1000萬，ABC三間房自由平分"], "a": 1, "x": "協議分割會將財產依個數平均分配，不會每個物件都有名分。（協議分割＝一人一間）"}, {"id": "cA32", "cat": "A", "n": 32, "q": "下列何者屬於個人資料？", "o": ["擔任獅子會會長", "擁有不動產之情形", "血型", "以上皆是"], "a": 3, "x": "凡得以直接或間接方式識別該個人之資料者，均屬個人資料。"}, {"id": "cA33", "cat": "A", "n": 33, "q": "在房地合一稅2.0新制中，若想節稅可考慮申請「自住房地租稅優惠」，請問關於自住房地優惠的適用條件何者有「誤」？", "o": ["個人或其配偶、未成年子女於該自住房屋設有戶籍，持有並居住於該房屋連續滿3年", "交易該自住房屋土地的前6年內，未將該房屋土地出租、供營業或執行業務使用", "個人與其配偶及未成年子女於交易自住房屋土地前6年內，未曾適用本自住房地租稅優惠", "課稅所得超過400萬元者，免稅額為400萬元，超過部分並按10%優惠稅率計算應納稅額"], "a": 0, "x": "應為：設有戶籍、持有並居住於該房屋連續滿「6」年（非3年）。"}, {"id": "cA34", "cat": "A", "n": 34, "q": "有關強制執行的裁判，可以分為裁定和判決，以下說明何者有誤：", "o": ["不論是裁定或判決，若有不服，均需在十日內提出上訴或抗告", "若對實體事項作結論時，是為判決；若對程序事項作結論，則為裁定", "若對判決不服，可提出上訴；若對裁定不服，則可提出抗告", "裁定只需進行書面審查，而判決則需進行實質審查，並需出庭當面對質"], "a": 0, "x": "若對裁定不服，可在十日內提出抗告；若對判決不服，可在二十日內提出上訴。（期間不同）"}, {"id": "cA35", "cat": "A", "n": 35, "q": "下列何者不是判斷A、B、C級辦公的主要項目？", "o": ["地段", "門廳", "管理", "室內裝潢"], "a": 3, "x": "室內裝潢非主要判斷依據。"}, {"id": "cA36", "cat": "A", "n": 36, "q": "請問下列何者『非』屬於房地合一稅課徵的交易日期認定基準。", "o": ["完成所有權移轉登記日", "訂定房地買賣契約之日", "預售屋買賣交易日", "符合視為房地交易之股份或出資額交易日"], "a": 1, "x": "成屋買賣以『所有權移轉登記日』為準，其餘預售屋或股權交易皆以契約簽約日為準。"}, {"id": "cA37", "cat": "A", "n": 37, "q": "主管在進行「日常溝通與通訊」時，下列哪種行為已跨越紅線進入「職場霸凌」的範疇？", "o": ["在合理工作時間與頻率內，與部屬討論專案進度", "部屬工作犯錯時，選擇私下嚴厲指正並給予明確改善方法", "非緊急情況下，於下班時間進行長期、密集的訊息轟炸與情緒勒索"], "a": 2, "x": "下班後長期密集訊息轟炸與情緒勒索屬於霸凌行為；合理的績效與指導則屬於合法管理。"}, {"id": "cA38", "cat": "A", "n": 38, "q": "小名想把爸爸的遺產過戶給媽媽，但發現爸爸底下還有一個妹妹，請問他要怎麼做才能將遺產順利過戶給媽媽？", "o": ["以應繼分處理", "以協議分割處理", "媽媽可以直接取得所有財產", "媽媽在協議後可直接取得全部財產"], "a": 1, "x": "應先透過協議分割處理，再以贈與方式將所有權全部給媽媽。"}, {"id": "cA39", "cat": "A", "n": 39, "q": "志明受託出售一間金店面，現有承租方，據賣方表示租金10萬元／月，請問志明是否可以把租賃收益每月10萬元這件事納入廣告用語？", "o": ["可以，因為屋主已經說有出租", "可以，因為符合行情", "不可以，廣告列示具體租金容易引發爭議", "不可以，因為屋主欠服務費"], "a": 2, "x": "營業／出租使用之物件，因承租方可能藉機期前終止租約，故將租金數字列入廣告中易造成糾紛，應予避免。如無法取得租賃契約，廣告不得標明。"}, {"id": "cA40", "cat": "A", "n": 40, "q": "經營社群媒體重視的是什麼？", "o": ["分享很多房子連結", "吸引目光的獨特性", "滿滿的落落長文字分享", "走一個跟自己個性不一樣的路"], "a": 1, "x": "經營社群媒體的重點在於能創造吸引目光的獨特性。"}, {"id": "cA41", "cat": "A", "n": 41, "q": "甲之房屋有壁癌現象，因擔心影響價格，於委託前請人重新粉刷，並要求在買賣契約中約定甲對之後屋況概不負責，交屋後買方果然發現壁癌又復發，請問買方可以要甲負責嗎？（請選最佳答案）", "o": ["可以，因為買方不知情", "可以，因為甲故意欺瞞", "有理由，因為瑕疵擔保責任屋主無過失責任", "不可以，因為已經修過了"], "a": 1, "x": "瑕疵擔保責任可經賣方約定而免除，但前提是賣方不可以有瑕疵不告知之行為，如有故意行為，依民法第366條，其免責約定無效，甚至構成詐欺責任。第1個選項雖沒錯，但非免責約定無效的原因，故不是最佳答案。"}, {"id": "cA42", "cat": "A", "n": 42, "q": "主管針對低績同仁特別安排一對一面談時間及輔導改善計畫，下列哪一項描述正確？", "o": ["主管僅針對績效較低的特定員工進行輔導，已屬差別待遇，因此構成職場霸凌", "只要是針對特定員工進行輔導與改善要求，即代表主管濫用管理權限，應盡免採取此類措施", "若輔導內容係基於客觀績效資料，設定合理明確的改善目標、期限及必要協助措施，屬合理管理範圍，不當然構成職場霸凌"], "a": 2, "x": "主管基於業務需求，針對績效未達標準之員工進行一對一溝通、績效改善輔導（如改善計畫、教育訓練、定期追蹤），屬於正常管理職責，並不會因為「只針對特定人員」就當然構成職場霸凌。"}, {"id": "cA43", "cat": "A", "n": 43, "q": "請問下列關於不動產說明書「內容」的描述，何者有誤？", "o": ["種類中，須包含物件的用途、建材、屋齡、坪數、所有權、他項權利及注意事項等", "費類中，因為每個房屋的交易費用不同，所以於成屋交易再出示交易時所需的費用即可，無須在不動產說明書中提供各項概算金額", "圖類是確認本物件原登記時的人與物與現況是否相符，常使用建物測量成果圖、地籍圖，可確認現況空間是否有增建占用等情況", "委託證明附上屋主簽名的委託書及附近成交行情資訊，是為了讓買賣雙方資訊對等"], "a": 1, "x": "費類一定要包含買賣雙方交易時所需的費用提醒及概算，並附上相關法令規定，以方便同仁向客戶說明。"}, {"id": "cA44", "cat": "A", "n": 44, "q": "要約書、斡旋金契約、定金收據，拒絕給予客戶三天審閱期，買方亦未勾選放棄行使審閱權，效果如何？", "o": ["契約全部無效", "違反消保法規定，消費者得主張部分條款不構成契約內容", "因仲介瑕疵，公司不得向買方收取契費", "若賣主願意出售並成交，買方得拒絕履行買賣契約"], "a": 1, "x": "消保法第11之1條第1項：企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。同條第2項：違反者，其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容。"}, {"id": "cA45", "cat": "A", "n": 45, "q": "關於主管對同仁的「績效要求與工作分配」，下列何者屬於「合理管理」？", "o": ["對全體同仁採一致標準，設定具挑戰性但可達成且能說明理由的目標", "針對特定部屬專案加碼，設定客觀上完全無法達成的績效目標", "利用業務調整名義，刻意將特定同仁邊緣化並給予差別待遇"], "a": 0, "x": "目標具挑戰性但可達成、標準一致且能說明理由者屬合法管理；專挑特定人刁難則屬霸凌。"}, {"id": "cA46", "cat": "A", "n": 46, "q": "有關強制執行的裁判，可以分為裁定和判決，以下說明何者有誤：", "o": ["不論是裁定或判決，若有不服，均需在十日內提出上訴或抗告", "若對實體事項作結論時，是為判決；若對程序事項作結論，則為裁定", "若對判決不服，可提出上訴；若對裁定不服，則可提出抗告", "裁定只需進行書面審查，而判決則需進行實質審查，並需出庭當面對質"], "a": 0, "x": "若對裁定不服，可在十日內提出抗告；若對判決不服，可在二十日內提出上訴。"}, {"id": "cA47", "cat": "A", "n": 47, "q": "哪一個系統可以查詢土地有無供公眾通行之道路？", "o": ["違建查報系統", "全國地政電子謄本系統", "地籍圖資網路便民服務系統"], "a": 2, "x": "地籍圖資網路便民服務系統。"}, {"id": "cA48", "cat": "A", "n": 48, "q": "簽土地委託前，使用土地委託Check List，對簽委託的幫助，何者敘述有誤？", "o": ["可以針對委託標地初步查檢", "若有需委託人配合查詢資料，可事先說明，避免來返確認", "可以快篩出是不是屬於法定空地機率較高者", "可以談到一個好的銷售價格"], "a": 3, "x": "銷售價格須與土地所有權人協商，並非Check List的功能。"}, {"id": "cA49", "cat": "A", "n": 49, "q": "關於土地上有地上物之處理方式敘述，下列何者有誤？", "o": ["詢問所有權人有哪些地上物並請所有權人填寫於契據上", "不用特別理會，因為僅出售土地", "業務仔細查檢現場"], "a": 1, "x": "不能因為僅出售土地就不理會地上物。"}, {"id": "cA50", "cat": "A", "n": 50, "q": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值之多少？", "o": ["百分之一點二", "百分之一點五", "百分之二", "百分之三"], "a": 0, "x": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值之1.2%。"}, {"id": "cB1", "cat": "B", "n": 1, "q": "店長為提升團隊業績，規定每週例會時，由當週績效排名最後一名的同仁站立參與會議，並要求其說明業績未達標原因及改善方式。關於此管理措施，下列何者描述最正確？", "o": ["店長已事先公布規則，且目的是提升業績，因此屬於合理管理措施，員工應配合遵守", "績效表現本來就是員工責任，只要未達成績效目標，採取站立處罰方式屬正常管理，不涉及職場霸凌", "以站立方式要求特定績效較差員工於公開場合接受檢視，除可能具有懲罰性質外，也可能造成公開羞辱，主管應避免採取此類管理方式"], "a": 2, "x": "主管有權進行績效管理（設定目標、檢視成果、要求改善、績效輔導），然而管理方式仍須符合合理性、必要性及尊重人格尊嚴的原則。"}, {"id": "cB2", "cat": "B", "n": 2, "q": "媽媽未得女兒同意，要出售女兒名下的房屋，並且在授權代理人出售的授權書上為女兒簽名，媽媽這種行為，會觸犯什麼罪？", "o": ["背信罪", "侵占罪", "偽造文書罪", "因為他們是母女，所以媽媽替女兒簽名不會構成刑事責任"], "a": 2, "x": "刑法上所謂偽造文書，是以無制作權之人冒用他人名義而制作文書為條件；所謂他人，除自己外，父母、妻子、兄弟均包括在內，不因有親屬關係而例外。"}, {"id": "cB3", "cat": "B", "n": 3, "q": "主動與分店共買客戶接洽時，請協助阿德挑出電話拜訪共享買方客戶時「恰當」的預應。甲：「客戶搬出個資法追問電話號碼哪裡來時，我會如實告知電話是透過何種管道取得」乙：「客戶主動跟我反應某人服務不好時，我直接把電話轉給店長處理」丙：「若客戶表達目前暫無需求，我得恭喜對方成交，並登入系統註記『勿擾』」丁：「若客戶願告知新屋添購的地點，我可以視情況追問原住房子是否有規劃出售」", "o": ["甲乙", "乙丁", "乙丙", "甲丁"], "a": 3, "x": "接洽時應提前主動告知電話取得方式（甲對）；客戶反應同仁服務問題應耐心聽完、事後反應給店長處理，而非直接轉接；系統設[勿擾]是指客戶明示不願受打擾時的註記，而非客戶告知已成交後之作法。故甲、丁恰當。"}, {"id": "cB4", "cat": "B", "n": 4, "q": "下列有關財產交易所得稅（舊制）重購退稅適用要件之敘述，何者正確？", "o": ["於出售自用住宅房屋完成移轉登記日起2年內重購者，先購後售者亦適用之", "重購房屋的市值必須超過出售的房屋市價", "出售或重購之房屋以納稅義務人本人或其配偶名義登記者都可以退稅", "出售土地於出售前半年內未曾供營業使用或出租行為"], "a": 2, "x": "重購退稅要件：1.以2次產權移轉日計算，相距期間應為2年內；2.看土地地價；3.一年內沒有營業使用或出租行為。"}, {"id": "cB5", "cat": "B", "n": 5, "q": "請問有關遺產轉移的敘述，下列何者錯誤？", "o": ["配偶不能單獨繼承", "遺產繼承人除配偶外，繼承順序為1.直系血親卑親屬 2.父母 3.兄弟姊妹 4.祖父母", "兩個月內需申報遺產稅、辦戶繼承登記", "以協議分割處理可以方便以房養老"], "a": 2, "x": "六個月內需申報遺產稅、過戶繼承登記。"}, {"id": "cB6", "cat": "B", "n": 6, "q": "所有權人為境內之「營利事業」，修法後改為適用短期交易重稅並依持有期間課徵不同稅率。關於營利事業所得應適用之房地合一稅率下列何者有「誤」？", "o": ["2年內移轉：課45%", "持有逾2年，未滿5年：課35%", "持有逾5年，未滿10年：課20%", "持有逾10年以上：課15%"], "a": 3, "x": "營利事業課徵之房地合一稅率最低為20%，持有逾10年以上仍然維持20%稅率（而非15%）。"}, {"id": "cB7", "cat": "B", "n": 7, "q": "共用部分、約定共用部分之修繕、管理、維護，以下何者為「非」？", "o": ["由管理負責人為之", "管理委員會為之", "由公共基金支付", "由最近鄰該修繕處所之區分所有權人負擔"], "a": 3, "x": "依公寓大廈管理條例第10條第2項規定，並非由最近該修繕處所之區分所有權人負擔，故選項4為錯誤。"}, {"id": "cB8", "cat": "B", "n": 8, "q": "一般而言，零售商場的租金一般習慣採用什麼制度來計算收益率？", "o": ["固定租金", "抽成", "包底", "包底抽成"], "a": 3, "x": "零售商場的租金一般習慣採用包底抽成制度來計算收益率。"}, {"id": "cB9", "cat": "B", "n": 9, "q": "因他人拋棄繼承而應為繼承之人，為拋棄繼承時，應於知悉其得繼承之日起多久為之？", "o": ["一個月", "二個月", "三個月", "六個月"], "a": 2, "x": "民法第1174條：繼承人得拋棄其繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之。"}, {"id": "cB10", "cat": "B", "n": 10, "q": "以下哪一類法人客戶的財產處分需依法有會員或會員代表過半數之出席，應有出席人數三分之二以上表決同意：", "o": ["股份有限公司", "公益社團法人", "財團法人", "有限合夥公司"], "a": 1, "x": "依人民團體法，公益社團法人其財產之處分應取得會員（代表）大會之決議，應有會員（代表）過半數之出席，出席人數三分之二以上表決同意。"}, {"id": "cB11", "cat": "B", "n": 11, "q": "在房地合一稅2.0新制中，若想節稅可考慮申請「自住房地租稅優惠」，請問關於自住房地優惠的適用條件何者有「誤」？", "o": ["個人或其配偶、未成年子女於該自住房屋設有戶籍，持有並居住於該房屋連續滿3年", "交易該自住房屋土地的前6年內，未將該房屋土地出租、供營業或執行業務使用", "個人與其配偶及未成年子女於交易自住房屋土地前6年內，未曾適用本自住房地租稅優惠", "課稅所得超過400萬元者，免稅額為400萬元，超過部分並按10%優惠稅率計算應納稅額"], "a": 0, "x": "應為：設有戶籍、持有並居住於該房屋連續滿「6」年（非3年）。"}, {"id": "cB12", "cat": "B", "n": 12, "q": "房地合一稅制自105年1月1日生效以來已執行多年，請問本次修法2.0的主要目的與方向為何？", "o": ["抑制個人短期炒作不動產", "防杜個人藉由設立營利事業短期買賣房地，規避稅負", "防杜藉由預售屋交易炒作房地產規避稅負", "防杜利用高於公告土地現值之土地移轉現值方式規避所得稅負", "以上皆是"], "a": 4, "x": "選項皆是。"}, {"id": "cB13", "cat": "B", "n": 13, "q": "小明是頂樓住戶，最近社區決議要與行動通訊業者簽約在頂樓設置基地台，所得作為公共基金，但小明不同意，請問住戶大會這項決議有無問題？", "o": ["沒有，多數決是民主的表現，小明只能遵守", "有問題，因為未經小明同意，所以決議不生效力", "如果出席人數合法就沒有問題", "以上皆非"], "a": 1, "x": "公寓大廈管理條例第33條第2款：於樓頂平臺設置基地台等設備，設置於屋頂者，應經頂層區分所有權人同意。故小明（頂層住戶）不同意，決議有問題。"}, {"id": "cB14", "cat": "B", "n": 14, "q": "專有部分、約定專用部分之修繕、管理、維護，應由何人進行，並負擔其費用？", "o": ["各該區分所有權人", "約定共用部分之使用人", "管理負責人", "管理委員會"], "a": 0, "x": "依公寓大廈管理條例第10條第1項，專有部分、約定專用部分之修繕、管理、維護，由各該區分所有權人為之，並負擔其費用。"}, {"id": "cB15", "cat": "B", "n": 15, "q": "依照房地合一稅2.0之計算公式，若所有權人未提示『相關費用』證明文件者，依照新制之『相關費用』數額應如何認定？", "o": ["成交價額之5%", "成交價額之3%", "金額上限為30萬元", "成交價額之3%且金額上限為30萬元"], "a": 3, "x": "本次修法將個人房地交易推計費用率由5%調降為3%，並同時增訂費用金額上限為新臺幣30萬元。故無法提出證明文件者，課稅所得將提高。"}, {"id": "cB16", "cat": "B", "n": 16, "q": "有關強制執行的裁判，可以分為裁定和判決，以下說明何者有誤：", "o": ["不論是裁定或判決，若有不服，均需在十日內提出上訴或抗告", "若對實體事項作結論時，是為判決；若對程序事項作結論，則為裁定", "若對判決不服，可提出上訴；若對裁定不服，則可提出抗告", "裁定只需進行書面審查，而判決則需進行實質審查，並需出庭當面對質"], "a": 0, "x": "若對裁定不服，可在十日內提出抗告；若對判決不服，可在二十日內提出上訴。"}, {"id": "cB17", "cat": "B", "n": 17, "q": "有關「土壤污染評估調查及檢測資料」，下列敘述何者有誤？", "o": ["中央主管機關公告之事業所使用的土地，在移轉前需要提供「土壤污染評估調查及檢測資料」給地方主管機關備查取得備查函", "若未取得「土壤污染評估調查及檢測資料」備查函，就辦理土地移轉登記，會被處罰緩", "所有的工業用地在移轉前都需要提供「土壤污染評估調查及檢測資料」給地方主管機關備查取得備查函"], "a": 2, "x": "不是所有的工業用地在移轉前都需要提供「土壤污染評估調查及檢測資料」給地方主管機關備查取得備查函。"}, {"id": "cB18", "cat": "B", "n": 18, "q": "依據公司買賣契約之約定，如賣方委託時其社區已經決議須每戶另繳交十萬元作大樓外牆整修費用，但賣方因未住該社區而不知情，交屋後買方才知道此事，請問該費用應由何人負擔？", "o": ["買方", "賣方", "仲介公司", "買賣雙方平均負擔"], "a": 1, "x": "依現行不動產買賣契約約定，若交屋前有重大修繕決議須由住戶另外付費者，賣方應告知買方；如未告知，除買方已知悉者外，應由賣方負擔費用。"}, {"id": "cB19", "cat": "B", "n": 19, "q": "有關新成屋的經營方式何者為是？", "o": ["建立社區服務4.0，當尚未交屋時建立基本專業能力，才能即時有效提供客戶的問題", "交屋完即寄送賀卡，裏頭除介紹自己外，食衣住行育樂資訊都要有，並定錨在客戶心中", "綁定社區與門市的連結、行銷物傘架、魚、樹等，並美盡社區活動內容", "以上皆是"], "a": 3, "x": "選項皆是。"}, {"id": "cB20", "cat": "B", "n": 20, "q": "關於不動產說明書的注意事項，請問何者錯誤？", "o": ["物件有增建或同棟它戶有疑似非自然身故等狀況，一定要在注意事項中詳細記載，並向客戶解說", "若在不動產說明書上有發現不懂的地方，可以參考線上的注意事項解說手冊，或直接詢問店長", "不動產說明書上若有可能因物價指數波動或年度重新公告而更改稅額，皆須註記並提醒客戶", "若所有權人不願意提供物件的用途、建材、屋齡、坪數、所有權、他項權利，不可強制要求提供"], "a": 3, "x": "物件的用途、建材、屋齡、坪數、所有權、他項權利是必須提供的，業務可要求所有權人提供。"}, {"id": "cB21", "cat": "B", "n": 21, "q": "賣方Tina因新買的房子裝潢延期，須延後三個月才能入住，希望新屋屋主讓她再住三個月，買賣雙方同意採用「售後回租」。身為專業房仲，哪一項「不是」你應當發揮的功能？", "o": ["此法可彌補買方雖無入住卻須繳交房貸所產生的利息損失；原屋主Tina也不用多搬一次家", "我會提醒交屋前一定要讓雙方做好屋況確認，避免雙方身份轉換後因原本屋況瑕疵造成爭議", "我會告知客戶Tina，交屋後在回租期間內若有新產生的屋況瑕疵，會由新屋主處理", "由於是售後回租，因此必須在轉屋合約上直接載明因回租而延後交屋的新交屋日期，而非簽訂租賃契約"], "a": 3, "x": "售後回租是在售後發生的權宜型雙方合議租賃行為，與延後交屋無關。應確保Tina與新屋主另簽訂租賃契約，把租金、租期、附贈物、瑕疵處理方式等細項寫清楚，故選項4的作法錯誤。"}, {"id": "cB22", "cat": "B", "n": 22, "q": "小明家中疑似因公共管線漏水遭受波及，為了修繕必須進入樓上阿花家勘查，但阿花拒絕，請問小明在法律上有何權利基礎可以請阿花配合？", "o": ["民法的侵權行為", "刑法的妨害自由", "公寓大廈管理條例的相關規定", "刑法的公共危險罪"], "a": 2, "x": "因修繕專有或共用部分時，如有必要進入任一方之專有部分或約定專用部分時，該住戶不得拒絕。此為公寓大廈管理條例第6條第1項第2款所明定。"}, {"id": "cB23", "cat": "B", "n": 23, "q": "以下貸款條件不佳的物件中，哪一個說明是正確的：", "o": ["只有地上權的物件，因為沒有土地所有權，而不易爭取到好的貸款條件", "工業住宅因為工業區建物需求性低，而不易爭取到好的貸款條件", "隔套收租產品，因為轉手複本率高，而不易爭取到好的貸款條件", "特殊屋況如漏水／海砂／凶宅／傾斜物件，因為銀行作業成本高，而不易爭取到好的貸款條件"], "a": 0, "x": "地上權、工業住宅、隔套收租、特殊屋況都是貸款條件不佳的物件；但選項理由只有「地上權因無土地所有權」是正確的（工業住宅是土地使用分區問題、隔套收租是結構安全疑慮、特殊屋況是根本安全風險，皆與銀行作業成本無關）。"}, {"id": "cB24", "cat": "B", "n": 24, "q": "小花於民國115年死亡，遺有一棟價值1,300萬元的房屋，假設無其他遺產，且暫不考慮其他扣除額，請問應繳納多少遺產稅？", "o": ["130萬元", "133.3萬元", "260萬元", "無須繳納"], "a": 3, "x": "遺產稅免稅額由1200萬（110年）提高至1333萬（111年）。1300萬未超過免稅額，故無須繳納。"}, {"id": "cB25", "cat": "B", "n": 25, "q": "關於張貼「實體廣告」，誰的認知是對的？小天：親自去附近社區的信箱做派報投遞。小賴：將宣傳看板丟置公車站牌下方增加曝光率。小何：將建商建案廣告圍籬同樣做成宣傳單。小田：可先張貼完廣告後再補送廣告核准編號申請。", "o": ["小天", "小賴", "小何", "小田"], "a": 0, "x": "任何類型廣告一定要先取得廣告核准編號才可進行後續動作。小賴放置看板須確認是否影響安全動線；小何不可使用未經著作人授權的圖像；小田必須在申請核准編號後才能張貼。故只有小天正確。"}, {"id": "cB26", "cat": "B", "n": 26, "q": "買方交屋後發現房屋有傾斜，經鑑定後發現是簽約後流程中因隔壁工地施工所致，請問賣方要負責嗎？", "o": ["要", "不要", "不一定", "法院認定"], "a": 0, "x": "瑕疵擔保責任以交付為責任分界基準，交屋前已發生的瑕疵屋主必須負責。本題在簽約後、交屋前發生鄰損傾斜，屋主必須負責。"}, {"id": "cB27", "cat": "B", "n": 27, "q": "下列何者不是評估店面價值關鍵的項目？", "o": ["廣告面寬", "租金投報", "裝潢新舊", "商圈地段"], "a": 2, "x": "評估店面價值關鍵項目為：廣告面寬、租金投報、商圈地段。裝潢新舊非關鍵。"}, {"id": "cB28", "cat": "B", "n": 28, "q": "台東市有一棟正在被法拍的物件，市值1000萬，若進到第四拍，請問拍賣底價可能為多少錢？", "o": ["800萬", "400萬", "640萬", "600萬"], "a": 2, "x": "若進到第四拍會進行減價或另行估價；若選擇減價，則會低於第三拍價格：1000×80%×80%＝640萬。"}, {"id": "cB29", "cat": "B", "n": 29, "q": "為了確保分店現址沒有不符合法規的違建，可以透過哪兩項圖資來做確認？", "o": ["google map＋格局圖", "格局圖＋地籍圖", "建物測量成果圖＋竣工圖", "謄本＋使用執照"], "a": 2, "x": "建物測量成果圖能針對所有權人的建物外框範圍做判斷；是否牽涉違建違法使用則須用竣工圖來確認。"}, {"id": "cB30", "cat": "B", "n": 30, "q": "若所有權人為隱匿名字，可利用「二類謄本查詢」，輸入下列哪個資訊，比對是否為信義經營過的客戶。", "o": ["身分證號碼", "縣市＋姓＋身分證前4碼＋末1碼", "出生年月日", "縣市＋姓＋身分證號碼"], "a": 1, "x": "可於系統上輸入縣市＋姓＋身分證前4碼＋末1碼進行查詢。"}, {"id": "cB31", "cat": "B", "n": 31, "q": "賣方在房屋四周裝設高價之監視器，今出售該屋，於交屋後將監視設備拆走，買方主張屬固定物、賣方不可以拆走，有無理由？", "o": ["有理由", "無理由", "要看價值多寡", "仲介公司認定"], "a": 1, "x": "監視設備雖是固定的，但並非法律上之固定物，亦非建物之一部，因此除非雙方有約定贈與，否則賣方是可以拆走的。"}, {"id": "cB32", "cat": "B", "n": 32, "q": "申請補發土地所有權狀，依法應該公告多久？", "o": ["15天", "30天", "3個月", "6個月"], "a": 1, "x": "依土地登記規則第155條，申請補發土地所有權狀，依法應該公告30天。"}, {"id": "cB33", "cat": "B", "n": 33, "q": "依民法規定，買賣契約是何時成立？", "o": ["簽立買賣契約書時", "買賣雙方就標的物及其價金互相同意時", "賣方收受定金時", "交屋時"], "a": 1, "x": "民法第345條第2項：當事人就標的物及其價金互相同意時，買賣契約即為成立。"}, {"id": "cB34", "cat": "B", "n": 34, "q": "假扣押和假處分的「假」，係指：", "o": ["真真假假的假", "假是暫時之意", "假是提前之意", "與假執行的假同意"], "a": 1, "x": "假扣押和假處分的假是「暫時」之意（暫時扣押、暫時處分）；假執行的假則是提前執行之意，意涵不同，都不是真真假假的假。"}, {"id": "cB35", "cat": "B", "n": 35, "q": "阿義於108年12月1日出售A屋自宅，移轉現值100萬元，已繳土地增值稅10萬元。109年12月購買一棟房子，移轉現值95萬元，登記完成並本人設籍，阿義可申請退還多少土地增值稅稅款？", "o": ["可以退稅，退2萬", "可以退稅，退5萬", "不可以申請退稅", "可以退稅，退10萬"], "a": 1, "x": "原出售土地地價100萬－已繳土增稅10萬＝餘額90萬，只要買超過90萬即可退稅：買91萬退1萬、買92萬退2萬…買95萬退5萬。"}, {"id": "cB36", "cat": "B", "n": 36, "q": "以下同仁在客戶服務範圍是在友店或友區時，判斷是否要親自服務的原則，何者係屬合宜？", "o": ["小平：如果客戶非我服務不可，天涯海角我都親力親為", "小安：PASS給別人自己業績就變少了，堅持不pass", "小順：如果案子太小，不要接比較不會浪費時間", "小新：如果本身對該區域不熟，PASS給當地的分店來服務會是對客戶最有利的方式"], "a": 3, "x": "小平若力有未及，應跟客戶溝通並請當地分店同仁接手服務；小安太自私，沒把客戶利益放前面；小順太勢利眼。故小新最合宜。"}, {"id": "cB37", "cat": "B", "n": 37, "q": "引導買方出價又得同時符合公司理念最好的方式為？", "o": ["銷售前預應案件搶手，決定速度要快", "帶看時加碼促銷力道，爭取當下收斡旋", "平時建立良好信任感，同理心對待", "請同仁陪同帶看，加強促斡力道"], "a": 2, "x": "平時建立良好信任感、同理心對待是最好的方式。"}, {"id": "cB38", "cat": "B", "n": 38, "q": "主席跟馬拉桑買小米酒，並簽發本票給馬拉桑作為擔保，但後主席不付款，馬拉桑可以向法院聲請何種程序保障權益？", "o": ["公示催告", "本票裁定", "除權判決", "公示送達"], "a": 1, "x": "依票據法第123條及非訟事件法規定，可以持本票向法院聲請裁定准予強制執行（本票裁定）。"}, {"id": "cB39", "cat": "B", "n": 39, "q": "某建物共有五戶，大家約定頂樓由其中五樓使用，於是該戶就在頂樓大興土木蓋違建，二樓住戶提出抗議無效，遂向法院起訴，請問誰有理由？", "o": ["五樓有理，因為已經分管", "二樓有理，因為二樓比較大聲", "二樓有理，因為就算有分管協議也不可以蓋違建", "不一定，要看當時其他住戶意見"], "a": 2, "x": "依法院實務見解，頂樓之功能僅止於休憩景觀之用，縱有分管協議也不可以加蓋違建，所以違建必須拆除。"}, {"id": "cB40", "cat": "B", "n": 40, "q": "小明是不動產經紀營業員，當他換證時，必須檢附在中央主管機關認可之機構、團體完成專業訓練多久時間以上之證明文件？", "o": ["15小時以上", "20小時以上", "25小時以上", "30小時以上"], "a": 1, "x": "應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練二十個小時以上之證明文件辦理換證（不動產經紀業管理條例第19條）。"}, {"id": "cB41", "cat": "B", "n": 41, "q": "依不動產經紀業管理條例之規定，下列有關經紀人員業務及責任之敘述，何者有誤？", "o": ["經紀人員不得收取差價", "經紀人員收取差價者，應無息返還支付人", "經紀人員在執行業務過程中，應以經委託人簽章之不動產說明書向買方進行解說", "經紀人員對於因業務所知悉或持有之他人秘密，不得無故洩漏"], "a": 1, "x": "依不動產經紀業管理條例第19條，經紀業或經紀人員不當收取差價或其他報酬者，應於加計利息後加倍返還支付人（非無息返還）。"}, {"id": "cB42", "cat": "B", "n": 42, "q": "買方以第三人之票據（客票）做為斡旋金支票時，應特別注意下列何種事項？", "o": ["請買方於客票簽名背書轉讓給賣方", "電洽銀行詢問支存有無足夠存款", "向銀行辦理票據掛失止付", "將票據拿去貼現後以現金做為斡旋金"], "a": 0, "x": "於票據簽名者始負擔票據責任，且買方未背書轉讓給賣方，賣方無法向銀行提示票據兌現，故應請買方於客票上簽名背書轉讓予賣方。"}, {"id": "cB43", "cat": "B", "n": 43, "q": "甲出租房屋給乙，三天後乙搬入居住，並依約繳交房租，下列敘述何者最正確？", "o": ["關於房屋租金之請求權，其消滅時效期間為兩年", "租賃期間若甲將房屋出賣給丙，甲與乙之租賃關係即消滅", "甲若將房屋贈與丁，並移轉房屋所有權給丁，則乙之租賃契約對丁繼續存在", "甲若先後將房屋出賣給戊與辛，則基於優先性之考量，僅甲與戊之買賣契約生效"], "a": 2, "x": "租金請求權依民法第126條規定為五年，而債權沒有成立時間先後的問題，一律平等。（買賣不破租賃）"}, {"id": "cB44", "cat": "B", "n": 44, "q": "假設父親有遺產3000萬＋ABC三間房，若以「應繼分」方式處理，請問家中的媽媽、兒子、女兒會如何分到這些財產？", "o": ["三個人各拿1000萬，ABC三間房三位皆有名分", "三個人各拿1000萬，ABC三間房一人一間", "三個人各拿1000萬，ABC三間房三位協議平分", "三個人各拿1000萬，ABC三間房自由平分"], "a": 0, "x": "應繼分即為所有財產平均分配（每間房三位皆有應有部分／名分）。"}, {"id": "cB45", "cat": "B", "n": 45, "q": "熊先生買1000萬的房子，已付定金100萬元，但賣方王先生表示後悔不賣，熊先生要求返還100萬元及違約金100萬元共200萬元。為避免王先生脫產，熊先生應採取以下限制登記的哪一項作為：", "o": ["預告登記", "破產登記", "假扣押", "禁止處分"], "a": 2, "x": "由於熊先生要的是金錢的請求，合宜的作為是聲請假扣押，即暫時扣押王先生的房子，待其出售房產可確保獲得給付。"}, {"id": "cB46", "cat": "B", "n": 46, "q": "下列何者非工業用地？", "o": ["非都市地區乙種建築用地", "產業園區", "科技園區"], "a": 0, "x": "非都市地區乙種建築用地不是工業用地。"}, {"id": "cB47", "cat": "B", "n": 47, "q": "「提前預應」可以讓客戶理解同業破壞的話術，請挑出以下四位新人在Line上給客戶的預應中「不合宜」的說帖？", "o": ["小芸：謝謝王大哥給我專任委託的服務機會，如果最近突然有同業主動與您聯繫、直稱手上有客戶可以馬上購買，那很有可能是同業製造假客戶的競爭手段", "小新：陳阿姨，買方目前的出價已經很接近我們的期望價格了，近期如果您有接到同業打給您說價格賣低了、或退服務費的情形，那可能是同業為中斷我們洽談的拖延歡術", "阿齋：張爺爺你要注意，巷口那間xx房屋，聽網路上人家說專門拐騙像您這樣的退休公務員，角色扮演客戶、丟假斡旋，您可別被騙了", "阿敬：呂先生，這是我整理給您的本棟大樓近三年來的成交行情資訊，請您放心，我們不會刻意壓低屋主價格，但競爭的同業還是有可能散發訊息說我們公司如何，但行情資訊都是公開的，我們不可能造假"], "a": 2, "x": "可跟客戶預應同業可能的破壞方式，但切勿加油添醋，甚至傳達網路上的謠言或臆測。阿齋針對特定同業、引用未經查證的資訊，因此不適宜。"}, {"id": "cB48", "cat": "B", "n": 48, "q": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值多少？", "o": ["百分之一點二", "百分之一點五", "百分之二", "百分之三"], "a": 0, "x": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值之1.2%。"}, {"id": "cB49", "cat": "B", "n": 49, "q": "「朱太太，我是信義的Mike啦！…所以，朱太太我早說過…」從這段對話中，你可以判斷Mike早就做過哪一點？", "o": ["落實做好回報", "與客戶誠懇溝通", "多聽客戶心聲", "預應同業破壞"], "a": 3, "x": "Mike告訴朱太太『我早說過』，代表有做好預應同業破壞的準備。這題要選「預應同業破壞」。"}, {"id": "cB50", "cat": "B", "n": 50, "q": "對於沒有繳管理費的住戶，由於金額不大，一般可由管委會主委向法院聲請：", "o": ["支付命令", "假扣押", "假執行", "強制執行"], "a": 0, "x": "當債權金額不大、不值得耗時花錢取得執行名義來確保債權時，可以聲請支付命令為之。"}];
const AGENT = [{"id": "a0", "cat": "土地法", "q": "土地法所稱的公有土地不包括下列那一項？", "o": ["省有土地", "直轄市有土地", "縣有土地", "鄉有土地"], "a": 0, "x": "依據 土地法第4條"}, {"id": "a1", "cat": "土地法", "q": "依土地法規定，下列敘述何者有誤？", "o": ["土地改良物，分為建築改良物及農作改良物", "陽台非屬建築改良物", "附著於土地之建築物及工事為建築改良物", "附著於土地之農作物及其他植物與水利土壤之改良為農作改良物"], "a": 1, "x": "依據 土地法第5條"}, {"id": "a2", "cat": "土地法", "q": "依土地法規定，私有土地所有權消滅者，其土地所有權之歸屬如何認 定？", "o": ["為無主土地", "為國有土地", "為省有土地", "為直轄市或縣市有土地"], "a": 1, "x": "依據 土地法第10條"}, {"id": "a3", "cat": "土地法", "q": "依土地法規定，下列敘述何者有誤？", "o": ["私有土地，因天然變遷成為湖澤，其所有權視為消滅", "私有土地，因天然變遷成為可通運之水道時，其所有權視為消滅", "私有土地所有權消滅者，為權屬未定", "私有土地回復原狀時，經原所有權人證明為其原有者，仍回復其所有權"], "a": 2, "x": "依據 土地法第10、12條"}, {"id": "a4", "cat": "土地法", "q": "依土地法第 14 條規定，不得私有之土地，如已成為私有者，應如何 處理？", "o": ["私有土地所有權視為消滅", "得逕為登記為國有", "得依法徵收之", "得照價收買之"], "a": 2, "x": "依據 土地法第14條"}, {"id": "a5", "cat": "土地法", "q": "依土地法規定，如日據時期原屬私有之土地，台灣光復後登記為公 有，下列何者依法得贈與移轉為私有？", "o": ["名勝古蹟", "礦泉地", "瀑布地", "公有需用水源地"], "a": 0, "x": "依據 土地法第14條"}, {"id": "a6", "cat": "土地法", "q": "依土地法規定，下列敘述何者有誤？", "o": ["礦泉地不得私有", "礦泉地已成為私有者，得依法徵收之", "礦之種類以礦業法所規定者為限", "附著於土地之礦因土地所有權之取得而成為私有"], "a": 3, "x": "依據 土地法第14、15條"}, {"id": "a7", "cat": "土地法", "q": "依土地法規定，私有土地之移轉、設定負擔或租賃，妨害基本國策 者，中央地政機關得報請何機關制止之?", "o": ["行政院", "立法院", "司法院", "監察院"], "a": 0, "x": "依據 土地法第16條"}, {"id": "a8", "cat": "土地法", "q": "依土地法之規定，下列何種土地得移轉於外國人？", "o": ["農地", "林地", "漁地", "水源地"], "a": 0, "x": "依據 土地法第17條"}, {"id": "a9", "cat": "土地法", "q": "依土地法之規定，下列何種土地不得移轉於外國人？", "o": ["建地", "農地", "林地", "牧地"], "a": 2, "x": "依據 土地法第17條"}, {"id": "a10", "cat": "土地法", "q": "依土地法規定，不得移轉於外國人之土地，其移轉原因不包括下列 那一種?", "o": ["買賣", "贈與", "交換", "繼承"], "a": 3, "x": "依據 土地法第17條"}, {"id": "a11", "cat": "土地法", "q": "外國人因繼承取得土地法所定不得移轉給外國人之土地，依法應於 辦理繼承登記完畢後最遲多久期限內出售予本國人？", "o": ["1年", "2年", "3年", "5年"], "a": 2, "x": "依據 土地法第17條"}, {"id": "a12", "cat": "土地法", "q": "外國人在中華民國取得或設定土地權利，下列敘述何者有誤？", "o": ["依條約，中華民國人民得在該國享受同樣權利者為限", "依其本國法律，中華民國人民得在該國享受同樣權利者為限", "外國人在我國得任意取得或設定土地權利", "外國人未經主管機關核准不得取得林地"], "a": 2, "x": "依據 土地法第18、17、19條"}, { 予第三人"], "a": 3, "x": "依據 平均地權條例第47-3條"}, {"id": "a85", "cat": "土地法", "q": "下列有關預售屋銷售之敘述，何者不符平均地權條例之規定 ?", "o": ["銷售預售屋者應於銷售前將預售屋坐落基地及買賣定型化契約以書面報主管機關備查", "起造人或建築業者自行銷售預售屋應於簽訂買賣契約書之日起30日內申報登錄成交案件實際資訊", "銷售預售屋向買受人收受定金應以書面契據確立買賣標的物及價金", "銷售預售屋向買受人收受定金所立契據得轉售予第三人"], "a": 3, "x": "依據 :平均地權條例第47-3條"}, {"id": "a86", "cat": "土地法", "q": "有關預售屋解約申報登錄之敘述，何者不符平均地權條例之規定 ?", "o": ["銷售預售屋者，應於解除買賣契約書之日起三十日內申報。", "預售屋買賣案件申報登錄後，如僅變更不買位於共有部分之停車位時，屬契約變更，免辦理解約申報。", "預售屋買賣案件於申報期間解約，不須申報。", "未依限申報或申報不實，按戶（棟）數及按次罰新台幣3萬元以上15萬元以下。"], "a": 2, "x": "依據 平均地權條例第47-3條"}, {"id": "a87", "cat": "土地法", "q": "下列何者非屬中央主管機關公告之預售屋或新建成屋買受人，於簽 約繳款後，得讓與或轉售之情形？", "o": ["因災害損毀原設籍居住房屋，須另行租屋。", "自願離職", "重大意外事故致第三人傷亡。", "買受人為自然人轉讓給同契約所列其他共同買受人。"], "a": 1, "x": "依據 平均地權條例第47-4條；預售屋及新建成屋買賣契約得讓與或轉售情形第2點"}, {"id": "a88", "cat": "土地法", "q": "有關預售屋或新建成屋買賣契約之買受人讓與或轉售買賣契約與第 三人之敘述，何者不符平均地權條例之規定 ?", "o": ["銷售預售屋或新建成屋者(如建商)，原則得同意或協助買受人將契約讓與或轉售給第三人，並得接受委託刊登讓與或轉售廣告。", "買受人須於契約讓與或轉售前，檢具相關證明文件，以書面向建案基地坐落所在地之直轄市或縣（市）主管機關申請核准後，始得刊登轉售廣告及辦理換約。", "預售屋及新建成屋限制換約規定，不以住宅用房屋為限。", "買受人於完成過戶登記取得建物產權後，就不再受換約限制。"], "a": 0, "x": "依據 平均地權條例第47-4條"}, {"id": "a89", "cat": "土地法", "q": "依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，於簽 訂買賣契約後，不得讓與或轉售買賣契約與第三人，並不得自行或委託 刊登讓與或轉售廣告。下列何者非例外得讓與或轉售之對象？", "o": ["配偶", "直系血親", "二親等內旁系血親", "三親等內旁系血親"], "a": 3, "x": "依據 平均地權條例第47-4條"}, {"id": "a90", "cat": "土地法", "q": "依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，有中 央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核 准者，全國每二年得讓與或轉售之以戶（棟）數，以幾戶（棟）為限？", "o": ["一戶（棟）", "二戶（棟）", "三戶（棟）", "四戶（棟）"], "a": 0, "x": "依據 平均地權條例第47-4條"}, {"id": "a91", "cat": "土地法", "q": "依平均地權條例規定，任何人有下列何種行為時，非屬主管機關得 裁處之情形？", "o": ["以電子通訊、網際網路、說明會或其他傳播方式散布不實資訊，影響不動產交易價格。", "與他人通謀或為虛偽交易，營造不動產交易活絡之表象。", "於直轄市、縣（市）主管機關要求查核時，配合提供有關文件或提出說明。", "自行、以他人名義或集結多數人違規銷售、連續買入或加價轉售不動產，且明顯影響市場秩序或壟斷轉售牟利。"], "a": 2, "x": "依據 平均地權條例第47-5條"}, {"id": "a92", "cat": "土地法", "q": "各級主管機關辦理市地重劃時所擬具之重劃計畫書在公告期間內， 重劃地區私有土地所有權人半數以上表示反對，且符合下列何種情形 時，主管機關應予調處，並參酌反對理由修訂市地重劃計畫書重新報請 上級機關核定 ?", "o": ["反對者所有之土地面積達重劃地區私有土地總面積半數時", "反對者所有之土地面積超過重劃地區私有土地總面積半數以上時", "反對者所有之土地面積達重劃地區土地總面積半  公平交易法第7條"}, {"id": "a309", "cat": "公平交易法", "q": "依公平交易法規定，下列有關事業規模，何者不列入獨占事業認定範 圍？", "o": ["一事業於相關市場之占有率達1/2", "二事業全體於相關市場之占有率達2/3", "三事業全體於相關市場之占有率達3/4", "四事業全體於相關市場之占有率達4/5"], "a": 3, "x": "依據 公平交易法第8條"}, {"id": "a310", "cat": "公平交易法", "q": "依公平交易法規定，一事業於相關市場之占有率達二分之一，其個別 事業於相關市場占有率未達多少，該事業不列入獨占事業之認定範圍?", "o": ["二分之一", "三分之一", "四分之一", "十分之一"], "a": 3, "x": "依據 公平交易法第8條"}, {"id": "a311", "cat": "公平交易法", "q": "依公平交易法規定，二事業於相關市場之占有率達多少，上一會計年 度事業總銷售金額未達主管機關所公告之金額者，該事業不列入獨占事 業之認定範圍?", "o": ["二分之一", "三分之一", "三分之二", "十分之一"], "a": 2, "x": "依據 公平交易法第8條"}, {"id": "a312", "cat": "公平交易法", "q": "依公平交易法規定，三事業於相關市場之占有率達多少，上一會計年 度事業總銷售金額未達主管機關所公告之金額者，該事業不列入獨占事 業之認定範圍?", "o": ["二分之一", "三分之一", "三分之二", "四分之三"], "a": 3, "x": "依據 公平交易法第8條"}, {"id": "a313", "cat": "公平交易法", "q": "依公平交易法規定，下列有關獨占事業之敘述，何者錯誤？", "o": ["事業之設立或事業所提供之商品或服務進入相關市場，受法令、技術之限制，主管機關仍得認定其為獨占事業", "事業之設立或事業所提供之商品或服務進入相關市場，有其他足以影響市場供需可排除競爭能力之情事者，主管機關仍得認定其為獨占事業", "獨占之事業，仍得有對其商品價格或服務報酬，任為決定、維持或變更", "獨占之事業，不得有以不公平之方法，直接或間接阻礙他事業參與競爭"], "a": 2, "x": "依據 公平交易法第8、9條"}, {"id": "a314", "cat": "公平交易法", "q": "依公平交易法規定，獨占之事業不得有之行為，下列敘述何者非屬 之？", "o": ["對商品價格或服務報酬，為不當之決定", "以公平之方法參與競爭", "無正當理由，使交易相對人給予特別優惠", "濫用市場地位之行為"], "a": 1, "x": "依據 公平交易法第9條"}, {"id": "a315", "cat": "公平交易法", "q": "依公平交易法規定，下列有關結合之敘述，何者錯誤？", "o": ["持有他事業之出資額，達到他事業有資本總額1/4以上。", "持有他事業之股份，達到他事業有表決權股份總數1/3以上。", "直接控制他事業之業務經營或人事任免。", "間接控制他事業之業務經營或人事任免。"], "a": 0, "x": "依據 公平交易法第10條"}, {"id": "a316", "cat": "公平交易法", "q": "依公平交易法規定，下列有關結合之敘述，何者錯誤？", "o": ["與他事業合併", "取得他事業之股份，達到他事業有表決權股份總數1/4以上。", "承租他事業全部或主要部分之營業或財產", "承租他事業主要部分之營業或財產"], "a": 1, "x": "依據 公平交易法第10條"}, {"id": "a317", "cat": "公平交易法", "q": "依公平交易法規定，事業結合時，下列何者不屬應先向主管機關提 出申報之情形?", "o": ["同一自然人與其配偶及二親等以內血親事業結合", "事業因結合而使其市場占有率達1/3", "參與結合之一事業，其市場占有率達1/4", "參與結合之事業，其上一會計年度銷售金額，超過主管機關所公告之金額"], "a": 0, "x": "依據 公平交易法第11條"}, {"id": "a318", "cat": "公平交易法", "q": "依公平交易法規定，事業結合時，有下列何種情形者，應先向主管 機關提出申報?", "o": ["事業因結合而使其市場占有率達1/6", "事業因結合而使其市場占有率達1/5", "事業因結合而使其市場占有率達1/4", "事業因結合而使其市場占有率達1/3"], "a": 3, "x": "依據 公平交易法第11條"}, {"id": "a319", "cat": "公平交易法", "q": "依公平交易法規定，參與結合之一事業，其市場占有率至少達多少 時，應先向主管機關提出申報?", "o": ["1/6", "1/5", "1/4", "1/3"], "a": 2, "x": "依據 公平交易法第11條"}, {"id": "a320", "cat": "公平交易法", "q": "依公平交易法規定事業結合時，參與結合之事業，其上一會計年度 銷售金額，超過下列何種情形，應先向主管機關提出申報?", "o": ["前三會計年度平均銷售金額", "前五會計年度平均銷售金額", "前七會計年度平均銷售金額", "主管機關所公告之金額"], "a": 3, "x": "依據 公平交易法第11條"}, {"id": "a321", "cat": "公平交易法", "q": "依公平交易法規定，事業結合時應先向主管機關提出申報，但同一 事業所持有有表決權股份或出資額達多少以上之事業間結合者，不適用 之?", "o": ["百分之二十", "百分之三十", "百分之四十", "百分之五十"], "a": 3, "x": "依據 公平交易法第12條"}, {"id": "a322", "cat": "公平交易法", "q": "依公平交易法規定，事業結合時應先向主管機關提出申報，但單一 事業轉投資成立並持有多少股份或出資額之子公司者，不適用之?", "o": ["百分之百", "百分之八十", "百分之七十", "百分之五十"], "a": 0, "x": "依據 公平交易法第12條"}, {"id": "a323", "cat": "公平交易法", "q": "依公平交易法規定，下列有關稱聯合行為之敘述，何者錯誤？", "o": ["指具競爭關係之同一產銷階段事業，以契約、協議或其他方式之合意，共同決定商品或服務之價格、數量，而足以影響生產、商品交易或服務供需之市場功能者", "所稱其他方式之合意，指契約、協議以外之意思聯絡，不問有無法律拘束力，事實上可導致共同行為者", "同業公會藉章程或會員大會、理、監事會議決議或其他方法所為約束事業活動之行為，非本法所稱之聯合行為", "聯合行為之合意，得依市場狀況、商品或服務特性、成本及利潤考量、事業行為之經濟合理性等相當依據之因素推定之"], "a": 2, "x": "依據 公平交易法第14條"}, {"id": "a324", "cat": "公平交易法", "q": "依公平交易法規定，同業公會藉章程或會員大會、理、監事會議決 議或其他方法所為約束事業活動之行為，為本法所稱之何種行為?", "o": ["獨佔行為", "壟斷行為", "結合行為", "聯合行為"], "a": 3, "x": "依據 公平交易法第14條"}, {"id": "a325", "cat": "公平交易法", "q": "依公平交易法規定，事業之聯合行為，有益於整體經濟與公共利 益，得申請主管機關許可，主管機關收受前項之申請，最遲應於多久內 為決定?", "o": ["1個月內", "2個月內", "3個月內", "6個月內"], "a": 3, "x": "依據 公平交易法第15條"}, {"id": "a326", "cat": "公平交易法", "q": "依公平交易法規定，事業不得為聯合行為。但有益於整體經濟與公 共利益，經申請主管機關許可者，不在此限。下列何者不屬前述例外情 形？", "o": ["為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式", "為促進產業發展、技術創新或經營效率所必要之共同行為", "為促進事業合理經營，而分別作專業發展", "為增進中小企業之營收利益，或增加其盈餘所為之共同行為"], "a": 3, "x": "依據 公平交易法第15條"}, {"id": "a327", "cat": "公平交易法", "q": "有關事業為降低成本或增進效率，而共同研究開發商品、服務或市 場之聯合行為。下列相關敘述何者錯誤？", "o": ["該行為須申請主管機關許可者", "該行為以降低事業成本、增進效率即足", "主管機關對該行為為許可時，得附加條件", "主管機關對該行為為許可後，依規定得令停止"], "a": 1, "x": "依據 公平交易法第15、16、17條"}, {"id": "a328", "cat": "公平交易法", "q": "依公平交易法規定，經申請主管機關許可得為聯合行為者，主管機 關為許可時，下列相關敘述何者錯誤？", "o": ["得附加條件", "得附加負擔", "不得附加條件", "許可應附期限"], "a": 2, "x": "依據 公平交易法第16條"}, {"id": "a329", "cat": "公平交易法", "q": "依公平交易法規定，經申請主管機關許可得為聯合行為者，主管機 關為許可時應附期限，其期限最長不得逾多少年?", "o": ["5年", "7年", "10年", "15年"], "a": 0, "x": "依據 公平交易法第16條"}, {"id": "a330", "cat": "公平交易法", "q": "依公平交易法規定，經申請主管機關許可得為聯合行為者，事業如 有正當理由，得於期限屆滿前在下列何者期間內，以書面向主管機關申 請延展?", "o": ["1個月至3個月", "3個月至6個月", "6個月至9個月", "9個月至12個月"], "a": 1, "x": "依據 公平交易法第16條"}, {"id": "a331", "cat": "公平交易法", "q": "依公平交易法規定，經申請主管機關許可得為聯合行為者，事業如 有正當理由，得於許可期限屆滿前，以書面向主管機關申請延展，其延 展期限每次不得逾多少年?", "o": ["5年", "7年", "10年", "15年"], "a": 0, "x": "依據 公平交易法第16條"}, {"id": "a332", "cat": "公平交易法", "q": "聯合行為經許可後，下列何種情形主管機關依法得廢止許可?", "o": ["經濟情況變更", "營業項目申請變更", "許可期限申請延展", "事業難以繼續維持"], "a": 0, "x": "依據 公平交易法第17條"}, {"id": "a333", "cat": "公平交易法", "q": "依公平交易法規定，主管機關對下列何種行為之許可及其有關之條 件、負擔、期限，應主動公開?", "o": ["結合行為", "獨占行為", "聯合行為", "差別待遇行為"], "a": 2, "x": "依據 公平交易法第18條"}, {"id": "a334", "cat": "公平交易法", "q": "依公平交易法規定，下列有關不公平競爭之敘述，何者錯誤？", "o": ["事業不得在商品或廣告上，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵。", "廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主分別各負損害賠償責任。", "事業對於載有前項虛偽不實或引人錯誤表示之商品，不得販賣、運送輸出或輸入。", "與商品相關而足以影響交易決定之事項，包括商品之價格、數量、品質、內容、使用方法、用途等，及其他具有招徠效果之相關事項"], "a": 1, "x": "依據 公平交易法第21條"}, {"id": "a335", "cat": "公平交易法", "q": "依公平交易法規定，下列有關與廣告主負連帶損害賠償責任之敘 述，何者錯誤？", "o": ["廣告媒體業在明知其所傳播之廣告有引人錯誤之虞，仍予傳播", "廣告代理業在明知情形下，仍製作或設計有引人錯誤之廣告", "廣告薦證者明知其所從事之薦證有引人錯誤之虞，而仍為薦證者", "廣告薦證者非屬知名公眾人物，至少受廣告主報酬15倍之範圍內，與廣告主負連帶損害賠償責任"], "a": 3, "x": "依據 公平交易法第21條"}, {"id": "a336", "cat": "公平交易法", "q": "依公平交易法規定，下列有關與廣告主負連帶損害賠償責任之敘 述，何者錯誤？", "o": ["廣告媒體業在明知其所傳播之廣告有引人錯誤之虞，仍予傳播", "廣告媒體業在可得而知其所傳播之廣告有引人錯誤之虞，仍予傳播", "廣告薦證者僅在明知其所從事之薦證有引人錯誤之虞，而仍為薦證者", "廣告代理業在明知情形下，仍製作或設計有引人錯誤之廣告"], "a": 2, "x": "依據 公平交易法第21條"}, {"id": "a337", "cat": "公平交易法", "q": "依公平交易法規定，廣告薦證者非屬知名公眾人物，至多於受廣告 主報酬幾倍之範圍內，與廣告主負連帶損害賠償責任?", "o": ["1倍", "3倍", "5倍", "10倍"], "a": 3, "x": "依據 公平交易法第21條"}, {"id": "a338", "cat": "公平交易法", "q": "依公平交易法規定，事業對於載有虛偽不實或引人錯誤表示之商 品，得禁止之事項，下列敘述何者錯誤?", "o": ["不得販賣", "得予以運送", "不得輸入", "不得輸出"], "a": 1, "x": "依據 公平交易法第21條"}, {"id": "a339", "cat": "公平交易法", "q": "依公平交易法規定，下列何者為事業就其營業所提供之商品可以有 的行為?", "o": ["以著名之他人商品容器之表徵，於類似之商品為近似之使用，致與他人商品混淆", "以著名之他人包裝之表徵，於類似之商品為近似之使用，致與他人商品混淆", "以未著名且未註冊取得商標權之他人包裝之表徵，善意為相同或近似使用者", "以著名之他人公司商標之表徵，於類似之商品為近似之使用，致與他人商品混淆"], "a": 2, "x": "依據 公平交易法第22條"}, {"id": "a340", "cat": "公平交易法", "q": "主管機關對於涉有違反公平交易法規定，危害公共利益之情事，依 法調查之程序進行，下列敘述何者錯誤？", "o": ["不得扣留調查證據之物", "通知當事人到場陳述意見", "通知當事人提出帳冊或證物", "派員前往當事人之事務所為必要之調查"], "a": 0, "x": "依據 公平交易法第26、27條"}, {"id": "a341", "cat": "公平交易法", "q": "法院因被害人之請求，如為事業之故意行為，得依侵害情節，酌定 損害額以上之賠償。但依法至多不得超過已證明損害額之幾倍？", "o": ["1倍", "3倍", "5倍", "10倍"], "a": 1, "x": "依據 公平交易法第31條"}, {"id": "a342", "cat": "公平交易法", "q": "依公平交易法規定，損害賠償之請求權，自請求權人知有行為及賠 償義務人時起，2 年間不行使而消滅；自為行為時起，至少逾多少年者 亦同？", "o": ["2年", "5年", "10年", "15年"], "a": 2, "x": "依據 公平交易法第32條"}, {"id": "a343", "cat": "公平交易法", "q": "事業關於競爭之行為，優先適用下列何種法規之規定?", "o": ["土地稅法", "公平交易法", "消費者保護法", "民法"], "a": 1, "x": "依據 公平交易法第46條"}, {"id": "a344", "cat": "公平交易法", "q": "依公平交易法規定，主管機關為強化聯合行為查處，促進市場競爭 秩序之健全發展，得設立下列何種基金?", "o": ["反托拉斯基金", "聯合基金", "平均地權基金", "結合基金"], "a": 0, "x": "依據 公平交易法第47-1條"}, {"id": "a345", "cat": "公平交易法", "q": "依公平交易法規定，主管機關所設立反托拉斯基金之來源，以違反 本法所處罰鍰百分之多少而提撥之?", "o": ["百分之三", "百分之十", "百分之二十", "百分之三十"], "a": 3, "x": "依據 公平交易法第47-1條"}, {"id": "a346", "cat": "公平交易法", "q": "不動產經紀業者銷售預售屋時，下列何種行為構成顯失公平行為？", "o": ["書面提供建造執照影本予購屋人審閱", "書面提供預售屋買賣契約書（應含共有部分之項目、面積或比例分攤之計算方式）予購屋人審閱", "書面提供各層平面圖及停車空間平面圖予購屋人審閱", "未以書面提供核准之基地位置圖、地盤圖(坐落基地之地籍圖)、各層平面圖及停車空間平面圖予購屋人審閱"], "a": 3, "x": "依據 公平交易委員會對於預售屋銷售行為案件之處理原則第3點"}, {"id": "a347", "cat": "公平交易法", "q": "不動產經紀業者銷售預售屋時，應提供重要交易資訊予購屋人審閱 之書面不包含何者？", "o": ["核准之基地位置圖、地盤圖(坐落基地之地籍圖)", "土地位於重劃用地限制資訊與所須負擔之重劃費用", "配合建案貸款之金融機構名稱", "建築業者之獲獎紀錄"], "a": 3, "x": "依據 公平交易委員會對於預售屋銷售行為案件之處理原則第3點"}, {"id": "a348", "cat": "公平交易法", "q": "不動產經紀業者銷售預售屋時，下列何者為限制購屋人契約審閱之 顯失公平行為？", "o": ["提供預售屋買賣契約書予購屋人攜回審閱", "簽約前提供購屋人至少五日審閱期", "經購屋人已充分審閱契約並同意縮短期限", "要求購屋人須給付定金始提供預售屋買賣契約書攜回審閱"], "a": 3, "x": "依據 公平交易委員會對於預售屋銷售行為案件之處理原則第4點"}, {"id": "a349", "cat": "公平交易法", "q": "不動產開發業者與購屋人締結預售屋買賣契約後，下列何者構成顯 失公平之行為？", "o": ["將未售出部分逕自變更設計，增加戶數銷售", "經全體購屋人同意變更設計", "經全體購屋人同意增加戶數銷售", "同意給予全體購屋人解除契約或其他和解措施之選擇"], "a": 0, "x": "依據 公平交易委員會對於預售屋銷售行為案件之處理原則第5點"}, {"id": "a350", "cat": "公平交易法", "q": "下列何者屬於適用公平交易法之爭議類型？", "o": ["開工遲延", "以欺瞞、誤導或隱匿重要交易資訊致引人錯誤之方式，從事交易之行為", "施工瑕疵", "交屋遲延"], "a": 1, "x": "依據 公平交易委員會對於預售屋銷售行為案件之處理原則之附表：不適用公平交易法類型之例示、公平交易委員會對於公平交易法第二十五條案件之處理原則第6點"}, {"id": "a351", "cat": "公平交易法", "q": "不動產開發業者或不動產經紀業者銷售預售屋時，未以書面提供下 列重要交易資訊予購屋人審閱，不構成欺罔或顯失公平行為？", "o": ["不動產經紀業者從事不動產買賣之仲介業務時，未以書面告知買方斡旋金契約與內政部版「要約書」之區別及其替代關係", "對賣方隱瞞已有買方斡旋之資訊", "預售屋之銷售，於交屋時就未列入買賣契約共有部分之項目，要求購屋人找補價款", "起造人或建築業者之獲獎紀錄"], "a": 3, "x": "依據 公平交易委員會對於公平交易法第二十五條案件之處理原則第6點第3項第3款、公平交易委員會對於預售屋銷售行為案件之處理原則第5點第2款"}, {"id": "a352", "cat": "公平交易法", "q": "有關公平交易法第二十五條規定：「除本法另有規定者外，事業亦不 得為其他足以影響交易秩序之欺罔或顯失公平之行為」，下列敘述何者 正確﹖", "o": ["本條有優先於公平交易法之其他條文適用之效力", "消費者權益遭受損害，未達「足以影響交易秩序」之要件，亦有本條規定之適用", "本條所稱欺罔，係對於交易相對人，以欺瞞、誤導或隱匿重要交易資訊致引人錯誤之方式，從事交易之行為", "對於單一個別非經常性之交易糾紛，當事人不得尋求民事救濟，僅能依據本條規定主張權利。"], "a": 2, "x": "依據 公平交易委員會對於公平交易法第二十五條案件之處理原則第2、5、6點"}, {"id": "a353", "cat": "公平交易法", "q": "有關公平交易法第二十五條規定：「除本法另有規定者外，事業亦 不得為其他足以影響交易秩序之欺罔或顯失公平之行為」，下列敘述何 者正確﹖", "o": ["本條所稱欺罔，係對於交易相對人，以欺瞞、誤導或隱匿重要交易資訊致引人錯誤之方式，從事交易之行為", "所稱之重要交易資訊，係指不足以影響交易決定之交易資訊", "所稱引人錯誤，係指主觀上不會引起一般大眾所誤認或致交易相對人受騙之可能性", "衡量交易相對人判斷能力之標準，須以極低或特別高之注意程度為判斷標準，而不以一般大眾所能從事之「合理判斷」為基準"], "a": 0, "x": "依據 公平交易委員會對於公平交易法第二十五條案件之處理原則第6點"}, {"id": "a354", "cat": "公平交易法", "q": "下列何者屬於公平交易法所稱隱匿重要交易資訊之欺罔行為？", "o": ["未以書面告知買方斡旋金契約與內政部版「要約書」之區別及其替代關係", "銷售預售屋未提供預售屋買賣契約書說明共有部分之項目、面積或比例分攤之計算方式", "銷售預售屋未提供各層平面圖及停車空間平面圖", "銷售預售屋未提供建造執照影本"], "a": 0, "x": "依據 公平交易委員會對於公平交易法第二十五條案件之處理原則第6點、公平交易委員會對於預售屋銷售行為案件之處理原則第3點"}, {"id": "a355", "cat": "公平交易法", "q": "下列何者不動產廣告非屬虛偽不實或引人錯誤情形之表示或表徵？", "o": ["建造執照尚未核發，而廣告表示有引人誤認已取得建照", "建築物或土地之用途與使用分區(如工業區、商業區、旅館區、農業區等)之法定用途不符，且依法不得變更使用者", "廣告未對建築基地使用限制為「工業區」或「丁種建築用地」充分說明", "廣告表示之房屋或土地總面積與所有權狀登記之面積相符"], "a": 3, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a356", "cat": "公平交易法", "q": "下列敘述何者正確？", "o": ["不動產廣告可以為虛偽不實或引人錯誤之表示或表徵", "建造執照尚未核發，而廣告可以表示已取得建照", "廣告登載之房屋或土地總面積與所有權狀登記之面積應相符", "廣告之建築物或土地用途與使用分區之法定用途可以不相符"], "a": 2, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a357", "cat": "公平交易法", "q": "下列關於不動產廣告之敘述何者正確？", "o": ["不動產廣告可以使用「使用面積」、「受益面積」且不必註明其包括範圍", "不動產廣告刊登之面積應與實際登記面積相符", "廣告之建築物或土地用途與使用分區之法定用途不必相符", "廣告表示建築物座落地點與事實不必相符。"], "a": 1, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a358", "cat": "公平交易法", "q": "下列敘述何者正確？", "o": ["不動產廣告無須明示建築法規對施作夾層之限制(樓層、面積、材質、容積率管制等)", "不動產廣告可以使用「建築面積」、「基地面積」作為建築物面積之表示，而其面積表示之數量與法定用語所應有或登記之面積不必相符", "廣告表示建築物共有設施比例之具體數字與完工建築物不必相符", "廣告表示停車位應與施(竣)工圖相符"], "a": 3, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a359", "cat": "公平交易法", "q": "依據公平交易委員會對於不動產廣告案件之處理原則，下列敘述何 者正確？", "o": ["廣告對公有公共設施(如學校、公園等)之表示與使用廣告當時之客觀狀況或完工後之實際狀況無須相符", "廣告不得以未完成之公共設施或交通道路為表示或表徵，使一般或相關大眾誤認已完成者", "廣告之建築物或土地用途與使用分區之法定用途可以不相符", "廣告對交通狀況、時間或空間距離之表示，無須以通常得使用之道路狀況為計算標準"], "a": 1, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a360", "cat": "公平交易法", "q": "依據公平交易委員會對於不動產廣告案件之處理原則，下列敘述何 者正確？", "o": ["廣告對建築物外在環境、視野、景觀之表示無須與事實相符", "建築物外觀、設計、共有部分之格局配置與廣告無須相符", "建築物外觀、設計、共有部分之格局配置應與廣告表示相符", "廣告登載之房屋或土地總面積與所有權狀登記之面積無須相符"], "a": 2, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a361", "cat": "公平交易法", "q": "下列敘述何者錯誤？", "o": ["不動產廣告不得為虛偽不實或引人錯誤之表示或表徵", "建造執照尚未核發，廣告不得表示已取得建照", "廣告之建築物或土地用途與使用分區之法定用途無須相符", "廣告登載之房屋或土地總面積與所有權狀登記之面積應相符"], "a": 2, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a362", "cat": "公平交易法", "q": "下列敘述何者錯誤？", "o": ["廣告表示溫泉設施，實際給付應符合溫泉法相關法令", "廣告登載之房屋或土地總面積與所有權狀登記之面積應相符", "廣告表示於一定期間之投資報酬率與事實無須相符", "廣告表示之獲獎情形與應與事實相符"], "a": 2, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第3點"}, {"id": "a363", "cat": "公平交易法", "q": "下列有關預售屋廣告之判斷，何者不正確？", "o": ["預售屋廣告是否虛偽不實或引人錯誤，應以廣告主使用廣告時之客觀狀況予以判斷", "所謂之客觀狀況，係指廣告主提供日後給付之能力、法令之規定、建材之供給等", "預售屋廣告之廣告主使用廣告時，已預知或可得知其日後給付之內容無法與廣告相符，則其廣告有虛偽不實或引人錯誤", "廣告表示溫泉設施，實際給付不必符合溫泉法相關法令"], "a": 3, "x": "依據 公平交易委員會對於不動產廣告案件之處理原則第4點、第3點第11款"}, {"id": "a364", "cat": "公平交易法", "q": "下列何者非屬公平交易法所稱顯失公平之競爭或營業行為？", "o": ["進行不當商業干擾，如赴競爭對手交易相對人之處所，散布競爭對手侵權之言論", "事業以警告函等書面方式對其自身或他事業之交易相對人或潛在交易相對人，散發他事業侵害其著作權、商標權或專利權之行為", "以新聞稿或網站等使公眾得知之方式，散布競爭對手侵權之訊息，使交易相對人  "依據 房屋稅條例第12條"}, {"id": "a543", "cat": "房屋稅條例", "q": "依房屋稅條例規定，房屋如有新建、增建或改建而於當期建造完成 者，稽徵機關均須按下列何種比例計課房屋稅？", "o": ["日", "月", "季", "年"], "a": 1, "x": "依據 房屋稅條例第12條"}, {"id": "a544", "cat": "房屋稅條例", "q": "公有房屋免徵房屋稅，下列敘述何者錯誤?", "o": ["各級政府機關及地方自治機關之辦公房屋及其員工宿舍", "市府員工福利餐廳有對外營業", "公立學校、醫院、社會教育學術研究機構及救濟機構之校舍、院舍、辦公房屋及其員工宿舍", "郵政、電信、鐵路、公路、航空、氣象、港務事業，供本身業務所使用之房屋及其員工宿舍"], "a": 1, "x": "依據 房屋稅條例第14條"}, {"id": "a545", "cat": "房屋稅條例", "q": "依房屋稅條例規定，稽徵機關對下列何者應課徵房屋稅？", "o": ["自由業事務所", "公有名勝古蹟", "公有之紀念先賢先烈之祠廟", "公有但由政府供貧民居住之房屋"], "a": 0, "x": "依據 房屋稅條例第14條"}, {"id": "a546", "cat": "房屋稅條例", "q": "依房屋稅條例規定，稽徵機關對下列何者應課徵房屋稅？", "o": ["公立學校辦公房屋及員工宿舍", "公立醫院辦公房屋及員工宿舍", "公有出租營業使用之房屋", "公有農林試驗所用之房屋"], "a": 2, "x": "依據 房屋稅條例第14條"}, {"id": "a547", "cat": "房屋稅條例", "q": "依房屋稅條例規定，私有房屋免徵房屋稅，下列敘述何者錯誤?", "o": ["業經立案之私立學校及學術研究機構，完成財團法人登記者，其供校舍或辦公使用之自有房屋", "專供祭祀用之宗祠、宗教團體供傳教佈道之教堂及寺廟。但以完成財團法人或寺廟登記，且房屋為其所有者為限", "無償供政府機關公用或供軍用之房屋", "公司所有使用之房屋"], "a": 3, "x": "依據 房屋稅條例第15條"}, {"id": "a548", "cat": "房屋稅條例", "q": "依房屋稅條例規定，私有房屋受重大災害，毀損面積佔整棟面積至 少幾成以上，必須修復始能使用之房屋免徵房屋稅?", "o": ["2", "3", "5", "7"], "a": 2, "x": "依據 房屋稅條例第15條"}, {"id": "a549", "cat": "房屋稅條例", "q": "依房屋稅條例規定，私有房屋免徵房屋稅，下列敘述何者錯誤?", "o": ["司法保護事業所有之房屋", "住家房屋現值在新臺幣20萬元以上者", "農會所有之倉庫，專供糧政機關儲存公糧，經主管機關證明者", "經目的事業主管機關許可設立之公益信託，其受託人因該信託關係而取得之房屋，直接供辦理公益活動使用者"], "a": 1, "x": "依據 房屋稅條例第15條"}, {"id": "a550", "cat": "房屋稅條例", "q": "依房屋稅條例規定，有關私有房屋減半徵收房屋稅，下列敘述何者 錯誤?", "o": ["受重大災害，毀損面積佔整棟面積二成以上不及五成之房屋", "政府平價配售之平民住宅", "合法登記之工廠供直接生產使用之自有房屋", "農會所有之自用倉庫及檢驗場，經主管機關證明者"], "a": 0, "x": "依據 房屋稅條例第15條"}, {"id": "a551", "cat": "房屋稅條例", "q": "依房屋稅條例規定，稽徵機關對下列私有房屋，何者應課徵課房屋 稅？", "o": ["私有培植農產品之溫室", "私有存放農業機具倉庫", "私有專供農民自用之稻穀烘乾機房", "不動產經紀業之營業處所"], "a": 3, "x": "依據 房屋稅條例第15條"}, {"id": "a552", "cat": "房屋稅條例", "q": "依房屋稅條例規定，稽徵機關對下列私有房屋，何者應課徵課房屋 稅？", "o": ["工廠", "專供飼養禽畜之房舍", "稻米育苗中心作業室", "人工繁殖場"], "a": 0, "x": "依據 房屋稅條例第15條"}, {"id": "a553", "cat": "房屋稅條例", "q": "依房屋稅條例規定，稽徵機關對下列私有房屋，何者應課徵課房屋 稅？", "o": ["宗教團體供傳教佈道之教堂，完成財團法人登記房屋為其所有者", "業經立案之私立學校完成財團法人登記，其非供校舍或辦公使用之自有房屋", " 例第18條"}, {"id": "a579", "cat": "契稅條例", "q": "依契稅條例規定，主管稽核機關對納稅義務人所檢送表件，如認為有 欠完備或有疑問時，應於收件後最長幾日內通知納稅義務人補正或說 明？", "o": ["5日", "7日", "10日", "15日"], "a": 1, "x": "依據 契稅條例第18條"}, {"id": "a580", "cat": "契稅條例", "q": "凡因下列不動產何種原因而辦理所有權移轉登記者，地政機關應憑繳 納契稅收據、免稅證明書或同意移轉證明書，辦理權利變更登記?", "o": ["租賃", "使用借貸", "抵押", "承典"], "a": 3, "x": "依據 契稅條例第23條"}, {"id": "a581", "cat": "契稅條例", "q": "依契稅條例規定，因不動產買賣、承典、交換、贈與、分割及占有而 辦理所有權登記者，下列何者非屬應附之證明文件之一、辦理權利變更 登記？", "o": ["不計入契價總額證明書", "繳納契稅收據", "免稅證明書", "同意移轉證明書"], "a": 0, "x": "依據 契稅條例第23條"}, {"id": "a582", "cat": "契稅條例", "q": "契稅納稅義務人不依規定期限申報契稅者，每逾多少日，加徵應納稅 額百分之一怠報金。最高以應納稅額為限，但不得超過新台幣一萬 五仟元?", "o": ["2日", "3日", "5日", "10日"], "a": 1, "x": "依據 契稅條例第24條"}, {"id": "a583", "cat": "契稅條例", "q": "契稅納稅義務人不依規定期限繳納稅款者，每逾 2 日，加徵應納稅額 多少之滯納金?", "o": ["1%", "2%", "3%", "5%"], "a": 0, "x": "依據 契稅條例第25條"}, {"id": "a584", "cat": "契稅條例", "q": "納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉 發查明屬實者，除應補繳稅額外，並加處以應納稅額多少倍罰鍰?", "o": ["1倍以上3倍以下", "1倍以上4倍以下", "2倍以上5倍以下", "3倍以上5倍以下"], "a": 0, "x": "依據 契稅條例第26條"}, {"id": "a585", "cat": "契稅條例", "q": "在規定申報繳納契稅期間，因不可抗力致不能如期申報或繳納者，應 於不可抗力之原因消滅後至多幾日內，聲明事由，經查明屬實，免 予加徵怠報金或滯納金?", "o": ["2日", "3日", "5日", "10日"], "a": 3, "x": "依據 契稅條例第30條"}, {"id": "a586", "cat": "契稅條例", "q": "告發或檢舉納稅義務人逃漏、匿報、短報或以其他不正當之行為逃 稅者，稽徵機關得以罰鍰百分之幾獎給舉發人，並為舉發人絕對保 守秘密?", "o": ["5", "10", "20", "30"], "a": 2, "x": "依據 契稅條例第32條"}, {"id": "a587", "cat": "消費者保護法", "q": "依消費者保護法規定，下列有關定型化契約條款之敘述何者錯誤?", "o": ["企業經營者為與多數消費者訂立同類契約之用，所提出預先擬定之契約條款", "定型化契約條款不限於書面", "定型化契約條款得以放映字幕、張貼、牌示、網際網路或其他方法表示", "契約當事人個別磋商而合意之契約條款"], "a": 3, "x": "依據 消費者保護法第2條"}, {"id": "a588", "cat": "消費者保護法", "q": "依消費者保護法規定，下列有關個別磋商條款之敘述，何者正確?", "o": ["經營者與多數消費者訂立契約之用，提出預先擬定之契約條款", "契約當事人個別磋商而合意之契約條款", "經營者逕自以放映字幕、張貼方法表示之契約條款", "經營者逕自以書面表示之契約條款"], "a": 1, "x": "依據 消費者保護法第2條"}, {"id": "a589", "cat": "消費者保護法", "q": "依消費者保護法規定，企業經營者未經邀約而與消費者在其住居所、 工作場所、公共場所或其他場所所訂立之契約。此係指下列何者?", "o": ["訪問交易", "現物交易", "分期付款交易", "寄賣"], "a": 0, "x": "依據 消費者保護法第2條"}, {"id": "a590", "cat": "消費者保護法", "q": "依消費者保護法規定，下列有關訪問交易之敘述，何者錯誤?", "     h+=hero('專業力認證','信義房仲模擬考．A／B 共 100 題',acc,w);
    h+='<div class="sec-title">開始練習</div><div class="menu">';
    h+=mbtn('','A','模擬考 A','第 1～50 題．依序作答','50 題',"start('A')");
    h+=mbtn('','B','模擬考 B','第 1～50 題．依序作答','50 題',"start('B')");
    h+=mbtn('','⚡','隨機測驗','從全題庫抽 20 題','20 題',"start('random')");
    h+='</div>';
  }else{
    h+=hero('營業員考試','988 題 · 10 科目 · 每題 1 分 · 及格 60 分',acc,w);
    h+='<div class="sec-title">快速考試</div><div class="menu">';
    h+=mbtn('big','📝','快速考試（混合科目）','隨機 100 題，限時 60 分鐘，及格 60 分','100 題',"start('quick')");
    h+='</div>';
    h+='<div class="sec-title">科目分開考</div>';
    SUBJECTS.forEach(sj=>{
      const cnt=bank.filter(q=>q.cat===sj.name).length;
      const miss=bank.filter(q=>q.cat===sj.name && state.wrong[q.id]).length;
      h+=`<button class="subrow" onclick="start('subject','${esc(sj.name)}')">`
        +`<span class="sn">${esc(sj.short)}</span>`
        +(miss?`<span class="miss">錯 ${miss}</span>`:'')
        +`<span class="sc">${cnt} 題</span><span class="sc">›</span></button>`;
    });
  }
  h+='<div class="sec-title">加強與複習</div><div class="menu">';
  h+=mbtn('wrong','✕','錯題本重練','只練答錯的題，答對才移除',w+' 題',"start('wrong')",w===0);
  h+=mbtn('review','★','重點標記','練習你標星號的題目',s+' 題',"start('star')",s===0);
  h+=mbtn('','☰','全題庫瀏覽','看題目、正解與依據', (APP==='cert'?'100':'988')+' 題',"go('browse')");
  h+='</div>';
  h+='<div class="sec-title">設定</div>';
  h+=`<div class="setrow"><div><div class="t">答對自動跳下一題</div><div class="d">答錯會停下來讓你看解析</div></div>`
    +`<button class="switch ${state.autoNext?'on':''}" onclick="toggleAuto(this)"><i></i></button></div>`;
  h+='<div class="foot">資料為公告題庫．進度僅存於本機瀏覽器</div>';
  $('#homeBody').innerHTML=h;
}
function hero(title,sub,acc,w){
  return `<div class="hero"><h1>${esc(title)}</h1><p>${esc(sub)}</p>
    <div class="stats">
      <div class="stat"><div class="n">${acc}</div><div class="l">歷史答對率</div></div>
      <div class="stat"><div class="n">${w}</div><div class="l">待複習錯題</div></div>
      <div class="stat"><div class="n">${state.totalDone}</div><div class="l">累計作答</div></div>
    </div></div>`;
}
function mbtn(cls,ico,t,d,cnt,onclick,disabled){
  return `<button class="mbtn ${cls}" onclick="${onclick}" ${disabled?'disabled':''}>
    <span class="ico">${ico}</span>
    <span class="tx"><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span></span>
    <span class="cnt">${esc(cnt)}</span><span class="arrow">›</span></button>`;
}
function toggleAuto(el){ state.autoNext=!state.autoNext; saveState(); el.classList.toggle('on',state.autoNext); }

// ---- session ----
let ses=null, autoTimer=null;
let examTimer=null, timeLeft=0;
function clearAuto(){ if(autoTimer){clearTimeout(autoTimer);autoTimer=null;} }
function stopTimer(){ if(examTimer){clearInterval(examTimer);examTimer=null;} const el=$('#qTimer'); if(el)el.classList.add('hidden'); }
function showTimer(){ const el=$('#qTimer'); el.classList.remove('hidden'); const m=Math.floor(timeLeft/60),s=timeLeft%60; el.textContent='⏱ '+m+':'+String(s).padStart(2,'0'); el.classList.toggle('warn',timeLeft<=300); }
function startTimer(sec){ stopTimer(); timeLeft=sec; showTimer(); examTimer=setInterval(()=>{ timeLeft--; if(timeLeft<=0){ showTimer(); stopTimer(); if(ses){ showResult(true);} } else showTimer(); },1000); }
function start(mode,arg){
  let list=[],title='',exam=false,timed=false;
  if(mode==='A'){list=bank.filter(q=>q.cat==='A');title='模擬考 A';}
  else if(mode==='B'){list=bank.filter(q=>q.cat==='B');title='模擬考 B';}
  else if(mode==='random'){list=shuffle(bank).slice(0,20);title='隨機測驗';}
  else if(mode==='quick'){list=shuffle(bank).slice(0,100);title='快速考試（100題）';exam=true;timed=true;}
  else if(mode==='subject'){list=bank.filter(q=>q.cat===arg);title=SHORT[arg]||arg;exam=true;}
  else if(mode==='wrong'){list=shuffle(bank.filter(q=>state.wrong[q.id]));if(!list.length){alert('目前沒有待複習的錯題');return;}title='錯題本重練';}
  else if(mode==='star'){list=shuffle(bank.filter(q=>state.star[q.id]));if(!list.length){alert('還沒有標記重點題目');return;}title='重點標記';}
  ses={mode,title,list,i:0,ok:0,no:0,wrongIds:[],answered:false,exam,timed};
  go('quiz'); renderQ();
  if(timed) startTimer(60*60);
}
function renderQ(){
  clearAuto();
  const q=ses.list[ses.i];
  $('#qTag').textContent=tagOf(q);
  $('#qPos').textContent=(ses.i+1)+' / '+ses.list.length;
  $('#prog').style.width=(ses.i/ses.list.length*100)+'%';
  $('#liveOk').textContent=ses.ok;$('#liveNo').textContent=ses.no;
  $('#qText').innerHTML='<span class="idx">Q'+(ses.i+1)+'</span>'+esc(q.q);
  const wrap=$('#qOpts');wrap.innerHTML='';
  q.o.forEach((opt,idx)=>{
    const b=document.createElement('button');b.className='opt';b.dataset.i=idx;
    b.innerHTML='<span class="k">'+KEYS[idx]+'</span><span class="otx">'+esc(opt)+'</span>';
    b.onclick=()=>choose(idx);wrap.appendChild(b);
  });
  $('#qExp').className='explain';
  ses.answered=false;
  const nb=$('#nextBtn');nb.disabled=true;nb.textContent='選擇答案';
  const st=$('#starToggle');const on=!!state.star[q.id];st.textContent=on?'★':'☆';st.classList.toggle('on',on);
}
function choose(idx){
  if(ses.answered)return;
  const q=ses.list[ses.i];ses.answered=true;
  const correct=idx===q.a;
  state.totalDone++; if(correct)state.totalOk++;
  if(correct){ses.ok++; if(state.wrong[q.id])delete state.wrong[q.id];}
  else{ses.no++;ses.wrongIds.push(q.id);state.wrong[q.id]=true;}
  saveState();
  document.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i;b.classList.add('disabled');b.onclick=null;
    if(i===q.a){b.classList.add('correct');b.insertAdjacentHTML('beforeend','<span class="badge">正解</span>');}
    else if(i===idx){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span class="badge">你選的</span>');}
    else b.classList.add('dim');
  });
  const exp=$('#qExp');exp.className='explain show '+(correct?'pass':'fail');
  $('#expR').textContent=correct?'✓ 答對了':'✕ 答錯了（已加入錯題本）';
  $('#expLbl').textContent = q.x && q.x.indexOf('依據')===0 ? '法條依據' : '觀念解析';
  $('#expBody').textContent=q.x||'（此題無附解析）';
  $('#liveOk').textContent=ses.ok;$('#liveNo').textContent=ses.no;
  $('#prog').style.width=((ses.i+1)/ses.list.length*100)+'%';
  const nb=$('#nextBtn');nb.disabled=false;nb.textContent=(ses.i+1<ses.list.length)?'下一題':'看結果';
  if(correct && state.autoNext){ autoTimer=setTimeout(()=>{autoTimer=null;next();},800); }
}
function next(){
  clearAuto();
  if(!ses.answered)return;
  if(ses.i+1<ses.list.length){ses.i++;renderQ();window.scrollTo({top:0,behavior:'smooth'});}
  else showResult();
}
function toggleStar(){
  const q=ses.list[ses.i];
  if(state.star[q.id])delete state.star[q.id];else state.star[q.id]=true;
  saveState();const st=$('#starToggle');const on=!!state.star[q.id];st.textContent=on?'★':'☆';st.classList.toggle('on',on);
}
function showResult(timeout){
  stopTimer();
  const tot=ses.list.length,ok=ses.ok,pct=Math.round(ok/tot*100);
  const unans=tot-ok-ses.no;
  $('#rPct').textContent=pct+'%';$('#rOk').textContent=ok;$('#rNo').textContent=ses.no+unans;$('#rTot').textContent=tot;
  $('#ringFg').style.strokeDashoffset=402-402*(pct/100);
  const badge=$('#rBadge');
  if(ses.exam){
    const pass=pct>=60;
    badge.innerHTML=`<div class="pass-badge ${pass?'y':'n'}">${pass?'✓ 合格':'✕ 不合格'}（及格 60 分）</div>`;
  }else badge.innerHTML='';
  let msg,sub;
  if(pct===100){msg='滿分！🎉';sub=ses.title+'．全部答對';}
  else if(pct>=80){msg='表現很好';sub='把錯題本清完更穩';}
  else if(pct>=60){msg=ses.exam?'及格，繼續加強':'及格邊緣';sub='建議馬上重練錯題';}
  else {msg='多練幾次就會了';sub='先從錯題本開始複習';}
  if(timeout) sub='時間到自動交卷'+(unans>0?('，'+unans+' 題未作答'):'')+'．'+sub;
  else if(unans>0) sub=unans+' 題未作答．'+sub;
  $('#rMsg').textContent=msg;$('#rSub').textContent=sub;
  $('#rRetry').style.display=ses.wrongIds.length?'block':'none';
  const list=$('#rList');
  if(ses.wrongIds.length){
    let hh='<div class="sec-title" style="margin-top:4px">本次答錯（'+ses.wrongIds.length+'）</div>';
    ses.wrongIds.forEach(id=>hh+=itemHTML(byId(id),true));list.innerHTML=hh;
  }else list.innerHTML='';
  go('result');window.scrollTo({top:0});
}
function retryWrong(){
  const arr=ses.wrongIds.map(byId);
  ses={mode:'retry',title:'重練錯題',list:shuffle(arr),i:0,ok:0,no:0,wrongIds:[],answered:false,exam:false};
  go('quiz');renderQ();window.scrollTo({top:0});
}

// ---- browse ----
let bFilter='ALL';
function buildBrowseCtrl(){
  const c=$('#browseCtrl');
  if(APP==='cert'){
    c.innerHTML='<div class="bfilter">'
      +chip('ALL','全部')+chip('A','模擬考A')+chip('B','模擬考B')+chip('WRONG','錯題')+'</div>';
  }else{
    let opts='<option value="ALL">全部科目</option><option value="WRONG">只看錯題</option>';
    SUBJECTS.forEach(s=>opts+=`<option value="${esc(s.name)}">${esc(s.short)}（${bank.filter(q=>q.cat===s.name).length}）</option>`);
    c.innerHTML=`<select class="bsel" onchange="bFilter=this.value;renderBrowse()">${opts}</select>`;
  }
}
function chip(f,label){return `<button class="chip ${bFilter===f?'on':''}" onclick="bFilter='${f}';buildBrowseCtrl();renderBrowse()">${label}</button>`;}
function renderBrowse(){
  let list=bank;
  if(bFilter==='WRONG')list=bank.filter(q=>state.wrong[q.id]);
  else if(bFilter!=='ALL')list=bank.filter(q=>q.cat===bFilter);
  const box=$('#browseList');
  if(!list.length){box.innerHTML='<div class="empty"><div class="e">🎯</div><div class="t">沒有題目</div><div>答錯的題會出現在這裡</div></div>';return;}
  // cap very long lists for performance
  const cap=400; const show=list.slice(0,cap);
  box.innerHTML=show.map(q=>itemHTML(q,state.wrong[q.id])).join('')
    +(list.length>cap?`<div class="foot">僅顯示前 ${cap} 題，請用科目篩選縮小範圍</div>`:'');
}
function itemHTML(q,miss){
  return '<div class="item"><div class="h"><span class="tag">'+esc(tagOf(q))+'</span>'
    +(miss?'<span class="miss">待複習</span>':'')+'</div>'
    +'<div class="q">'+esc(q.q)+'</div>'
    +'<div class="ans"><b>正解 '+KEYS[q.a]+'．</b>'+esc(q.o[q.a])+'</div>'
    +(q.x?'<div class="ex"><b>'+(q.x.indexOf('依據')===0?'依據：':'解析：')+'</b>'+esc(q.x.replace(/^依據\s*/,''))+'</div>':'')
    +'</div>';
}

// ---- nav ----
function go(v){
  clearAuto(); if(v!=='quiz') stopTimer();
  ['landing','home','quiz','result','browse'].forEach(x=>$('#view-'+x).classList.toggle('hidden',x!==v));
  $('#homeBtn').style.display=(v==='quiz'||v==='result'||v==='browse')?'inline-block':'none';
  $('#landBtn').style.display=(v!=='landing')?'inline-block':'none';
  if(v==='home'){ document.body.setAttribute('data-app',APP); buildHome(); }
  if(v==='landing'){ $('#topTitle').textContent='房仲考試練習'; document.body.removeAttribute('data-app'); }
  if(v==='browse'){ bFilter='ALL'; buildBrowseCtrl(); renderBrowse(); }
  window.scrollTo({top:0});
}
go('landing');
</script>
</body>
