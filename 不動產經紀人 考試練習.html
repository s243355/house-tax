":"105r23","year":105,"cat":"不動產經紀相關法規概要","n":23,"q":"依消費者保護法規定，企業經營者與消費者分期付款買賣契約的敘述，下列何者正確？","o":["分期付款買賣契約，應以書面載明頭期款、各期價款與其他附加費用","分期付款買賣契約，未載明利率者，其利率按現金交易價格週年利率百分之六計算之","分期付款買賣契約，未載明相關應付款項者，消費者不負現金交易價格加計法定利息以外價款之給付義務","分期付款買賣契約，於消費者要求時，企業經營者應以書面載明消費者應付總價款與現金交易價格之差額"],"a":0},{"id":"105r24","year":105,"cat":"不動產經紀相關法規概要","n":24,"q":"未經消費者要約而對之郵寄或投遞之商品，寄送人未經消費者通知取回，在寄送後逾多少時間未經消費者表示承諾，而仍不取回其商品者，視為拋棄其寄投之商品：","o":["逾1個月","逾2個月","逾3個月","逾6個月"],"a":0},{"id":"105r25","year":105,"cat":"不動產經紀相關法規概要","n":25,"q":"關於定型化契約審閱期的敘述，下列何者正確？","o":["定型化契約條款審閱期如有疑義時，應探求企業經營者之真意，不得拘泥於所用之文字","企業經營者與消費者訂立定型化契約前，應有10日以內之合理期間，供消費者審閱全部條款內容","企業經營者以定型化契約條款使消費者拋棄審閱權利者，雖非無效，但消費者得撤銷其意思表示","違反審閱期規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容"],"a":3},{"id":"105r26","year":105,"cat":"不動產經紀相關法規概要","n":26,"q":"依消費者保護法規定，下列敘述何者正確？","o":["企業經營者於商品或服務具有危害消費者生命、身體、健康、財產之可能者，未於明顯處為警告標示及緊急處理危險之方法者應負賠償責任。但企業經營者能證明其無過失者，法院得減輕或免除其賠償責任","商品或服務因其後有較佳之商品或服務，得被推定不符合當時科技或專業水準可合理期待之安全性","從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，視為從事設計、生產、製造商品或提供服務之企業經營者","企業經營者對消費者或第三人之損害賠償責任，得預先約定限制但不得約定免除"],"a":2},{"id":"105r27","year":105,"cat":"不動產經紀相關法規概要","n":27,"q":"針對臺灣社會發生食品安全問題（如黑心油），消費者得依消費者保護法第50條所定消費者保護團體訴訟（以下簡稱「消保團體訴訟」）尋求救濟。下列敘述何者正確？","o":["多數受害之消費者得申請組成消保團體之組織，以便立即以團體自己名義，逕向法院提起消費者團體損害訴訟","消保團體於受讓20人以上消費者損害賠償請求權，得以自己名義提起訴訟。消費者於言詞辯論終結前，不得終止讓與該損害賠償請求權","消保團體依法提出消保團體訴訟者，應委任律師代理訴訟","消保團體就消費者團體損害賠償訴訟，於扣除訴訟、支付予律師之必要費用以及得向消費者請求之報酬後，將訴訟結果所得之賠償交付該讓與請求權之消費者"],"a":2},{"id":"105r28","year":105,"cat":"不動產經紀相關法規概要","n":28,"q":"企業經營者於下列違反消費者保護法之情形，何者所適用罰則所定之法定罰鍰額度為最高？","o":["地方政府針對企業經營者提供之商品或服務，經調查認為確有損害消費者身體健康者，命其為限期回收或其他必要處置，而企業經營者拒不遵從者","企業經營者未依商品標示法等法令為商品或服務之標示","企業經營者對消費者保證商品或服務之品質時，未主動出具書面保證書","企業經營者使用定型化契約時，拒絕、規避或阻撓主管機關之派員查核"],"a":0},{"id":"105r29","year":105,"cat":"不動產經紀相關法規概要","n":29,"q":"依消費者保護法規定，定型化契約條款於下列何種情形，可認為並非違反平等互惠原則？","o":["當事人間之給付與對待給付顯不相當者","當事人一方之企業經營者，就系爭商品或服務之市場占有率規模超過50%者","消費者負擔非其所能控制之危險者","消費者違約時，應負擔顯不相當之賠償責任者"],"a":1},{"id":"105r30","year":105,"cat":"不動產經紀相關法規概要","n":30,"q":"甲於乙商店購得丙手機公司所生產之新型手機，甲交予其子丁使用，詎料丁於使用時竟發生手機電池燃燒，致丁受傷送醫。依消費者保護法規定，關於本案中企業經營者責任之敘述，下列何者錯誤？","o":["丙公司係生產問題手機之企業經營者，應確保該手機符合當時科技或專業水準可合理期待之安全性，如有違反，應負損害賠償責任","該問題手機雖係甲所購買，但如丁因使用而身體受損害，丙公司仍應對丁負損害賠償責任","若丙公司能證明其於生產手機時無過失者，法院應免除其賠償責任","經銷手機之乙商店，就使用問題手機所生損害，與丙公司連帶負損害賠償責任。但乙商店得主張對損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害，以免除其與丙公司之連帶責任"],"a":2},{"id":"105r31","year":105,"cat":"不動產經紀相關法規概要","n":31,"q":"關於公寓大廈住戶行為規範之敘述，下列何者錯誤？","o":["住戶不得於大樓之公共密閉處所吸菸，以免影響其他住戶健康","針對開放空間，在直轄市、縣（市）政府核准範圍內，住戶縱依規約或區分所有權人會議決議許可得使用該空間，亦不得為營業目的使用","住戶於公寓大廈內依法經營餐飲業者，應依中央主管機關所定保險金額投保公共意外責任保險","住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定"],"a":1},{"id":"105r32","year":105,"cat":"不動產經紀相關法規概要","n":32,"q":"依公寓大廈管理條例規定，區分所有權人召開定期會議之頻率為：","o":["每半年至少應召開定期會議1次","每季至少應召開定期會議1次","每年至少應召開定期會議1次","每兩年至少應召開定期會議1次"],"a":2},{"id":"105r33","year":105,"cat":"不動產經紀相關法規概要","n":33,"q":"公寓大廈內連通數個專有部分之樓梯間，依公寓大廈管理條例相關規定屬於何種型態？","o":["分別所有部分","共同公共部分","共用部分","獨立部分"],"a":2},{"id":"105r34","year":105,"cat":"不動產經紀相關法規概要","n":34,"q":"關於公寓大廈起造人行為規範之敘述，下列何者錯誤？","o":["起造人非經領得建造執照，不得辦理銷售","起造人應就領得使用執照1年內之管理維護事項，提列一定比例金額作為公共基金，並於使用執照申請時，繳交各地方主管機關公庫代收之證明","起造人應移交公寓大廈共用部分及設施予管理委員會或管理負責人","起造人得將法定停車空間讓售於特定人，以增加公共基金收入來源"],"a":3},{"id":"105r35","year":105,"cat":"不動產經紀相關法規概要","n":35,"q":"依公寓大廈管理條例規定，公寓大廈住戶對於非屬專有部分之利用情形，下列敘述何者正確？","o":["住戶得經管理委員會主委同意，於外牆面設置廣告看板","有12歲以下兒童之住戶，如未依規約或未經區分所有權人會議決議之同意，不得擅自於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施","有12歲以下兒童之住戶，得於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施，無庸經規約或區分所有權人會議決議同意，但設置理由消失者，住戶應予改善或回復原狀","住戶得經頂樓住戶之許可，於樓頂平台加蓋廟宇神壇"],"a":2},{"id":"105r36","year":105,"cat":"不動產經紀相關法規概要","n":36,"q":"關於公寓大廈營運與管理維護的敘述，下列何者正確？","o":["住戶共同事務應興革事項之決議，為管理委員會的職務之一","受僱於公寓大廈管理維護公司之管理服務人員，不得同時受聘於2家以上之管理維護公司","利害關係人請求閱覽或影印規約，管理委員於必要時得拒絕之，並應召集區分所有權人會議臨時會議","公寓大廈之住戶非該專有部分之區分所有權人者，除區分所有權人會議之決議或規約另有規定外，不得被選任、推選為管理委員、主任委員或管理負責人"],"a":1},{"id":"105r38","year":105,"cat":"不動產經紀相關法規概要","n":38,"q":"關於公寓大廈公共基金的敘述，下列何者正確？","o":["公共基金其來源之一為起造人就公寓大廈領得使用執照2年內之管理維護事項，應按工程造價一定比例或金額提列","區分所有權人對於公共基金之權利不應隨區分所有權之移轉而移轉；得因個人事由為讓與、扣押、抵銷或設定負擔","區分所有權人積欠應繳納之公共基金已逾六期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息","區分所有權人未繳納公共基金時，主管機關依公寓大廈管理條例處新臺幣4萬元以上20萬元以下罰鍰，並得令其限期改善或履行義務"],"a":3},{"id":"105r39","year":105,"cat":"不動產經紀相關法規概要","n":39,"q":"依公寓大廈管理條例規定，直轄市、縣（市）政府得聘請資深之專家、學者及建築師、律師，並指定公寓大廈及建築管理主管人員，組設何種委員會處理公寓大廈爭議事件？","o":["公寓大廈爭議事件調解委員會","公寓大廈爭議事件調處委員會","公寓大廈爭議事件調查委員會","公寓大廈爭議事件審議委員會"],"a":1},{"id":"105r40","year":105,"cat":"不動產經紀相關法規概要","n":40,"q":"公寓大廈外牆面設置廣告物，除應依法令規定辦理外，下列敘述何者正確？","o":["該公寓大廈規約另有規定，即應受該規約之限制","該公寓大廈管理委員會會議已有決議，即應受該管理委員會會議決議之限制","該公寓大廈規約另有規定，經向直轄市、縣（市）主管機關完成報備有案者，即應受該規約之限制","該公寓大廈管理委員會會議已有決議，經向直轄市、縣（市）主管機關完成報備有案者，即應受該管理委員會會議決議之限制"],"a":2}];
const SUBJECTS=[
  {name:'民法概要',short:'民法'},
  {name:'不動產估價概要',short:'估價'},
  {name:'土地法與土地相關稅法概要',short:'土地法稅法'},
  {name:'不動產經紀相關法規概要',short:'經紀法規'}
];
const SHORT={}; SUBJECTS.forEach(s=>SHORT[s.name]=s.short);
const YEARS=[...new Set(BANK.map(q=>q.year))].sort((a,b)=>b-a);
const KEYS=['A','B','C','D'];
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function tagOf(q){return q.year+'年·'+(SHORT[q.cat]||q.cat);}
const byId=id=>BANK.find(q=>q.id===id);

const LSK='reagent_quiz_v1';
let state={};
function loadState(){try{state=JSON.parse(localStorage.getItem(LSK))||{}}catch(e){state={}}
  state.wrong=state.wrong||{};state.star=state.star||{};state.totalDone=state.totalDone||0;state.totalOk=state.totalOk||0;state.autoNext=state.autoNext!==false;}
function saveState(){try{localStorage.setItem(LSK,JSON.stringify(state))}catch(e){}}

function buildHome(){
  const w=Object.keys(state.wrong).length,s=Object.keys(state.star).length;
  const acc=state.totalDone?Math.round(state.totalOk/state.totalDone*100)+'%':'—';
  let h='';
  h+=`<div class="hero"><h1>不動產經紀人 考試練習</h1><p>考選部歷屆試題 · 民國${YEARS[YEARS.length-1]}–${YEARS[0]}年 · 四科 ${BANK.length} 題</p>
    <div class="stats">
      <div class="stat"><div class="n">${acc}</div><div class="l">歷史答對率</div></div>
      <div class="stat"><div class="n">${w}</div><div class="l">待複習錯題</div></div>
      <div class="stat"><div class="n">${state.totalDone}</div><div class="l">累計作答</div></div>
    </div></div>`;
  h+='<div class="sec-title">快速練習</div><div class="menu">';
  h+=mbtn('big','⚡','隨機練習 50 題','全年度、全科目隨機抽題','50 題',"start('random',50)");
  h+=mbtn('','🔀','隨機練習 20 題','快速小測驗','20 題',"start('random',20)");
  h+='</div>';
  h+='<div class="sec-title">依年度模擬（整年考題）</div><div class="yrgrid">';
  YEARS.forEach(y=>{
    const c=BANK.filter(q=>q.year===y).length;
    const mi=BANK.filter(q=>q.year===y&&state.wrong[q.id]).length;
    h+=`<button class="ybtn" onclick="start('year',${y})"><div class="yy">${y}年</div><div class="yc">${c} 題</div>${mi?`<div class="ym">錯 ${mi}</div>`:''}</button>`;
  });
  h+='</div>';
  h+='<div class="sec-title">依科目練習</div>';
  SUBJECTS.forEach(sj=>{
    const cnt=BANK.filter(q=>q.cat===sj.name).length;
    const miss=BANK.filter(q=>q.cat===sj.name&&state.wrong[q.id]).length;
    h+=`<button class="subrow" onclick="start('subject','${esc(sj.name)}')"><span class="sn">${esc(sj.name)}</span>${miss?`<span class="miss">錯 ${miss}</span>`:''}<span class="sc">${cnt} 題</span><span class="sc">›</span></button>`;
  });
  h+='<div class="sec-title">加強與複習</div><div class="menu">';
  h+=mbtn('wrong','✕','錯題本重練','只練答錯的題，答對才移除',w+' 題',"start('wrong')",w===0);
  h+=mbtn('review','★','我的收藏','練習標星號的題目',s+' 題',"start('star')",s===0);
  h+=mbtn('','☰','全題庫瀏覽','看題目與官方標準答案',BANK.length+' 題',"go('browse')");
  h+='</div>';
  h+='<div class="sec-title">設定</div>';
  h+=`<div class="setrow"><div><div class="t">答對自動跳下一題</div><div class="d">答錯會停下來讓你看答案</div></div><button class="switch ${state.autoNext?'on':''}" onclick="toggleAuto(this)"><i></i></button></div>`;
  h+='<div class="foot">題目與答案來源：考選部考畢試題查詢平臺（官方公布標準答案）<br>進度僅儲存於本機瀏覽器</div>';
  $('#homeBody').innerHTML=h;
}
function mbtn(cls,ico,t,d,cnt,onclick,disabled){
  return `<button class="mbtn ${cls}" onclick="${onclick}" ${disabled?'disabled':''}><span class="ico">${ico}</span><span class="tx"><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span></span><span class="cnt">${esc(cnt)}</span><span class="arrow">›</span></button>`;
}
function toggleAuto(el){state.autoNext=!state.autoNext;saveState();el.classList.toggle('on',state.autoNext);}

let ses=null,autoTimer=null;
function clearAuto(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
function start(mode,arg){
  let list=[],title='',exam=false;
  if(mode==='random'){list=shuffle(BANK).slice(0,arg);title='隨機練習 '+arg+' 題';}
  else if(mode==='year'){list=BANK.filter(q=>q.year===arg).slice();list.sort((a,b)=>(SUBord(a.cat)-SUBord(b.cat))||a.n-b.n);title=arg+'年 全科模擬';exam=true;}
  else if(mode==='subject'){list=shuffle(BANK.filter(q=>q.cat===arg));title=SHORT[arg]||arg;exam=true;}
  else if(mode==='wrong'){list=shuffle(BANK.filter(q=>state.wrong[q.id]));if(!list.length){alert('目前沒有待複習的錯題');return;}title='錯題本重練';}
  else if(mode==='star'){list=shuffle(BANK.filter(q=>state.star[q.id]));if(!list.length){alert('還沒有收藏題目');return;}title='我的收藏';}
  if(!list.length){alert('沒有題目');return;}
  ses={mode,title,list,i:0,ok:0,no:0,wrongIds:[],answered:false,exam};
  go('quiz');renderQ();
}
function SUBord(c){const m={'民法概要':0,'不動產估價概要':1,'土地法與土地相關稅法概要':2,'不動產經紀相關法規概要':3};return m[c]==null?9:m[c];}
function renderQ(){
  clearAuto();const q=ses.list[ses.i];
  $('#qTag').textContent=tagOf(q);
  $('#qPos').textContent=(ses.i+1)+' / '+ses.list.length;
  $('#prog').style.width=(ses.i/ses.list.length*100)+'%';
  $('#liveOk').textContent=ses.ok;$('#liveNo').textContent=ses.no;
  $('#qText').innerHTML='<span class="idx">Q'+(ses.i+1)+'</span>'+esc(q.q);
  const wrap=$('#qOpts');wrap.innerHTML='';
  q.o.forEach((opt,idx)=>{const b=document.createElement('button');b.className='opt';b.dataset.i=idx;
    b.innerHTML='<span class="k">'+KEYS[idx]+'</span><span class="otx">'+esc(opt)+'</span>';
    b.onclick=()=>choose(idx);wrap.appendChild(b);});
  $('#qExp').className='explain';
  ses.answered=false;
  const nb=$('#nextBtn');nb.disabled=true;nb.textContent='選擇答案';
  const st=$('#starToggle');const on=!!state.star[q.id];st.textContent=on?'★':'☆';st.classList.toggle('on',on);
}
function choose(idx){
  if(ses.answered)return;const q=ses.list[ses.i];ses.answered=true;
  const correct=idx===q.a;state.totalDone++;if(correct)state.totalOk++;
  if(correct){ses.ok++;if(state.wrong[q.id])delete state.wrong[q.id];}
  else{ses.no++;ses.wrongIds.push(q.id);state.wrong[q.id]=true;}
  saveState();
  document.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.classList.add('disabled');b.onclick=null;
    if(i===q.a){b.classList.add('correct');b.insertAdjacentHTML('beforeend','<span class="badge">正解</span>');}
    else if(i===idx){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span class="badge">你選的</span>');}
    else b.classList.add('dim');});
  const exp=$('#qExp');exp.className='explain show '+(correct?'pass':'fail');
  $('#expR').textContent=correct?'✓ 答對了':'✕ 答錯了（已加入錯題本）';
  $('#expLbl').textContent='出處';
  $('#expBody').textContent='民國'+q.year+'年 不動產經紀人『'+q.cat+'』第 '+q.n+' 題．正解 '+KEYS[q.a]+'（考選部公布標準答案）';
  $('#liveOk').textContent=ses.ok;$('#liveNo').textContent=ses.no;
  $('#prog').style.width=((ses.i+1)/ses.list.length*100)+'%';
  const nb=$('#nextBtn');nb.disabled=false;nb.textContent=(ses.i+1<ses.list.length)?'下一題':'看結果';
  if(correct&&state.autoNext){autoTimer=setTimeout(()=>{autoTimer=null;next();},800);}
}
function next(){clearAuto();if(!ses.answered)return;
  if(ses.i+1<ses.list.length){ses.i++;renderQ();window.scrollTo({top:0,behavior:'smooth'});}else showResult();}
function toggleStar(){const q=ses.list[ses.i];if(state.star[q.id])delete state.star[q.id];else state.star[q.id]=true;saveState();
  const st=$('#starToggle');const on=!!state.star[q.id];st.textContent=on?'★':'☆';st.classList.toggle('on',on);}
function showResult(){
  const tot=ses.list.length,ok=ses.ok,pct=Math.round(ok/tot*100),unans=tot-ok-ses.no;
  $('#rPct').textContent=pct+'%';$('#rOk').textContent=ok;$('#rNo').textContent=ses.no+unans;$('#rTot').textContent=tot;
  $('#ringFg').style.strokeDashoffset=402-402*(pct/100);
  const badge=$('#rBadge');
  if(ses.exam){const pass=pct>=60;badge.innerHTML=`<div class="pass-badge ${pass?'y':'n'}">${pass?'✓ 合格':'✕ 不合格'}（及格 60 分）</div>`;}else badge.innerHTML='';
  let msg,sub;
  if(pct===100){msg='滿分！🎉';sub=ses.title+'．全部答對';}
  else if(pct>=80){msg='表現很好';sub='把錯題本清完更穩';}
  else if(pct>=60){msg='及格，繼續加強';sub='建議馬上重練錯題';}
  else{msg='多練幾次就會了';sub='先從錯題本開始複習';}
  if(unans>0)sub=unans+' 題未作答．'+sub;
  $('#rMsg').textContent=msg;$('#rSub').textContent=sub;
  $('#rRetry').style.display=ses.wrongIds.length?'block':'none';
  const list=$('#rList');
  if(ses.wrongIds.length){let hh='<div class="sec-title" style="margin-top:4px">本次答錯（'+ses.wrongIds.length+'）</div>';ses.wrongIds.forEach(id=>hh+=itemHTML(byId(id),true));list.innerHTML=hh;}else list.innerHTML='';
  go('result');window.scrollTo({top:0});
}
function retryWrong(){const arr=ses.wrongIds.map(byId);ses={mode:'retry',title:'重練錯題',list:shuffle(arr),i:0,ok:0,no:0,wrongIds:[],answered:false,exam:false};go('quiz');renderQ();window.scrollTo({top:0});}

let bYear='ALL',bSub='ALL';
function buildBrowseCtrl(){
  let yo='<option value="ALL">全部年度</option>';YEARS.forEach(y=>yo+=`<option value="${y}">${y}年</option>`);
  let so='<option value="ALL">全部科目</option><option value="WRONG">只看錯題</option>';SUBJECTS.forEach(s=>so+=`<option value="${esc(s.name)}">${esc(s.short)}</option>`);
  $('#browseCtrl').innerHTML=`<div class="bfilter"><select class="bsel" onchange="bYear=this.value;renderBrowse()">${yo}</select><select class="bsel" onchange="bSub=this.value;renderBrowse()">${so}</select></div>`;
}
function renderBrowse(){
  let list=BANK;
  if(bSub==='WRONG')list=list.filter(q=>state.wrong[q.id]);else if(bSub!=='ALL')list=list.filter(q=>q.cat===bSub);
  if(bYear!=='ALL')list=list.filter(q=>q.year==bYear);
  const box=$('#browseList');
  if(!list.length){box.innerHTML='<div class="empty"><div class="e">🎯</div><div class="t">沒有題目</div><div>換個年度或科目看看</div></div>';return;}
  const cap=300,show=list.slice(0,cap);
  box.innerHTML=show.map(q=>itemHTML(q,state.wrong[q.id])).join('')+(list.length>cap?`<div class="foot">僅顯示前 ${cap} 題，請用上方篩選縮小範圍（符合 ${list.length} 題）</div>`:`<div class="foot">共 ${list.length} 題</div>`);
}
function itemHTML(q,miss){
  return '<div class="item"><div class="h"><span class="tag">'+esc(tagOf(q))+' 第'+q.n+'題</span>'+(miss?'<span class="miss">待複習</span>':'')+'</div><div class="q">'+esc(q.q)+'</div><div class="ans"><b>正解 '+KEYS[q.a]+'．</b>'+esc(q.o[q.a])+'</div></div>';
}
function go(v){
  clearAuto();
  ['home','quiz','result','browse'].forEach(x=>$('#view-'+x).classList.toggle('hidden',x!==v));
  $('#homeBtn').style.display=(v!=='home')?'inline-block':'none';
  if(v==='home')buildHome();
  if(v==='browse'){bYear='ALL';bSub='ALL';buildBrowseCtrl();renderBrowse();}
  window.scrollTo({top:0});
}
loadState();go('home');

</script>
