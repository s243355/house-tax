<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00843d">
<title>不動產經紀人 考試練習</title>
<style>
:root{
  --green:#00843d; --green-d:#006b31; --green-l:#e6f3ec;
  --ink:#1c1f1d; --sub:#5c6360; --line:#e3e6e4; --bg:#f6f7f6; --card:#ffffff;
  --ok:#0f8a43; --ok-bg:#e7f5ec; --no:#c62f3b; --no-bg:#fbeaeb;
  --star:#e0a400; --accent:#00843d;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}
.top .brand{font-weight:800;letter-spacing:.5px;font-size:16px;display:flex;align-items:center;gap:8px}
.top .mark{width:22px;height:22px;border-radius:6px;background:#fff;color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:14px}
.top .spacer{flex:1}
.top button.link{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:14px;font-weight:700;padding:7px 12px;border-radius:8px}
.top button.link:active{background:rgba(255,255,255,.28)}
.main{flex:1;padding:16px}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));
  color:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.hero h1{margin:0 0 4px;font-size:20px;font-weight:800}
.hero p{margin:0;opacity:.92;font-size:14px}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:10px 8px;text-align:center}
.stat .n{font-size:22px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;opacity:.9;margin-top:2px}
.sec-title{font-size:14px;font-weight:700;color:var(--sub);margin:20px 4px 10px}
.menu{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;text-align:left;box-shadow:var(--sh);color:var(--ink);font-family:inherit;font-size:16px;cursor:pointer}
.mbtn:active{transform:scale(.99);background:#fafbfa}
.mbtn .ico{width:44px;height:44px;border-radius:12px;background:var(--green-l);color:var(--accent);
  display:grid;place-items:center;font-size:22px;flex-shrink:0;font-weight:800}
.mbtn .tx{flex:1;min-width:0}
.mbtn .tx .t{font-weight:700}
.mbtn .tx .d{font-size:13px;color:var(--sub);margin-top:1px}
.mbtn .cnt{font-size:13px;color:var(--sub);font-weight:700;white-space:nowrap}
.mbtn .arrow{color:var(--sub);font-size:20px}
.mbtn.wrong .ico{background:var(--no-bg);color:var(--no)}
.mbtn.review .ico{background:#fff6de;color:#b9860a}
.mbtn.big{background:var(--accent);border-color:var(--accent);color:#fff}
.mbtn.big .ico{background:rgba(255,255,255,.2);color:#fff}
.mbtn.big .tx .d{color:rgba(255,255,255,.85)}
.mbtn.big .cnt,.mbtn.big .arrow{color:rgba(255,255,255,.9)}
.mbtn:disabled{opacity:.5}
.yrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ybtn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:var(--sh);font-family:inherit;color:var(--ink);cursor:pointer}
.ybtn:active{background:#fafbfa}
.ybtn .yy{font-size:18px;font-weight:800;color:var(--accent)}
.ybtn .yc{font-size:12px;color:var(--sub);margin-top:2px}
.ybtn .ym{font-size:11px;font-weight:800;color:var(--no);margin-top:2px}
/* quiz */
.qhead{margin-bottom:12px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qmeta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub)}
.qmeta .tag{background:var(--green-l);color:var(--green-d);font-weight:700;padding:2px 10px;border-radius:99px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta .live b{color:var(--ok)} .qmeta .live s{color:var(--no);text-decoration:none}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:#eef1ff;color:#204a94;padding:2px 10px;border-radius:99px;font-size:13px}
.timer.warn{background:var(--no-bg);color:var(--no);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.qtext{font-size:17px;font-weight:600;line-height:1.7;margin-bottom:16px}
.qtext .idx{color:var(--accent);font-weight:800;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:14px;text-align:left;font-family:inherit;font-size:15.5px;line-height:1.6;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:active{background:#f7f9f8}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--sub);flex-shrink:0;background:#fff;transition:all .15s}
.opt .otx{flex:1;padding-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.disabled{cursor:default} .opt.dim{opacity:.55}
.opt .badge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;align-self:center;flex-shrink:0}
.opt.correct .badge{background:var(--ok);color:#fff} .opt.wrong .badge{background:var(--no);color:#fff}
.explain{margin-top:16px;border-radius:12px;padding:14px;font-size:14.5px;line-height:1.75;display:none}
.explain.show{display:block;animation:fade .25s}
.explain.pass{background:var(--ok-bg);border:1px solid #bfe6cd}
.explain.fail{background:var(--no-bg);border:1px solid #f2c6ca}
.explain .r{font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:15px}
.explain.pass .r{color:var(--ok)} .explain.fail .r{color:var(--no)}
.explain .lbl{font-weight:800;color:var(--green-d);display:block;margin-bottom:2px}
.explain .body{color:#25302a}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px}
#view-quiz{padding-bottom:104px}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:640px;margin:0 auto;display:flex;gap:10px;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(246,247,246,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(0,0,0,.06)}
.btn{flex:1;padding:16px;border-radius:12px;border:none;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);flex:0 0 auto;width:56px;font-size:22px}
.btn.ghost.on{color:var(--star);border-color:var(--star)}
.btn:disabled{opacity:.4}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--sh);text-align:center}
.ring{width:150px;height:150px;margin:6px auto 14px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .p{font-size:32px;font-weight:900;line-height:1}
.ring .mid .l{font-size:13px;color:var(--sub);margin-top:2px}
.pass-badge{display:inline-block;font-weight:800;font-size:14px;padding:5px 16px;border-radius:99px;margin-bottom:8px}
.pass-badge.y{background:var(--ok-bg);color:var(--ok)} .pass-badge.n{background:var(--no-bg);color:var(--no)}
.rmsg{font-size:17px;font-weight:800;margin-bottom:4px}
.rsub{font-size:14px;color:var(--sub);margin-bottom:16px}
.rgrid{display:flex;gap:10px}
.rgrid .b{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}
.rgrid .b .n{font-size:22px;font-weight:800} .rgrid .b .l{font-size:12px;color:var(--sub)}
.rgrid .b.ok .n{color:var(--ok)} .rgrid .b.no .n{color:var(--no)}
.bfilter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bsel{flex:1;min-width:120px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:var(--sh)}
.item .h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item .h .tag{font-size:11px;font-weight:800;background:var(--green-l);color:var(--green-d);padding:2px 8px;border-radius:99px}
.item .h .miss{font-size:11px;font-weight:800;background:var(--no-bg);color:var(--no);padding:2px 8px;border-radius:99px;margin-left:auto}
.item .q{font-weight:600;font-size:15px;line-height:1.6;margin-bottom:10px}
.item .ans{font-size:14px;line-height:1.6;background:var(--ok-bg);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.item .ans b{color:var(--ok)}
.item .ex{font-size:13px;color:#444;line-height:1.7}
.item .ex b{color:var(--green-d)}
.subrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-align:left;box-shadow:var(--sh);font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:8px}
.subrow:active{background:#fafbfa}
.subrow .sn{flex:1;font-weight:700}
.subrow .sc{font-size:13px;color:var(--sub);font-weight:700}
.subrow .miss{font-size:11px;font-weight:800;background:var(--no-bg);color:var(--no);padding:2px 8px;border-radius:99px}
.empty{text-align:center;color:var(--sub);padding:48px 20px}
.empty .e{font-size:44px;margin-bottom:10px}
.empty .t{font-weight:800;font-size:17px;color:var(--ink);margin-bottom:4px}
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:8px}
.setrow>div:first-child{flex:1}.setrow .t{font-weight:700}.setrow .d{font-size:13px;color:var(--sub);margin-top:1px}
.switch{width:52px;height:30px;border-radius:99px;border:none;background:#d3d7d5;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)} .switch.on i{left:25px}
.foot{text-align:center;color:#9aa19d;font-size:12px;padding:18px 0 26px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark">信</span><span id="topTitle">不動產經紀人 考試練習</span></div>
    <div class="spacer"></div>
    <button class="link" id="homeBtn" onclick="go('home')" style="display:none">選單</button>
  </div>
  <div class="main">
    <section id="view-home"><div id="homeBody"></div></section>
    <section id="view-quiz" class="hidden">
      <div class="qhead">
        <div class="progress"><i id="prog"></i></div>
        <div class="qmeta">
          <span><span class="tag" id="qTag"></span> <span id="qPos"></span></span>
          <span style="display:flex;gap:8px;align-items:center"><span class="timer hidden" id="qTimer"></span><span class="live">對 <b id="liveOk">0</b> · 錯 <s id="liveNo">0</s></span></span>
        </div>
      </div>
      <div class="qcard">
        <div class="qtext" id="qText"></div>
        <div class="opts" id="qOpts"></div>
        <div class="explain" id="qExp">
          <div class="r" id="expR"></div>
          <div class="body"><span class="lbl" id="expLbl">出處</span><span id="expBody"></span></div>
        </div>
      </div>
      <div class="qactions qbar">
        <button class="btn ghost" id="starToggle" onclick="toggleStar()">☆</button>
        <button class="btn primary" id="nextBtn" onclick="next()" disabled>選擇答案</button>
      </div>
    </section>
    <section id="view-result" class="hidden">
      <div class="rcard">
        <div class="ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="64" fill="none" stroke="#eef0ef" stroke-width="14"/>
            <circle id="ringFg" cx="75" cy="75" r="64" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402" style="color:var(--accent)"/>
          </svg>
          <div class="mid"><div class="p" id="rPct">0%</div><div class="l">答對率</div></div>
        </div>
        <div id="rBadge"></div>
        <div class="rmsg" id="rMsg"></div>
        <div class="rsub" id="rSub"></div>
        <div class="rgrid">
          <div class="b ok"><div class="n" id="rOk">0</div><div class="l">答對</div></div>
          <div class="b no"><div class="n" id="rNo">0</div><div class="l">答錯</div></div>
          <div class="b"><div class="n" id="rTot">0</div><div class="l">總題數</div></div>
        </div>
      </div>
      <div class="qactions" style="margin-top:16px">
        <button class="btn ghost" style="width:auto;flex:1;font-size:16px;font-weight:800" onclick="go('home')">回選單</button>
        <button class="btn primary" id="rRetry" onclick="retryWrong()">重練本次錯題</button>
      </div>
      <div id="rList" style="margin-top:16px"></div>
    </section>
    <section id="view-browse" class="hidden">
      <div id="browseCtrl"></div>
      <div id="browseList"></div>
    </section>
  </div>
</div>

<script>

const BANK=[{"id":"114m1","year":114,"cat":"民法概要","n":1,"q":"依我國民法有關死亡宣告之規定，下述何者錯誤？","o":["失蹤人遺留之與他人共有不動產之共有人，得聲請對失蹤人為死亡宣告","失蹤人已年滿80歲，其失蹤期間應滿3年後，始得被聲請死亡宣告","失蹤人受死亡宣告後，生存歸來時，得聲請地檢署撤銷死亡宣告","受死亡宣告之失蹤人實際上仍生存時，其權利能力不因死亡宣告而喪失"],"a":2},{"id":"114m2","year":114,"cat":"民法概要","n":2,"q":"我國民法修正時，增訂有關監護宣告及輔助宣告制度之規定。依現行民法相關之規定，下列何者錯誤？","o":["受監護宣告之成年人，無行為能力","成年人因精神障礙或其他心智缺陷，致其辨識其意思表示效果之能力顯有不足者，得因聲請，對其為監護之宣告","受監護宣告之成年人，仍保有完全之權利能力","受輔助宣告之成年人逕自締結汽車之買賣契約，該契約不因欠缺輔助人之事前同意而無效"],"a":1},{"id":"114m3","year":114,"cat":"民法概要","n":3,"q":"下列敘述，何者與民法法人之規定並不相容？","o":["民法關於公益社團法人之設立，係採取許可主義","法人解散後，在清算程序中，在清算之必要範圍內，仍具有法人格","法人之權利能力，受到性質上之限制，因此無法享有民法賦予自然人所有之人格權利","財團法人之設立，捐助人亦得以遺囑捐助之方式為之，且以此種方式設立之財團法人，無須訂立捐助章程"],"a":2},{"id":"114m4","year":114,"cat":"民法概要","n":4,"q":"甲當選A法人董事，準備大顯身手，下列敘述何者錯誤？","o":["就A法人一切事務，甲可代表A法人","A法人可僅設甲一位董事","A法人若對甲董事之代表權加以限制，其限制得對抗任何第三人","若A法人僅有甲與丙兩位董事，則該法人事務之執行，若兩人意見相左，則恐陷入表決的僵局"],"a":2},{"id":"114m5","year":114,"cat":"民法概要","n":5,"q":"有關自然人從事有效法律行為之情形，依現行民法規定，應以具備完全之行為能力為其要件。對此，下列相關之選項何者正確？","o":["年滿16歲之人，取得完全行為能力","15歲之人得逕行有效撤銷被他人詐欺而締結日常生活所需之買賣契約","14歲之未成年人得有效書立遺囑","某成年人被法院為輔助之宣告，若未得輔助人事前同意，即締結消費借貸契約，其得於法院撤銷該輔助宣告後，承認該消費借貸契約，使之逕行生效"],"a":3},{"id":"114m6","year":114,"cat":"民法概要","n":6,"q":"民法規定權利客體中動產、不動產之定義、種類及變動之法定方式；依該規定之內容，下列何者屬於正確之敘述？","o":["甲在所有A地種植芭樂樹，樹上之芭樂成熟時，即已成為獨立之動產","甲為慶祝關聖帝君生日臨時搭建完成之表演舞台，屬於甲獨立取得之定著物所有權","甲移轉買賣標的物之A地予乙，甲、乙完成A地所有權讓與合意並交付A地後，乙即成為A地之新所有權人","甲在A地池塘養殖金魚，池中金魚所生金魚苗，由甲取得該金魚苗之獨立動產物權"],"a":3},{"id":"114m7","year":114,"cat":"民法概要","n":7,"q":"不同之權利主體以法律行為方式，形成了彼此間之法律關係。嗣後，當事人一方發現自己已為之意思表示發生錯誤，乃依民法第88條規定行使撤銷權。下列相關之敘述，何者錯誤？","o":["該錯誤之意思表示若因表意人之過失所致時，表意人不得撤銷其所為之意思表示","該錯誤必須在交易上被認為具有重要性","錯誤之表意人必須在意思表示後，於2年內行使撤銷權，反之於除斥期間經過後，該法律關係即應繼續有效存續","錯誤之表意人撤銷其意思表示後，對於相對人應承擔信賴該法律行為有效而生之損害賠償責任"],"a":2},{"id":"114m8","year":114,"cat":"民法概要","n":8,"q":"關於無因管理之制度，下列何者非屬我國民法相關規範之內容？","o":["無因管理人誤將客觀上屬於自己事務當作他人之事務，而為事務之管理者，不成立民法之無因管理","無因管理人違反本人明示或可得推知之意思，代本人繳納贈與稅捐，得依民法第176條之規定，請求本人返還","管理人為免除本人生命之急迫危險，因重大過失造成本人財產上之損害，亦無須負損害賠償的責任","管理人明知為他人事務，卻違反本人明示或可得推知之意思或僅為自己利益，而為他人事務之管理者，本人主張管理事務之利益時，對管理人負第176條第1項之義務，以其所得利益為限"],"a":2},{"id":"114m9","year":114,"cat":"民法概要","n":9,"q":"甲授與乙代理權，並委任乙與丙商談甲買受丙所有房屋及辦理移轉所有權之事宜。下列敘述何者錯誤？","o":["本件代理權的授與和委任契約二者均須書面","若丙自始至終不知道乙為甲的代理人，且債權契約和物權契約當事人簽乙的名字，則本件法律效果無法歸屬於甲","若甲知道丙欺騙乙，把房屋的優點講得天花亂墜，但甲仍要乙代理他買下房屋，則甲事後不得主張受詐欺撤銷意思表示","甲跟乙說好，最多出價1億元，1億元的事情沒寫在書面，乙和丙講價的結果，被丙說服用行情價1億1千萬簽訂契約。該買賣契約在1億元價金的範圍內有效"],"a":3},{"id":"114m10","year":114,"cat":"民法概要","n":10,"q":"下述情形，何者不符合我國民法侵權行為之規定？","o":["加害人因過失致直接被害人死亡，因直接被害人已喪失權利能力，無須對直接被害人負非財產上之損害賠償","承攬人於執行承攬事務不法侵害他人之權利，除定作人於定作或指示有過失者，原則上定作人無須負損害賠償責任","限制行為能力人不法侵害他人權利，且於行為時無識別能力，其法定代理人對被害人亦無須負擔賠償責任","受僱人執行職務，因過失不法侵害他人之權利，如僱用人對於受僱人已盡選任、監督相當之注意義務，僱用人不負賠償責任"],"a":2},{"id":"114m11","year":114,"cat":"民法概要","n":11,"q":"甲賣給乙一隻狗狗，名喚S，乙光看甲提供的S犬照片就喜歡的不得了，馬上承諾以10萬元的價金訂立契約。下列何者錯誤？","o":["若S實則在甲、乙訂立契約前已死亡，則甲、乙契約無效","若S身上有跳蚤，並傳染給乙的貓咪B和乙家的環境，則甲應負加害給付責任","若S其實是甲母的狗，僅因甲母出國，暫時寄放於甲處，則乙即使已經把S抱回家照顧，乙絕不可能取得S的所有權","若乙向甲主張交付S，甲得主張同時履行抗辯"],"a":2},{"id":"114m12","year":114,"cat":"民法概要","n":12,"q":"甲將房屋租給乙。下列何者正確？","o":["租期若超過1年，且未寫書面契約，則租賃契約無效","若未特別約定，則乙有權將其中的房間分租給丙","若未特別約定，則乙有權將承租人的地位債權讓與給丙","若雙方約定租期3年，3年過後乙默默繳房租，甲默默收房租，則雙方均不得主張租賃契約默示更新"],"a":1},{"id":"114m13","year":114,"cat":"民法概要","n":13,"q":"對於權利主體間之贈與契約，依我國民法規定，下列何者為正確之論述？","o":["在經公證之贈與契約，贈與人因可歸責之事由致給付遲延，受贈人得依民法第231條之規定請求贈與人對於遲延給付造成之損害，負賠償責任","依現行民法之規定，以不動產為標的之贈與契約，屬於具要物性之法律行為","贈與人所贈與之標的物本身具有瑕疵，贈與人應負無過失之擔保責任","贈與人所贈與之標的物具有瑕疵，造成受贈人之損害，僅於贈與人故意不告知其瑕疵或保證其無瑕疵時，始得請求賠償"],"a":3},{"id":"114m14","year":114,"cat":"民法概要","n":14,"q":"甲、乙兩人合夥開了一家小麵館M，生意興隆。下列何者錯誤？","o":["如甲在麵館以外之場所猥褻K，乙無須對K負連帶損害賠償責任","麵體供應商J多次索取買賣價金均無果，J得以M為被告請求履行債務","甲、乙兩人想把M收起來，尚須經清算程序","M麵館的餐具是甲提供的、攤車是乙提供的，當麵館持續在營業時，餐具的所有權仍是甲的、攤車的所有權仍是乙的"],"a":3},{"id":"114m15","year":114,"cat":"民法概要","n":15,"q":"依現行民法物權編有關不動產所有權相鄰關係規定之內容，下列之選項，何者正確？","o":["土地所有人建築房屋故意逾越地界者，法院得斟酌公共利益後，能允許鄰地所有人請求移去或變更","共有土地因分割，致其中一共有人所取得分得土地與公路無適宜之聯絡，無法為通常之使用，應支付償金，取得通行他分割人所有地之權利","果實自落於鄰地，推定由鄰地所有人取得所有權","鄰地所有人因營造或修繕建築物之必要，得使用土地所有人之土地及其上建物內部閒置之空間。但受有損害時，則得拒絕鄰地所有人之使用"],"a":0},{"id":"114m16","year":114,"cat":"民法概要","n":16,"q":"甲、乙兩人共有A地，應有部分甲為1/3、乙為2/3。下列何者錯誤？","o":["若甲、乙協議20年內不得分割，則在該期限內，不論發生任何事由，甲、乙均不得請求分割","甲得在未經乙的同意下，將其應有部分贈與及移轉給丁","若甲商請乙分割A地未果，甲可聲請法院分割A地，此時法院須優先考慮原物分配","A地由丙無權占有使用，乙得在未經甲的同意下請求丙返還A地"],"a":0},{"id":"114m17","year":114,"cat":"民法概要","n":17,"q":"依我國民法關於地上權之規定，下列何者正確之論述？","o":["地上權未定有存續期間者，逾越30年後，土地所有人始得向法院請求，定其後續之存續期間，或終止該地上權","地上權人因不可抗力之事由導致妨礙其行使地上權使用時，得拒絕或減少地租之支付","地上權人積欠地租達2年總額時，除另有習慣外，土地所有人得逕行終止存續期限尚未屆至之地上權","已設定地上權之土地所有權人，於地上權存續期間讓與該土地所有權與第三人，已預收之地租如已登記，地上權人得以該預付地租對抗受讓之第三人"],"a":3},{"id":"114m18","year":114,"cat":"民法概要","n":18,"q":"關於占有，下列何者錯誤？","o":["占有於我國為事實，而非占有權","無權占有人亦有占有物返還請求權","占有與取得時效有關","惡意占有人，因保存占有物所支出之必要費用，不得請求償還"],"a":3},{"id":"114m19","year":114,"cat":"民法概要","n":19,"q":"甲所有的A地與乙所有的B地相鄰。下列何者正確？","o":["A地兩面環山、第三面環河，僅能經過B地通行於道路，則甲須經乙的同意，始得取得對B地的通行權","A地一面環山、一面環河、一面接著大馬路、一面緊鄰B地，甲聽信風水師的建議，將面臨大馬路的那一面築起無門的高牆因此無法通行，則甲須經乙的同意，始得取得對B地的通行權","袋地通行權性質上並非供役地所有權本質上的限縮","若甲在A地上蓋房子，因為土地測量單位的疏失，該建築有30公分越界到B地，此時乙得知此狀況，若沒有馬上阻止，則之後仍可請求甲拆屋還地"],"a":1},{"id":"114m20","year":114,"cat":"民法概要","n":20,"q":"甲、乙結婚後未約定夫妻財產制時，下列有關甲、乙間之配偶財產關係之論述，何者錯誤？","o":["甲所有之婚前購買之有價證券，於甲、乙婚後，甲取得該有價證券分配之股息或利息，於甲、乙離婚時，乙得主張該分配之股息或利息，納入剩餘財產為分配計算之標的","甲於婚後以自己之財產清償乙所負之債務後，即使在婚姻關係中，仍得請求乙償還","甲、乙離婚時，對於婚後乙受贈之財產，如未經贈與人以書面聲明為乙之特有財產時，即應納入乙之婚後財產，成為剩餘財產分配計算之標的","甲、乙離婚時，乙知悉剩餘財產分配計算之差額，僅得自法定財產關係消滅時起2年內，向甲主張給付該差額之二分之一"],"a":2},{"id":"114m21","year":114,"cat":"民法概要","n":21,"q":"民法對於法定繼承人及其順序，於第1138條設有明文規定。下列相關之說明，何者正確？","o":["被繼承人死亡時之配偶，於被繼承人死亡後2年內再婚者，喪失其原已取得之繼承權","被繼承人死亡時，其已出家之子女，無繼承之資格與地位","養子女與養父母之親生子女，雖因法律擬制而為旁系親屬，然因欠缺真實血緣關係，非屬民法第1138條第3順位之法定繼承人","父再婚之後妻，與前妻之子女，僅為直系姻親關係，因此後妻對於前妻子女之死亡，無繼承其遺產之權利"],"a":3},{"id":"114m22","year":114,"cat":"民法概要","n":22,"q":"我國現行民法對於繼承制度，原則上採取概括繼承有限責任之規範型態。下列何者屬於正確之敘述？","o":["概括繼承人如對於被繼承人生前享有權利或負擔義務，不因被繼承人之死亡而隨之消滅","第1138條所定第1順序之繼承人中有拋棄繼承權者，其應繼分應由其直系血親卑親屬代位繼承之","繼承人對於被繼承人所遺留之債務，對於被繼承人之債權人，負連帶清償之責任","拋棄繼承者，就自己所管理之遺產，於其他繼承人或遺產管理人開始管理前，應以善良管理人之注意義務，繼續管理該遺產"],"a":0},{"id":"114m23","year":114,"cat":"民法概要","n":23,"q":"依我國民法有關遺囑之規定，下列敘述何者錯誤？","o":["甲立遺囑，遺囑中將A地贈與好友乙。乙於甲之遺囑生效前意外死亡，其後甲重病身亡，乙之繼承人丙得向甲之繼承人丁請求移轉交付A地所有權予自己","甲遺囑中遺贈予乙之A車，因丙之過失毀損，甲之遺囑生效時，推定對丙之權利成為遺贈之客體，乙得向甲之繼承人丁請求移轉該權利予自己","甲以遺囑贈與A屋予好友乙，遺囑生效時，甲之繼承人丙寄存證信函請求乙30日內回函確認，乙置之不理，期限屆滿時，該遺囑中之遺贈，仍然確定生效","甲以遺囑贈與A屋予好友乙，遺囑生效前，甲將A屋出賣予丙取得價金1千萬元之債權，甲請求丙將該價金1千萬元直接捐贈予丁慈善基金會。甲之遺囑生效時，遺囑中A屋之遺贈應屬無效"],"a":0},{"id":"114m24","year":114,"cat":"民法概要","n":24,"q":"關於生前特種贈與的歸扣，下列何者錯誤？","o":["生前特種贈與，包括因結婚、分居、營業所為之贈與","須有其他繼承人行使歸扣權，始須歸扣","一般認為，生前特種贈與之被繼承人有應繼分前付之意思","即使被繼承人於贈與時有反對意思表示，仍應歸扣"],"a":3},{"id":"114m25","year":114,"cat":"民法概要","n":25,"q":"甲夫乙妻，一起到夏威夷旅遊，租車亂跑，不幸墜入山谷。下列何者錯誤？","o":["甲、乙被發現時，由屍體的腐壞程度可以斷定甲比乙早10小時死亡，則乙為甲的繼承人","甲、乙被發現時，即使經過法醫相驗，也無法確定誰先死，則雙方互為繼承人","3年前，甲的家人為了擔心乙分家產，要求甲把全部的財產贈與給甲母，才允許雙方登記結婚此次事故甲死乙傷，乙無法對甲母主張詐害債權的撤銷","該事故實則是乙為了取得甲大筆的遺產所製造的車禍，若甲死乙傷，乙將喪失對甲的繼承權"],"a":1},{"id":"114v1","year":114,"cat":"不動產估價概要","n":1,"q":"鄰近國小的店舖，做販賣文具及圖書生意使用，此為何種不動產估價原則之掌握？","o":["外部性原則","貢獻原則","適合原則","內部性原則"],"a":2},{"id":"114v2","year":114,"cat":"不動產估價概要","n":2,"q":"以成本法進行不動產估價，下列何者非為總成本應包括之項目？","o":["營造或施工費","出售不動產之所得稅","資本利息","建築利潤"],"a":1},{"id":"114v3","year":114,"cat":"不動產估價概要","n":3,"q":"建築物屋齡10年，重建成本2,000萬元，若殘價率為10%，經濟耐用年數50年，選擇等速折舊路徑的方法計算累積折舊額為多少萬元？","o":["400","40","360","36"],"a":2},{"id":"114v4","year":114,"cat":"不動產估價概要","n":4,"q":"比較標的為與法定用途不符之交易，應先作適當之調整才能採用，此為何種調整？","o":["情況調整","價格日期調整","區域因素調整","個別因素調整"],"a":0},{"id":"114v5","year":114,"cat":"不動產估價概要","n":5,"q":"下列價格調整率何者符合不動產估價技術規則之規定？","o":["區域因素總價格調整率為18%","個別因素總價格調整率為18%","個別因素內之任一單獨項目之價格調整率為18%","情況、價格日期、區域因素及個別因素調整總調整率為18%"],"a":3},{"id":"114v6","year":114,"cat":"不動產估價概要","n":6,"q":"勘估標的未來平均1年期間之客觀淨收益為100萬元，收益價格為2,000萬元，收益資本化率為：","o":["3%","5%","8%","10%"],"a":1},{"id":"114v7","year":114,"cat":"不動產估價概要","n":7,"q":"以投資為目的之不動產投資評估，最適合的估價方法為：","o":["比較法","折現現金流量分析法","成本法","土地開發分析法"],"a":1},{"id":"114v8","year":114,"cat":"不動產估價概要","n":8,"q":"債務保障比率為1.3、貸款常數為0.055、貸款資金占不動產價格比率為70%，收益資本化率約為：","o":["3%","4%","5%","6%"],"a":2},{"id":"114v9","year":114,"cat":"不動產估價概要","n":9,"q":"附著於土地之工事及水利土壤之改良，以何種方法估價為原則？","o":["比較法","收益法","成本法","土地殘餘法"],"a":2},{"id":"114v10","year":114,"cat":"不動產估價概要","n":10,"q":"下列有關直接資本化法之敘述何者正確？","o":["屬於比較法之一種","應以勘估標的作最合理使用之客觀淨收益為基準","應用價格日期當時適當之收益資本化率推算","計算過程應另加計期末價值"],"a":2},{"id":"114v11","year":114,"cat":"不動產估價概要","n":11,"q":"下列有關成本法之敘述何者正確？","o":["建物估價以求取重置成本為原則","預售收入之資金應計息","建物折舊額計算應以物理耐用年數為主","建物之殘餘價格率以不超過百分之十為原則"],"a":3},{"id":"114v12","year":114,"cat":"不動產估價概要","n":12,"q":"有關土地開發分析法之資本利息綜合利率之敘述何者正確？","o":["資本利息綜合利率＝貸款利息年利率×（建物價值比率＋土地價值比率×1/2）×開發年數","資本利息綜合利率＝資本利息年利率×（建物價值比率＋土地價值比率×1/2）×開發年數","資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×1/2）×開發年數","資本利息綜合利率＝貸款利息年利率×（土地價值比率＋建物價值比率×1/2）×開發年數"],"a":2},{"id":"114v13","year":114,"cat":"不動產估價概要","n":13,"q":"下列因素：①地區淹水②捷運站設置③利率變動④離小學距離，那些是屬於影響不動產價格之區域因素？","o":["①②","①③","②③④","①②③④"],"a":0},{"id":"114v14","year":114,"cat":"不動產估價概要","n":14,"q":"下列何者是個別因素之描述？","o":["甲先生的房子位於重劃區內，房價水準很高","乙小姐的房子距捷運站距離大約50公尺","X大學特定區生活機能佳","大巨蛋球場完工，周圍不動產房價跟著起漲"],"a":1},{"id":"114v15","year":114,"cat":"不動產估價概要","n":15,"q":"下列各項原則中，何者最能說明畸零地價格偏高的現象？","o":["預期原則","貢獻原則","適合原則","外部性原則"],"a":1},{"id":"114v16","year":114,"cat":"不動產估價概要","n":16,"q":"評估臺南孔廟的現值，依不動產估價技術規則之規定，其價格種類為下列何者？","o":["正常價格","限定價格","特定價格","特殊價格"],"a":3},{"id":"114v17","year":114,"cat":"不動產估價概要","n":17,"q":"不動產估價報告書中應註明價格日期與勘查日期，就時間發生的先後下列敘述何者正確？","o":["價格日期先於勘查日期","勘查日期先於價格日期","勘查日期等於價格日期","不一定"],"a":3},{"id":"114v19","year":114,"cat":"不動產估價概要","n":19,"q":"收益法中對於收益的資本化可採收益資本化率或折現率，下列對於兩者數值高低關係之敘述何者正確？","o":["收益資本化率高於折現率","收益資本化率低於折現率","收益資本化率等於折現率","不一定"],"a":3},{"id":"114v20","year":114,"cat":"不動產估價概要","n":20,"q":"不動產相對一般性財貨具低流通、高風險、高增值及管理較難等特性；於採風險溢酬法決定收益資本化率時，上述特性中何者與收益資本化率高低呈反向變動？","o":["流通性","風險性","增值性","管理難度"],"a":2},{"id":"114v21","year":114,"cat":"不動產估價概要","n":21,"q":"以直接資本化法對同一不動產之土地、建物及不動產分別評估其價值，則三者之收益資本化率數值何者最高？","o":["土地","建物","不動產","不一定"],"a":1},{"id":"114v22","year":114,"cat":"不動產估價概要","n":22,"q":"依不動產估價技術規則第130條之規定，不動產租金估計以估計勘估標的之何種租金為原則？","o":["經濟租金","支付租金","合理租金","實質租金"],"a":3},{"id":"114v23","year":114,"cat":"不動產估價概要","n":23,"q":"依不動產估價技術規則第32條之規定，若期末處分價值已知，以折現現金流量分析法計入該價值時，應採取那一種資本化率？","o":["直接資本化率","綜合資本化率","折現率","利率"],"a":2},{"id":"114v24","year":114,"cat":"不動產估價概要","n":24,"q":"於不動產租金估計中有所謂的經濟租金與支付租金，兩者的大小關係為何？","o":["經濟租金高於支付租金","經濟租金低於支付租金","經濟租金等於支付租金","不一定"],"a":3},{"id":"114l2","year":114,"cat":"土地法與土地相關稅法概要","n":2,"q":"甲為A地之登記名義人，與乙成立附條件的A地贈與契約，則甲與乙可以對A地申請做下列那一種土地登記？","o":["假處分登記","第一次登記","註記登記","預告登記"],"a":3},{"id":"114l3","year":114,"cat":"土地法與土地相關稅法概要","n":3,"q":"辦理土地徵收時，徵收事業經行政院核定為重大建設，徵收範圍內之特定農業區農牧用地，如土地所有權人對於土地列入徵收範圍有爭議，經說明後仍有異議，則中央目的事業主管機關應辦理那一項民眾參與方式？","o":["聽證","說明會","公聽會","陳述意見"],"a":0},{"id":"114l4","year":114,"cat":"土地法與土地相關稅法概要","n":4,"q":"依土地稅法之規定，一般地價稅的基本稅率為多少？","o":["百分之十","百分之五","千分之十","千分之十五"],"a":2},{"id":"114l5","year":114,"cat":"土地法與土地相關稅法概要","n":5,"q":"下列關於房屋稅納稅義務人的認定，何者錯誤？","o":["以土地設定地上權之使用權房屋，為該使用權人","共有房屋向共有人徵收，並由共有人推定一人繳納","未辦建物所有權第一次登記且所有人不明者，優先向建造執照所載起造人徵收","房屋為信託財產，在信託關係存續中，為受託人"],"a":2},{"id":"114l6","year":114,"cat":"土地法與土地相關稅法概要","n":6,"q":"土地所有權移轉時，原則上權利人及義務人雙方應於訂定契約幾日內檢附契約影本及相關文件共同向主管稽徵機關申報土地移轉現值？","o":["15日","30日","45日","60日"],"a":1},{"id":"114l7","year":114,"cat":"土地法與土地相關稅法概要","n":7,"q":"依土地法規定，所有權人欲以共有土地設定地上權，在不計共有人人數比例的情況下，至少應得到該共有土地應有部分多少比例之同意？","o":["超過四分之三","超過二分之一","超過三分之二","全體"],"a":2},{"id":"114l8","year":114,"cat":"土地法與土地相關稅法概要","n":8,"q":"下列有關公有土地撥用之敘述，何者錯誤？","o":["無論國有或地方有之土地均有撥用的可能","公有土地撥用需經財政部國有財產署核准","各級政府機關有使用公有土地之需求均得申請撥用公有土地","公有土地之撥用以無償為原則"],"a":1},{"id":"114l9","year":114,"cat":"土地法與土地相關稅法概要","n":9,"q":"區段徵收地區如為經實施農地重劃者，此一地區抵價地總面積比例不得少於徵收總面積多少？","o":["百分之四十","百分之四十五","百分之五十","百分之五十五"],"a":1},{"id":"114l10","year":114,"cat":"土地法與土地相關稅法概要","n":10,"q":"土地法第78條第8款所稱限制登記，謂限制登記名義人處分其土地權利所為之登記，下列何者非屬之？","o":["更正登記","假處分","破產登記","預告登記"],"a":0},{"id":"114l11","year":114,"cat":"土地法與土地相關稅法概要","n":11,"q":"依土地法規定，有關私有土地所有權取得之限制，土地若已成為私有者，政府得依法以何種方式處置？","o":["公開標售","照價收買","徵收","沒收"],"a":2},{"id":"114l12","year":114,"cat":"土地法與土地相關稅法概要","n":12,"q":"對於土地權利之規定，我國係採「物權法定主義」，土地所有權以外之其他不動產物權，謂之他項權利，下列何者屬之？","o":["耕作權","通行權","日照權","畜牧權"],"a":0},{"id":"114l13","year":114,"cat":"土地法與土地相關稅法概要","n":13,"q":"依土地法規定，有關優先購買權之敘述，下列何者正確？","o":["基地出賣或房屋出賣時，優先購買權人，於接到出賣通知後15日內不表示者，其優先購買權視為放棄","耕地租用出租人出賣或出典耕地時，優先購買權人，於接到出賣通知後15日內不表示者，其優先購買權視為放棄","共有土地共有人出賣其應有部分時，優先購買權人，於接到出賣通知後15日內不表示者，其優先購買權視為放棄","區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人者，他共有人有優先購買權之適用"],"a":2},{"id":"114l14","year":114,"cat":"土地法與土地相關稅法概要","n":14,"q":"在不動產贈與的情形下，有關契稅稅率，下列何者為是？","o":["百分之四","百分之六","百分之二","百分之五"],"a":1},{"id":"114l15","year":114,"cat":"土地法與土地相關稅法概要","n":15,"q":"依房屋稅條例規定，對於私有房屋免徵房屋稅，下列何者正確？","o":["無償供政府機關公用或供軍用之房屋","政府平價配售之平民住宅","合法登記之工廠供直接生產使用之自有房屋","受重大災害，毀損面積占整棟面積三成以上不及五成之房屋"],"a":0},{"id":"114l16","year":114,"cat":"土地法與土地相關稅法概要","n":16,"q":"依契稅條例規定，有關納稅義務人繳納契稅期限及罰則之規定，下列敘述何者正確？","o":["納稅義務人應於稽徵機關核定繳款書送達後30日內繳納","納稅義務人不依規定期限申報者，每逾2日，加徵應納稅額百分之二之怠報金","納稅義務人不依規定期限繳納稅款者，每逾3日，加徵應納稅額百分之二之滯納金","納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉發查明屬實者，除應補繳稅額外，並加處以應納稅額一倍以上二倍以下之罰鍰"],"a":0},{"id":"114l17","year":114,"cat":"土地法與土地相關稅法概要","n":17,"q":"依土地稅法規定，納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，應依規定辦理，下列敘述何者正確？","o":["規避繳納實物者，除追補應納部分外，處應繳田賦實物額二倍之罰鍰","土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值百分之三以下之罰鍰","逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰","應追補之稅額或賦額、隨賦徵購實物及罰鍰，納稅義務人應於通知繳納之日起2個月內繳納之"],"a":2},{"id":"114l18","year":114,"cat":"土地法與土地相關稅法概要","n":18,"q":"依都市計畫法規定，有關都市計畫之內容與實施，下列敘述何者正確？","o":["主要計畫其實施進度以5年為一期，最長不得超過25年","細部計畫圖，其比例尺不得小於一千五百分之一","主要計畫圖，其比例尺不得小於一萬五千分之一","主要計畫經核定或備案後，當地直轄市、縣（市）政府應於接到核定或備案公文之日起20日內，將主要計畫書及主要計畫圖發布實施"],"a":0},{"id":"114l19","year":114,"cat":"土地法與土地相關稅法概要","n":19,"q":"依國土計畫法規定，關於中央主管機關應辦理之事項，下列敘述何者正確？","o":["國土功能分區之劃設","國土保育地區或海洋資源地區之使用許可、許可變更及廢止之核定","農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之核定","直轄市、縣（市）國土計畫之擬訂、公告、變更及執行"],"a":1},{"id":"114l20","year":114,"cat":"土地法與土地相關稅法概要","n":20,"q":"有關自辦土地重劃，依相關法規之規定，下列敘述何者正確？","o":["重劃會組織、職權、重劃業務、獎勵措施等事項之辦法，由地方主管機關定之","重劃會辦理市地重劃時，應由重劃區內私有土地所有權人半數以上，而其所有土地面積超過重劃區私有土地總面積半數以上者之同意，並經主管機關核准後實施之","自辦農地重劃，應經重劃區內私有土地所有權人半數以上，而其所有面積亦達私有土地面積半數以上者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准","重劃會辦理農村社區土地重劃時，應經重劃區內私有土地所有權人合計超過三分之二，且其所有面積合計超過私有土地面積三分之二者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准後實施"],"a":1},{"id":"114l21","year":114,"cat":"土地法與土地相關稅法概要","n":21,"q":"依土地法規定，下列何種土地非屬於不得移轉、設定負擔或租賃於外國人之土地？","o":["林地","鹽地","農地","水源地"],"a":2},{"id":"114l22","year":114,"cat":"土地法與土地相關稅法概要","n":22,"q":"下列何者並非土地法中的農作改良物？","o":["置於農地上的盆栽","附著於農地上的芒果樹","農田的灌溉設施","農地上所施加的肥料"],"a":0},{"id":"114l23","year":114,"cat":"土地法與土地相關稅法概要","n":23,"q":"依土地徵收條例規定，有關得為區段徵收之情形，下列何項非屬之？","o":["舊都市地區為公共安全、衛生、交通之需要或促進土地之合理使用實施更新者","非都市土地實施開發建設者","興辦國營事業或公安事業者","農村社區為加強公共設施、改善公共衛生之需要或配合農業發展之規劃實施更新者"],"a":2},{"id":"114l24","year":114,"cat":"土地法與土地相關稅法概要","n":24,"q":"依土地稅法規定，土地所有權人申請自用住宅用地，其地價稅按千分之二計徵，下列敘述何者正確？","o":["都市土地面積未超過五公畝部分","非都市土地面積未超過十公畝部分","國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅","土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率繳納地價稅者，以一次為限"],"a":2},{"id":"114l25","year":114,"cat":"土地法與土地相關稅法概要","n":25,"q":"政府為解決因經費問題無法於短期內徵收公共設施保留地，以至於影響土地所有權人之權益，於是採取若干措施，依相關法規之規定，下列敘述何者正確？","o":["都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依平均地權條例第20條之規定外，統按千分之十計徵地價稅","公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅","依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，減半徵收土地增值稅","公共設施保留地因繼承或因配偶、直系血親間之贈與而移轉者，減半徵收遺產稅或贈與稅"],"a":1},{"id":"114r1","year":114,"cat":"不動產經紀相關法規概要","n":1,"q":"公寓大廈頂樓平台漏水之原因，為年久失修導致防水層破損。此時應由誰負修繕義務？","o":["依區分所有權人會議決議","公寓大廈管理委員會","頂樓住戶","頂樓住戶和管理委員會共同負責"],"a":1},{"id":"114r2","year":114,"cat":"不動產經紀相關法規概要","n":2,"q":"舉行公寓大廈區分所有權人會議時，何種事項在會議中，不得以臨時動議提出？","o":["管理委員選任之事項","公共區域禁止吸煙之事項","公共設施緊急維修之事項","調整收取社區管理費之事項"],"a":0},{"id":"114r3","year":114,"cat":"不動產經紀相關法規概要","n":3,"q":"依公寓大廈管理條例，下列有關公寓大廈管理委員任期之敘述，何者正確？","o":["管理委員之任期不可以規定在規約中，要召開區分所有權人會議決定","管理委員會會議得決議各管理委員任期為1年或2年","主任委員、財務管理委員及監察業務委員之任期屆滿，連選得連任一次","管理委員會的各管理委員之任期屆滿，連選得連任"],"a":2},{"id":"114r4","year":114,"cat":"不動產經紀相關法規概要","n":4,"q":"甲在公寓大廈1樓開店營業，向管理委員會表示想要於該大樓1、2樓外牆設置廣告物，甲要取得何者之同意，才能設置廣告物？","o":["管理委員會開會同意","管理委員會會議及區分所有權人會議決議同意","2樓區分所有權人同意","區分所有權人會議決議同意及1樓、2樓區分所有權人同意"],"a":3},{"id":"114r5","year":114,"cat":"不動產經紀相關法規概要","n":5,"q":"依消費者保護法之規定，企業經營者對消費者保證商品或服務之品質時，應主動出具書面保證書。該保證書應載明之事項中，不包括那一項？","o":["商品或服務之名稱、種類、數量，其有製造號碼或批號者，其製造號碼或批號","保證期間及其起算方法","由經銷商售出者，經銷商之名稱、地址","各期價款與其他附加費用合計之總價款與現金交易價格之差額"],"a":3},{"id":"114r6","year":114,"cat":"不動產經紀相關法規概要","n":6,"q":"訪問交易之消費者，關於行使解除契約之敘述，下列何者為正確？","o":["消費者行使解除權，唯有直接退回商品給企業經營者之方式","經企業經營者同意，可以用口頭通知企業經營者的方式來解除契約","消費者解除買賣契約，無須說明理由且無庸負擔任何費用或價款","消費者行使解除權的7天猶豫期，可以以特約排除猶豫期間"],"a":2},{"id":"114r7","year":114,"cat":"不動產經紀相關法規概要","n":7,"q":"甲建商所銷售預售屋的車位位置、規格，不符合預售屋買賣定型化契約應記載及不得記載事項時，地方政府主管機關應優先適用何種法律，裁處罰鍰？","o":["公平交易法","平均地權條例","消費者保護法","不動產經紀業管理條例"],"a":1},{"id":"114r8","year":114,"cat":"不動產經紀相關法規概要","n":8,"q":"公平交易法有關事業間聯合行為之敘述，下列何者錯誤？","o":["行為主體須為二以上彼此具競爭關係之同一產銷階段事業","事業間具有以契約、協議或其他方式之合意或相互約束事業活動之行為","效果須足以影響生產、商品交易或服務供需之市場功能","主管機關不得以相當依據推定事業間具有聯合行為之合意"],"a":3},{"id":"114r9","year":114,"cat":"不動產經紀相關法規概要","n":9,"q":"下列何者不屬於公平交易法第21條不實廣告之行為態樣？","o":["甲公司在網頁宣稱驗屋人員有專業證照，惟該等證照並非與執行驗屋業務相關的證照","乙建商在廣告文宣傳單上，對於使用分區為科技商務專用區之建案使用一般住宅用語","丙仲介人員在公司窗戶上貼單，刊載多筆房屋賀成交資訊，惟部分成交紀錄並非均為該公司所成交","代銷業者刊登廣告招徠客人，對來購屋消費者表示須先給付定金始提供房屋買賣契約書攜回審閱"],"a":3},{"id":"114r10","year":114,"cat":"不動產經紀相關法規概要","n":10,"q":"事業向公平交易委員會申請許可進口玉米之聯合行為，經該會附加負擔後予以許可，並在期限屆滿前，再向主管機關申請期限延展。下列敘述何者錯誤？","o":["主管機關對許可及其有關之條件、負擔、期限，不得主動公開","事業向主管機關申請其延展期限，每次不得逾5年","主管機關對申請展延所為之許可，得附加條件或負擔","事業如有正當理由，得於期限屆滿前3個月至6個月期間內申請"],"a":0},{"id":"114r11","year":114,"cat":"不動產經紀相關法規概要","n":11,"q":"有關不動產說明書應記載及不得記載事項之擬定與公告，下列敘述何者正確？","o":["由內政部擬定相關規範，並向行政院報請核定公告","由消費者保護處擬定相關規範，並向行政院報請核定公告","由法務部擬定相關規範，並向司法院報請核定公告","由仲介業全聯會擬定相關規範，並向司法院報請核定公告"],"a":0},{"id":"114r12","year":114,"cat":"不動產經紀相關法規概要","n":12,"q":"甲不動產仲介經紀有限公司，A營業處所之經紀人離職缺人，因而僱用剛考取不動產經紀人考試及格者丁，承辦仲介業務並於委託銷售契約書上簽章。下列甲違反不動產經紀業管理條例規定之敘述，何者錯誤？","o":["甲違反經紀業設立之營業處所至少應置經紀人一人","甲違反不動產之委託契約書應由經紀業指派經紀人簽章","甲違反不得僱用未具備經紀人員資格者從事仲介業務","甲違反規定受停止執行業務處分累計達3次以上者，廢止其經營許可"],"a":3},{"id":"114r13","year":114,"cat":"不動產經紀相關法規概要","n":13,"q":"依據不動產經紀業管理條例，關於經營仲介業務者之規定，下列敘述何者正確？","o":["向主管機關申請許可，經審查後即得經營仲介業務","以商號之型態辦理登記後，即得開始經營仲介業務","所僱用的經紀人員可以用個人名義執行不動產買賣","經營國外不動產仲介業務，應以公司型態辦理登記"],"a":3},{"id":"114r14","year":114,"cat":"不動產經紀相關法規概要","n":14,"q":"甲剛搬來社區不久，即受到鄰居推薦，並順利當選社區管理委員會之委員。依公寓大廈管理條例之規定，該管理委員會有那一種能力？","o":["權利能力","行為能力","意思能力","當事人能力"],"a":3},{"id":"114r15","year":114,"cat":"不動產經紀相關法規概要","n":15,"q":"依公寓大廈管理條例之規定，關於共用部分之敘述，何者錯誤？","o":["各區分所有權人對建築物之共用部分及其基地有使用收益之權利，按其共有之應有部分比例，不得另行約定之","住戶對共用部分之使用方法，可以另外約定調整之","共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之","專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔"],"a":0},{"id":"114r16","year":114,"cat":"不動產經紀相關法規概要","n":16,"q":"甲買了一個社區的房子，剛好到了要召開區分所有權人會議的時間。依公寓大廈管理條例之規定，區分所有權人會議至少多久應召開定期會議一次？","o":["每3個月","每季","每半年","每年"],"a":3},{"id":"114r17","year":114,"cat":"不動產經紀相關法規概要","n":17,"q":"區分所有權人會議之決議，依公寓大廈管理條例，除規約另有規定，應有區分所有權人⑴以上及其區分所有權比例合計⑵以上出席，以出席人數⑶以上及其區分所有權比例占出席人數區分所有權⑷以上之同意行之。上述⑴⑵⑶⑷之比例，依序應為多少？","o":["二分之一、二分之一、三分之二、三分之二","二分之一、三分之二、三分之二、四分之三","三分之二、三分之二、四分之三、四分之三","三分之二、四分之三、四分之三、五分之四"],"a":2},{"id":"114r18","year":114,"cat":"不動產經紀相關法規概要","n":18,"q":"依不動產經紀業管理條例之規定，經紀人員違反下列那一選項之規定，不僅應依規定懲戒，經紀業亦將依規定處罰？","o":["經紀人員未專任一經紀業，違法為他經紀業執行仲介或代銷業務","經紀人員收取差價或其他報酬","經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說","經紀人員無故洩漏因業務知悉或持有之他人秘密"],"a":1},{"id":"114r19","year":114,"cat":"不動產經紀相關法規概要","n":19,"q":"依不動產經紀業管理條例之規定，下列關於不動產經紀營業員之敘述，何者正確？","o":["不動產經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員","經紀營業員訓練不得少於20個小時，其證明有效期限為4年","期滿時，經紀營業員應檢附完成訓練30個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄","經紀營業員經驗之認定，得以本條例施行後，已實際從事仲介或代銷業務之所得扣繳資料證明"],"a":0},{"id":"114r20","year":114,"cat":"不動產經紀相關法規概要","n":20,"q":"依不動產經紀業管理條例之規定，經紀業應完成相關程序後方得營業。下列敘述，何者錯誤？","o":["經紀業經主管機關之許可，並辦妥公司登記或商業登記","加入戶籍所在地之同業公會","依中央主管機關規定繳存營業保證金","應於6個月內開始營業；逾期未開始營業者，由主管機關廢止其許可"],"a":1},{"id":"114r21","year":114,"cat":"不動產經紀相關法規概要","n":21,"q":"依公平交易法之規定，法院因事業違反該法之規定，致侵害他人權益者，被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？","o":["二倍","三倍","五倍","十倍"],"a":1},{"id":"114r22","year":114,"cat":"不動產經紀相關法規概要","n":22,"q":"依不動產經紀業管理條例之規定，下列那一項關於簽章之敘述錯誤？","o":["經紀人員在執行業務過程中，不動產說明書於提供解說前，應經委託人簽章","雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章","委由經紀業仲介或代銷者，不動產租賃、買賣契約書文件應由經紀業指派經紀人簽章","經營經紀業者，向主管機關申請許可之應備文件應由經紀業指派經紀人簽章"],"a":3},{"id":"114r23","year":114,"cat":"不動產經紀相關法規概要","n":23,"q":"不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，依不動產經紀業管理條例之規定，相關文件應由經紀業指派經紀人簽章。下列何者於經營代銷業務者不適用之？","o":["不動產出租、出售委託契約書","定金收據","不動產廣告稿","不動產說明書"],"a":0},{"id":"114r24","year":114,"cat":"不動產經紀相關法規概要","n":24,"q":"依公平交易法之規定，下列那一個定義之內容錯誤？","o":["廣告薦證者，指廣告主於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果","獨占，指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者","競爭，指二以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為","控制性持股，指前項之人或團體及其關係人持有他事業有表決權之股份或出資額，超過他事業已發行有表決權之股份總數或資本總額半數者"],"a":0},{"id":"114r25","year":114,"cat":"不動產經紀相關法規概要","n":25,"q":"依消費者保護法之規定，下列敘述何者正確？","o":["定型化契約條款：指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約","邀約交易：指企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約","分期付款：指買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態","通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於檢視商品或服務之後，而與企業經營者所訂立之契約"],"a":2},{"id":"113m1","year":113,"cat":"民法概要","n":1,"q":"甲就其所有之A地，先與乙訂立買賣契約，後與丙訂立買賣契約，均未辦理所有權移轉登記。關於二個買賣契約之效力，下列敘述，何者正確？","o":["前契約有效，後契約無效","前契約無效，後契約有效","前契約有效，後契約有效","前契約無效，後契約無效"],"a":2},{"id":"113m2","year":113,"cat":"民法概要","n":2,"q":"有關行為能力之敘述，下列何者正確？","o":["年滿30歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力","年滿19歲之乙可以獨自訂立買賣汽車之契約","受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊","15歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"],"a":1},{"id":"113m3","year":113,"cat":"民法概要","n":3,"q":"甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？","o":["丙善意取得名畫之所有權","丙得請求乙損害賠償","乙與丙之買賣契約有效","乙與丙之物權契約有效"],"a":1},{"id":"113m4","year":113,"cat":"民法概要","n":4,"q":"甲對乙有新臺幣（下同）100萬元之債權，將該債權讓與丙，甲與丙均未通知乙債權讓與之事情。嗣後，乙因不知債權讓與之事情，對甲清償100萬元，經甲受領，下列敘述，何者正確？","o":["甲與丙之債權讓與無效","乙之債務因清償而消滅","應經丙承認，乙之債務始消滅","甲與丙之債權讓與應經乙承認始生效"],"a":1},{"id":"113m5","year":113,"cat":"民法概要","n":5,"q":"甲申請之建案因違法無法取得建造許可，遂與乙約定，由甲贈與乙之妻丙100萬元後，乙須幫助甲取得建造許可，後來乙收賄之行為經法院判決有罪確定。問甲可否向丙請求返還100萬元？","o":["可以，依據不當得利","不可，100萬元為不法原因之給付","可以，100萬為違背公序良俗之給付","可以，依據無因管理"],"a":1},{"id":"113m6","year":113,"cat":"民法概要","n":6,"q":"甲無權占有乙所有已登記之A地15年後，乙對甲提起所有物返還請求之訴訟，下列敘述，何者正確？","o":["甲得對乙為消滅時效之抗辯","乙之回復請求權不罹於消滅時效","甲得對乙主張時效取得A地所有權","乙之A地所有權因罹於時效而消滅"],"a":1},{"id":"113m7","year":113,"cat":"民法概要","n":7,"q":"甲與乙訂立租賃契約，將丙所有之A屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還A屋，致乙不能為約定之使用，下列敘述，何者正確？","o":["甲與乙訂立之租賃契約無效","甲與乙訂立之租賃契約得撤銷","乙得終止與甲訂立之租賃契約","乙得以與甲之租賃契約對抗丙"],"a":2},{"id":"113m8","year":113,"cat":"民法概要","n":8,"q":"甲將其所有之A屋出租於乙，乙未經甲之同意，將A屋全部轉租於丙。下列敘述，何者正確？","o":["乙與丙訂立之租賃契約無效","甲與乙訂立之租賃契約無效","乙得終止乙與丙之租賃契約","甲得終止甲與乙之租賃契約"],"a":3},{"id":"113m9","year":113,"cat":"民法概要","n":9,"q":"甲在其所有之A地上興建B屋後，將B屋出售並移轉所有權登記於乙。下列敘述，何者正確？","o":["推定甲與乙在房屋得使用期限內有租賃關係","視為甲與乙在房屋得使用期限內有租賃關係","推定乙在房屋得使用期限內對A地有普通地上權","視為乙在房屋得使用期限內對A地有普通地上權"],"a":0},{"id":"113m10","year":113,"cat":"民法概要","n":10,"q":"有關意思表示之敘述，下列何者正確？","o":["甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係","甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與契約仍有效","甲誤將丙誤認為乙，與之訂立買賣契約，該契約有效，但甲得撤銷其之意思表示","甲受丙脅迫而與之訂立互易契約，該契約當然無效"],"a":2},{"id":"113m12","year":113,"cat":"民法概要","n":12,"q":"甲於自有土地上建造房屋一棟，因積欠乙銀行巨款，土地及房屋遭乙向法院聲請查封拍賣，土地為丙所拍得，房屋為丁所拍得。下列敘述，何者正確？","o":["丙可以請求丁拆屋還地","丁必須承租丙之土地","視為丁於土地上有地上權","推定丙與丁間有使用借貸契約"],"a":2},{"id":"113m13","year":113,"cat":"民法概要","n":13,"q":"甲與乙訂立買賣契約，向乙購買A地。下列關於甲何時取得A地所有權之敘述，何者正確？","o":["買賣契約有效成立時","甲付清買賣價金之時","完成所有權移轉登記時","乙將A地交付於甲之時"],"a":2},{"id":"113m14","year":113,"cat":"民法概要","n":14,"q":"甲乙丙丁分別共有A地，甲以乙丙丁為被告提起分割共有物之訴，獲得勝訴確定判決。下列敘述，何者正確？","o":["甲乙丙丁於判決確定時，各自取得分得部分之所有權","甲根據確定判決，請求乙丙丁辦理登記，始取得分得部分之所有權","共有物分割之判決是確認判決，僅在確認甲乙丙丁之權利義務法律關係","共有物分割之判決是給付判決，甲有權請求乙丙丁給付分得部分之所有權"],"a":0},{"id":"113m15","year":113,"cat":"民法概要","n":15,"q":"甲以行使普通地上權之意思，二十年間和平、公然、繼續在乙已登記之A地上有B屋，下列敘述，何者正確？","o":["甲已經取得普通地上權","甲得請求登記為普通地上權人","因乙之A地已辦理登記，故甲無法時效取得","甲得直接以乙為被告，起訴請求乙同意甲登記為普通地上權人"],"a":1},{"id":"113m16","year":113,"cat":"民法概要","n":16,"q":"甲以自有土地設定抵押權予乙，以擔保其債權，該債權之請求權於113年3月1日因時效而消滅。下列敘述，何者正確？","o":["因從屬於擔保債權，故抵押權隨之消滅","抵押權人須於消滅時效完成後，5年間實行其抵押權","抵押權無消滅時效，可一直存續","從此之後，抵押權之實行須經債務人同意"],"a":1},{"id":"113m17","year":113,"cat":"民法概要","n":17,"q":"甲向乙銀行貸款新臺幣500萬元，並以甲所有之A地為乙設定普通抵押權，雙方約定債權已屆清償期而未為清償時，A地之所有權移屬於乙。就該流押契約之效力，下列敘述，何者正確？","o":["絕對無效","相對無效","非經登記，不生效力","非經登記，不得對抗第三人"],"a":3},{"id":"113m18","year":113,"cat":"民法概要","n":18,"q":"甲向乙銀行借貸新臺幣1000萬元，並以甲所有之A屋為乙設定普通抵押權。嗣後，因第三人丙之過失，致A屋滅失，下列敘述，何者正確？","o":["乙之抵押權因A屋滅失而消滅","乙就甲對丙所得行使之賠償請求權有權利質權","乙就甲對丙所得行使之賠償請求權有動產質權","乙就甲對丙所得行使之賠償請求權有普通抵押權"],"a":1},{"id":"113m19","year":113,"cat":"民法概要","n":19,"q":"著有數本暢銷理財專書之甲，某日遭汽車駕駛人丙撞傷，卻於與丙損害賠償協議達成前，突發心肌梗塞猝死，留有土地一筆及尚未繳清貸款之房屋一棟，某上市電子公司股份100萬股，銀行存款30萬元，尚欠有乙銀行之信用貸款20萬元。下列何者非屬繼承之標的？","o":["尚未繳清貸款之房屋","甲所著理財專書之著作權","甲對丙依據民法第195條規定可主張之非財產上損害賠償請求權","甲積欠乙銀行之20萬信用貸款"],"a":2},{"id":"113m20","year":113,"cat":"民法概要","n":20,"q":"民法就夫妻財產制採類型法定原則，下列何者並非我國現行民法規定之夫妻財產制類型？","o":["法定財產制","共同財產制","分別財產制","統一財產制"],"a":3},{"id":"113m21","year":113,"cat":"民法概要","n":21,"q":"夫妻得於結婚前或結婚後，以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。關於夫妻財產制契約，下列敘述，何者錯誤？","o":["應以書面為之","非經登記，不生效力","非經登記，不得以之對抗第三人","夫妻未以契約訂立夫妻財產制者，原則上以法定財產制，為其夫妻財產制"],"a":1},{"id":"113m22","year":113,"cat":"民法概要","n":22,"q":"甲男與乙女結婚後，乙女與丙男發生婚外情，並生下丁。下列敘述，何者錯誤？","o":["丁係在甲與乙婚姻關係存續中受胎，推定為甲乙之婚生子女","甲自知悉丁非其婚生子女時起二年內，得對丁提起否認之訴","丙得以甲與丁為被告，提起否認甲與丁間具有親子關係之訴","丁與乙之關係，視為婚生子女，乙無須出面從事認領之動作"],"a":2},{"id":"113m23","year":113,"cat":"民法概要","n":23,"q":"甲男與乙女結婚後，並無任何子女。嗣後，甲男死亡，繼承人為乙與甲之父母丙丁。關於乙女之應繼分，下列敘述，何者正確？","o":["乙與丙丁平均繼承，各三分之一","乙女之應繼分為遺產之二分之一","乙女之應繼分為遺產之三分之二","乙女之應繼分為遺產之四分之三"],"a":1},{"id":"113m24","year":113,"cat":"民法概要","n":24,"q":"民法關於特留分比例之規定，下列敘述，何者錯誤？","o":["直系血親卑親屬之特留分為其應繼分二分之一","父母之特留分為其應繼分二分之一","兄弟姊妹之特留分為其應繼分二分之一","配偶之特留分為其應繼分二分之一"],"a":2},{"id":"113m25","year":113,"cat":"民法概要","n":25,"q":"甲死亡後留有土地一筆，由其妻乙、兒子丙及女兒丁及戊繼承，因丙不想繼承該筆土地，故向法院以書面聲明拋棄繼承，並通知其他應繼承之人，戊知悉後，則向乙、丙、丁表明，其也要拋棄繼承，並拒絕繳納遺產稅及辦理繼承登記。下列敘述，何者正確？","o":["丙收到法院寄發之「台端拋棄繼承，准予備查」的函件時，拋棄繼承才生效","丙拋棄繼承時，其子女可代位繼承","戊亦已經拋棄繼承，不得繼承土地所有權","甲之繼承人有乙、丁、戊等三人，應繼分均等"],"a":3},{"id":"113v1","year":113,"cat":"不動產估價概要","n":1,"q":"不動產市場循環受到諸多經濟因素的影響，評估不動產價格時都訂有價格日期，依價格日期評估時必須掌握那項原則？","o":["預測原則","變動原則","收益分配原則","外部性原則"],"a":1},{"id":"113v2","year":113,"cat":"不動產估價概要","n":2,"q":"王小姐住家旁有一個高壓電塔，電塔周遭的房子不太容易售出，價格也比較低，不動產估價師評估該嫌惡設施對於房屋價格的影響是基於那一項原則？","o":["適合原則","外部性原則","貢獻原則","競爭原則"],"a":1},{"id":"113v3","year":113,"cat":"不動產估價概要","n":3,"q":"下列何者非屬於不動產估價範疇？","o":["大鵬灣濕地","地上權房屋，如101大樓","種植在山上的果樹","從果樹上摘下來的果實"],"a":3},{"id":"113v5","year":113,"cat":"不動產估價概要","n":5,"q":"下列有關租金估計的敘述何者錯誤？","o":["租金估價的價格種類包括正常租金與限定租金兩種","名目租金，指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數","續訂租金與正常市場租金不同，故續訂租金屬於限定租金","積算法用於評估正常租金"],"a":1},{"id":"113v6","year":113,"cat":"不動產估價概要","n":6,"q":"不動產估價技術規則對不動產估價方法運用的規定，下列何者錯誤？","o":["不動產估價師應兼採二種以上估價方法推算勘估標的價格","不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新檢討","評估證券化不動產清算價格時，對於折現現金流量分析法之收益價格應賦予相對較大之權重","對於各方法試算價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格，並將決定理由詳予敘明"],"a":2},{"id":"113v7","year":113,"cat":"不動產估價概要","n":7,"q":"有關比較法的敘述下列何者錯誤？","o":["比較標的價格經情況調整、價格日期調整、區域因素調整及個別因素調整後所獲得之價格稱為比較價格","比較法指以比較標的價格為基礎，經比較、分析及調整等，以推算勘估標的價格之方法","價格日期調整是指比較標的之交易日期與勘估標的之價格日期因時間之差異，致價格水準發生變動，應以適當之變動率或變動金額，將比較標的價格調整為勘估標的價格日期之價格","比較標的與勘估標的不在同一近鄰地區內時，為將比較標的之價格轉化為與勘估標的同一近鄰地區內之價格水準的調整稱為區域因素調整"],"a":0},{"id":"113v8","year":113,"cat":"不動產估價概要","n":8,"q":"不動產估價技術規則第26條第1項：經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。若比較標的一、二、三之試算價格分別為79萬元/坪，77萬元/坪及95萬元/坪，下列敘述何者正確？","o":["三個試算價格之間皆符合排除條件","三個試算價格之間皆不符合排除條件","比較標的一與三之間符合排除條件","比較標的二與三之間符合排除條件"],"a":3},{"id":"113v9","year":113,"cat":"不動產估價概要","n":9,"q":"下列何者非屬營造或施工費的內含項目？","o":["直接人工費","間接材料費","開發商的合理利潤","資本利息"],"a":2},{"id":"113v10","year":113,"cat":"不動產估價概要","n":10,"q":"有關營造或施工費的敘述何者錯誤？","o":["營造或施工費屬於建物總成本的一部分，房屋愈舊，營造或施工費就愈低","勘估標的之營造或施工費，得按直接法或間接法擇一求取之。功能性退化造成的折舊屬於房屋折舊的一部分","淨計法屬於直接法的一種，是指就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤","單位工程法也屬於直接法，係以建築細部工程之各項目單價乘以該工程施工數量，並合計之"],"a":0},{"id":"113v11","year":113,"cat":"不動產估價概要","n":11,"q":"中央銀行理監事會於113年第3季會議決議調升存款準備率及調整選擇性信用管制措施，此項宣布可能會影響不動產市場與價值，此為影響不動產價值之何種因素？","o":["一般因素","情況因素","區域因素","個別因素"],"a":0},{"id":"113v12","year":113,"cat":"不動產估價概要","n":12,"q":"下列對於有效總收入與總收入之間關係的敘述何者正確？","o":["總收入必定大於或等於有效總收入","有效總收入與總收入只是說法上不同，兩者在實質的意義上一樣","總收入減去總費用等於淨收益","總收入=有效總收入+總費用"],"a":0},{"id":"113v14","year":113,"cat":"不動產估價概要","n":14,"q":"有關收益法的公式，下列何者錯誤？","o":["淨收益未扣除折舊提存費者，建物收益價格＝建物淨收益／建物收益資本化率","直接資本化法之收益價格＝勘估標的未來平均一年期間之客觀淨收益／收益資本化率","地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率","淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率"],"a":0},{"id":"113v15","year":113,"cat":"不動產估價概要","n":15,"q":"有關特殊宗地估價敘述，下列何者錯誤？","o":["農場或牧場之估價，以比較法估價為原則","公共設施用地及公共設施保留地之估價，應考慮政府徵收土地之可能價格評估之","高爾夫球場之估價，應考慮會員制度、球場設施、開發成本、收益及營運費用等因素","鹽田之估價無買賣實例者，得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，比較推估之"],"a":1},{"id":"113v16","year":113,"cat":"不動產估價概要","n":16,"q":"有關權利估價敘述，下列何者正確？","o":["市地重劃前後土地估價係作為地主分配的依據，不屬於權利估價","永佃權估價，不需要考慮佃租支付情形，依民間習慣估計之","地上權估價，應考慮其用途、權利存續期間、支付地租之有無、權利讓與之限制及地上權設定之空間位置等因素估計之","容積移轉估價，主要考慮捐贈公共設施用地的市場價格決定之"],"a":2},{"id":"113v17","year":113,"cat":"不動產估價概要","n":17,"q":"下列那種情況評估的是特殊價格？","o":["估價師受託辦理評估因都市計畫將公園變更為住宅用地之土地價格","估價師受託辦理評估以土地租賃權與租賃地合併為目的之價格","估價師受託辦理評估大甲鎮瀾宮的價格","估價師受託辦理評估都市邊緣未來可能變更為建地的農地價格"],"a":2},{"id":"113v18","year":113,"cat":"不動產估價概要","n":18,"q":"影響不動產價格的三大因素中區域因素甚為重要，下列敘述何者非屬區域因素的描述？","o":["王小姐的房子位於信義計畫區內房價水準很高","張先生的房子距離大安森林公園約50公尺條件很好","板橋埔墘生活圈生活機能很好","中正紀念堂周遭的房子有很好的價值條件"],"a":1},{"id":"113v19","year":113,"cat":"不動產估價概要","n":19,"q":"A把忠孝東路五段鄰近市政府的店面出租給一間連鎖咖啡店，每月租金100,000元，押金2個月，假設年利率2.5%，約定每年管理費120,000元由咖啡店支付，請問其一年支付之實質租金為多少元？","o":["1,200,000","1,205,000","1,085,000","1,080,000"],"a":1},{"id":"113v20","year":113,"cat":"不動產估價概要","n":20,"q":"某公寓因為隔壁基地正在興建危老建案造成外牆龜裂現象，此現象屬於那一種折舊類型？","o":["物理性折舊","功能性折舊","經濟性折舊","外部性折舊"],"a":0},{"id":"113v21","year":113,"cat":"不動產估價概要","n":21,"q":"一棟屋齡30年的公寓，假設現在重建成本是3,000萬元，耐用年數為50年，殘餘價格率為10%，以定額法計算折舊的情況下，目前公寓的價值是多少？","o":["1,620萬元","1,380萬元","1,080萬元","1,200萬元"],"a":1},{"id":"113v22","year":113,"cat":"不動產估價概要","n":22,"q":"比較標的於112年9月以3,060萬元售出，當時房價指數為102；勘估標的價格日期為113年5月，房價指數上漲至105。假設其他條件相同，勘估標的經價格日期調整後的應該是多少？","o":["2,970萬元","3,150萬元","3,240萬元","3,210萬元"],"a":1},{"id":"113v23","year":113,"cat":"不動產估價概要","n":23,"q":"依據不動產估價技術規則規定試算價格的價格決定，那一項不適用？","o":["試算價格調整過程中，任一單獨項目之價格調整率大於15%時應排除","試算價格調整過程中，總調整率大於20%應排除","試算價格調整過程中，總調整率大於30%應排除","試算價格調整過程中，試算價格之間差距達20%以上應排除"],"a":1},{"id":"113v24","year":113,"cat":"不動產估價概要","n":24,"q":"某一開發案自有資金比例是30%，其餘資金向銀行貸款，貸款利率為3%，自有資金報酬率為2%，其資本化率為何？","o":["2.3%","2.7%","2.5%","2.6%"],"a":1},{"id":"113v25","year":113,"cat":"不動產估價概要","n":25,"q":"某一棟四層樓公寓，各樓層面積皆相同，一樓單價每坪50萬元，4樓單價每坪40萬元，假設4樓之樓層別效用比為100%，請問一樓的樓層別效用比是多少？","o":["150%","130%","115%","125%"],"a":3},{"id":"113l1","year":113,"cat":"土地法與土地相關稅法概要","n":1,"q":"依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，但經其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核准者，不在此限。買受人據此得讓與或轉售之戶（棟）數為何？","o":["全國每一年以一戶（棟）為限","全國每一年以二戶（棟）為限","全國每二年以一戶（棟）為限","全國每二年以三戶（棟）為限"],"a":2},{"id":"113l2","year":113,"cat":"土地法與土地相關稅法概要","n":2,"q":"依平均地權條例規定，權利人及義務人應於買賣案件申請所有權移轉登記時，申報登錄資訊，未共同申報登錄資訊者，直轄市、縣（市）主管機關應令其限期申報登錄資訊；屆期未申報登錄資訊，買賣案件已辦竣所有權移轉登記者，處多少罰鍰，並令其限期改正？","o":["新臺幣三萬元以上十五萬元以下罰鍰","新臺幣六萬元以上三十萬元以下罰鍰","新臺幣十五萬元以上五十萬元以下罰鍰","新臺幣三十萬元以上一百萬元以下罰鍰"],"a":0},{"id":"113l3","year":113,"cat":"土地法與土地相關稅法概要","n":3,"q":"依平均地權條例規定，有關私法人買受供住宅使用之房屋，下列何者正確？","o":["應檢具切結書，經中央主管機關許可","中央主管機關審核其使用計畫，以合議制方式辦理","私法人取得之房屋，於登記完畢後十年內不得辦理預告登記","許可之文件有效期限為二年"],"a":1},{"id":"113l4","year":113,"cat":"土地法與土地相關稅法概要","n":4,"q":"依都市計畫法規定，有關主要計畫之核定，下列何者正確？","o":["鎮及鄉街之主要計畫由內政部核定","直轄市之主要計畫由行政院核定","特定區計畫由縣（市）政府擬定者，由內政部核定，轉報行政院備案","特定區計畫由內政部訂定者，由行政院核定"],"a":0},{"id":"113l5","year":113,"cat":"土地法與土地相關稅法概要","n":5,"q":"依土地徵收條例規定，有關徵收之撤銷或廢止之敘述，下列何者錯誤？","o":["撤銷或廢止徵收，由需用土地人向中央主管機關申請之","在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由該管直轄市或縣（市）政府列管","依徵收計畫開始使用前，開發方式改變，應廢止徵收","因作業錯誤，致原徵收之土地不在工程用地範圍內，應撤銷徵收"],"a":1},{"id":"113l6","year":113,"cat":"土地法與土地相關稅法概要","n":6,"q":"依土地徵收條例規定，有關徵收補償費，下列何者正確？","o":["在都市計畫區內之公共設施保留地，應按照徵收當期之市價補償其地價","徵收補償之地價，由不動產估價師評定之","建築改良物之補償費，按徵收當時該建築改良物之重置價格估定之","農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在一年以內者，按成熟時之孳息估定之"],"a":3},{"id":"113l7","year":113,"cat":"土地法與土地相關稅法概要","n":7,"q":"依土地徵收條例規定，有關直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶部分，下列何者錯誤？","o":["自通知送達發生效力之日起，逾十年未領取之補償費，歸屬國庫","應於規定應發給補償費之期限屆滿次日起三個月內存入專戶保管","保管未受領之徵收補償費，不適用提存法之規定","未受領之徵收補償費，依規定繳存專戶保管時，視同補償完竣"],"a":0},{"id":"113l8","year":113,"cat":"土地法與土地相關稅法概要","n":8,"q":"依土地徵收條例規定，有關徵收之程序，下列何者正確？","o":["特定農業區經行政院核定為重大建設須辦理徵收者，應依行政程序法舉行聽證","需用土地人於事業計畫報請目的事業主管機關許可後，應舉行公聽會","協議價購時，依其他法律規定有優先購買權者，無優先購買權之適用","需用土地人於所有權人拒絕參與協議或經開會未能達成協議時，則改申請徵收"],"a":2},{"id":"113l9","year":113,"cat":"土地法與土地相關稅法概要","n":9,"q":"依都市計畫法規定，主要計畫擬定後經該管政府都市計畫委員會審議修正，或經內政部指示修正者，後續如何辦理？","o":["免再公開展覽及舉行說明會","再公開展覽","再舉行說明會","再公開展覽及舉行說明會"],"a":0},{"id":"113l10","year":113,"cat":"土地法與土地相關稅法概要","n":10,"q":"依土地法規定，逾期未辦繼承之土地於標售時，有關優先購買權人之順序依序為何？","o":["繼承人、合法使用人、其他共有人","其他共有人、合法使用人、繼承人","合法使用人、繼承人、其他共有人","繼承人、其他共有人、合法使用人"],"a":0},{"id":"113l11","year":113,"cat":"土地法與土地相關稅法概要","n":11,"q":"依土地法規定，依法得分割之共有土地，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之？","o":["七日","十日","十五日","三十日"],"a":2},{"id":"113l12","year":113,"cat":"土地法與土地相關稅法概要","n":12,"q":"依土地法規定，關於地權及地權限制，下列何者正確？","o":["台灣糖業股份有限公司所有土地為公有土地","私有土地，因天然變遷成為湖澤或可通運之水道時，其所有權絕對消滅","湖澤及可通運之水道及岸地，如因水流變遷而自然增加時，其接連地之使用權人，有優先依法取得其所有權或使用受益之權","私有土地所有權之移轉、設定負擔或租賃，妨害基本國策者，中央地政機關得報請行政院制止之"],"a":3},{"id":"113l13","year":113,"cat":"土地法與土地相關稅法概要","n":13,"q":"都市計畫地區範圍內，應視實際情況，分別設置公共設施用地，其設置標準之規定，下列何者正確？","o":["應就人口分布、所得及納稅能力、地價高低、產業進駐情形等現狀，決定其項目、位置與面積，以增進市民活動之便利，及確保良好之都市生活環境","中小學校、社教場所、社會福利設施、市場、郵政、電信、變電所、衛生、警所、消防、防空等公共設施，應按閭鄰單位或居民分布情形適當配置之","公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之二十","道路系統、停車場所及加油站，應按土地使用分區及交通情形與預期之發展配置之。鐵路、公路通過實施都市計畫之區域者，應以市區中心為規劃重點，以增進市民活動之便利"],"a":1},{"id":"113l14","year":113,"cat":"土地法與土地相關稅法概要","n":14,"q":"依都市計畫法規定，下列有關公共設施保留地之使用管制規定，何者錯誤？","o":["公共設施保留地在未取得前，得申請為臨時建築使用","不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用","私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府財產管理法令相關規定之限制","地上物除准修繕外，不得增建或改建。當地政府認有必要時，得令其清除地上物或遷移，且不得請求補償"],"a":3},{"id":"113l15","year":113,"cat":"土地法與土地相關稅法概要","n":15,"q":"依土地法規定，下列有關建築基地出賣時行使優先購買權之敘述，何者錯誤？","o":["地上權人、典權人或承租人有依同樣條件優先購買之權","優先購買權人，於接到出賣通知後十日內不表示者，其優先權視為放棄","出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人","基地承租人與基地共有人行使優先購買權發生競合時，其順序以登記之先後定之"],"a":3},{"id":"113l16","year":113,"cat":"土地法與土地相關稅法概要","n":16,"q":"依土地法規定，下列有關逾期未辦繼承登記案件應由地政機關書面通知繼承人之情形，何者正確？","o":["自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於六個月內聲請登記，並以書面通知繼承人","列冊管理期間為十五年，列冊管理期間該管直轄市或縣市地政機關應每年清查並書面通知繼承人辦理繼承登記","列冊管理期間屆滿，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售","標售土地或建築改良物前應公告三個月，並書面通知繼承人、共有人或合法使用人依序行使優先購買權"],"a":2},{"id":"113l17","year":113,"cat":"土地法與土地相關稅法概要","n":17,"q":"甲乙丙丁戊共有A地，持分各五分之一。甲乙丙三人擬依土地法第34條之1規定，將A地出售予戊，下列敘述何者正確？","o":["不適法，出售為有償讓與行為，應依民法規定，經共有人全體同意始得為之","不適法，共有人不得為受讓人","適法，甲乙丙三人已符合共有人過半數及其應有部分合計過半數之同意的行使要件","適法，買賣契約業經甲乙丙戊同意，縱使戊未經計算在同意人數及應有部分內，仍得依土地法第34條之1辦理"],"a":1},{"id":"113l18","year":113,"cat":"土地法與土地相關稅法概要","n":18,"q":"依土地徵收條例規定，有關區段徵收範圍內土地，經規劃整理後之處理方式，下列何者正確？","o":["抵費地發交被徵收土地所有權人領回","零售市場無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有","標租時，其期限不得逾九十九年","安置原住戶土地得以標售"],"a":2},{"id":"113l19","year":113,"cat":"土地法與土地相關稅法概要","n":19,"q":"依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何？","o":["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四","最低不得少於其房屋現值百分之二，最高不得超過百分之三點六","最低不得少於其房屋現值百分之二，最高不得超過百分之四點八","最低不得少於其房屋現值百分之三，最高不得超過百分之五"],"a":1},{"id":"113l20","year":113,"cat":"土地法與土地相關稅法概要","n":20,"q":"依契稅條例規定，有關申報契稅之起算日期，下列何者正確？","o":["向政府機關標購公產，以政府機關核准產權移轉之日為申報起算日","不動產移轉發生糾紛時，以法院判決確定之日為申報起算日","向法院標購拍賣之不動產，以承買人拍定之日為申報起算日","建築物於建造完成前，因交換以承受人為建造執照原始起造人者，以主管建築機關核發使用執照之日為申報起算日"],"a":1},{"id":"113l21","year":113,"cat":"土地法與土地相關稅法概要","n":21,"q":"依土地稅法規定，有關累進起點地價，下列何者正確？","o":["累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。只有工業用地、礦業用地及農業用地不包括在內","土地所有權人之地價總額未超過戶籍所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收","累進起點地價以百元為單位，以下四捨五入","累進起點地價，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，並報請財政部及內政部備查"],"a":3},{"id":"113l22","year":113,"cat":"土地法與土地相關稅法概要","n":22,"q":"依土地稅法規定，非都市土地供公共設施使用者，在滿足規定要件下，其尚未被徵收前之移轉，免徵土地增值稅。下列有關免稅要件之敘述，何者錯誤？","o":["經需用土地人開闢完成或依計畫核定供公共設施使用","依法完成使用地編定","依法完成徵收公告","經需用土地人證明"],"a":2},{"id":"113l23","year":113,"cat":"土地法與土地相關稅法概要","n":23,"q":"下列有關契稅納稅義務人之敘述，何者正確？","o":["受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時，由歸屬權利人申報納稅","買賣契稅，應由出賣人申報納稅","典權契稅，應由出典人申報納稅","交換有給付差額價款者，其差額價款，應由出賣人申報納稅"],"a":0},{"id":"113l24","year":113,"cat":"土地法與土地相關稅法概要","n":24,"q":"依房屋稅條例規定，下列有關自住使用之住家用房屋適用1.2%計徵房屋稅之要件，何者錯誤？","o":["無出租或供營業情形","房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記","房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下","房屋所有人本人、配偶或直系親屬實際居住使用"],"a":2},{"id":"113l25","year":113,"cat":"土地法與土地相關稅法概要","n":25,"q":"依所得稅法規定，個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，其所得稅稅率為何？","o":["百分之十","百分之十五","百分之二十","百分之二十五"],"a":2},{"id":"113r1","year":113,"cat":"不動產經紀相關法規概要","n":1,"q":"不動產說明書係不動產交易過程中極為重要之資訊揭露文件，下列關於不動產說明書之敘述，何者與不動產經紀業管理條例之規定不符？","o":["不動產之買賣如委由經紀業代銷者，不動產說明書應由經紀業指派經紀人簽章","經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說","經紀人員於提供解說後，應將不動產說明書交由委託人簽章","雙方當事人簽訂買賣契約書後，不動產說明書視為買賣契約書之一部分"],"a":2},{"id":"113r2","year":113,"cat":"不動產經紀相關法規概要","n":2,"q":"依不動產經紀業管理條例規定，中華民國國民經不動產經紀人考試及格並領有不動產經紀人證書者，得充不動產經紀人。下列有關不動產經紀人證書之敘述，何者正確？","o":["經不動產經紀人考試及格者，應具備一年以上經紀營業員經驗，始得向考試院考選部請領不動產經紀人證書","不動產經紀人證書有效期限為四年，期滿時，經紀人應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練二十個小時以上之證明文件，向中央主管機關指定之機構、團體辦理換證","不動產經紀人受申誡處分三次者，應廢止其經紀人證書","不動產經紀人受監護宣告成為無行為能力人，應廢止其經紀人證書"],"a":3},{"id":"113r3","year":113,"cat":"不動產經紀相關法規概要","n":3,"q":"經紀人員違反業務規範時，應負之法律責任，下列敘述何者錯誤？","o":["未經所屬經紀業同意為他經紀業執行業務，而為自己或他經紀業執行仲介或代銷業務者，應予以六個月以上三年以下之停止執行業務之懲戒處分","在執行業務過程中，未向與委託人交易之相對人解說不動產說明書之內容者，應予申誡","對於因業務知悉或持有之他人秘密，無故洩漏者，應予申誡","執行業務因故意或過失不法侵害交易當事人致其受有損害者，應與經紀業負連帶賠償責任"],"a":0},{"id":"113r4","year":113,"cat":"不動產經紀相關法規概要","n":4,"q":"有關公寓大廈專有部分、共用部分之修繕義務及費用負擔，下列敘述何者錯誤？","o":["專有部分之修繕，由各該區分所有權人為之，並負擔其費用","共用部分之修繕，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之","共用部分之修繕，係因可歸責於區分所有權人之事由所致者，由區分所有權人為之，並負擔其費用。但規約另有規定者，從其規定","共用部分之重大修繕，應依區分所有權人會議之決議為之。其費用，由公共基金支付或由區分所有權人按其共有之應有部分比例分擔"],"a":2},{"id":"113r5","year":113,"cat":"不動產經紀相關法規概要","n":5,"q":"按公寓大廈之共有部分為區分所有人所分別共有。下列關於共有部分之使用、收益及處分權能之說明，何者與公寓大廈管理條例之規定不符？","o":["各區分所有權人按其共有之應有部分比例，對建築物之共用部分有使用收益之權。但另有約定者從其約定","共用部分得約定供特定區分所有權人使用。但有違法令使用限制之規定者，不得約定專用","共用部分之應有部分應隨同專有部分一併移轉或設定負擔。但另有約定者從其約定","共用部分之拆除，應依區分所有權人會議之決議為之"],"a":2},{"id":"113r6","year":113,"cat":"不動產經紀相關法規概要","n":6,"q":"某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，在符合公寓大廈管理條例第30條及第31條規定下，決議同意重建。惟甲自始即反對重建，於臨時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？","o":["因未經全體區分所有權人之同意，該公寓社區不得進行重建","管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分","管理負責人或管理委員會得訴請法院將甲強制遷離","管理負責人或管理委員會得請求主管機關為必要之處置"],"a":1},{"id":"113r7","year":113,"cat":"不動產經紀相關法規概要","n":7,"q":"依公寓大廈管理條例規定，起造人於符合下列何種情形後三個月內，應召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？","o":["公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上","公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計三分之二以上","公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計半數以上","公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計三分之二以上"],"a":0},{"id":"113r9","year":113,"cat":"不動產經紀相關法規概要","n":9,"q":"甲建商於預售屋銷售廣告單中表示：「現場簽約，贈送德國進口高級廚衛設備」。首次購屋者乙於建商接待中心看完樣品屋後，隨即與銷售人員丙簽定預售屋買賣契約書。惟交屋時，始發現建商所贈送者，係國產中等品質設備，與廣告內容不符。就此案例，下列敘述，何者正確？","o":["廣告係要約引誘，對甲並不具拘束力","廣告內容若未經甲、乙合意成為個別磋商條款，並訂入預售屋買賣契約中，對甲不生效力","廣告內容即為契約內容，於契約成立後，甲應確實履行","甲得以廣告內容係媒體經營者所為，未註記其公司名稱，主張免除履約責任"],"a":2},{"id":"113r10","year":113,"cat":"不動產經紀相關法規概要","n":10,"q":"下列關於公平交易法之敘述，何者錯誤？","o":["維護消費者利益為本法立法目的之一","依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之行為，不適用本法之規定","事業關於競爭之行為，優先適用本法之規定。但其他法律另有規定且不牴觸本法立法意旨者，不在此限","本法規定事項，涉及其他部會之職掌者，由主管機關商同各該部會辦理之"],"a":1},{"id":"113r11","year":113,"cat":"不動產經紀相關法規概要","n":11,"q":"不動產開發業者或不動產經紀業者銷售預售屋時，其所為之下列何種行為，並不構成公平交易法第25條「其他足以影響交易秩序之欺罔或顯失公平之行為」？","o":["在向買方收取斡旋金前，未以書面告知買方得選擇支付斡旋金或採用內政部版「要約書」","向買方收取斡旋金後，因未能締結預售屋買賣契約，而拒絕返還","要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱","締結預售屋買賣契約後，要求繳回契約書"],"a":1},{"id":"113r12","year":113,"cat":"不動產經紀相關法規概要","n":12,"q":"不動產業者因炒作房地產所涉及之不實廣告、不當銷售行為，下列何者非屬內政部主管法規所及，應由公平交易委員會依公平交易法相關規定辦理？","o":["散布不實成交價格、市場成交行情、銷售量，影響不動產交易價格","違規潛銷預售屋（未領得建造執照即廣告銷售）","利用人頭排隊、假客戶付訂金、簽訂虛假購屋預約單或不動產買賣契約書等與他人通謀或為虛偽交易，營造不動產交易活絡之表象","對服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者"],"a":3},{"id":"113r13","year":113,"cat":"不動產經紀相關法規概要","n":13,"q":"事業申報結合，經公平交易委員會禁止其結合而仍為結合者，公平交易委員會除得處新臺幣二十萬元以上五千萬元以下罰鍰外，並得為一定之處分。下列何者不包括在內？","o":["停止營業","限期令分設事業","處分全部或部分股份","轉讓部分營業"],"a":0},{"id":"113r14","year":113,"cat":"不動產經紀相關法規概要","n":14,"q":"公平交易法原則禁止事業為聯合行為，但有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。不動產經紀業者相互間之何種聯合行為應予以禁止，不在得申請公平交易委員會許可之列？","o":["共同劃分經營區域、共同劃分交易對象","為降低成本、改良品質或增進效率，而統一服務之規格或型式","為促進事業合理經營，而分別作專業發展","為促進產業發展、技術創新或經營效率所必要之共同行為"],"a":0},{"id":"113r15","year":113,"cat":"不動產經紀相關法規概要","n":15,"q":"有關不動產經紀業廣告，下列敘述何者正確？","o":["經紀業於臉書社群網路平台刊登不動產銷售廣告，僅註明加盟於知名連鎖不動產經紀業「○○不動產」並使用其服務標章","主打買地送屋，實際卻沒有房屋處分權","廣告及相關銷售文宣註明不動產經紀業名稱","廣告使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞"],"a":2},{"id":"113r16","year":113,"cat":"不動產經紀相關法規概要","n":16,"q":"下列何者不違反公平交易法第21條廣告不實？","o":["不動產代銷業者於售屋網站公告35米泳池，而該泳池設置處於竣工圖為景觀水池","不動產代銷業者於售屋廣告，標示近捷運站","不動產代銷業者於售屋廣告，對於使用分區為乙種工業區之建案使用一般住宅之用語及圖示說明","不動產代銷業者於銷售屬科技工業區之建案時，使用可供住家使用之傢俱配置參考圖"],"a":1},{"id":"113r17","year":113,"cat":"不動產經紀相關法規概要","n":17,"q":"甲透過仲介公司看房，對某一間公寓頗為滿意，想請父母看房再決定，仲介公司業務員請他先付10萬元斡旋，可保留優先購買之權利，於是甲支付10萬元，並簽訂「不動產購買意願書」，下列何者錯誤？","o":["仲介業者如提出斡旋金要求，應主動告知消費者亦可選擇採用內政部所訂定之要約書，並需支付斡旋費用","斡旋金是當消費者中意某房屋，欲與屋主進行議價時，仲介業常要求消費者支付一定金額，作為斡旋差價之用","如消費者選擇交付斡旋金，則仲介業者應以書面明定交付斡旋金之目的，明確告知消費者之權利義務","仲介業者未遵行公平交易委員會對斡旋金規範而有欺罔或顯失公平情事，將違反公平交易法第25條之規定"],"a":0},{"id":"113r18","year":113,"cat":"不動產經紀相關法規概要","n":18,"q":"不動產經紀業違反不動產經紀業管理條例相關規定時，下列何種情形，直轄市、縣（市）主管機關應先令其限期改正，屆期未改正，始處一定金額之罰鍰？","o":["設立之營業處所未置經紀人","僱用未具備經紀人員資格者從事仲介或代銷業務","收取差價或其他報酬","未將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處"],"a":3},{"id":"113r19","year":113,"cat":"不動產經紀相關法規概要","n":19,"q":"不動產經紀業者告知消費者「今天不簽約就沒機會」、「不簽約就不能看契約」、並在契約中記載「已確實攜回本契約書審閱5日以上無誤或是已詳閱並充分瞭解本契約書及附件內容，無須5日以上審閱期，本約簽訂後，確認即生契約效力無誤」，請問此定型化契約條款效力為何？","o":["有效","無效","效力未定","部分有效，部分無效"],"a":1},{"id":"113r21","year":113,"cat":"不動產經紀相關法規概要","n":21,"q":"下列何者不是定型化契約條款推定顯失公平之情形？","o":["違反平等互惠原則者","條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者","契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者","定型化契約中之定型化契約條款牴觸個別磋商條款之約定者"],"a":3},{"id":"113r22","year":113,"cat":"不動產經紀相關法規概要","n":22,"q":"1樓露台屬於全體住戶共有，為了有效利用露台空間，住戶間常會將露台給該特定住戶使用，此露台稱為？","o":["專有部分","共用部分","約定專用部分","約定共用部分"],"a":2},{"id":"113r23","year":113,"cat":"不動產經紀相關法規概要","n":23,"q":"大樓規約約定1樓露台屬於1樓甲使用，嗣後3樓所有權人乙將其房地產權出售並過戶給丙，請問該規約對丙繼受人有無效力？","o":["依公寓大廈管理條例第24條規定，區分所有權之繼受人丙，應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項","丙未在規約簽章，對其不生效力","丙不知有該規約約定，對其不生效力","該規約僅能拘束原區分所有權人乙"],"a":0},{"id":"113r24","year":113,"cat":"不動產經紀相關法規概要","n":24,"q":"3樓住戶因浴室漏水，經抓漏後發現是3、4樓樓地板內之管線自然損壞導致漏水，請問修繕費用由誰負擔？","o":["3樓","4樓","3、4樓之住戶共同負擔","3、4樓之區分所有權人共同負擔"],"a":3},{"id":"113r25","year":113,"cat":"不動產經紀相關法規概要","n":25,"q":"依現行公寓大廈管理條例規定，公寓大廈住戶可以飼養動物？","o":["原則可以，但社區管委會有權禁止住戶飼養動物","原則可以，但規約另有禁止飼養之規定時，則依規約約定","原則禁止，但社區管委會有權開放住戶飼養動物","原則禁止，但規約有權開放住戶飼養動物"],"a":1},{"id":"112m1","year":112,"cat":"民法概要","n":1,"q":"有關權利能力之敘述，下列何者錯誤？","o":["人的權利能力始於出生終於死亡，因此胎兒尚未出生所以沒有權利能力","人的權利能力不得拋棄，更不得轉讓","法人除於法令或性質上之限制外，仍享有權利能力","植物人仍享有權利能力"],"a":0},{"id":"112m2","year":112,"cat":"民法概要","n":2,"q":"有關權利客體之敘述，下列何者錯誤？","o":["甲未經乙的同意在乙的土地上種植樹木，該樹木為乙土地上之部分","甲飼養一頭母牛，後來該母牛生下一頭小牛，小牛所有權仍屬於甲所有","為收容災民而臨時拼裝之貨櫃屋，仍為定著物，性質上為不動產","主物之處分效力及於從物，所以購買汽車之契約效力及於備胎"],"a":2},{"id":"112m3","year":112,"cat":"民法概要","n":3,"q":"有關限制行為能力之敘述，下列何者正確？","o":["滿16歲之未成年人寫遺囑時，仍須經法定代理人同意，否則效力未定","16歲之甲偽造身分證，使相對人乙誤信甲已滿18歲，而與甲簽訂買賣契約，該買賣契約有效","限制行為能力人為代理人時，代理人受領代理權仍須經法定代理人之同意","法定代理人可以概括允許限制行為能力人為法律行為"],"a":1},{"id":"112m4","year":112,"cat":"民法概要","n":4,"q":"下列情形，那一行為需向法院聲請撤銷，才會發生撤銷之效力？","o":["通謀虛偽意思表示所為之法律行為","因錯誤或誤傳之意思表示而為法律行為","被詐欺而為意思表示之法律行為","因暴利行為所為之法律行為"],"a":3},{"id":"112m5","year":112,"cat":"民法概要","n":5,"q":"甲向乙推銷一只古董錶，甲出價新臺幣（下同）10萬元問乙要不要買，乙答覆說：「如果8萬元我就買」，請問乙的答覆性質上為何？","o":["要約之引誘","承諾","要約","意思實現"],"a":2},{"id":"112m6","year":112,"cat":"民法概要","n":6,"q":"甲向乙購買乙對於丙的債權，但丙已於買賣前清償系爭債權而使該債權消滅，請問該買賣契約之效力如何？","o":["債權不得作為買賣之標的所以無效","該買賣標的權利自始不存在，屬於標的不能而無效","該買賣標的權利雖然不存在，但契約仍有效，甲可對乙主張權利瑕疵擔保","甲可依締約上過失向乙請求損害賠償"],"a":2},{"id":"112m7","year":112,"cat":"民法概要","n":7,"q":"依民法之規定，約定利率超過週年百分之多少，則超過之部分會無效？","o":["12","16","20","25"],"a":1},{"id":"112m8","year":112,"cat":"民法概要","n":8,"q":"下列何種契約性質上屬於要物契約？","o":["消費借貸契約","房屋租賃契約","贈與契約","合會契約"],"a":0},{"id":"112m9","year":112,"cat":"民法概要","n":9,"q":"依民法之規定，有關租賃契約之效力，下列何者錯誤？","o":["租賃物有修繕之必要時，原則上承租人可直接自行修繕後再請求出租人給付修繕費用","如租賃物是房屋時，倘出租人無反對之約定，承租人可以將房屋一部轉租","租賃物因承租人失火而造成損害，承租人僅就重大過失負賠償責任","租賃物應納之一切稅捐，由出租人負擔"],"a":0},{"id":"112m10","year":112,"cat":"民法概要","n":10,"q":"為動產物權讓與之交付，倘受讓人已先占有動產，於讓與合意時即生動產所有權取得之效力，學理上稱之為何？","o":["現實交付","占有改定","簡易交付","指示交付"],"a":2},{"id":"112m11","year":112,"cat":"民法概要","n":11,"q":"果實自落於鄰地者，果實之所有權為鄰地所有權人所有，倘鄰地係公有用地時，該自落之果實為何人所有？","o":["國家所有","該果實為無主物，誰先占即取得所有","為該果實之果樹所有權人所有","由國家及果樹所有權人所共有"],"a":2},{"id":"112m12","year":112,"cat":"民法概要","n":12,"q":"有關遺失物拾得之敘述，下列何者錯誤？","o":["遺失物自通知或最後招領日起逾6個月，未有受領人認領者，由拾得人取得遺失物之所有權","受領權人認領遺失物時，拾得人原則上可以請求報酬，但不得超過遺失物價值之十分之三","拾得人之報酬請求權因6個月不行使而消滅","倘受領權人為低收入戶時，依法可以拒絕拾得人之報酬請求"],"a":1},{"id":"112m13","year":112,"cat":"民法概要","n":13,"q":"抵押權人僅就土地設定抵押權，因債權已屆清償期而未清償而實行抵押權，下列何者錯誤？","o":["於設定抵押權時，該土地上已存在房屋，實行抵押權之範圍僅限於土地本身，不得就房屋併付拍賣","於設定抵押權時，土地上並無房屋，於實行抵押權時土地所有人已營造房屋，抵押權人必要時得聲請併付拍賣","抵押權人聲請併付拍賣時，如房屋有存在他人之租賃權，抵押權人得聲請法院除去房屋之租賃權後再執行拍賣","抵押權人將土地與房屋併付拍賣後，對於土地及房屋賣得之價金，抵押權人均有優先受償之權利"],"a":3},{"id":"112m14","year":112,"cat":"民法概要","n":14,"q":"民法關於死亡宣告的規定，下列何者正確？","o":["失蹤人失蹤滿三年後，法院得因利害關係人之聲請，為死亡之宣告","受死亡宣告者，以判決內所確定死亡之時，推定其為死亡","遺產稅捐徵收機關得為失蹤人向法院聲請死亡宣告","死亡宣告會剝奪失蹤人之權利能力"],"a":1},{"id":"112m15","year":112,"cat":"民法概要","n":15,"q":"甲於民國（下同）107年9月間向乙租車公司租用自小客車環島，然卻積欠乙租金新臺幣3萬元，乙於108年9月催告後甲仍不為給付，乙便於109年8月訴請甲給付租金，於110年9月獲勝訴判決確定。下列何者正確？","o":["乙租車公司的租金請求權時效本為5年","乙於108年9月催告後6個月內未起訴，仍生中斷時效之效力","乙於109年8月訴請甲給付租金時，時效不完成","判決確定後，時效重新起算5年"],"a":3},{"id":"112m16","year":112,"cat":"民法概要","n":16,"q":"甲委託乙代為尋覓對象結婚，並承諾事成後給予乙報酬新臺幣10萬元。關於婚姻居間契約，下列何者正確？","o":["甲乙間的契約，無效","乙得對甲請求給付報酬","乙對甲無報酬請求權","婚姻居間契約不得約定報酬"],"a":2},{"id":"112m17","year":112,"cat":"民法概要","n":17,"q":"土地所有人非因故意或重大過失逾越地界建築房屋，而鄰地所有人知其越界，卻不即時提出異議者，下列何者正確？","o":["鄰地所有人不為異議，即表示拋棄所有權利，不得再為主張","土地所有人有權得請求購買越界之土地","鄰地所有人得請求移去或變更越界建築之房屋，並請求支付償金","鄰地所有人不得請求移去或變更越界建築之房屋，但得請求所受損害之償金"],"a":3},{"id":"112m18","year":112,"cat":"民法概要","n":18,"q":"關於民法區分所有建築物規定之敘述，下列何者錯誤？","o":["專有部分與其所屬之共有部分及其基地之權利，得分離而為移轉或設定負擔","就區分所有建築物共有部分及基地之應有部分，區分所有人得約定其比例","專有部分得經其所有人之同意，依規約之約定供區分所有建築物之所有人共同使用","共有部分除法律另有規定外，得經規約之約定供區分所有建築物之特定所有人使用"],"a":0},{"id":"112m19","year":112,"cat":"民法概要","n":19,"q":"甲在其所有A地上興建B屋，但B屋為未辦理建物所有權第一次登記的違章建物，嗣後甲與乙訂立A地與B屋的買賣契約，下列何者錯誤？","o":["B屋雖為違章建築亦為融通物，得為交易之客體","甲應將A地所有權辦妥移轉登記給乙，乙始取得A地所有權","興建B屋時因未為建物所有權保存登記，故甲未取得B屋所有權","甲將Ｂ屋讓與乙，乙僅取得對Ｂ屋之事實上處分權"],"a":2},{"id":"112m20","year":112,"cat":"民法概要","n":20,"q":"關於善意占有人之敘述，下列何者錯誤？","o":["善意占有人於本權訴訟敗訴時，自判決確定之日起，視為惡意占有人","善意占有人自確知其無占有本權時起，為惡意占有人","善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還","善意占有人，因改良占有物所支出之有益費用，於其占有物現存之增加價值限度內，得向回復請求人，請求償還"],"a":0},{"id":"112m21","year":112,"cat":"民法概要","n":21,"q":"就法定夫妻財產制之敘述，下列何者錯誤？","o":["夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產","不能證明為夫或妻所有之財產，視為夫妻共有","夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有","夫妻各自對其債務負清償之責"],"a":1},{"id":"112m22","year":112,"cat":"民法概要","n":22,"q":"關於民法第1031條之1夫妻財產制中之特有財產之敘述，下列何者錯誤？","o":["甲在婚前取得之受贈物A屋，若贈與人甲父以書面聲明甲日後結婚時，該A屋為特有財產，則該A屋亦屬特有財產","夫或妻在家中共同使用的茶杯、桌椅等動產，非特有財產","夫是音樂家，則其演奏時所需之樂器為特有財產","夫或妻雖以受贈之特有財產之金錢購買不動產一筆，惟該受贈物狀態已變更，則該不動產非特有財產"],"a":3},{"id":"112m23","year":112,"cat":"民法概要","n":23,"q":"關於遺產繼承之敘述，下列何者錯誤？","o":["非婚生子女非經生父認領或準正，不得繼承其生父之遺產","遺產繼承人，除配偶外，其繼承順序為直系血親卑親屬、父母、兄弟姊妹、祖父母","配偶與被繼承人直系血親尊親屬同為繼承時，其應繼分為遺產之三分之一","特留分之規定，係為保障法定繼承人之權利免受侵害"],"a":2},{"id":"112m24","year":112,"cat":"民法概要","n":24,"q":"關於回復喪失繼承權之敘述，下列何者錯誤？","o":["子女為了遺產而謀殺父親，即喪失對父親之繼承權，因被繼承人原諒繼承人之行為而回復繼承權","偽造、變造、隱匿、湮滅被繼承人關於繼承之遺囑者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權","對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承時，喪失繼承權，但之後仍可因獲得被繼承人之原諒而回復繼承權","以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權"],"a":0},{"id":"112m25","year":112,"cat":"民法概要","n":25,"q":"關於拋棄繼承之敘述，下列何者錯誤？","o":["應於知悉其得繼承之時起三個月內，以書面向法院為之","拋棄繼承後，應通知因其拋棄而應為繼承之人。未為通知者，不生拋棄繼承之效力","配偶拋棄繼承權者，其應繼分歸屬於與其同為繼承之人","繼承之拋棄，溯及於繼承開始時發生效力"],"a":1},{"id":"112v1","year":112,"cat":"不動產估價概要","n":1,"q":"不動產售屋廣告中「面對公園第一排」，對不動產之影響，是屬於不動產估價影響因素中之何種因素？","o":["一般因素","市場因素","區域因素","個別因素"],"a":3},{"id":"112v2","year":112,"cat":"不動產估價概要","n":2,"q":"不動產估價師受託評估總統府價值，此屬於何種價格種類？","o":["申報價格","特殊價格","特定價格","限定價格"],"a":1},{"id":"112v3","year":112,"cat":"不動產估價概要","n":3,"q":"各直轄市、縣（市）國土計畫於110年4月30日公告實施，此為影響不動產價格之何種因素？","o":["一般因素","市場因素","區域因素","個別因素"],"a":0},{"id":"112v4","year":112,"cat":"不動產估價概要","n":4,"q":"收益性不動產價值是由現在至將來所能帶給權利人之利潤總計，估價師求取將來的收益據以評估不動產價值，應重視何種不動產估價原則？","o":["期日原則","外部性原則","預測原則","內部性原則"],"a":2},{"id":"112v5","year":112,"cat":"不動產估價概要","n":5,"q":"老舊公寓因加裝電梯設備，價格也因此提升，此為何種不動產原則？","o":["收益分配原則","貢獻原則","均衡原則","供需原則"],"a":1},{"id":"112v6","year":112,"cat":"不動產估價概要","n":6,"q":"依不動產估價技術規則規定，比較標的為父親賣給兒子之交易，應進行何種調整？","o":["情況調整","價格日期調整","區域因素調整","個人因素調整"],"a":0},{"id":"112v7","year":112,"cat":"不動產估價概要","n":7,"q":"下列之建物殘餘價格率，何者符合不動產估價技術規則之規定？","o":["20%","18%","12%","8%"],"a":3},{"id":"112v8","year":112,"cat":"不動產估價概要","n":8,"q":"有一不動產平均每年每坪之淨收益為3,000元，若收益資本化率為5%，該不動產每坪之收益價格為：","o":["8萬元","7萬元","6萬元","5萬元"],"a":2},{"id":"112v9","year":112,"cat":"不動產估價概要","n":9,"q":"下列何者不是收益法推算勘估標的總費用之項目？","o":["地價稅","房屋稅","土地增值稅","維修費"],"a":2},{"id":"112v10","year":112,"cat":"不動產估價概要","n":10,"q":"有一幢公寓每坪平均售價為60萬元，1樓每坪售價為75萬元，4樓每坪售價為50萬元，建物價格占不動產價格之40%，若4樓之樓層別效用比為100%，則1樓之樓層別效用比為何？","o":["175%","150%","120%","102%"],"a":1},{"id":"112v11","year":112,"cat":"不動產估價概要","n":11,"q":"目前銀行之一年期定存利率為1.57%，活存利率為0.58%，短期放款利率為7.11%，下列之敘述何者正確？","o":["資金中自有資金之計息利率為7.11%","資金中預售收入之計息利率為0.58%","資金中自有資金之計息利率為1.52%","資金中借款之計息利率為1.57%"],"a":2},{"id":"112v12","year":112,"cat":"不動產估價概要","n":12,"q":"就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤，以求取勘估標的營造施工費之方法為何？","o":["間接法","淨計法","工程造價比較法","單位面積比較法"],"a":1},{"id":"112v13","year":112,"cat":"不動產估價概要","n":13,"q":"不動產租金估計，以估計勘估標的之何種租金為原則？","o":["市場租金","差額租金","實質租金","經濟租金"],"a":2},{"id":"112v14","year":112,"cat":"不動產估價概要","n":14,"q":"決定收益資本化率之方法中，選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法為何？","o":["風險溢酬法","市場萃取法","債務保障比率法","折現現金流量分析法"],"a":1},{"id":"112v15","year":112,"cat":"不動產估價概要","n":15,"q":"依不動產估價技術規則之規定，有關特殊宗地估價之敘述，下列何者正確？","o":["高爾夫球場之估價，以比較法估價為原則","溫泉地之估價，以比較法估價為原則","鹽田之估價，以比較法估價為原則","林地之估價，以比較法估價為原則"],"a":2},{"id":"112v16","year":112,"cat":"不動產估價概要","n":16,"q":"有關計量模型分析法之敘述，下列何者錯誤？","o":["計量模型分析法截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於百分之五","計量模型分析法只能用以推算各主要影響價格因素之調整率","計量模型分析法可求出各主要影響價格因素與比較標的價格二者之關係式","計量模型分析採迴歸分析者，其調整後判定係數不得低於零點七"],"a":1},{"id":"112v17","year":112,"cat":"不動產估價概要","n":17,"q":"有關不動產租金估計之敘述，下列何者正確？","o":["不動產租金估計，以估計勘估標的之承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數為原則","新訂租約之租金估計得以勘估標的預估契約租金之淨收益，估計租金未來變動趨勢調整後，再加計必要費用","續訂租約之租金估計得以勘估標的價格乘以租金收益率，以估計淨收益，再加計必要費用","不動產之租金估計不應考慮使用目的"],"a":0},{"id":"112v18","year":112,"cat":"不動產估價概要","n":18,"q":"當債務保障比率要求為1.5倍，貸款常數為0.1，不動產價格為新臺幣60億元，自有資金為新臺幣15億元，不足資金則跟銀行貸款。請問在前述情況下收益資本化率（折現率）為何？","o":["15%","11.25%","5%","3.75%"],"a":1},{"id":"112v19","year":112,"cat":"不動產估價概要","n":19,"q":"在宗地估價中，公共設施用地及公共設施保留地之估價，以下列那一種方法估價為原則？","o":["比較法","收益法","成本法","土地開發分析法"],"a":0},{"id":"112v20","year":112,"cat":"不動產估價概要","n":20,"q":"下列何者不屬於土地建築開發之間接成本項目？","o":["建築開發之施工人員施工費用","建築開發之規劃設計費","建築開發之管理費","建築開發之銷售費"],"a":0},{"id":"112v21","year":112,"cat":"不動產估價概要","n":21,"q":"有關房地成本價格之計算公式，下列何者正確？","o":["房地成本價格＝土地總成本＋建物成本價格","房地成本價格＝土地總成本＋建物總成本","房地成本價格＝土地價格＋建物成本價格－建物累積折舊額","房地成本價格＝土地價格＋建物成本價格＋建物累積折舊額"],"a":0},{"id":"112v22","year":112,"cat":"不動產估價概要","n":22,"q":"下列那一種方法不屬於計算收益資本化率或折現率之方法？","o":["加權平均資金成本法","有效總收入乘數法","折現現金流量分析法","風險溢酬法"],"a":2},{"id":"112v23","year":112,"cat":"不動產估價概要","n":23,"q":"比較法估價試算價格之調整運算過程中，區域因素調整、個別因素調整或區域因素及個別因素內之任一單獨項目之價格調整率大於（甲），或情況、價格日期、區域因素及個別因素調整總調整率大於（乙）時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。請問（甲）與（乙）各為多少？","o":["（甲）為百分之十五，（乙）為百分之十五","（甲）為百分之十五，（乙）為百分之三十","（甲）為百分之三十，（乙）為百分之十五","（甲）為百分之三十，（乙）為百分之三十"],"a":1},{"id":"112v25","year":112,"cat":"不動產估價概要","n":25,"q":"有關一宗土地內有數種不同法定用途時之估價敘述，下列何者錯誤？","o":["估價前應先考量其最有效使用再決定估價方式","在考量宗地狀況後可以視不同法定用途採分別估價","估價前應先考量各種用途之相關性及分割之難易度再決定估價方式","估價時無須考量是否有數種不同法定用途，只需依其主要用途估價"],"a":3},{"id":"112l1","year":112,"cat":"土地法與土地相關稅法概要","n":1,"q":"都市計畫公共設施保留地，未作任何使用並與使用中之土地隔離者，其地價稅之計徵，下列何者正確？","o":["免徵","按千分之六稅率計徵","按千分之十稅率計徵","按千分之二稅率計徵"],"a":0},{"id":"112l2","year":112,"cat":"土地法與土地相關稅法概要","n":2,"q":"關於土地所有權人出售自用住宅用地時，土地增值稅適用「一生一次」之優惠稅率，下列何者正確？","o":["土地增值稅之優惠稅率為千分之二","僅限於都市土地面積未超過三公畝部分或非都市土地面積未超過七公畝部分","土地於出售前一年內，曾供營業使用或出租","出售前應持有該土地三年以上"],"a":1},{"id":"112l3","year":112,"cat":"土地法與土地相關稅法概要","n":3,"q":"依土地稅法規定，已規定地價之土地設定典權時之預繳土地增值稅，下列何者正確？","o":["典權人回贖時，原繳之土地增值稅，應加計利息退還","典權人回贖時，原繳之土地增值稅，應無息退還","出典人回贖時，原繳之土地增值稅，應加計利息退還","出典人回贖時，原繳之土地增值稅，應無息退還"],"a":3},{"id":"112l4","year":112,"cat":"土地法與土地相關稅法概要","n":4,"q":"土地所有權經法院判決移轉登記者，土地增值稅申報移轉現值之審核標準，下列何者正確？","o":["以法院判決日當期之公告土地現值為準","以申報人向法院起訴日當期之公告土地現值為準","以法院判決送達日當期之公告土地現值為準","以申報人向主管稽徵機關申報日當期之公告土地現值為準"],"a":1},{"id":"112l5","year":112,"cat":"土地法與土地相關稅法概要","n":5,"q":"依土地稅法規定，地價稅之稅率，下列何者錯誤？","o":["地價稅之基本稅率為千分之十","土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按千分之十稅率徵收","土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價五倍者，就其超過部分課徵千分之十五","土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"],"a":2},{"id":"112l6","year":112,"cat":"土地法與土地相關稅法概要","n":6,"q":"依土地法規定，關於共有土地之處分，下列何者正確？","o":["應以共有人半數及其應有部分半數之同意行之","應有部分合計三分之二者，其人數不予計算","共有人不能以書面通知他共有人者，應公告之","共有人不得單獨處分其應有部分"],"a":2},{"id":"112l7","year":112,"cat":"土地法與土地相關稅法概要","n":7,"q":"有關土地總登記，經聲請而逾限未補繳證明文件者之情形，下列何者錯誤？","o":["其土地視為無主土地","由該管直轄市或縣（市）地政機關公告之","公告期間不得少於十五日","公告期滿，無人提出異議，即為國有土地之登記"],"a":2},{"id":"112l8","year":112,"cat":"土地法與土地相關稅法概要","n":8,"q":"依土地法規定，有關繼承登記，下列何者正確？","o":["繼承登記應於繼承開始之日起一個月內為之，否則視為逾期登記","繼承開始之日起逾三個月未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於一年內聲請登記","逾期未聲請繼承登記之土地，經地政機關列冊管理十五年，逾期仍未聲請繼承登記者，由地政機關將該土地清冊移請財政部國有財產署公開標售","標售逾期未辦繼承登記土地所得之價款，逾十五年無繼承人申請提領該價款者始得歸屬國庫"],"a":2},{"id":"112l9","year":112,"cat":"土地法與土地相關稅法概要","n":9,"q":"依平均地權條例之規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，並不得自行或委託刊登讓與或轉售廣告，但於下列何種情形不在此限？","o":["配偶、直系血親或二親等內旁系血親間之讓與或轉售","配偶、直系姻親或二親等內旁系姻親間之讓與或轉售","配偶、直系姻親或二親等內旁系血親間之讓與或轉售","配偶、直系血親或二親等內旁系姻親間之讓與或轉售"],"a":0},{"id":"112l10","year":112,"cat":"土地法與土地相關稅法概要","n":10,"q":"依平均地權條例之規定，委託不動產經紀業代銷預售屋者，應於何時向直轄市、縣（市）主管機關申報登錄資訊？","o":["應於簽訂買賣契約之日起至少十日內申報","應於簽訂買賣契約之日起至少十五日內申報","應於簽訂買賣契約之日起三十日內申報","應於簽訂買賣契約之日起四十五日內申報"],"a":2},{"id":"112l11","year":112,"cat":"土地法與土地相關稅法概要","n":11,"q":"依市地重劃實施辦法之規定，土地所有權人重劃後應分配土地面積已達重劃區最小分配面積標準二分之一，經主管機關按最小分配面積標準分配後，如申請放棄分配土地而改領現金補償，下列何者正確？","o":["以其重劃前原有面積按原位置評定重劃後地價發給現金補償","以其重劃前原有面積按原位置評定重劃前地價發給現金補償","以其應分配權利面積，按重劃後分配位置之評定重劃後地價予以計算補償","以其應分配權利面積，按重劃後分配位置之評定重劃前地價予以計算補償"],"a":2},{"id":"112l12","year":112,"cat":"土地法與土地相關稅法概要","n":12,"q":"以下關於契稅之敘述，何者正確？","o":["買賣契稅應由出賣人申報納稅","贈與契稅應由贈與人估價立契，申報納稅","典權契稅，應由典權人申報納稅","占有契稅稅率為其契價百分之二"],"a":2},{"id":"112l13","year":112,"cat":"土地法與土地相關稅法概要","n":13,"q":"依土地徵收條例規定，因受領遲延、拒絕受領或不能受領之補償費，下列何者正確？","o":["依提存法提存於直轄市或縣（市）主管機關於國庫設立之土地徵收補償費保管專戶","直轄市或縣（市）主管機關應於補償費發給期限屆滿之日起三個月內存入專戶保管","保管專戶儲存之補償費應給付利息","已依規定繳存專戶保管之徵收補償費，自徵收公告期滿之日起，逾十五年未領取者，歸屬國庫"],"a":2},{"id":"112l14","year":112,"cat":"土地法與土地相關稅法概要","n":14,"q":"已公告徵收之土地，依徵收計畫開始使用前，興辦之事業改變時，依土地徵收條例之規定，下列何者正確？","o":["應撤銷徵收","應廢止徵收","土地所有權人得行使收回權","應舉行聽證"],"a":1},{"id":"112l15","year":112,"cat":"土地法與土地相關稅法概要","n":15,"q":"依土地登記規則之規定，於何種情形下登記機關應以書面敘明理由或法令依據，通知申請人於接到通知書之日起十五日內補正，下列何者錯誤？","o":["申請人之資格不符或其代理人之代理權有欠缺","登記申請書不合程式，或應提出之文件不符或欠缺","未依規定繳納登記規費","登記之權利人、義務人或其與申請登記之法律關係有關之權利關係人間有爭執"],"a":3},{"id":"112l16","year":112,"cat":"土地法與土地相關稅法概要","n":16,"q":"我國物權係採法定主義，於土地所有權以外之其他不動產物權，謂之他項權利，依民法及土地法之規定，下列何者非屬物權？","o":["抵押權","農育權","耕作權","租賃權"],"a":3},{"id":"112l17","year":112,"cat":"土地法與土地相關稅法概要","n":17,"q":"依土地法之規定，外國人為供自用、投資或公益之目的使用，得取得所需之土地，其面積及所在地點，應受該管直轄市或縣（市）政府依法所定之限制，下列何種用途不屬之？","o":["長照機構","住宅","醫院","營業處所、辦公場所、商店及工廠"],"a":0},{"id":"112l18","year":112,"cat":"土地法與土地相關稅法概要","n":18,"q":"依土地法第三十四條之一執行要點規定，有關共有人權利之行使，下列何者錯誤？","o":["部分共有人就共有土地或建築改良物為處分、變更及設定地上權、農育權、不動產役權或典權，應就共有物之全部為之","部分共有人依本法條規定為處分、變更或設定負擔前，應先行通知他共有人","出賣共有土地或建築改良物時，他共有人得以出賣之同一條件共同或單獨優先購買","他共有人於接到出賣通知後二十日內不表示者，其優先購買權視為放棄"],"a":3},{"id":"112l19","year":112,"cat":"土地法與土地相關稅法概要","n":19,"q":"依土地法規定，有關地籍測量之相關規定，下列何者錯誤？","o":["地籍測量時，土地所有權人應設立界標，並永久保存之","地籍測量，如由該管直轄市或縣（市）政府辦理，其實施計畫應經該地方之地政機關核定","重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界","重新實施地籍測量之結果，應予公告，其期間為三十日"],"a":1},{"id":"112l20","year":112,"cat":"土地法與土地相關稅法概要","n":20,"q":"依土地法之規定，有關土地登記之損害賠償，下列何者錯誤？","o":["因登記錯誤遺漏或虛偽致受損害者，由該地政機關負損害賠償責任","登記人員或利害關係人，於登記完畢後，發見登記錯誤或遺漏時，非以書面聲請該管上級機關查明核准後，不得更正","地政機關所負之損害賠償，如因登記人員之重大過失所致者，由該人員及地政機關負連帶損害賠償責任，撥歸登記儲金","損害賠償之請求，如經該地政機關拒絕，受損害人得向司法機關起訴"],"a":2},{"id":"112l21","year":112,"cat":"土地法與土地相關稅法概要","n":21,"q":"依平均地權條例規定，對私有空地之處置，下列何者錯誤？","o":["規定照價收買者，以收買當期之平均市價為準","逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅或照價收買","依規定限期建築、增建、改建或重建之土地，其新建之改良物價值不及所占基地申報地價百分之五十者，直轄市或縣（市）政府不予核發建築執照","直轄市或縣（市）政府對於私有空地，得視建設發展情形，分別劃定區域，限期建築、增建、改建或重建"],"a":0},{"id":"112l22","year":112,"cat":"土地法與土地相關稅法概要","n":22,"q":"依都市計畫法之規定，市鎮計畫之主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於多少？","o":["五百分之一","一千分之一","一萬分之一","一萬五千分之一"],"a":2},{"id":"112l23","year":112,"cat":"土地法與土地相關稅法概要","n":23,"q":"依所得稅法之規定，個人依第14條之4前2項規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30條第1項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，按相關規定稅率計算應納稅額，其在中華民國境內居住之個人應納稅額，下列何者正確？","o":["持有房屋、土地之期間在二年以內者，稅率為百分之三十五","持有房屋、土地之期間超過二年，未逾五年者，稅率為百分之二十五","因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土地者，稅率為百分之二十","個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，稅率為百分之二十五"],"a":2},{"id":"112l24","year":112,"cat":"土地法與土地相關稅法概要","n":24,"q":"依土地稅法之規定，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦，下列何項非屬所規範者？","o":["土地進行訴訟者","權屬不明者","納稅義務人行蹤不明者","土地所有權人申請由占有人代繳者"],"a":0},{"id":"112l25","year":112,"cat":"土地法與土地相關稅法概要","n":25,"q":"有關土地利用計畫之通盤檢討相關規定，下列何者正確？","o":["全國國土計畫每五年通盤檢討一次","直轄市、縣（市）國土計畫每十年通盤檢討一次","都市計畫每三年內或五年內至少應通盤檢討一次","區域計畫每十年通盤檢討一次"],"a":2},{"id":"112r1","year":112,"cat":"不動產經紀相關法規概要","n":1,"q":"有關不動產經紀業營業保證金之敘述，下列何者錯誤？","o":["營業保證金由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會統一於指定之金融機構設置營業保證基金專戶儲存","經紀業未依規定繳存營業保證金者，應予停止營業處分，其停止營業期間達一年者，應撤銷其許可","營業保證金獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押、抵銷或設定負擔","經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"],"a":1},{"id":"112r2","year":112,"cat":"不動產經紀相關法規概要","n":2,"q":"有關外國人任職不動產經紀業之規定，下列何者正確？","o":["外國人得依中華民國法律參加營業員訓練，經內政部許可後得應不動產經紀人考試","經內政部許可後，始得受僱於經紀業為經紀人員；如為大陸地區人民，尚須經大陸委員會許可","經內政部或其認可之機構、團體舉辦不動產經紀營業員訓練合格或不動產經紀人考試及格，並向內政部指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員","外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，可不限以中華民國文字為之"],"a":2},{"id":"112r3","year":112,"cat":"不動產經紀相關法規概要","n":3,"q":"經營代銷業務者，下列何種文件不適用經紀業指派經紀人簽章規定？","o":["不動產說明書","不動產廣告稿","不動產租賃、買賣契約書","不動產出租、出售委託契約書"],"a":3},{"id":"112r4","year":112,"cat":"不動產經紀相關法規概要","n":4,"q":"有關不動產說明書之敘述，下列何者正確？","o":["不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，不動產說明書應由經紀業指派經紀營業員簽章","經紀人員應以不動產說明書向與委託人交易之相對人解說。提供解說前，應經委託人交易之相對人簽章","雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人","不動產說明書應記載及不得記載事項，由所在地主管機關定之"],"a":2},{"id":"112r5","year":112,"cat":"不動產經紀相關法規概要","n":5,"q":"根據不動產經紀業管理條例第24條之1之現行規定，下列何者正確？","o":["中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，維持以區段化、去識別化方式，提供查詢","中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，應依同條第三項規定，除涉及個人資料外，重新提供查詢","經營代銷業務，受起造人或建築業委託代銷預售屋者，應於簽訂買賣契約之日起三十日內，將委託代銷契約及買賣契約相關書件報請所在地直轄市、縣（市）主管機關備查","經營仲介業務者，對於居間或代理成交之租賃案件，應於租賃物交付後，承租人占有中之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊"],"a":1},{"id":"112r6","year":112,"cat":"不動產經紀相關法規概要","n":6,"q":"不動產經紀業管理條例之「用辭定義」，下列何者正確？","o":["不動產︰指土地、土地定著物或房屋及其可移轉之權利","成屋︰指領有建造執照之建築物","經紀人員︰經紀營業員之職務為執行仲介或代銷業務","營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或常態之非固定場所"],"a":0},{"id":"112r7","year":112,"cat":"不動產經紀相關法規概要","n":7,"q":"依據不動產經紀業管理條例之規定，直轄市、縣（市）同業公會關於會員入會、停權、退會情形應如何處理？","o":["報請所在地主管機關核定","報請所在地主管機關備查","報請所在地主管機關層轉中央主管機關核定","報請所在地主管機關層轉中央主管機關備查"],"a":3},{"id":"112r8","year":112,"cat":"不動產經紀相關法規概要","n":8,"q":"有關公寓大廈周圍上下、外牆面設置防墜設施之規定，下列何者錯誤？","o":["須公寓大廈有十二歲以下兒童或六十歲以上老人之住戶","須於外牆開口部或陽臺設置","防墜設施須不妨礙逃生且不突出外牆面","防墜設施設置後，設置理由消失且不符公寓大廈管理條例之限制者，區分所有權人應予改善或回復原狀"],"a":0},{"id":"112r9","year":112,"cat":"不動產經紀相關法規概要","n":9,"q":"依公寓大廈管理條例之規定，有關公寓大廈管理委員會職務之敘述，下列何者正確？","o":["住戶大會決議事項之執行","住戶違規情事之制止及相關資料之提供","共有及共用部分之清潔、維護、重大修繕及改良","住戶共同事務應興革事項之決定與管理"],"a":1},{"id":"112r10","year":112,"cat":"不動產經紀相關法規概要","n":10,"q":"有關公寓大廈公共基金之設置，下列何者錯誤？","o":["起造人就公寓大廈領得使用執照一年內之管理維護事項，應按工程造價一定比例或金額提列","起造人於該公寓大廈使用執照申請時，應提出繳交公庫代收之證明；於公寓大廈召開區分所有權人會議時，由公庫代為撥付","公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理","公共基金經區分所有權人會議決議交付信託者，其運用應依區分所有權人會議之決議為之"],"a":1},{"id":"112r11","year":112,"cat":"不動產經紀相關法規概要","n":11,"q":"依公寓大廈管理條例規定，有關起造人責任之敘述，下列何者錯誤？","o":["就公寓大廈領得使用執照一年內之管理維護事項，起造人應按工程造價一定比例或金額提列公共基金","公寓大廈之起造人，非經領得建造執照，不得辦理銷售","公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約","起造人應將公寓大廈共用部分、約定共用部分與其附屬設施設備等，確認其功能正常無誤後，移交管理委員會或管理負責人"],"a":2},{"id":"112r12","year":112,"cat":"不動產經紀相關法規概要","n":12,"q":"關於公寓大廈住戶之權利義務，下列何者正確？","o":["區分所有權人除法律另有限制外，對其共有部分，得自由使用、收益、處分，並排除他人干涉","區分所有權人對專有部分之利用，不得有妨害建築物之正常使用及違反區分所有權人共同利益之行為","專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉，但設定負擔則可分別為之","於住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用他住戶專有部分或約定專用部分時，應經管理負責人或管理委員會之同意後方得為之"],"a":1},{"id":"112r13","year":112,"cat":"不動產經紀相關法規概要","n":13,"q":"關於公寓大廈管理維護公司之執業，下列何者正確？","o":["應經直轄市、縣（市）政府許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業","應經直轄市、縣（市）政府許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業","應經中央主管機關許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業","應經中央主管機關許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業"],"a":3},{"id":"112r14","year":112,"cat":"不動產經紀相關法規概要","n":14,"q":"採加盟經營方式之不動產經紀業者如以不正當限制加盟店服務報酬標準，作為成立或持續加盟經營關係之條件，而有限制競爭之虞者，屬於下列何種違反公平交易法之情事？","o":["以不正當限制交易相對人之事業活動為條件，而與其交易之行為","相互約束事業活動之行為，而足以影響生產、商品交易或服務供需之市場功能，構成公平交易法之聯合行為","以脅迫、利誘或其他不正當方法，使他事業不為價格之競爭、參與結合、聯合或為垂直限制競爭之行為","以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"],"a":0},{"id":"112r15","year":112,"cat":"不動產經紀相關法規概要","n":15,"q":"下列何者應以公平交易法之規定處理？","o":["不動產經紀業加盟店，未於廣告、市招及名片等明顯處，標明加盟店或加盟經營字樣者","不動產經紀業者對於涉及事業服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者","不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者","不動產經紀業者未依成屋買賣定型化契約書應記載及不得記載事項製作契約書者"],"a":1},{"id":"112r16","year":112,"cat":"不動產經紀相關法規概要","n":16,"q":"下列何者屬於限制競爭之行為，事業不得為之？","o":["以著名之他人姓名、商號或公司名稱於同一或類似之商品，為相同或近似之使用，致與他人商品混淆","事業為競爭之目的，而陳述或散布足以損害他人營業信譽之不實情事","事業以不當提供贈品、贈獎之方法，爭取交易之機會","無正當理由，對他事業給予差別待遇之行為"],"a":3},{"id":"112r17","year":112,"cat":"不動產經紀相關法規概要","n":17,"q":"關於聯合行為，下列何者正確？","o":["事業不得為聯合行為。但為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式，有益於個別經濟與股東利益，經申請主管機關許可者，不在此限","許可應附期限，其期限不得逾三年","事業對於主管機關就其聯合行為之許可及其有關之條件、負擔、期限，應主動公開","聯合行為經許可後，因經濟情況變更者，主管機關得廢止該許可"],"a":3},{"id":"112r18","year":112,"cat":"不動產經紀相關法規概要","n":18,"q":"主管機關對於事業涉有違反公平交易法規定之行為進行調查時，下列何者正確？","o":["事業承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得終止調查","主管機關作成中止調查之決定係基於事業提供不完整或不真實之資訊，應恢復調查","裁處權時效自終止調查之日起，停止進行","主管機關恢復調查者，裁處權時效自恢復調查之翌日起，重新起算"],"a":1},{"id":"112r19","year":112,"cat":"不動產經紀相關法規概要","n":19,"q":"關於事業以不當提供贈品、贈獎之方法，爭取交易之機會，下列何者正確？","o":["構成獨占地位之濫用","構成事業之結合","構成限制轉售價格","構成不公平競爭"],"a":3},{"id":"112r20","year":112,"cat":"不動產經紀相關法規概要","n":20,"q":"有關消費資訊之規範，依消費者保護法規定，下列何者錯誤？","o":["企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容","企業經營者之商品或服務廣告內容，於契約成立後，應確實履行","媒體經營者刊登或報導廣告之內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任","輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略"],"a":2},{"id":"112r21","year":112,"cat":"不動產經紀相關法規概要","n":21,"q":"依消費者保護法規定，有關定型化契約應記載或不得記載事項之規定，下列何者正確？","o":["應公告後報請行政院備查","中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業擬訂之","違反公告之定型化契約，其定型化契約條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容","中央主管機關公告應記載之事項，雖未記載於定型化契約，經消費者主張，仍構成契約之內容"],"a":1},{"id":"112r22","year":112,"cat":"不動產經紀相關法規概要","n":22,"q":"消費者保護團體依消費者保護法提起消費者損害賠償訴訟之要件，下列何者正確？","o":["消費者保護團體許可設立三年以上","消費者保護團體申請行政院評定優良者","得委任律師代理訴訟","消費者保護團體不得向消費者請求報酬，但得請求預付或償還必要費用"],"a":1},{"id":"112r23","year":112,"cat":"不動產經紀相關法規概要","n":23,"q":"依消費者保護法之規定，關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，下列何者錯誤？","o":["調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，此方案應經參與調解委員過半數之同意","該解決方案之送達，不適用公示送達規定","當事人對該解決方案，得於送達後十日之不變期間內，提出異議；未於異議期間內提出異議者，視為已依該解決方案成立調解","當事人於異議期間提出異議，經調解委員另定調解期日，無正當理由不到場者，視為依該解決方案成立調解"],"a":0},{"id":"112r24","year":112,"cat":"不動產經紀相關法規概要","n":24,"q":"關於輸入商品或服務之企業經營者，下列何者錯誤？","o":["視為該商品之設計、生產、製造者或服務之提供者","於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性","消費者保護團體主張企業經營者不符合當時科技或專業水準可合理期待之安全性者，就其事實應負舉證責任","企業經營者違反相關規定，致生損害於消費者或第三人時，應負連帶賠償責任"],"a":2},{"id":"112r25","year":112,"cat"
