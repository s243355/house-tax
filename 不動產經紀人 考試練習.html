條例規定，經紀業應依中央主管機關規定繳存營業保證金。下列關於營業保證金之說明，何者錯誤？","o":["獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因其債務債權關係而為扣押","得因經紀業或經紀人員之債務債權關係而抵銷","經紀業合併時，所繳存營業保證金之權利，應隨之移轉","經紀業申請解散時，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"],"a":1},{"id":"108r3","year":108,"cat":"不動產經紀相關法規概要","n":3,"q":"不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，下列何者不屬不動產經紀業管理條例規定經紀業應指派經紀人簽章之文件？","o":["不動產承租、承購委託契約書","不動產承租、承購要約書","定金收據","不動產廣告稿"],"a":0},{"id":"108r4","year":108,"cat":"不動產經紀相關法規概要","n":4,"q":"不動產經紀業管理條例關於經紀業經營仲介與代銷業務之規範，下列敘述何者正確？","o":["受起造人或建築業之委託，負責企劃並代理銷售不動產之業務為仲介業務；從事不動產買賣、互易、租賃之居間或代理業務為代銷業務","經營仲介業務者，應將報酬標準及收取方式於營業處所明顯處揭示；經營代銷業務者，則不須揭示之","經營仲介業務者，應僱用具備經紀人員資格者從事業務；經營代銷業務者，則無此限制","經營仲介業務者，有向主管機關申報登錄成交案件實際資訊之義務；經營代銷業務者，則無此義務"],"a":1},{"id":"108r5","year":108,"cat":"不動產經紀相關法規概要","n":5,"q":"有下列何種情形者，不得申請經營經紀業，其經許可者，撤銷或廢止其許可？","o":["犯詐欺、背信、侵占罪經受有期徒刑一年以上刑之宣告確定，執行完畢或赦免後已滿三年者","曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起已滿五年者","受停止營業處分，已執行完畢者","受廢止經紀人員證書或證明處分未滿五年者"],"a":3},{"id":"108r6","year":108,"cat":"不動產經紀相關法規概要","n":6,"q":"甲通過不動產經紀人考試並領有不動產經紀人證書，從事不動產仲介業務多年，同時擔任乙仲介公司董事長。執業期間因車禍腦部受創而受法院監護宣告，成為無行為能力人。下列敘述何者正確？","o":["甲得繼續充任不動產經紀人，其資格不受影響","主管機關應予甲申誡處分","主管機關應廢止乙公司之營業許可","由主管機關命乙公司限期改善；逾期未改善者，廢止其許可，並通知公司或商業登記主管機關廢止其登記"],"a":3},{"id":"108r7","year":108,"cat":"不動產經紀相關法規概要","n":7,"q":"甲公司接受乙建築公司之委託，簽訂委託契約書後，負責企劃並代理銷售乙公司新推出之公寓大廈預售屋。下列敘述何者正確？","o":["雙方應簽訂委託銷售契約書，並由乙公司指派經紀人於契約書簽章","甲公司於簽訂委託銷售契約書前，即得刊登廣告並開始銷售","甲公司應將報酬標準及收取方式揭示於營業處所明顯之處","乙公司之不動產廣告及銷售內容，應與事實相符，並註明甲公司名稱"],"a":3},{"id":"108r8","year":108,"cat":"不動產經紀相關法規概要","n":8,"q":"公平交易法規定，法院因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？","o":["二倍","三倍","四倍","五倍"],"a":1},{"id":"108r9","year":108,"cat":"不動產經紀相關法規概要","n":9,"q":"不動產經紀業者以下何種行為不涉及違法聯合行為？","o":["共同決定服務報酬收費標準，或協議限制服務報酬之調整","協議拒絕其他不動產經紀業者參與聯賣","共同約束開發物件必須與委託人簽訂一般委託契約","共同約束專任委託契約之期間"],"a":2},{"id":"108r10","year":108,"cat":"不動產經紀相關法規概要","n":10,"q":"下列何者非屬內政部所頒不動產說明書不得記載事項之內容？","o":["附屬建物除陽台外，其餘項目不得計入買賣價格","不得記載本說明書內容僅供參考","不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞","預售屋出售標的，不得記載未經依法領有建造執照之夾層設計或夾層空間面積"],"a":0},{"id":"108r11","year":108,"cat":"不動產經紀相關法規概要","n":11,"q":"安心社區擬於近日召開區分所有權人定期會議，討論社區管理事宜，同時選任新的管理委員。社區規約對於定期會議之召集程序及管理委員之選任事項，未定有特別規定。請問：管理委員會主任委員召集會議時，下列何項程序有違公寓大廈管理條例之規定？","o":["於開會前十日通知各區分所有權人","以書面通知載明開會內容","逕以公告代替書面通知，公告期間多於二日","有關管理委員之選任事項，在開會通知中載明並公告之"],"a":2},{"id":"108r12","year":108,"cat":"不動產經紀相關法規概要","n":12,"q":"甲房屋仲介公司擬與乙房屋仲介公司合併，下列何種情形不須先向公平交易委員會提出申報？","o":["甲公司已持有乙公司達百分之五十以上之有表決權股份","兩家公司合併後之市場占有率達三分之一","乙公司之市場占有率已達四分之一","甲公司上一會計年度銷售金額，超過公平交易委員會所公告之金額"],"a":0},{"id":"108r13","year":108,"cat":"不動產經紀相關法規概要","n":13,"q":"某直轄市內有競爭關係之甲、乙、丙、丁不動產仲介業者相互協議，就仲介成交之房屋買賣或租賃案件一律收取固定之服務報酬。試問：甲、乙、丙、丁之協議行為，可能構成公平交易法所規定之何種行為？","o":["獨占","結合","聯合","杯葛"],"a":2},{"id":"108r14","year":108,"cat":"不動產經紀相關法規概要","n":14,"q":"定型化契約中之條款可以分為定型化契約條款及個別磋商條款兩種，兩者如果發生不一致情形時，以下何者正確？","o":["個別磋商條款具有高於所有定型化契約條款之效力","由於個別磋商條款，係經過契約當事人個別磋商而合意約定的契約條款，相較於僅由企業經營者所預先擬定的定型化契約條款，更能顯示當事人真意所在，自應優先考量","如定型化契約條款與個別磋商條款發生牴觸時，定型化契約條款全部無效，其未牴觸部分亦無效","定型化契約條款牴觸個別磋商條款之約定者，定型化契約無效"],"a":1},{"id":"108r15","year":108,"cat":"不動產經紀相關法規概要","n":15,"q":"關於消費者保護法所稱分期付款買賣，以下何者正確？","o":["指買賣契約約定消費者支付頭期款，餘款分期支付之交易型態","預售屋分期付款買賣，價金分期給付，是消費者保護法有關分期付款買賣","分期付款買賣契約書未記載利率者，其利率按現金交易價格週年利率百分之六計算之","分期付款買賣契約書應記載各期價款與其他附加費用合計之總價款與現金交易價格之差額"],"a":3},{"id":"108r16","year":108,"cat":"不動產經紀相關法規概要","n":16,"q":"消費者與企業經營者因商品或服務發生消費爭議，消費者向企業經營者申訴時，企業經營者對於消費者的申訴，以下何者正確？","o":["從企業經營者接獲消費者申訴的當日開始起算十日內予以妥適處理","從企業經營者接獲消費者申訴的當日開始起算十五日內予以妥適處理","從消費者為申訴的那一天開始起算十五日內予以妥適處理","從消費者為申訴的那一天開始起算十日內予以妥適處理"],"a":1},{"id":"108r17","year":108,"cat":"不動產經紀相關法規概要","n":17,"q":"甲、乙、丙三公司分別為從事A商品之設計、製造及銷售之企業經營者。假設消費者丁購買丙公司銷售之A商品，造成丁的兒子受到傷害，依消費者保護法規定，甲公司應負何種責任？","o":["不須負任何責任","與乙、丙公司比例分擔損害賠償責任","與乙、丙公司負連帶賠償責任。但能證明其無過失者，法院得減輕其賠償責任","與乙、丙公司負連帶賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限"],"a":2},{"id":"108r18","year":108,"cat":"不動產經紀相關法規概要","n":18,"q":"依消費者保護法規定，消費者與企業經營者間因商品或服務所生之爭議，得選擇申訴、調解及訴訟途徑，尋求救濟。下列有關申請調解之敘述，何者正確？","o":["調解屬於司法解決途徑","申訴與調解並無先後之分，未提起申訴仍得申請調解","調解須向直轄市、縣（市）政府消費者保護官申請","調解成立者，調解書經法院核定後，與民事確定判決有同一之效力"],"a":3},{"id":"108r19","year":108,"cat":"不動產經紀相關法規概要","n":19,"q":"消費者因使用商品或接受服務，造成權利受損，依消費者保護法規定得提起團體訴訟，向企業經營者求償。有關團體訴訟之敘述，下列何者正確？","o":["至少有五十人將損害賠償請求權讓與經主管機關核定之優良消費者保護團體","消費者保護團體係以自己名義提起訴訟","損害賠償僅限於財產上之損害，不包括非財產上之損害","消費者團體就此項訴訟，得向消費者請求報酬"],"a":1},{"id":"108r20","year":108,"cat":"不動產經紀相關法規概要","n":20,"q":"關於不動產經紀人設置之敘述，以下何者正確？","o":["營業處所經紀營業員數每逾10名時，應增設經紀人1人","經紀業設立之營業處所至少應置經紀人1人，但非常態營業處所，其所銷售總金額達新臺幣6億元以上時，該處所至少應置經紀人1人","經紀業應於經紀人到職之日起7日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同","非中華民國國民，不得充任中華民國不動產經紀人"],"a":1},{"id":"108r21","year":108,"cat":"不動產經紀相關法規概要","n":21,"q":"公寓大廈專有部分之共同壁及樓地板或其內之管線，其維修費用，以下敘述何者正確？","o":["修繕費係因非可歸責於區分所有權人之事由所致者，由該區分所有權人負擔","由該共同壁雙方或樓地板上下方之區分所有權人共同負擔","由公共基金負擔","由管理委員會負擔"],"a":1},{"id":"108r22","year":108,"cat":"不動產經紀相關法規概要","n":22,"q":"下列何者，得為公寓大廈約定專用部分？","o":["連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳","社區內各巷道、防火巷弄","公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造","樓頂平臺"],"a":3},{"id":"108r23","year":108,"cat":"不動產經紀相關法規概要","n":23,"q":"以下有關公寓大廈區分所有權人會議及管理委員會兩者間關係之說明，何者錯誤？","o":["管理委員會有執行區分所有權人會議決議事項之義務","管理委員會會議決議之內容不得違反區分所有權人會議決議","管理委員會不得為訴訟之原告或被告，如起訴或被訴時，應通知區分所有權人擔當訴訟","管理委員會應向區分所有權人會議負責，並向其報告會務"],"a":2},{"id":"108r24","year":108,"cat":"不動產經紀相關法規概要","n":24,"q":"向上大樓已成立管理委員會，並將公共基金存放銀行專戶。住戶希望閒置的公共基金能獲取較銀行存款更高的投資報酬，擬交付信託。試問：依公寓大廈管理條例規定，應如何處理？","o":["經管理委員會決議後，由負責財務管理之管理委員交付信託","經區分所有權人會議決議後，由管理委員會交付信託","由管理委員會主任委員直接交付信託","由負責財務管理之管理委員直接交付信託"],"a":1},{"id":"108r25","year":108,"cat":"不動產經紀相關法規概要","n":25,"q":"下列有關公寓大廈規約之敘述，何者正確？","o":["由管理委員會訂定","內政部訂頒之「公寓大廈規約範本」具強制效力，公寓大廈訂定規約不得違反該範本之內容","就住戶違反義務之處理方式，非經載明於規約，不生效力","規約訂定後，應向主管機關報備，始生效力"],"a":2},{"id":"107m1","year":107,"cat":"民法概要","n":1,"q":"甲有A、B、C三台車，以總價50萬元出售給乙，其後甲將其對乙的債權贈與於丙，並讓與之。於乙將50萬元現金支付於丙後，甲將A、B、C三台車交付給乙並移轉所有權。試問甲、乙、丙間共有多少法律行為？","o":["4","5","6","7"],"a":3},{"id":"107m2","year":107,"cat":"民法概要","n":2,"q":"A公司董事長甲於5月1日上午告訴其助理乙致函於丙，表示願以一億元購買其工廠。乙於5月2日上午發信，信於5月4日到達丙處。經查，甲於5月2日晚上心肌梗塞死亡，丙於5月6日函覆A公司為承諾，試問買賣契約是否成立？","o":["買賣契約不成立","買賣契約效力未定，需視A公司繼任董事長是否承認決定其效力","買賣契約效力未定，需視甲之繼承人是否承認決定其效力","買賣契約成立"],"a":3},{"id":"107m3","year":107,"cat":"民法概要","n":3,"q":"下列有關使者之敘述，何者錯誤？","o":["使者係在傳達他人的意思表示","使者得為無行為能力人","身分行為不可藉使者傳達其意思表示","使者未適時傳達的危險由表意人承擔"],"a":2},{"id":"107m4","year":107,"cat":"民法概要","n":4,"q":"種類之債係以不特定物之給付為標的，為使債之實現，於履行前應為特定。下列有關種類之債特定之方法，何者正確？","o":["種類之債只能依法定方法為特定","往取之債於債務人具體指定給付物，並將準備給付之情事，通知債權人時，種類之債即為特定","送赴之債於債務人將給付物送至債權人住所地，使債權人處於得隨時受領之狀態時，種類之債即為特定","赴償之債於債務人交付其物於運送之人時，種類之債即為特定"],"a":1},{"id":"107m5","year":107,"cat":"民法概要","n":5,"q":"甲向乙貸款新臺幣500萬元，以其所有之A地及其上之B屋設定抵押權給乙作擔保。試問下列何者非屬抵押權效力所及？","o":["B屋抵押權設定後，甲於B屋上增建無獨立出入口之頂樓","B屋抵押權設定前，甲於B屋旁增建有獨立出入口之車庫","A地抵押權設定前，甲於A地栽種之果樹","A地扣押前，自甲於A地栽種果樹所分離之果實"],"a":3},{"id":"107m6","year":107,"cat":"民法概要","n":6,"q":"債務人甲所有之抵押物上，設有擔保乙200萬元債權之第一次序抵押權、丙120萬元債權之第二次序抵押權及丁50萬元債權之第三次序抵押權。抵押物拍賣所得價金為300萬元。乙將其第一次序之優先受償利益拋棄予丁，則應如何分配拍賣所得之金額？","o":["乙150萬元，丙0元，丁50萬元","乙160萬元，丙100萬元，丁40萬元","乙0元，丙100萬元，丁200萬元","乙150萬元，丙100萬元，丁50萬元"],"a":1},{"id":"107m7","year":107,"cat":"民法概要","n":7,"q":"下列有關農育權之敘述，何者錯誤？","o":["農育權係用益物權之一種","農育權有支付地租約定者，農育權人因不可抗力致收益減少，得請求減免其地租","農育權原則上係不定期限","農育權人原則上得將其農育權讓與他人"],"a":2},{"id":"107m8","year":107,"cat":"民法概要","n":8,"q":"甲乙丙丁共有A地，各有應有部分四分之一，甲乙丙三人未經丁之同意即將A地出賣給戊並為移轉登記，請問此物權移轉行為之效力為何？","o":["有效","無效","未得共有人全體同意，係屬無權處分效力未定","債權行為效力未定，物權移轉行為亦受其影響而效力未定"],"a":0},{"id":"107m9","year":107,"cat":"民法概要","n":9,"q":"下列有關夫妻分別財產制之規定，下列何者錯誤？","o":["分別財產制為約定財產制之一種","夫妻各自保有財產之所有權，並各自為管理、使用、收益及處分","夫妻之一方得因他方有花柳病或其他惡疾，向法院請求宣告改用分別財產制","夫妻各自對其債務負清償之責，但夫妻之一方以自己財產清償他方債務時，得請求返還"],"a":2},{"id":"107m10","year":107,"cat":"民法概要","n":10,"q":"下列有關夫妻法定財產制之敘述，下列何者正確？","o":["婚前財產由夫妻各自所有，婚後財產由夫妻公同共有","婚前財產及婚後財產均由夫妻各自所有","婚前財產由夫妻各自所有，婚後財產由夫妻分別共有","婚前財產及婚後財產均由夫妻公同共有，且夫妻對其結婚而公同共有之財產均有管理、使用、收益、處分之權利，若將來離婚對他方有請求分割之權利"],"a":1},{"id":"107m11","year":107,"cat":"民法概要","n":11,"q":"16歲之甲於騎車上學時，與正在送貨之某公司送貨員乙（30歲）擦撞，並導致路人丙受傷。若甲與乙均為違規駕駛，下列敘述何者正確？","o":["丙僅得請求財產上之損害賠償，不得主張非財產上損害賠償","甲為有識別能力人，故丙僅得向甲單獨請求損害賠償，不得向甲之父母求償","我國並無僱傭人責任之規範，僱傭乙之公司不必負損害賠償責任","甲與乙對丙構成共同侵權行為，均須對丙負連帶損害賠償責任"],"a":3},{"id":"107m12","year":107,"cat":"民法概要","n":12,"q":"針對民法有關撤銷權之規範，下列敘述何者正確？","o":["撤銷權僅能對不健全的意思表示為之，不得對法律行為或法律關係為之","任何撤銷權之行使，均只須以意思表示方式為之，即生法律效果","撤銷權因一定期間內不行使而消滅，此期間稱為消滅時效","撤銷權之法律性質與解除權相同，均屬形成權之一種"],"a":3},{"id":"107m13","year":107,"cat":"民法概要","n":13,"q":"18歲之甲考取大學後，拿著父母親給的住宿費、生活費至北部求學，擬向乙承租A屋一年。關於甲乙間租賃契約之效力，下列敘述，何者錯誤？","o":["甲為限制行為能力人，故甲所締結之租賃契約無效","甲得主張關於租賃契約之意思表示，在現代社會中可認為係依其年齡及身分、日常生活所必需者，例外無須得法定代理人允許，契約仍可成立生效","甲得提出法定代理人就租屋之書面允許，以使契約成立生效","乙得定期限催告法定代理人，確答是否承認甲乙間租賃契約，以使契約成立生效"],"a":0},{"id":"107m14","year":107,"cat":"民法概要","n":14,"q":"下列有關贈與之敘述，何者正確？","o":["贈與係單獨行為","贈與以物之交付為要件，於物之交付後，贈與行為才為生效","經公證之贈與，於贈與物之權利未移轉前，贈與人得隨時撤銷其贈與","贈與得附有負擔"],"a":3},{"id":"107m15","year":107,"cat":"民法概要","n":15,"q":"民法關於法人之規定，下列敘述，何者錯誤？","o":["法人可分為財團法人與社團法人","法人於法令限制內，有享受權利負擔義務之能力。但專屬於自然人之權利義務，不在此限","法人應設董事與監察人","法人對於其董事或其他有代表權之人因執行職務所加於他人之損害，與該行為人連帶負賠償之責任"],"a":2},{"id":"107m16","year":107,"cat":"民法概要","n":16,"q":"關於人格權保護，下列敘述，何者錯誤？","o":["人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止之","名譽權受侵害時，若法院採取命被告登報道歉作為回復名譽之適當處分，依現行司法實務見解，仍屬合憲","債務人因債務不履行，致債權人之人格權受侵害者，不得請求損害賠償","生命權受侵害時，配偶得請求損害賠償與慰撫金"],"a":2},{"id":"107m17","year":107,"cat":"民法概要","n":17,"q":"關於僱傭契約，下列敘述，何者錯誤？","o":["僱傭契約之專屬性較低，故僱用人得將其勞務請求權讓與第三人，無需受僱人同意","受僱人服勞務，因非可歸責於自己之事由致受損害者，得向僱用人請求賠償","定期之僱傭契約，若當事人之一方遇有重大事由，仍得於期限屆至前終止契約","受僱人因執行職務，不法侵害他人之權利者，原則上係由僱用人與受僱人連帶負損害賠償責任"],"a":0},{"id":"107m18","year":107,"cat":"民法概要","n":18,"q":"下列敘述所涉及之物，何者不能單獨作為物權之客體？","o":["醫療器材店所販售之大腿義肢","已被安裝置入大廈內運作的客製化電梯","區分所有建築物（如大廈）之專有部分","足以遮風避雨的違章建築物"],"a":1},{"id":"107m19","year":107,"cat":"民法概要","n":19,"q":"甲於颱風過後翌日在河邊拾得從國家森林區漂流而下之珍貴紅檜木，乙自甲處竊取之，並將之以低價出售予不知情之丙。下列敘述，何者正確？","o":["甲拾得珍貴漂流木，依民法第802條無主物先占規定，原始取得其所有權","甲拾得珍貴漂流木，依民法第810條適用關於拾得遺失物規定，負通知及交存該物之義務，無法立即取得該物所有權","因天災致國有珍貴林木漂流至國有林區外時，甲得自由撿拾取得所有權，不受民法關於拾得遺失物規定之限制","甲因丙取得漂流木所有權而受損害時，得依關於不當得利之規定請求償還價額"],"a":1},{"id":"107m20","year":107,"cat":"民法概要","n":20,"q":"下列何種權利，得為抵押權之標的物？","o":["地上權","不動產役權","著作權","租賃權"],"a":0},{"id":"107m21","year":107,"cat":"民法概要","n":21,"q":"下列何者並非公同共有關係？","o":["祭祀公業之派下員對不具法人資格的祭祀公業財產之關係","合夥人對合夥財產之關係","將一筆土地贈與且移轉登記予數人，受贈人對該贈與物之關係","數人繼承遺產，於分割遺產前，各繼承人對於遺產全部之關係"],"a":2},{"id":"107m22","year":107,"cat":"民法概要","n":22,"q":"下列關於物權規定之敘述，何者正確？","o":["用益物權包括地上權、農育權、不動產役權、典權與質權","違章建築物不能辦理移轉登記，故於建造完成時，建造人無法取得所有權","基於公同關係而共有之房地，各共有人得就其應有部分設定抵押權","稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權"],"a":3},{"id":"107m23","year":107,"cat":"民法概要","n":23,"q":"甲與乙於民國100年結婚，雙方並未約定夫妻財產制，嗣於105年乙因外遇而雙方離婚。關於婚後財產，下列敘述何者正確？","o":["甲於民國103年因其父親過世所獲得的遺產300萬元是婚後財產","乙於民國102年因車禍所獲50萬元慰撫金之非財產上損害賠償屬於婚後財產","甲於民國100年將婚前所投資之股票出售，獲利30萬元，屬於婚後財產","乙於民國101年所購入之房屋屬於婚後財產"],"a":3},{"id":"107m24","year":107,"cat":"民法概要","n":24,"q":"關於相鄰地必要通行權，下列敘述何者錯誤？","o":["通行權人必須為土地所有人","土地因與公路無適宜聯絡即可，無須毫無聯絡方法","通行權人有必要時可以開設道路","通行權人對於通行地因此所受之損害，應支付償金"],"a":0},{"id":"107m25","year":107,"cat":"民法概要","n":25,"q":"甲有子女乙丙二人，乙與丁結婚後育有一女戊，丙收養一女己；然乙卻因工時過長，過勞而亡。甲於乙死亡後兩年亦病逝。有關甲遺產之繼承，下列敘述何者正確？","o":["戊、己得以代位繼承","丙、戊為甲的遺產繼承人","丙、戊、己為甲的遺產繼承人","丙、丁、戊、己均為甲的遺產繼承人"],"a":1},{"id":"107v1","year":107,"cat":"不動產估價概要","n":1,"q":"某便利商店需承租兩間相鄰之店面，兩間店面打通後合併使用之總面積方符合公司之需求。請問此二間店面合併為目的形成之租賃價值，以貨幣金額表示者稱為：","o":["正常租金","特殊租金","限定租金","合併租金"],"a":2},{"id":"107v2","year":107,"cat":"不動產估價概要","n":2,"q":"有關勘估標的總費用之推算項目，不包括下列那一項？","o":["管理費及維修費","地價稅或地租、房屋稅","保險費","貸款利息"],"a":3},{"id":"107v3","year":107,"cat":"不動產估價概要","n":3,"q":"下列何者不屬不動產估價師蒐集比較實例所應依循之原則？","o":["實例之價格屬限定價格、可調整為限定價格或與勘估標的價格種類相同者","與勘估標的位於同一供需圈之近鄰地區或類似地區者","與勘估標的使用性質或使用管制相同或相近者","實例價格形成日期與勘估標的之價格日期接近者"],"a":0},{"id":"107v4","year":107,"cat":"不動產估價概要","n":4,"q":"下列何者符合應用計量模型分析法關係式採用5個自變數時所要求之所有條件？","o":["蒐集26個比較標的、迴歸分析調整後判定係數為0.8、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.04","蒐集36個比較標的、迴歸分析調整後判定係數為0.8、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.95","蒐集60個比較標的、迴歸分析調整後判定係數為0.02、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.03","蒐集20個比較標的、迴歸分析調整後判定係數為0.8、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.01"],"a":0},{"id":"107v5","year":107,"cat":"不動產估價概要","n":5,"q":"運用比較法在試算價格之調整運算過程中，區域因素調整、個別因素調整或區域因素及個別因素內之任一單獨項目之價格調整率大於百分之(甲)，或情況、價格日期、區域因素及個別因素調整總調整率大於百分之(乙)時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。請問甲與乙各為多少？","o":["甲為10，乙為20","甲為10，乙為25","甲為15，乙為25","甲為15，乙為30"],"a":3},{"id":"107v6","year":107,"cat":"不動產估價概要","n":6,"q":"採用比較法經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。前者所稱百分之二十以上之差距係指：","o":["高低價格之差除以高低價格平均值達百分之二十以上者","高低價格之差除以最高價格達百分之二十以上者","高低價格平均值除以最高價格達百分之二十以上者","高低價格平均值除以高低價格之差達百分之二十以上者"],"a":0},{"id":"107v7","year":107,"cat":"不動產估價概要","n":7,"q":"收益法估價應蒐集勘估標的及與其特性相同或相似之比較標的最近幾年間總收入、總費用及收益資本化率或折現率等資料？","o":["2年","3年","4年","5年"],"a":1},{"id":"107v8","year":107,"cat":"不動產估價概要","n":8,"q":"當建物價格日期當時價值未來每年折舊提存率大於零時，下列對淨收益已扣除折舊提存費之房地綜合收益資本化率與淨收益未扣除折舊提存費之房地綜合收益資本化率兩者間之敘述，何者正確？","o":["淨收益已扣除折舊提存費之房地綜合收益資本化率高於淨收益未扣除折舊提存費之房地綜合收益資本化率","淨收益已扣除折舊提存費之房地綜合收益資本化率等於淨收益未扣除折舊提存費之房地綜合收益資本化率","淨收益已扣除折舊提存費之房地綜合收益資本化率小於淨收益未扣除折舊提存費之房地綜合收益資本化率","無法判斷"],"a":2},{"id":"107v9","year":107,"cat":"不動產估價概要","n":9,"q":"在使用成本法估價時，建物估價以求取(甲)為原則。但建物使用之材料目前已無生產或施工方法已改變者，得採(乙)替代之。請問甲、乙分別為何種成本？","o":["甲為重建成本、乙為重置成本","甲為重置成本、乙為重建成本","甲為直接成本、乙為間接成本","甲為間接成本、乙為直接成本"],"a":0},{"id":"107v10","year":107,"cat":"不動產估價概要","n":10,"q":"於採土地開發分析法之資本利息綜合利率之計算中，如果資本利息年利率為3%，土地價值比率為40%，建物價值比率為60%，開發年數為3年，請問資本利息綜合利率為何？","o":["9%","6.3%","4.5%","3%"],"a":1},{"id":"107v11","year":107,"cat":"不動產估價概要","n":11,"q":"下列那一項不屬於土地建築開發之間接成本？","o":["施工費","規劃設計費","銷售費","管理費"],"a":0},{"id":"107v12","year":107,"cat":"不動產估價概要","n":12,"q":"當某土地開發後預期總銷售金額為1000萬元，適當之利潤率為12%，開發所需之直接成本為300萬元，開發所需之間接成本為250萬元，開發所需總成本之資本利息綜合利率為4%時，請問土地開發分析法價格大約為何？","o":["433萬元","402萬元","386萬元","309萬元"],"a":3},{"id":"107v13","year":107,"cat":"不動產估價概要","n":13,"q":"附有違章建築之房地估價，有關違建部分之處理方式，下列何者正確？","o":["違建部分不予以評估","委託人要求評估違建部分之價值時，只需就合法建物及違建部分於估價報告書中標示合併之總價格即可","委託人如果要求評估違建部分之價值時，應拒絕之","不論委託人有無要求，皆應就合法建物及違建部分於估價報告書中標示合併之總價格"],"a":0},{"id":"107v14","year":107,"cat":"不動產估價概要","n":14,"q":"不動產估價報告書中載明價格日期，係立基於下列何種原則？","o":["最有效使用原則","競爭原則","變動原則","預期原則"],"a":2},{"id":"107v15","year":107,"cat":"不動產估價概要","n":15,"q":"不動產估價有所謂的獨立估價，請問獨立估價是指：","o":["土地上原有地上建物，但於估價之價格日期時已頽壞傾倒，估價時仍視為有地上建物，併同土地一併估價","土地上無地上建物，純素地估價","土地上有地上建物，估價時將土地與地上建物併同估價","土地上有地上建物或他項權利存在，但估價時將土地視為素地予以估價，不考慮地上建物或他項權利對該土地的影響"],"a":3},{"id":"107v16","year":107,"cat":"不動產估價概要","n":16,"q":"勘估標的是一都市邊緣之農地，未來極有可能變更為建地，今依委託人要求針對勘估標的未來可能變更為建地情況進行估價，其價格種類為何？","o":["正常價格","限定價格","特定價格","特殊價格"],"a":2},{"id":"107v17","year":107,"cat":"不動產估價概要","n":17,"q":"下列有關比較法的敘述，何者錯誤？","o":["試算價格調整運算過程中，情況因素、價格日期、區域因素、個別因素或區域因素及個別因素內之任一單獨項目之價格調整率不得大於15%，但勘估標的性質或區位特殊，於報告書敘明者，不在此限","試算價格調整運算過程中，情況因素、價格日期、區域因素及個別因素總調整率不得大於30%，但勘估標的性質或區位特殊，於報告書敘明者，不在此限","情況調整係指比較標的之價格形成條件中有非屬於一般正常情形而影響價格時，或有其他足以改變比較標的價格之情況存在時，就該影響部分所作之調整","估價師運用比較法估價時，應採用三件以上比較標的"],"a":0},{"id":"107v18","year":107,"cat":"不動產估價概要","n":18,"q":"王先生手中取得一份不動產估價報告書，比較法推估過程中三個比較案例的價格依序為新臺幣63萬元/坪、64.5萬元/坪、68.5萬元/坪，所推估之試算價格依序分別為新臺幣45萬元/坪、50萬元/坪、57.5萬元/坪，下列敘述何者正確？","o":["比較案例一總調整率不符規定","比較案例三總調整率不符規定","比較案例一與比較案例三試算價格之差距不符規定","比較案例一與比較案例二之試算價格較接近，應給予較高之權重"],"a":2},{"id":"107v20","year":107,"cat":"不動產估價概要","n":20,"q":"下列關於收益資本化率之敘述，何者錯誤？","o":["增值性較高的不動產，其收益資本化率較高","流通性高的不動產，其收益資本化率較低","風險性較高的不動產，其收益資本化率較高","管理度較難的不動產，其收益資本化率較高"],"a":0},{"id":"107v21","year":107,"cat":"不動產估價概要","n":21,"q":"選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定收益資本化率之方法為：","o":["加權平均資金成本法","有效總收入乘數法","債務保障比率法","市場萃取法"],"a":3},{"id":"107v22","year":107,"cat":"不動產估價概要","n":22,"q":"附著於土地之工事及水利土壤之改良，以何種方法估價為原則？","o":["收益法","成本法","比較法","土地開發分析法"],"a":1},{"id":"107v23","year":107,"cat":"不動產估價概要","n":23,"q":"同棟多層樓之不動產估價，估價師通常以某一層為比準層，再依樓層別效用比推估其他樓層之價格，若以最低價之樓層為比準層，其他各樓層之效用比為何？","o":["均大於100","均等於100","均小於100","大於或小於100"],"a":0},{"id":"107v24","year":107,"cat":"不動產估價概要","n":24,"q":"三筆土地分別為1500萬元、2500萬元及6000萬元，今決定將三筆土地合併開發，經評估合併後土地總價值為1億5千萬元，請問相對於原來1500萬元之土地，其合併後價格應為：","o":["3750萬元","2250萬元","9000萬元","2500萬元"],"a":1},{"id":"107v25","year":107,"cat":"不動產估價概要","n":25,"q":"依不動產估價技術規則規定，承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數，稱為：","o":["純租金","支付租金","實質租金","經濟租金"],"a":2},{"id":"107l1","year":107,"cat":"土地法與土地相關稅法概要","n":1,"q":"關於土地權利變更登記，下列何者正確？","o":["其係繼承登記者，應由全體繼承人聲請之","其係繼承登記者，依法應自繼承開始之日起二個月內為之","聲請逾期者，每逾一個月得處應納登記費額二倍之罰鍰","罰鍰最高不得超過應納登記費額二十倍"],"a":3},{"id":"107l2","year":107,"cat":"土地法與土地相關稅法概要","n":2,"q":"下列土地，何者非屬土地法規定不得為私有之土地？","o":["礦泉地","瀑布地","國家公園土地","名勝古蹟"],"a":2},{"id":"107l3","year":107,"cat":"土地法與土地相關稅法概要","n":3,"q":"下列何種登記，應繳納登記費？","o":["土地權利信託登記","土地權利塗銷登記","土地標示變更登記","因土地重劃之變更登記"],"a":0},{"id":"107l4","year":107,"cat":"土地法與土地相關稅法概要","n":4,"q":"土地法第34條之1第1項有關以多數決處分共有土地之規定，下列處分方式，何者不適用該規定？","o":["設定農育權","設定不動產役權","設定典權","辦理共有物分割"],"a":3},{"id":"107l5","year":107,"cat":"土地法與土地相關稅法概要","n":5,"q":"重新實施地籍測量，遇有土地所有權人因設立界標或到場指界發生界址爭議時，地政機關應如何處理？","o":["逕行參照舊地籍圖施測","請當事人逕行向法院提起確認界址之訴，俟判決確定後再行辦理","逕行依地方習慣施測","準用土地法第59條第2項規定之調處程序處理之"],"a":3},{"id":"107l6","year":107,"cat":"土地法與土地相關稅法概要","n":6,"q":"逾期未辦繼承登記之土地，經依土地法第73條之1規定程序列冊管理期滿，移請國有財產署標售五次不成，而登記為國有者，自登記完畢之日起多少年內，原權利人得檢附證明文件按其法定應繼分請求國有財產署發給價金？","o":["10年","12年","15年","20年"],"a":0},{"id":"107l7","year":107,"cat":"土地法與土地相關稅法概要","n":7,"q":"預告登記，對於因下列何種事由而為之新登記，具有排除之效力？","o":["土地交換","徵收","強制執行","法院判決"],"a":0},{"id":"107l8","year":107,"cat":"土地法與土地相關稅法概要","n":8,"q":"為保護基地承租人，依土地法規定，租用基地建築房屋，應由出租人與承租人會同聲請該管直轄市或縣（市）地政機關為何種權利之登記？","o":["租賃權","地上權","典權","不動產役權"],"a":1},{"id":"107l9","year":107,"cat":"土地法與土地相關稅法概要","n":9,"q":"依土地法規定，關於租用建築房屋之基地，下列何者，非屬出租人得收回之情形？","o":["出租人收回自行建築時","契約年限屆滿時","承租人以基地供違反法令之使用時","承租人轉租基地於他人時"],"a":0},{"id":"107l10","year":107,"cat":"土地法與土地相關稅法概要","n":10,"q":"依平均地權條例規定，直轄市或縣（市）政府對於尚未建築之超額私有建築用地之處理，下列敘述，何者正確？","o":["應通知土地所有權人於三年內出售","應通知土地所有權人於三年內建築使用","逾期未出售或未建築使用者，得予強制拍賣","逾期未出售或未建築使用者，得予照價收買"],"a":3},{"id":"107l11","year":107,"cat":"土地法與土地相關稅法概要","n":11,"q":"耕地以外之出租土地，因市地重劃而不能達到原租賃之目的者，承租人得終止租約，並得向出租人請求如何之補償？","o":["按重劃計畫書公告當期公告土地現值扣除預計土地增值稅後餘額之三分之一","按重劃計畫書公告當期公告土地現值之三分之一","相當六個月租金","相當一年租金"],"a":3},{"id":"107l12","year":107,"cat":"土地法與土地相關稅法概要","n":12,"q":"依土地徵收條例規定，關於特定農業區農牧用地之徵收，下列何者錯誤？","o":["除零星夾雜難以避免者外，不得徵收。但國防所必須或經行政院核定之重大建設所需者，不在此限","除零星夾雜難以避免者外，不得徵收。但交通所必須或經行政院核定之重大建設所需者，不在此限","特定農業區經行政院核定為重大建設須辦理徵收者，若有爭議，應依行政程序法舉行聽證","特定農業區經行政院核定為重大建設須辦理徵收者，若有爭議，應依行政程序法舉行公聽會"],"a":3},{"id":"107l13","year":107,"cat":"土地法與土地相關稅法概要","n":13,"q":"依土地徵收條例有關徵用之規定，下列敘述，何者正確？","o":["國家因興辦繼續性之公共建設工程，得徵用私有土地或土地改良物","徵用期間逾六年，或二次以上徵用，期間合計逾六年者，需用土地人應於申請徵用前，以書面通知","土地或土地改良物所有權人於收到徵用通知書之日起三十日內，得請求需用土地人徵收所有權","因徵用而請求徵收土地或土地改良物所有權者，必要時所有權人得申請收回其土地或土地改良物"],"a":2},{"id":"107l14","year":107,"cat":"土地法與土地相關稅法概要","n":14,"q":"依土地徵收條例規定，徵收土地之殘餘部分面積過小或形勢不整，致不能為相當之使用者，所有權人得向何機關申請一併徵收？","o":["需用土地人","該管直轄市或縣（市）主管機關","內政部","行政院"],"a":1},{"id":"107l15","year":107,"cat":"土地法與土地相關稅法概要","n":15,"q":"實施區段徵收時，申請發給抵價地者，對其被徵收土地之權利義務，於何時終止？","o":["向直轄市或縣（市）主管機關申請發給抵價地時","接到直轄市或縣（市）主管機關核定發給抵價地通知時","直轄市或縣（市）主管機關將抵價地登記為申請人所有時","直轄市或縣（市）主管機關將抵價地點交申請人接管時"],"a":1},{"id":"107l16","year":107,"cat":"土地法與土地相關稅法概要","n":16,"q":"區域計畫法有關非都市土地許可開發之規定，下列敘述，何者錯誤？","o":["開發許可前，應先將申請開發案提報各該區域計畫委員會審議之","申請開發許可，申請人應先取得開發地區內全部土地及建築物之所有權","開發許可後，辦理分區或用地變更前，應將開發區內公共設施用地完成分割移轉登記為各該直轄市、縣（市）有或鄉、鎮（市）有，並繳交開發影響費","直轄市、縣（市）政府受理開發申請案後，除情形特殊者外，應於六十日內報請各該區域計畫擬定機關審議"],"a":1},{"id":"107l17","year":107,"cat":"土地法與土地相關稅法概要","n":17,"q":"依非都市土地使用管制規則規定，山坡地範圍內之土地，在未編定使用地類別前，適用林業用地之管制，下列何者不包含在內？","o":["森林區","風景區","國家公園區","山坡地保育區"],"a":2},{"id":"107l18","year":107,"cat":"土地法與土地相關稅法概要","n":18,"q":"下列土地他項權利，何者為土地法所創設？","o":["地上權","農育權","耕作權","不動產役權"],"a":2},{"id":"107l19","year":107,"cat":"土地法與土地相關稅法概要","n":19,"q":"下列土地關係人，何者非屬土地稅法第3條所定之地價稅納稅義務人？","o":["承領土地，為承領人","承墾土地，為耕作權人","權屬不明土地，為主管稅捐稽徵機關指定之土地使用人","設有典權土地，為典權人"],"a":2},{"id":"107l20","year":107,"cat":"土地法與土地相關稅法概要","n":20,"q":"土地為信託財產者，於信託關係存續中，以何人為地價稅或田賦之納稅義務人？","o":["委託人","受託人","受益人","信託監察人"],"a":1},{"id":"107l21","year":107,"cat":"土地法與土地相關稅法概要","n":21,"q":"配偶相互贈與之土地，得申請不課徵土地增值稅。但於再移轉第三人時，以該土地第一次贈與前之原規定地價或前次移轉現值為原地價，計算下列何種數值或數額，課徵土地增值稅？","o":["公告現值","申報移轉現值","現值數額","漲價總數額"],"a":3},{"id":"107l22","year":107,"cat":"土地法與土地相關稅法概要","n":22,"q":"自用住宅用地得適用優惠稅率課徵地價稅，下列有關自用住宅用地要件之敘述，何者錯誤？","o":["須土地所有權人或其配偶、直系親屬於該地有居住事實並辦竣戶籍登記","須為無出租或供營業使用之住宅用地","土地面積，都市土地未超過三公畝部分，非都市土地未超過七公畝部分","土地上之建築改良物屬土地所有權人或其配偶、直系親屬所有者為限"],"a":0},{"id":"107l23","year":107,"cat":"土地法與土地相關稅法概要","n":23,"q":"買賣契稅之稅率，為其契價百分之六。所稱契價，以何者為準？","o":["以實際買賣價格為準","以當地不動產評價委員會評定之標準價格為準","以當地地價及標準地價評議委員會評定之標準價格為準","以當地建築主管機關公告之房屋造價為準"],"a":1},{"id":"107l24","year":107,"cat":"土地法與土地相關稅法概要","n":24,"q":"依房屋稅條例規定，私有房屋受重大災害時，有關房屋稅之減免，下列敘述何者正確？","o":["毀損面積佔整棟面積三成以上，不及五成之房屋，免徵房屋稅","毀損面積佔整棟面積五成以上，必須修復始能使用之房屋，免徵房屋稅","毀損面積佔整棟面積五成以上，其房屋稅減半徵收","毀損面積佔整棟面積五成以上，必須修復始能使用之房屋，其房屋稅減半徵收"],"a":1},{"id":"107l25","year":107,"cat":"土地法與土地相關稅法概要","n":25,"q":"依所得稅法規定，有關出售自住房屋，其房地交易所得稅之優惠，下列敘述，何者錯誤？","o":["免稅所得額，以按該法第14條之4第3項規定計算之餘額不超過四百萬元為限","個人或其配偶、直系親屬辦竣戶籍登記、持有並居住於該房屋連續滿六年","交易前六年內，無出租、供營業或執行業務使用","個人與其配偶及未成年子女於交易前六年內未曾適用該法第4條之5第1項第1款規定"],"a":1},{"id":"107r1","year":107,"cat":"不動產經紀相關法規概要","n":1,"q":"關於不動產經紀業刊登廣告及銷售，依不動產經紀業管理條例之規定，何者正確？","o":["經紀業與買受人簽訂委託契約書後，方得刊登廣告及銷售","廣告及銷售內容與事實不符者，應負損失補償責任","廣告及銷售內容，應註明經紀業名稱。如有違反，處新臺幣三萬元以上十五萬元以下罰鍰","不動產廣告稿應由經紀業指派經紀人簽章。如有違反，處新臺幣六萬元以上三十萬元以下罰鍰"],"a":3},{"id":"107r2","year":107,"cat":"不動產經紀相關法規概要","n":2,"q":"何種情況之受害人，得向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會請求代為賠償？","o":["不可歸責於經紀業之事由不能履行委託契約，致委託人受損害者","經營仲介業務者並未揭示報酬標準及收取方式於營業處所明顯之處，致受託人受損害者","經紀業因經紀人員執行仲介或代銷業務之故意或過失致交易當事人受損害者","非經紀業而經營仲介或代銷業務，致當事人受損害者"],"a":2},{"id":"107r3","year":107,"cat":"不動產經紀相關法規概要","n":3,"q":"甲於A市經營不動產經紀業，數年後欲遷出所在地A市到B縣，應於遷出後多久時間內，以書面向遷入之B縣主管機關申請遷入備查，並向原所屬之同業公會報備，及加入B縣同業公會，該遷入之同業公會並應轉知其全國聯合會？","o":["三十日","四十五日","二個月","三個月"],"a":0},{"id":"107r4","year":107,"cat":"不動產經紀相關法規概要","n":4,"q":"依不動產經紀業管理條例之規定，何者為應予停止營業處分之情形？","o":["經紀業未於經紀人到職之日起十五日內，造具名冊報請所在地主管機關層報中央主管機關備查","經紀業繳存之營業保證金低於規定之額度時，經中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會通知經紀業者於一個月內補足而未補足","經紀業僱用未具備經紀人員資格者從事仲介或代銷業務","經營仲介業務者，對於買賣或租賃委託案件，未依規定於簽訂買賣契約書並辦竣所有權移轉登記或簽訂租賃契約書後三十日內，向主管機關申報登錄成交案件實際資訊"],"a":1},{"id":"107r5","year":107,"cat":"不動產經紀相關法規概要","n":5,"q":"依不動產委託銷售定型化契約應記載及不得記載事項之規定，買賣雙方價金與條件一致時，委託人應與受託人所仲介成交之買方另行簽訂「不動產買賣契約書」，並約定由委託人及買方共同或協商指定地政士辦理所有權移轉登記及相關手續；如未約明者，由何人指定之？","o":["委託人","受託人","買方","直轄市、縣（市）主管機關"],"a":0},{"id":"107r6","year":107,"cat":"不動產經紀相關法規概要","n":6,"q":"雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章。依不動產說明書應記載及不得記載事項「壹、應記載事項二、成屋」部分，有關應記載或說明之「其他重要事項」，下列敘述何者錯誤？","o":["周邊環境，詳如都市計畫地形圖或相關電子地圖並於圖面標示周邊半徑三百公尺範圍內之重要環境設施","是否已辦理地籍圖重測","是否為直轄市或縣（市）政府列管之山坡地住宅社區","本建物共有部分於產權持有期間是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情形"],"a":3},{"id":"107r7","year":107,"cat":"不動產經紀相關法規概要","n":7,"q":"依不動產經紀業管理條例之規定，關於不動產經紀人證書之敘述，何者正確？","o":["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書","中華民國之國民，經不動產經紀人考試及格，並依不動產經紀業管理條例領有不動產經紀人證書者，得充不動產經紀人","經紀人證書有效期限為四年，期滿時，經紀人應檢附其於三年內在中央主管機關認可之機構、團體完成專業訓練三十個小時以上之證明文件，向直轄市或縣（市）政府辦理換證","經紀業應將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處。其為加盟經營者，得免揭示"],"a":1},{"id":"107r8","year":107,"cat":"不動產經紀相關法規概要","n":8,"q":"不動產經紀業者共同約束專任委託契約之期間，致使不動產經紀業者縱未積極努力撮合，委託人卻因受限於契約而無法另行委託其他不動產經紀業者，該行為將違反公平交易法所規範之那一種行為？","o":["以著名之他人姓名、商號或公司名稱、標章或其他表示他人營業、服務之表徵，於同一或類似之服務為相同或近似之使用，致與他人營業或服務之設施或活動混淆","結合","聯合行為","為其他足以影響交易秩序之欺罔或顯失公平之行為"],"a":2},{"id":"107r9","year":107,"cat":"不動產經紀相關法規概要","n":9,"q":"甲為不動產經紀業者，受乙不動產開發業者委託從事銷售行為，甲外包請丙廣告公司設計廣告，經消費者丁舉報該廣告之內容，有虛偽不實或引人錯誤之情形，經公平交易委員會認定為違反規定。依公平交易法之規定，下列敘述情形，何者錯誤？","o":["主管機關對於甲，得限期令停止、改正其行為或採取必要更正措施，並得處新臺幣二十萬元以上五千萬元以下罰鍰","若甲與乙共同具名製作不實房屋銷售廣告，且收取建案底價或總銷售金額一定成數之銷售服務費用，與乙共同獲有利益，可認為甲乙俱為廣告主","丙在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任","甲違反公平交易法之規定，致侵害丁之權益，應負損害賠償責任"],"a":0},{"id":"107r10","year":107,"cat":"不動產經紀相關法規概要","n":10,"q":"公平交易委員會發現某甲事業可能有違法之聯合行為情事，依職權欲對甲事業調查處理。關於調查之事項，下列何者錯誤？","o":["派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查","甲事業若承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得中止調查","執行調查之人員依法執行公務時，未出示有關執行職務之證明文件者，受調查者得拒絕之","調查所得可為證據之物，主管機關得扣留之；其扣留範圍及期間，不以供調查、檢驗、鑑定或其他為保全證據之目的所必要者為限"],"a":3},{"id":"107r11","year":107,"cat":"不動產經紀相關法規概要","n":11,"q":"甲為一位知名影星，曾拍攝二個不動產廣告，且知悉該等廣告有不實的情形。在成名之前，甲接拍廣告主乙的不動產廣告，廣告中反映甲對不動產商品的信賴，結果當時消費者丙即曾經檢舉廣告不實。十二年之後，甲已成為知名公眾人物，接了第二個廣告主丁的不動產廣告，反映甲對該廣告商品的親身體驗。此時，消費者戊檢舉廣告不實。依公平交易法之規定，下列敘述，何者正確？","o":["甲必須是「明知」其所從事之薦證有引人錯誤之虞，而仍為薦證，才需要負責","第一個廣告，甲仍非知名公眾人物，僅於受乙報酬五倍之範圍內，與乙負連帶損害賠償責任","第二個廣告，甲為知名人士，須與丁負連帶損害賠償責任","丙和戊的請求權尚未超過法定期限，故其請求權尚未消滅"],"a":2},{"id":"107r12","year":107,"cat":"不動產經紀相關法規概要","n":12,"q":"消費者保護法關於企業經營者對於廣告內容之規定，下列何者正確？","o":["製作廣告之媒體經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容","企業經營者對消費者從事與分期付款買賣有關之交易時，應於廣告上明示應付所有總費用之年百分率","刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任","企業經營者得預先約定限縮信賴該廣告之賠償責任範圍"],"a":2},{"id":"107r13","year":107,"cat":"不動產經紀相關法規概要","n":13,"q":"消費者保護團體得依消費者保護法之規定，提起消費者損害賠償訴訟或不作為訴訟，下列何者錯誤？","o":["消費者保護團體依規定提起訴訟者，得以自己之名義提起，視個案情形決定是否委任律師代理訴訟","消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟","消費者保護團體以自己名義提起訴訟者，應具備之條件有：許可設立二年以上，置有消費者保護專門人員，且申請行政院評定優良","消費者保護團體以自己之名義提起消費者損害賠償訴訟，其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費"],"a":0},{"id":"107r14","year":107,"cat":"不動產經紀相關法規概要","n":14,"q":"當有事實證明該流通進入市場之商品或服務，具有危害消費者安全與健康之虞時，為避免消費者權益遭受損害，企業經營者應回收或停止該有危險之商品或服務，以防免發生或擴大損害。依消費者保護法之規定，下列何者錯誤？","o":["中央主管機關認為有必要時，得命有損害消費者生命、身體、健康或財產的企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施","直轄市或縣（市）政府對於企業經營者提供之商品或服務，經調查認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬","企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，於明顯處為警告標示，得免除回收該批商品或停止其服務之責任","直轄市或縣（市）政府於企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞，而情況危急時，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品、服務、或為其他必要之處置"],"a":2},{"id":"107r15","year":107,"cat":"不動產經紀相關法規概要","n":15,"q":"依公寓大廈管理條例規定，有關公寓大廈外牆開口部或陽台設置防墜設施的條件，下列何者錯誤？","o":["有十二歲以下兒童之住戶","有六十五歲以上老人之住戶","防墜設施須不妨礙逃生且不突出外牆面","應經管理委員會之同意"],"a":3},{"id":"107r16","year":107,"cat":"不動產經紀相關法規概要","n":16,"q":"依公寓大廈管理條例之規定，非封閉式之公寓大廈集居社區其地面層為各自獨立之數幢建築物，且區內屬住宅與辦公、商場混合使用，其辦公、商場之出入口各自獨立之公寓大廈，各該幢內之辦公、商場部分，得就該幢或結合他幢內之辦公、商場部分，經其區分所有權人過多少比例之書面同意，及全體區分所有權人會議決議或規約明定法定事項後，以該辦公、商場部分召開區分所有權人會議，成立管理委員會，並向直轄市、縣（市）主管機關報備？","o":["二分之一","三分之二","五分之三","四分之三"],"a":0},{"id":"107r17","year":107,"cat":"不動產經紀相關法規概要","n":17,"q":"依公寓大廈管理條例之規定，公寓大廈之起造人或區分所有權人應依使用執照所記載之用途及法定之測繪規定，辦理建物所有權第一次登記。下列敘述何者錯誤？","o":["獨立建築物所有權之牆壁，以牆之外緣為界","建築物共用之牆壁，以牆壁之中心為界","附屬建物以其外緣為界辦理登記","無隔牆設置者，以建築執照竣工平面圖區分範圍為界，其面積應包括四周牆壁之厚度"],"a":3},{"id":"107r18","year":107,"cat":"不動產經紀相關法規概要","n":18,"q":"公寓大廈共用部分原則上不得獨立使用供做專有部分，依公寓大廈管理條例之規定，下列何者屬得為約定專用部分：","o":["連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄","無固定使用方法，非屬區分所有權人生活利用上不可或缺之共用部分","公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造","公寓大廈本身所占之地面"],"a":1},{"id":"107r19","year":107,"cat":"不動產經紀相關法規概要","n":19,"q":"依公寓大廈管理條例之規定，共用部分指公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者。關於共用部分，下列敘述何者錯誤？","o":["專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔","管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕","各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定","共用部分及其相關設施之拆除、重大修繕或改良，應依管理委員會之決定為之"],"a":3},{"id":"107r20","year":107,"cat":"不動產經紀相關法規概要","n":20,"q":"依公寓大廈管理條例之規定，開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，應經下列何種程序，始得供營業使用？","o":["經向直轄市、縣市主管機關申請許可之許可函","依規約或區分所有權人會議決議","依管理負責人或管理委員會之決定","依開放空間及退縮空地鄰近之區分所有權人之同意"],"a":1},{"id":"107r21","year":107,"cat":"不動產經紀相關法規概要","n":21,"q":"依公寓大廈管理條例之規定，因地震、水災、風災、火災或其他重大事變，肇致危害公共安全，而需要辦理公寓大廈之重建者，下列敘述何者錯誤？","o":["公寓大廈依此事由所為之重建，不須經全體區分所有權人及基地所有權人、地上權人或典權人之同意","經區分所有權人會議決議重建時，區分所有權人不同意決議又不出讓區分所有權或同意後不依決議履行其義務者，管理負責人或管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分","重建之建造執照之申請，其名義以區分所有權人會議之決議為之","管理負責人或管理委員會依公寓大廈管理條例之規定，訴請法院命不同意決議又不出讓區分所有權之區分所有權人出讓其區分所有權及其基地所有權應有部分後，對於該受讓人仍應徵詢其意見，不當然視為同意重建"],"a":3},{"id":"107r22","year":107,"cat":"不動產經紀相關法規概要","n":22,"q":"依不動產經紀業管理條例之規定，下列何種情形不得申請經營經紀業？","o":["受破產之宣告尚未復權者","受感訓處分之裁定確定，執行完畢後已滿三年者","犯詐欺、背信、侵占罪，經受有期徒刑一年以上刑之宣告確定，執行完畢或赦免後已滿三年者","受廢止經紀人員證書或證明處分已滿五年者"],"a":0},{"id":"107r23","year":107,"cat":"不動產經紀相關法規概要","n":23,"q":"下列有關經紀業及經紀人員業務及責任之敘述，何者正確？","o":["不動產說明書應由經紀業指派經紀人員簽章","經營仲介業務者，應依實際成交價金按中華民國不動產仲介經紀業同業公會全國聯合會規定之報酬標準計收","不動產廣告及銷售內容，應與事實相符，並註明經紀業及經紀人員名稱","經營仲介業務者經買賣雙方當事人之書面同意，得同時接受雙方之委託，並提供買受人關於不動產必要之資訊"],"a":3},{"id":"107r24","year":107,"cat":"不動產經紀相關法規概要","n":24,"q":"下列有關不動產經紀人辦理換發證書之規定敘述，何者正確？","o":["換發之證書，其有效期限自原證書有效期限屆滿之次日起算四年","應於證書有效期限屆滿前三個月內申請","應完成專業訓練至少二十個小時","應向執業所在地之直轄市或縣（市）政府申請"],"a":0},{"id":"107r25","year":107,"cat":"不動產經紀相關法規概要","n":25,"q":"首次請領不動產經紀人證書時，不須檢附下列何種文件？","o":["身分證明文件影本","完成專業訓練三十個小時以上之證明文件","不動產經紀人考試及格證書及其影本","一年以上經紀營業員經驗證明文件及其影本"],"a":1},{"id":"106m4","year":106,"cat":"民法概要","n":4,"q":"關於繼承之效力，下列敘述何者錯誤？","o":["繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任","繼承，因被繼承人死亡而開始","繼承人有數人時，在分割遺產前，各繼承人對於遺產全部為公同共有","繼承人從被繼承人生前所受贈之全部財產，視為其所得遺產"],"a":3},{"id":"106m5","year":106,"cat":"民法概要","n":5,"q":"關於意思表示錯誤，下列敘述何者正確？","o":["當事人資格之錯誤，可能得撤銷之","表意人得向相對人請求損害賠償","動機錯誤，均為意思表示內容之錯誤","表示行為錯誤，不得撤銷"],"a":0},{"id":"106m6","year":106,"cat":"民法概要","n":6,"q":"甲有A地，且登記為A地所有人。甲因乙之脅迫，出賣且交付A地於乙，於甲尚未撤銷買賣契約前。試問，下列敘述何者正確？","o":["甲得撤銷交付A地於乙之行為","現占有A地之乙為有權占有人","乙因此成為A地所有人","甲乙間之A地的買賣契約，無效"],"a":1},{"id":"106m7","year":106,"cat":"民法概要","n":7,"q":"關於消滅時效，下列敘述何者正確？","o":["消滅時效之規定，已登記不動產之回復請求權，亦有適用","一般消滅時效期間，乃20年","請求權因其消滅時效完成而消滅","以租賃動產為營業者之租價請求權，其消滅時效期間為2年"],"a":3},{"id":"106m8","year":106,"cat":"民法概要","n":8,"q":"依民法規定，關於不動產買賣，下列敘述何者正確？","o":["應作成公證書","非經登記，不生效力","非經交付買賣之不動產，不生效力","因當事人就標的物及其價金互相同意而成立"],"a":3},{"id":"106m9","year":106,"cat":"民法概要","n":9,"q":"甲有A屋，登記為A屋所有人。甲將A屋贈與乙女。試問，下列敘述何者正確？","o":["非經交付A屋，該贈與不生效力","該贈與應以書面為之","甲移轉A屋所有權予乙前，得撤銷該贈與","甲遲延交付A屋予乙時，乙得請求遲延損害賠償"],"a":2},{"id":"106m10","year":106,"cat":"民法概要","n":10,"q":"依民法規定，關於受任人之權利及義務，下列敘述何者正確？","o":["受任人受有報酬者，應以善良管理人之注意，處理委任事務","受任人未處理委任事務前，不得向委任人請求預付處理委任事務之必要費用","受任人必有代理權","受任人不得隨時終止委任契約"],"a":0},{"id":"106m11","year":106,"cat":"民法概要","n":11,"q":"甲有A屋，共95坪，登記為A屋所有人。乙詢問甲A屋坪數，甲告知A屋計有100坪。甲與乙締結100坪之A屋買賣契約。試問，下列敘述何者錯誤？","o":["甲侵害乙之A屋所有權","乙得解除契約","乙得請求減少價金","乙得以甲詐欺為由，撤銷締結該買賣契約之意思表示"],"a":0},{"id":"106m13","year":106,"cat":"民法概要","n":13,"q":"關於遺囑，下列敘述何者正確？","o":["遺囑乃非要式行為","無行為能力人，僅得為公證遺囑","代筆遺囑，應由遺囑人指定二人以上之見證人","繼承人及其配偶或其直系血親，不得為遺囑見證人"],"a":3},{"id":"106m14","year":106,"cat":"民法概要","n":14,"q":"甲對乙負有1,000萬元借款債務，丙為甲對乙所負該債務之連帶保證人。試問，下列敘述何者正確？","o":["乙得直接請求丙履行1,000萬元保證債務","乙僅得同時請求甲與丙履行債務","丙連帶責任之約定無效","丙負最終責任"],"a":0},{"id":"106m15","year":106,"cat":"民法概要","n":15,"q":"關於合會，下列敘述何者正確？","o":["法人亦得為合會會員","會首得兼為同一合會之會員","限制行為能力人亦得為會員","自然人不得同時為數合會之會首"],"a":2},{"id":"106m16","year":106,"cat":"民法概要","n":16,"q":"關於物權法定主義，下列敘述何者正確？","o":["僅得依制定法創設物權","僅得依特別法創設物權","得依習慣法創設物權","得依法理創設物權"],"a":2},{"id":"106m17","year":106,"cat":"民法概要","n":17,"q":"關於區分所有建築物，下列敘述何者正確？","o":["全體專有部分所有人公同共有區分所有建築物之基地","專有部分可共有或單獨所有","全體專有部分所有人公同共有區分所有建築物之公同部分","頂樓之專有部分所有人得占有區分所有建築物之屋頂，並為使用收益"],"a":1},{"id":"106m18","year":106,"cat":"民法概要","n":18,"q":"關於婚約下列敘述何者正確？","o":["婚約，得由未成年人之法定代理人代理為之","未成年人訂定婚約，無須經法定代理人之同意","婚約，得請求強迫履行","因訂定婚約而為贈與者，婚約解除時，當事人之一方，得請求他方返還贈與物"],"a":3},{"id":"106m19","year":106,"cat":"民法概要","n":19,"q":"關於結婚，下列敘述何者正確？","o":["男未滿17歲，女未滿15歲者，不得結婚","結婚應以公開儀式為之","直系血親及直系姻親在6親等以內者，不得結婚","當事人之一方，於結婚時不能人道而不能治者，他方得向法院請求撤銷之"],"a":3},{"id":"106m20","year":106,"cat":"民法概要","n":20,"q":"甲、乙與丙3人共有A車，應有部分各3分之1，約定A車由丙占有、使用及收益（分管契約）。占有A車之丙未經甲與乙同意，出賣A車於丁。試問，下列敘述何者正確？","o":["丁若不知丙非單獨所有人，且就其不知無過失，則善意取得A車所有權","丁若明知甲、乙與丙間之A車分管契約，則得占有使用收益A車","甲與乙若未同意，丙與丁間之A車的買賣，效力未定","丁對甲與乙乃有權占有"],"a":3},{"id":"106m21","year":106,"cat":"民法概要","n":21,"q":"關於地上權，下列敘述何者正確？","o":["以公共建設為目的而成立之地上權，不得定有期限","經設定地上權之土地，不得再設定抵押權","同一土地上，得設定數則內容相同之地上權","地上權亦得為時效取得之客體"],"a":3},{"id":"106m22","year":106,"cat":"民法概要","n":22,"q":"關於公同共有，下列敘述何者正確？","o":["公同關係存續中，各公同共有人，不得請求分割其公同共有物","各公同共有人，得自由處分其應有部分","公同關係，不以法律規定或習慣者為限","各公同共有人之權利，僅及於公同共有物之應有部分"],"a":0},{"id":"106m23","year":106,"cat":"民法概要","n":23,"q":"關於最高限額抵押權，下列敘述何者正確？","o":["當事人得約定其所擔保原債權之應確定之期日","最高限額抵押權所擔保之債權，不以由一定法律關係所生之權利為限","最高限額抵押權所擔保之債權，不得將其分離而為讓與","同一不動產上，僅得設定一項最高限額抵押權"],"a":0},{"id":"106m24","year":106,"cat":"民法概要","n":24,"q":"關於占有之推定，下列敘述何者正確？","o":["占有已登記之不動產而行使物權者，推定有該物權","行使所有權以外之權利者，對使其占有之人，推定有該權利","占有人推定其為他主占有","占有人推定其為無過失占有"],"a":3},{"id":"106m26","year":106,"cat":"民法概要","n":26,"q":"依民法之規定，法定要式行為有使用文字之必要時，下述情形何者錯誤？","o":["不動產物權之移轉或設定，當事人得以蓋章代替簽名","兩願離婚之協議書，夫妻雙方得以蓋章代替簽名","在代筆遺囑之情形，遺囑人得以蓋章代替簽名","應以書面方式訂立之人事保證契約，雙方得以蓋章代替簽名"],"a":2},{"id":"106m28","year":106,"cat":"民法概要","n":28,"q":"依民法規定，無權占有人返還占有物於回復請求人時，其得向回復請求人主張之權利及應負擔之義務，下列敘述何者正確？","o":["善意占有人對於占有物支出之必要費用，於扣除其所收取孳息之餘額，皆得請求償還","善意占有人對於占有物因改良占有物支出之有益費用，於扣除其所收取孳息之餘額，皆得請求償還","惡意占有人對於占有物孳息之收取，推定其適法有此權利，無須返還","惡意占有人，就占有物之滅失或毀損，縱使非因可歸責於自己之事由所致者，負損害賠償之責任"],"a":0},{"id":"106m30","year":106,"cat":"民法概要","n":30,"q":"19歲之甲經父母同意受僱於乙公司。某日甲受乙公司之吩咐，將貨物送到客戶手中。途中行經十字路口，甲闖紅燈致丙在綠燈穿越時受傷，經該地區行車事故鑑定委員會認定，認定甲應負全部之肇事責任。就此情形，下列敘述何者錯誤？","o":["甲是未成年人，對於丙之損害，無須負賠償責任","丙得主張乙與甲負連帶損害賠償責任","丙得主張甲及其父母負連帶損害賠償責任","乙賠償丙之損害後，得向甲求償"],"a":0},{"id":"106m31","year":106,"cat":"民法概要","n":31,"q":"就賣方甲與買方乙間訂立之買賣契約，下列敘述何者錯誤？","o":["該買賣標的物因可歸責於甲之事由而滅失，致給付不能者，乙得解除契約並請求損害賠償","該買賣標的物因不可歸責甲乙之事由而滅失，致給付不能者，甲得免除該物之給付義務","該買賣標的物因不可歸責甲乙之事由而滅失，致給付不能者，乙得免除價金支付之義務","該買賣標的物因可歸責乙之事由而滅失，致給付不能者，甲不得向乙請求價金之支付"],"a":3},{"id":"106m32","year":106,"cat":"民法概要","n":32,"q":"下列有關夫妻離婚後所生身分及財產上效力之說明，何者正確？","o":["夫妻離婚後，其子女對未享有親權之父母一方，喪失原本享有之法定繼承權","夫妻離婚後，未享有親權之父母一方與其子女間，互相不負扶養之義務","兩願離婚之場合，關於子女之親權，由夫任之","夫妻無過失之一方，因判決離婚而限於生活困難者，他方縱無過失，亦應給予贍養費"],"a":3},{"id":"106m38","year":106,"cat":"民法概要","n":38,"q":"下列有關契約解除之敘述，何者錯誤？","o":["契約解除時，當事人雙方負回復原狀之義務","解除權之行使，不妨礙損害賠償之請求","房屋買賣契約解除時，原買受人已支出之裝潢費用均得請求出賣人返還","解除權之行使，得以送達訴狀繕本予他方當事人之方法為之"],"a":2},{"id":"106v1","year":106,"cat":"不動產估價概要","n":1,"q":"不動產估價應敘明價格種類，如估價師受託辦理太平島估價，您認為應屬於何種價格？","o":["限定價格","正常價格","特定價格","特殊價格"],"a":3},{"id":"106v2","year":106,"cat":"不動產估價概要","n":2,"q":"下列何種情況，可歸類於不動產估價價格種類中之正常價格？","o":["實價登錄經主管機關篩選之價格","臺北市精華區標售國有土地價格","土地徵收補償所查估之市價","實價課稅經主管機關認定低報之價格"],"a":2},{"id":"106v3","year":106,"cat":"不動產估價概要","n":3,"q":"依不動產估價技術規則第7條規定：「依本規則辦理估價所稱之面積，已辦理登記者，以登記之面積為準」但未辦理登記或以部分面積為估價者，應如何處理？","o":["省略不處理","先探求未登記之原因","當作無價值","調查註明"],"a":3},{"id":"106v4","year":106,"cat":"不動產估價概要","n":4,"q":"如您於捷運地下街承租營運中，隔壁店家因故不與捷運局續租，此時您打算一併承租擴大經營，所承租之租金屬性應屬下列何者？","o":["市場租金","正常租金","經濟租金","限定租金"],"a":3},{"id":"106v5","year":106,"cat":"不動產估價概要","n":5,"q":"臺北市政府最近發布之10月份住宅價格指數，中山松山南港區標準住宅總價1,224萬元、萬華文山北投區1,080萬元，其價差達144萬元。以上的價差分析，屬下列何種運用？","o":["定率法","比率法","定額法","差額法"],"a":3},{"id":"106v6","year":106,"cat":"不動產估價概要","n":6,"q":"某出租型不動產之年總收益為100萬元，若總費用率為總收益的40%，收益資本化率4%，則該不動產之收益價格應為多少？","o":["1,000萬元","1,200萬元","1,500萬元","2,500萬元"],"a":2},{"id":"106v7","year":106,"cat":"不動產估價概要","n":7,"q":"不動產估價比較法就「畸零地或有合併使用之交易」所進行之調整，是屬於何項調整？","o":["情況調整","價格日期調整","區域因素調整","個別因素調整"],"a":0},{"id":"106v8","year":106,"cat":"不動產估價概要","n":8,"q":"關於不動產估價收益法之總費用估算項目，下列何者正確？","o":["只能算地價稅，如地上權地租不能算","房屋稅只適用於保存登記之建物","所得稅亦應計算","維修費、保險費亦應計算"],"a":3},{"id":"106v10","year":106,"cat":"不動產估價概要","n":10,"q":"「考慮銀行定期存款利率、政府公債利率、不動產投資之風險性、貨幣變動狀況及不動產價格之變動趨勢等因素，選擇最具一般性財貨之投資報酬率為基準，比較觀察該投資財貨與勘估標的個別特性之差異，並就流通性、風險性、增值性及管理上之難易程度等因素加以比較決定之。」係指收益資本化率何種方式？","o":["債務保障比率法","風險溢酬法","市場萃取法","有效總收入乘數法"],"a":1},{"id":"106v12","year":106,"cat":"不動產估價概要","n":12,"q":"下列有關成本法耐用年數之敘述，何者正確？","o":["建物折舊額計算應以物理耐用年數為主","物理耐用年數指建物因功能或效益衰退至不值得使用所經歷之年數","經濟耐用年數指建物因自然耗損或外力破壞至結構脆弱而不堪使用所經歷之年數","建物之經歷年數大於其經濟耐用年數時，應重新調整經濟耐用年數"],"a":3},{"id":"106v13","year":106,"cat":"不動產估價概要","n":13,"q":"依不動產估價技術規則規定，公共設施用地及公共設施保留地之估價，是以何種估價方法為原則？","o":["土地開發分析法","收益法","折現現金流量分析法","比較法"],"a":3},{"id":"106v14","year":106,"cat":"不動產估價概要","n":14,"q":"勘估標的之營造或施工費之求取方法中，「以建築細部工程之各項目單價乘以該工程施工數量，並合計之」之方法，係指何方法？","o":["淨計法","單位工程法","工程造價比較法","單位面積（或體積）比較法"],"a":1},{"id":"106v15","year":106,"cat":"不動產估價概要","n":15,"q":"某公寓1至4樓之單價分別為100、70、60、70萬元/坪，若全棟建物成本價格占全棟房地總價格比率為30%，若以3樓為基準，1至4樓之樓層別效用比分別為下列何者？","o":["、70%、60%、70%","、70%、70%、60%","、117%、117%、100%","、117%、100%、117%"],"a":3},{"id":"106v16","year":106,"cat":"不動產估價概要","n":16,"q":"不動產估價技術規則第89條規定：「受有土壤或地下水污染之土地，應先估算其未受污染之正常價格，再依據委託人提供之土壤污染檢測資料，考量該土壤或地下水污染之影響，並計算其地價減損額後，從正常價格中扣除之，以其餘額為該宗地之價格。」假設受污染宗地，未受污染正常價格2,000萬元，經勘估地價減損額500萬元，則受污染地價格多少？","o":["萬元",",000萬元",",500萬元",",000萬元"],"a":2},{"id":"106v17","year":106,"cat":"不動產估價概要","n":17,"q":"某建物於10年前興建，重建成本500萬元，殘餘價格率4%、經濟耐用年數40年，請問等速折舊型之建物成本價格為何？","o":["萬元","萬元","萬元","萬元"],"a":3},{"id":"106v18","year":106,"cat":"不動產估價概要","n":18,"q":"西門町某店面於3年前出租經營，到期擬續租，當年契約租金每年200萬元，目前市場經濟租金每年可達250萬元，若分析此租金上漲應有60%歸功於承租經營者，在必要費用不增加情況下，合理續租年租金多少？","o":["萬元","萬元","萬元","萬元"],"a":0},{"id":"106v19","year":106,"cat":"不動產估價概要","n":19,"q":"某建商擬開發建地，預計興建樓板面積1,000坪，若推定銷售單價平均80萬元/坪，利潤率20%、資本利息綜合利率5%、直接成本3億元、間接成本6千萬元，則土地開發分析價格為何？","o":[",582萬元",",215萬元",",492萬元",",200萬元"],"a":2},{"id":"106v20","year":106,"cat":"不動產估價概要","n":20,"q":"由於不動產是一種異質的商品，因其下列何種之特徵而分割為許多地區性市場？","o":["區位","高程","地形","地質"],"a":0},{"id":"106v21","year":106,"cat":"不動產估價概要","n":21,"q":"已開闢道路及其二側或一側帶狀土地，可就具有顯著商業活動之繁榮地區，依當地發展及地價高低情形而劃設為下列那二種地價區段？","o":["住宅價區段與商業價區段","商業價區段與非商業價區段","基準地價區段與標準地價區段","繁榮街道路線價區段與一般路線價區段"],"a":3},{"id":"106v22","year":106,"cat":"不動產估價概要","n":22,"q":"容積移轉及容積調派制度的實施，對不動產價值發生影響的因素被稱為：","o":["行政條件","政治條件","社會條件","接近條件"],"a":0},{"id":"106v23","year":106,"cat":"不動產估價概要","n":23,"q":"不動產附近如有公園、圖書館、學校、歌劇院等建設，皆會對其價值產生影響，此種估價時需掌握的原則較適合被稱為：","o":["供需原則","貢獻原則","外部性原則","社會成本原則"],"a":2},{"id":"106v25","year":106,"cat":"不動產估價概要","n":25,"q":"初入社會的陳君預計在往後10年，每年有10萬元的償債能力，假設此時銀行利率為3%，請問其可貸得金額為何？","o":[",390元",",970元",",020元",",146,390元"],"a":2},{"id":"106v26","year":106,"cat":"不動產估價概要","n":26,"q":"依不動產估價技術規則第68條規定，建物累積折舊額之計算，應視下列何者選擇屬於等速折舊、初期加速折舊或初期減速折舊路徑之折舊方法？","o":["建商信譽","建管單位要求","建物特性及市場動態","建築設計及建築投資公會"],"a":2},{"id":"106v27","year":106,"cat":"不動產估價概要","n":27,"q":"某建物已完工5年，面積100m2，目前重建成本單價為新臺幣3萬元/m2，殘餘價格率為5%、經濟耐用年數為50年，請問該建物累積折舊額為多少？","o":["萬元","萬元","萬元","萬元"],"a":0},{"id":"106v28","year":106,"cat":"不動產估價概要","n":28,"q":"勘估土地時蒐集到一個半年前正常情況下之土地交易案例，以每平方公尺30萬元成交，其與價格日期相比跌了2%，區域條件較勘估標的優5%、個別條件較勘估標的優10%，其試算價格為何？","o":["萬元/m2","萬元/m2","萬元/m2","萬元/m2"],"a":0},{"id":"106v29","year":106,"cat":"不動產估價概要","n":29,"q":"某一不動產每年營業淨收益60萬元，貸款成數80%，貸款利率5%，貸款年數20年，債權保障比率1.5，若以這些條件計算下之不動產價格應為：","o":["萬元","萬元","萬元",",420萬元"],"a":1},{"id":"106v30","year":106,"cat":"不動產估價概要","n":30,"q":"附有建物之宗地，考慮建物對宗地價格影響下所為之土地估價，稱之為：","o":["分割估價","合併估價","部分估價","獨立估價"],"a":2},{"id":"106v31","year":106,"cat":"不動產估價概要","n":31,"q":"下列有關勘估標的與比較標的調整及試算價格求取之敘述，何者正確？","o":["差異調整以差額法為原則","差異調整以定性分析法為原則","偏高或偏低檢討後試算價格間差距仍達10%以上者，應排除適用","偏高或偏低檢討後試算價格間差距仍達20%以上者，應排除適用"],"a":3},{"id":"106v32","year":106,"cat":"不動產估價概要","n":32,"q":"蒐集市場上僅有的5個交易案例之資本化率分別為10%、1%、5%、4.5%、4.9%，經估價師判斷應去掉差距過大之異常值，試問若依市場萃取法，勘估標的之資本化率應為：","o":["%","%","%","%"],"a":2},{"id":"106v33","year":106,"cat":"不動產估價概要","n":33,"q":"臺灣南部有許多鹽田，其價值評估以比較法估價為原則。若無買賣實例者，下列敘述何者正確？","o":["得以收益法估計之","得以成本法估計之","得以鹽田會員制度及曬鹽費用等因素推估之","得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，比較推估之"],"a":3},{"id":"106v34","year":106,"cat":"不動產估價概要","n":34,"q":"下列有關永佃權估價之敘述，何者正確？","o":["應考慮設定目的估計之","應考慮佃租支付情形、民間習俗等因素估計之","應考慮權利存續期間、權利讓與之限制等因素，以典價為基礎估計之","應考慮設定目的、約定方法、權利存續期間、支付地租之有無及高低估計之"],"a":1},{"id":"106v35","year":106,"cat":"不動產估價概要","n":35,"q":"有關不動產估價原則中之最有效使用原則，下列敘述何者錯誤？","o":["具有良好意識及通常之使用能力者","在合法、實質可能、正當合理、財務可行前提下者","所作得以獲致最高利益之使用","係消費者主觀效用上"],"a":3},{"id":"106v37","year":106,"cat":"不動產估價概要","n":37,"q":"在不考慮時間、高風險或不便利等因素下，審慎者不會支付高於財貨或勞務成本之代價，以取得一相同滿意度的替代性財貨或勞務。是指何種不動產價格形成原則？","o":["預測原則","競爭原則","供需原則","替代原則"],"a":3},{"id":"106v38","year":106,"cat":"不動產估價概要","n":38,"q":"成本法中，指與勘估標的相同效用之建物，以現代建材標準、設計及配置，於價格日期建築所需之成本，是指何種成本？","o":["重置成本","重建成本","重蓋成本","替換成本"],"a":0},{"id":"106v39","year":106,"cat":"不動產估價概要","n":39,"q":"有關不動產價值的定義，下列何者正確？","o":["保險價值是不動產用於某種特定壽險用途所產生之價值","營運價值係指特定投資人評估該不動產投資所能產生的主觀價值","市場價值是不動產在營運過程中的既有價值，它是整個企業的一部分","公允價值係指能瞭解實情、有意願之當事人間公平交易所議定之資產交換或還清債務之數額"],"a":3},{"id":"106v40","year":106,"cat":"不動產估價概要","n":40,"q":"依不動產估價技術規則第55條第1款之規定，就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築之單價及人工工資，並加計管理費、稅捐、資本利息及利潤之估價方法稱為：","o":["淨計法","單位法","工程造價比較法","單位面積比較法"],"a":0},{"id":"106l1","year":106,"cat":"土地法與土地相關稅法概要","n":1,"q":"關於免於課徵之規定，下列規定何者錯誤？","o":["每年（期）地價稅，每戶稅額在新臺幣100元以下者，免予課徵","每期田賦實際造單賦額，每戶未滿一賦元者，免予課徵","土地增值稅稅額，在新臺幣100元以下者，免予課徵","房屋稅稅額，在新臺幣100元以下者，免予課徵"],"a":3},{"id":"106l2","year":106,"cat":"土地法與土地相關稅法概要","n":2,"q":"區段徵收之抵價地總面積，以徵收總面積百分之多少為原則？","o":["50","45","40","30"],"a":0},{"id":"106l3","year":106,"cat":"土地法與土地相關稅法概要","n":3,"q":"下列何種登記免納登記費？","o":["土地總登記","限制登記","繼承登記","共有物分割登記"],"a":1},{"id":"106l4","year":106,"cat":"土地法與土地相關稅法概要","n":4,"q":"區段徵收之土地，領回抵價地後第一次移轉，應課徵土地增值稅時，原地價應如何認定？","o":["以原土地所有權人完成移轉登記之日當期公告土地現值","以原土地所有權人權利取得之日當期公告土地現值","以原土地所有權人實際領回抵價地之地價","以原土地所有權人領得之補償地價總額"],"a":2},{"id":"106l5","year":106,"cat":"土地法與土地相關稅法概要","n":5,"q":"建築物於建造完成前，因何種原因而變更起造人名義，並取得使用執照者，應申報繳納契稅？","o":["繼承","贈與","設典","分割"],"a":1},{"id":"106l6","year":106,"cat":"土地法與土地相關稅法概要","n":6,"q":"依土地法第100條之規定，出租人因下列何項情形，得收回房屋？","o":["承租人積欠租金額，除擔保金抵償外，達1個月","承租人損壞出租人之房屋或附著財物，為相當之賠償時","出租人收回自住或重新建築時","承租人以房屋供合於法令之使用時"],"a":2},{"id":"106l7","year":106,"cat":"土地法與土地相關稅法概要","n":7,"q":"依105年1月1日起實施的房地合一所得稅制規定，因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在2年以下之房屋、土地者，其稅率為何？","o":["45%","35%","20%","15%"],"a":2},{"id":"106l8","year":106,"cat":"土地法與土地相關稅法概要","n":8,"q":"下列有關都市計畫主要計畫之擬定及核定程序規定，何者錯誤？","o":["主要計畫擬定後，應先送由該管政府或鄉、鎮、縣轄市都市計畫委員會審議","縣政府所在地及縣轄市之主要計畫由內政部核定","地方政府於接到主要計畫核定公文之日起30日內，應將主要計畫書、圖發布實施","主要計畫經該管政府都市計畫委員會審議後，應公開展覽30天及舉行說明會"],"a":3},{"id":"106l9","year":106,"cat":"土地法與土地相關稅法概要","n":9,"q":"依土地法規定，公有土地之撥用程序為何？","o":["各級政府機關需用公有土地時，應商同該管直轄市或縣（市）民意機關層請行政院核准撥用","各級政府機關需用公有土地時，應商同該管直轄市或縣（市）政府層請行政院核准撥用","各級政府機關需用公有土地時，應商同該管直轄市或縣（市）民意機關層請內政部核准撥用","各級政府機關需用公有土地時，應商同該管直轄市或縣（市）政府層請內政部核准撥用"],"a":1},{"id":"106l10","year":106,"cat":"土地法與土地相關稅法概要","n":10,"q":"下列何者不符合申請自用住宅用地之土地增值稅稅率規定？","o":["出售前1年內，未營業使用或出租","都市土地面積未超過3公畝部分或非都市土地面積未超過7公畝部分","土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率者，以一處為限","土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記"],"a":2},{"id":"106l11","year":106,"cat":"土地法與土地相關稅法概要","n":11,"q":"下列何種情形免徵契稅？","o":["以遷移、補償等變相方式支付產價，取得不動產所有權者","依法領買或標購公產及向法院標購拍賣之不動產者","開徵土地增值稅區域之土地","以不動產為信託財產，受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時"],"a":2},{"id":"106l12","year":106,"cat":"土地法與土地相關稅法概要","n":12,"q":"下列何者是土地增值稅的課稅基礎？","o":["累進起點地價","公告土地現值","土地漲價總數額","申報地價"],"a":2},{"id":"106l14","year":106,"cat":"土地法與土地相關稅法概要","n":14,"q":"下列有關外國人取得我國土地之規定，何者正確？","o":["外國人依土地法規定取得土地時，應檢附相關文件，申請內政部核准","農、林、漁、牧用地不得移轉、設定負擔或租賃於外國人","外國人依土地法規定取得之土地，其面積及所在地點，應受該管直轄市或縣（市）政府依法所定之限制","外國人為有助於國內重大建設、整體經濟或農牧經營之投資所取得之土地，應先經行政院核准"],"a":2},{"id":"106l15","year":106,"cat":"土地法與土地相關稅法概要","n":15,"q":"個人及營利事業出售依農業發展條例申請興建的農舍，應如何計徵所得稅？","o":["依104年12月31日前實施之舊制，僅就土地部分計算財產交易所得，課徵綜合所得稅","依104年12月31日前實施之舊制，僅就房屋部分計算財產交易所得，課徵綜合所得稅","依105年1月1日起實施之新制，房屋、土地均應按實價計算交易所得課稅","不論新、舊制，均免徵所得稅"],"a":1},{"id":"106l16","year":106,"cat":"土地法與土地相關稅法概要","n":16,"q":"下列有關契稅之申報起算日規定，何者錯誤？","o":["不動產移轉發生糾紛時，其申報契稅之起算日期，應以法院判決確定日為準","向政府機關標購或領買公產，以政府機關核發產權移轉證明書之日為申報起算日","向法院標購拍賣之不動產，以法院發給權利移轉證明書之日為申報起算日","不動產分割時，以其完成移轉登記之日為申報起算日"],"a":3},{"id":"106l17","year":106,"cat":"土地法與土地相關稅法概要","n":17,"q":"下列何者非申請自住房屋稅稅率之要件？","o":["土地所有權人或其配偶、直系親屬於房屋所在地辦竣戶籍登記","房屋無出租使用","供本人、配偶或直系親屬實際居住使用","本人、配偶及未成年子女全國合計3戶以內"],"a":0},{"id":"106l18","year":106,"cat":"土地法與土地相關稅法概要","n":18,"q":"甲之土地於106年10月1日贈與並移轉登記予乙，請問106年期地價稅之納稅義務人為何？","o":["甲","乙","甲乙協議","甲乙依持有月數分別負擔"],"a":0},{"id":"106l19","year":106,"cat":"土地法與土地相關稅法概要","n":19,"q":"甲之土地、房屋於106年7月1日設定典權並完成移轉登記予乙。下列有關納稅義務人之規定，何者錯誤？","o":["當年度地價稅之納稅義務人為甲","107年期房屋稅之納稅義務人為乙","典權契稅之納稅義務人為乙","土地增值稅之納稅義務人為甲"],"a":0},{"id":"106l20","year":106,"cat":"土地法與土地相關稅法概要","n":20,"q":"甲出售市價2,000萬元之房屋連同基地，出售時土地公告現值總額為1,000萬元，房屋課稅現值為300萬元，繳納土地增值稅100萬元。如果甲符合自用住宅用地之規定，請問甲至少應買多少錢之房屋土地才能申請退還土地增值稅100萬元？","o":["不問市價，只要新購土地之公告土地現值大於900萬元","不問市價，只要新購土地之公告土地現值大於1,000萬元","新購之房屋現值大於300萬元，房屋連同基地之市價大於2,000萬元","新購房屋連同基地之市價大於2,000萬元"],"a":1},{"id":"106l22","year":106,"cat":"土地法與土地相關稅法概要","n":22,"q":"被徵收之土地，有下列何種情形時，原土地所有權人得於徵收公告之日起20年內，向該管直轄市或縣（市）主管機關申請照原徵收補償價額收回其土地？","o":["徵收補償費發給完竣屆滿2年，未依徵收計畫開始使用者","徵收土地之殘餘部分面積過小或形勢不整，致不能為相當之使用者","未依核准徵收原定興辦事業使用者","依原徵收計畫開始使用後未滿6年，不繼續依原徵收計畫使用者"],"a":2},{"id":"106l24","year":106,"cat":"土地法與土地相關稅法概要","n":24,"q":"下列有關違反區域計畫管制使用土地者之處罰規定，何者錯誤？","o":["由該管直轄市、縣（市）政府處新臺幣6萬元以上30萬元以下罰鍰","經限期變更使用、停止使用或拆除地上物恢復原狀而不遵從者，得按次處罰","經限期變更使用而不遵從者，並得停止供水、供電、封閉、強制拆除或採取其他恢復原狀之措施","不依限變更土地使用者，除依強制執行法辦理外，並得處6個月以下有期徒刑或拘役"],"a":3},{"id":"106l25","year":106,"cat":"土地法與土地相關稅法概要","n":25,"q":"下列何者非區域計畫法規定區域計畫得隨時檢討變更之原因？","o":["發生或避免重大災害","興辦重大開發或建設事業","為適應國防或經濟發展之需要","區域建設推行委員會之建議"],"a":2},{"id":"106l27","year":106,"cat":"土地法與土地相關稅法概要","n":27,"q":"依都市計畫法第22條規定，下列何者非細部計畫應以細部計畫書及細部計畫圖應表明之事項？","o":["名勝、古蹟及具有紀念性或藝術價值應予保存之建築","居住密度及容納人口","土地使用分區管制","道路系統"],"a":0},{"id":"106l28","year":106,"cat":"土地法與土地相關稅法概要","n":28,"q":"重新實施地籍測量時，已依法設立界標之土地所有權人，於重測結果公告後認為測量結果有錯誤者，應如何辦理？","o":["土地所有權人得於公告期間內，向該管地政機關繳納複丈費，聲請複丈","土地所有權人得於公告期滿後，向該管地政機關申請重新實施地籍測量","應由該管地政機關予以調處，不服調處者，應於接到調處通知後15日內，向司法機關訴請處理","應由該管地政機關予以調處，不服調處者，應於接到調處通知後15日內，循行政救濟程序辦理"],"a":0},{"id":"106l30","year":106,"cat":"土地法與土地相關稅法概要","n":30,"q":"依土地法第103條規定，租用建築房屋之基地，非因下列何種情形，出租人不得收回？","o":["出租人收回自住或重新建築時","承租人違反租賃契約時","承租人積欠租金額，除擔保金抵償外，達2個月以上時","承租人損壞出租人之房屋或附著財物，而不為相當之賠償時"],"a":1},{"id":"106l31","year":106,"cat":"土地法與土地相關稅法概要","n":31,"q":"關於房地交易課徵所得稅之稅率規定，下列敘述何者錯誤？","o":["個人持有房屋、土地之期間在1年以內者，稅率為45%","個人持有房屋、土地之期間超過1年，未逾2年者，稅率為35%","個人持有房屋、土地之期間超過2年，未逾10年者，稅率為25%","個人持有房屋、土地之期間超過10年者，稅率為15%"],"a":2},{"id":"106l32","year":106,"cat":"土地法與土地相關稅法概要","n":32,"q":"依契稅條例之規定，契稅之課稅基礎是？","o":["實價","市價","房價","契價"],"a":3},{"id":"106l33","year":106,"cat":"土地法與土地相關稅法概要","n":33,"q":"土地所有權人曾使用自用住宅用地優惠稅率後，再出售其自用住宅用地，符合下列何項規定，為不受一次優惠稅率限制條件之一：","o":["出售都市土地面積未超過3公畝部分或非都市土地面積未超過7公畝部分","出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋","出售前持有該土地5年以上","土地所有權人或其配偶、未成年子女於土地出售前，在該地設有戶籍且持有該自用住宅連續滿5年"],"a":1},{"id":"106l34","year":106,"cat":"土地法與土地相關稅法概要","n":34,"q":"下列敘述之地價稅稅率，何者錯誤？","o":["自用住宅用地之地價稅稅率是2‰","依都市計畫法規定設置供公眾使用之停車場用地之地價稅稅率是10‰","公有非公用土地之地價稅稅率是10‰","都市計畫公共設施保留地，在保留期間仍為建築使用者，地價稅稅率是10‰"],"a":3},{"id":"106l35","year":106,"cat":"土地法與土地相關稅法概要","n":35,"q":"山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地類別之前，適用那項用地之管制？","o":["林業用地","遊憩用地","生態保護用地","國土保安用地"],"a":0},{"id":"106l36","year":106,"cat":"土地法與土地相關稅法概要","n":36,"q":"依平均地權條例之規定，土地買賣未辦竣權利移轉登記，承買人再行出售該土地時，處應納登記費多少倍以下之罰鍰？","o":["5倍","10倍","15倍","20倍"],"a":3},{"id":"106l37","year":106,"cat":"土地法與土地相關稅法概要","n":37,"q":"都市計畫發布實施後，應依何法之規定，實施建築管理？","o":["建築法","建築技術規則","建築師法","建築管理規則"],"a":0},{"id":"106l38","year":106,"cat":"土地法與土地相關稅法概要","n":38,"q":"依土地法之規定，聲請為土地權利變更登記，應檢附什麼文件？","o":["原發土地所有權狀及地段圖","原發土地所有權狀及地段圖或土地他項權利證明書","原發土地所有權狀及地段圖及土地他項權利證明書","原發土地所有權狀或地段圖及土地他項權利證明書"],"a":1},{"id":"106l40","year":106,"cat":"土地法與土地相關稅法概要","n":40,"q":"甲105年6月買入A房地，購入成本1,300萬元，於106年2月以2,000萬元出售A房地時，繳納土地增值稅10萬元（土地漲價總數額為100萬元），因取得、改良及移轉而支付的費用50萬元，其應納交易所得稅若干？","o":["1,925,000元","2,240,000元","2,475,000元","2,880,000元"],"a":2},{"id":"106r1","year":106,"cat":"不動產經紀相關法規概要","n":1,"q":"依不動產經紀業管理條例規定，經紀人員違反下列何者應予停止執行業務處分？","o":["收取差價或其他報酬","未自己執行仲介或代銷業務，且未經所屬經紀業同意者","未於不動產出租、出售委託契約書上簽章","在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說"],"a":0},{"id":"106r4","year":106,"cat":"不動產經紀相關法規概要","n":4,"q":"下列何者非為不動產說明書不得記載事項？","o":["不得約定拋棄說明書審閱期間","不得記載本說明書內容僅供參考","不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞","不得記載房價有上漲空間或預測房價上漲之情形"],"a":0},{"id":"106r5","year":106,"cat":"不動產經紀相關法規概要","n":5,"q":"依不動產經紀業管理條例規定，下列關於條例用辭定義之敘述何者正確？","o":["成屋：指領有建造執照，或於實施建築管理前建造完成之建築物","預售屋：指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物","經紀業：指依不動產經紀業管理條例規定從事買賣、互易、租賃之居間或代理業務者","營業處所：指經紀業經營仲介或代銷業務之店面、辦公室或非常態之固定場所"],"a":3},{"id":"106r6","year":106,"cat":"不動產經紀相關法規概要","n":6,"q":"不動產買賣交易實價資訊之登錄，應於不動產簽訂買賣契約辦竣所有權移轉登記後，何時向主管機關申報登錄成交案件實際資訊？","o":["30日內","20日內","10日內","即時"],"a":0},{"id":"106r7","year":106,"cat":"不動產經紀相關法規概要","n":7,"q":"依不動產經紀業管理條例規定，經紀業應於經紀人到職之日起幾日內，造具名冊報請所在地主管機關層報中央主管機關備查？","o":["日","日","日","日"],"a":2},{"id":"106r8","year":106,"cat":"不動產經紀相關法規概要","n":8,"q":"依不動產經紀業管理條例規定，經營仲介業務者未揭示報酬標準及收取方式於營業處所明顯之處者，應如何懲處？","o":["經主管機關限期改正而未改正者，處新臺幣3萬元以上15萬元以下罰鍰","逕處新臺幣3萬元以上15萬元以下罰鍰","經主管機關限期改正而未改正者，處新臺幣6萬元以上30萬元以下罰鍰","逕處新臺幣6萬元以上30萬元以下罰鍰"],"a":0},{"id":"106r9","year":106,"cat":"不動產經紀相關法規概要","n":9,"q":"不動產經紀業管理條例所稱主管機關，下列敘述何者錯誤？","o":["內政部營建署","內政部","直轄市政府地政處","縣（市）政府"],"a":0},{"id":"106r11","year":106,"cat":"不動產經紀相關法規概要","n":11,"q":"依不動產經紀業管理條例規定，經紀業或經紀人員不得收取差價或其他報酬。若有違反，則應如何處置？","o":["返還支付人已收取之差價或其他報酬","加計利息後返還支付人已收取之差價或其他報酬","加計利息後加倍返還支付人已收取之差價或其他報酬","加計利息後返還支付人已收取之差價或其他報酬，並負損害賠償責任"],"a":2},{"id":"106r12","year":106,"cat":"不動產經紀相關法規概要","n":12,"q":"不動產經紀人員執行仲介或代銷業務時，因過失致交易當事人受損害者，不動產經紀業者其賠償責任，下列敘述何者正確？","o":["由不動產經紀人員單獨負賠償責任","由不動產經紀業單獨負賠償責任","由不動產經紀業應與經紀人員負連帶賠償責任","不動產經紀業以有可歸責事由為限，始負連帶賠償責任"],"a":2},{"id":"106r13","year":106,"cat":"不動產經紀相關法規概要","n":13,"q":"依公平交易法規定，事業有與他事業經常共同經營或受他事業委託經營之情形者，稱為下列何者？","o":["聯合","結合","獨占","寡占"],"a":1},{"id":"106r14","year":106,"cat":"不動產經紀相關法規概要","n":14,"q":"不動產經紀業者，共同約束開發物件必須與委託人簽訂專任委託契約，致使不動產經紀業者及委託人選擇委託契約型態之自由受到限制，可能違反公平交易法之何種行為？","o":["第20條之妨害公平競爭行為","第15條之聯合行為","第11條之結合行為","第9條之獨占行為"],"a":1},{"id":"106r16","year":106,"cat":"不動產經紀相關法規概要","n":16,"q":"甲向乙汽車公司購買限量跑車一台，在交車前夕，甲接獲汽車公司通知必須加購「跑車保險」，但甲向乙公司表示，可自行安排保險事宜無須加保，但遭乙公司拒絕，試問，乙汽車公司最有可能違反公平交易法中何種規定？","o":["聯合行為","不正當限制交易相對人與其交易行為","差別待遇","不實廣告"],"a":1},{"id":"106r18","year":106,"cat":"不動產經紀相關法規概要","n":18,"q":"依公平交易法第20條之規定，妨害公平競爭之行為不包括下列何者？","o":["無正當理由，對他事業給予差別待遇之行為","以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為","以脅迫、利誘或其他不正當之方法，使競爭者之交易相對人與自己交易之行為","以不正當限制交易相對人之事業活動為條件，而與其交易之行為"],"a":2},{"id":"106r19","year":106,"cat":"不動產經紀相關法規概要","n":19,"q":"甲建設公司請乙廣告公司針對新推出之建案，宣傳其公共設施包含三溫暖及健身房，並請知名女星丙推薦該建案。然該建案依使用執照登載所示，廣告中宣傳該公共設施位置之使用用途為「梯間、水箱及機械室」且未辦理變更使用執照。使該建案於日後交屋時，消費者並未能獲得或合法享有廣告所示之公共設施空間使用。根據公平交易法，下列敘述何者錯誤？","o":["主管機關得限期令甲停止或改正其行為，並得處新臺幣2,500萬元以下罰鍰","甲應負損害賠償責任","乙於明知該宣傳內容虛偽不實時，須負連帶損害賠償責任","丙如非明知或非可得而知該宣傳內容虛偽不實時，僅需就報酬十倍內負損害賠償責任"],"a":3},{"id":"106r20","year":106,"cat":"不動產經紀相關法規概要","n":20,"q":"不動產開發業者或不動產經紀業者銷售預售屋時，要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱，可能違反公平交易法之何種行為？","o":["第20條之妨害公平競爭行為","第25條之欺罔或顯失公平行為","第21條之虛偽不實廣告行為","第15條之聯合行為"],"a":1},{"id":"106r21","year":106,"cat":"不動產經紀相關法規概要","n":21,"q":"下列何者非反托拉斯法基金之用途？","o":["辦理競爭法之教育及宣傳","補助本法與涉及檢舉獎金訴訟案件相關費用之支出","推動國際競爭法執法機關之合作","補助消費者因聯合行為而受之損害"],"a":3},{"id":"106r22","year":106,"cat":"不動產經紀相關法規概要","n":22,"q":"依公平交易法規定，下列關於期間之敘述何者錯誤？","o":["主管機關對於違反獨占、聯合行為之裁處權，因5年期間經過而消滅","損害賠償請求權，自請求權人知有行為及賠償義務人時起，2年間不行使而消滅","損害賠償請求權，自行為時起，逾10年不行使而消滅","聯合行為許可應附期限，其期限不得逾3年。以書面申請延展，其延展期限每次不得逾3年"],"a":3},{"id":"106r23","year":106,"cat":"不動產經紀相關法規概要","n":23,"q":"依消費者保護法規定，關於消費爭議之處理，當事人對於調解委員依職權提出之解決方案若有異議，最遲得於送達後幾日內提出？","o":["日","日","日","日"],"a":1},{"id":"106r25","year":106,"cat":"不動產經紀相關法規概要","n":25,"q":"輸入之商品或服務，須以何種方式為之？","o":["應附中文標示","得附中文標示","無須附中文標示","應附中文及外文標示"],"a":0},{"id":"106r26","year":106,"cat":"不動產經紀相關法規概要","n":26,"q":"下列何者不是消費者保護法第12條所規定推定定型化契約條款顯失公平之情形？","o":["契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者","條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者","違反平等互惠原則者","違反誠信原則者"],"a":3},{"id":"106r27","year":106,"cat":"不動產經紀相關法規概要","n":27,"q":"下列何者非屬於內政部依消費者保護法之規定所訂定之定型化契約應記載不得記載事項類型？","o":["預售屋買賣定型化契約應記載及不得記載事項","成屋買賣定型化契約應記載及不得記載事項","不動產委託銷售定型化契約應記載及不得記載事項","停車位租賃定型化契約應記載及不得記載事項"],"a":3},{"id":"106r28","year":106,"cat":"不動產經紀相關法規概要","n":28,"q":"依消費者保護法規定，企業經營者對於消費者之申訴，應於申訴之日起幾日內妥適處理？","o":["日","日","日","日"],"a":2},{"id":"106r29","year":106,"cat":"不動產經紀相關法規概要","n":29,"q":"依消費者保護法規定，企業經營者對消費者保證商品或服務品質所出具之書面保證書，應載明事項不包括下列何者？","o":["商品或服務之名稱","保證之內容","製造日期","製造商之名稱、地址"],"a":2},{"id":"106r30","year":106,"cat":"不動產經紀相關法規概要","n":30,"q":"依消費者保護法規定，關於定型化契約之審閱期間，下列敘述何者錯誤？","o":["應有30日以內之合理審閱期間","企業經營者以定型化契約條款使消費者拋棄合理審閱期權利者，無效","違反合理審閱期規定者，該條款無效","中央主管機關得選擇特定行業，參酌定型化契約條款之重要性等事項，公告定型化契約之審閱期間"],"a":2},{"id":"106r32","year":106,"cat":"不動產經紀相關法規概要","n":32,"q":"定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分？","o":["效力未定","無效","構成契約之內容","不得撤銷"],"a":1},{"id":"106r33","year":106,"cat":"不動產經紀相關法規概要","n":33,"q":"公寓大廈共用部分不得獨立使用供作專有部分，其為下列何者非不得為約定專用部分？","o":["公寓大廈本身所占之地面","社區內各巷道、防火巷弄","非連通數個專有部分之樓梯或走廊","公寓大廈之主要樑柱之構造"],"a":2},{"id":"106r35","year":106,"cat":"不動產經紀相關法規概要","n":35,"q":"下列有關公寓大廈管理之敘述，何者錯誤？","o":["住戶雖有繳管理費用，但仍不得任意棄置垃圾、惡臭物質","住戶不得於私設通路、防火間隔、防火巷弄等處所堆置雜物","住戶於開放空間及退縮空地，經管理委員會核准後，在核准範圍內得自行設置廣告物","住戶飼養動物時，應遵守規定，不得妨礙公共衛生、公共安寧以及公共安全"],"a":2},{"id":"106r36","year":106,"cat":"不動產經紀相關法規概要","n":36,"q":"專有部分之樓地板維修時，原則上維護費用應由誰負擔？","o":["樓地板上下方區分所有權人，共同負擔","全體區分所有權人，共同負擔","由樓地板上方之區分所有權人負擔","由公寓大廈公共基金負擔"],"a":0},{"id":"106r37","year":106,"cat":"不動產經紀相關法規概要","n":37,"q":"公寓大廈住戶積欠應繳納之公共基金或應分擔之費用，下列何者情形管理委員會得訴請法院命其給付？","o":["已逾二期，經定相當期間催告仍不給付者，得向法院起訴請求","雖金額尚未相當，仍可向法院起訴請求","只要一逾期未繳，即可向法院起訴請求","視住戶態度決定催討與否或由管理委員會自行吸收"],"a":0},{"id":"106r38","year":106,"cat":"不動產經紀相關法規概要","n":38,"q":"依公寓大廈管理條例規定，召開區分所有權人會議之通知，應由召集人於開會幾日前以書面載明開會內容，通知各區分所有權人？","o":["日","日","日","日"],"a":1},{"id":"105m1","year":105,"cat":"民法概要","n":1,"q":"有關民法的法源，民法第1條規定「民事，法律所未規定者，依習慣；無習慣者，依法理。」下列敘述何者正確？","o":["民間「洗門風」的習慣，即是該條所稱之「習慣」","此之「習慣」，係專指習慣法而言","憲法關於人民之權利義務的規定，是該條所稱之法律","條約是規範國家間權利義務之協定，絕非是民法法源之一"],"a":1},{"id":"105m2","year":105,"cat":"民法概要","n":2,"q":"依民法之規定，下列何種非屬法定要式行為？","o":["兩願離婚","買賣契約","所有權移轉","社團章程之訂定"],"a":1},{"id":"105m3","year":105,"cat":"民法概要","n":3,"q":"有關財產權之描述，下列敘述何者正確？","o":["債權是請求權，所以只能約定由特定人請求另一特定人為一定作為，但不能約定不作為","債權具有相對性，所以當出賣人一屋先後兩賣時，前後買賣契約皆為有效","基於契約自由原則，當事人可以自由創設物權種類，不受限制","債權給付之內容，以有財產價格者為限"],"a":1},{"id":"105m4","year":105,"cat":"民法概要","n":4,"q":"有關人格權之敘述，下列何者錯誤？","o":["自由不得限制","行為能力不得拋棄","人格權具有專屬性","當人格權受侵害時，得請求法院除去其侵害"],"a":0},{"id":"105m5","year":105,"cat":"民法概要","n":5,"q":"30歲的甲患有精神疾病，並受監護宣告。某日，甲於精神狀況良好時，單獨到乙電信公司購買手機一支。試問甲乙間之買賣契約，其效力為何？","o":["有效","無效","得撤銷","效力未定"],"a":1},{"id":"105m6","year":105,"cat":"民法概要","n":6,"q":"甲誤認為好友所贈與之戒指，乃鍍金之假鑽戒，遂將該戒指以5百元之價格賣給乙，並已交付。甲事後得知此乃真金真鑽之戒指，且價值5萬元。有關此法律行為之敘述，下列何者正確？","o":["甲乙間之買賣契約無效，但物權行為有效","甲乙間之買賣契約有效，但物權行為無效","甲乙間之買賣契約得撤銷，但物權行為無效","甲乙間之買賣契約得撤銷，但物權行為有效"],"a":3},{"id":"105m7","year":105,"cat":"民法概要","n":7,"q":"有關法律行為之標的，下列敘述何者正確？","o":["甲乙約定以火星上岩石為贈與標的物，該契約有效","甲乙約定故宮翠玉白菜為買賣標的物，該契約有效","甲乙約定甲需於1日內完成環島健走行程，該契約有效","甲乙婚前協議約定，婚後任一方若有出軌行為，必須支付對方新臺幣100萬元賠償費，該契約有效"],"a":3},{"id":"105m8","year":105,"cat":"民法概要","n":8,"q":"甲為限制行為能力人，當其為法律行為時，下列何種行為無效？","o":["甲未得母之允許，於父死後3個月內，具狀向法院為拋棄其繼承權之意思表示","甲以詐術佯稱自己已成年，向乙購買機車一輛","甲未得父母之同意，擅自接收同學拋棄的筆電一台","甲未得父母之同意，擅自至福利社購買鉛筆"],"a":0},{"id":"105m9","year":105,"cat":"民法概要","n":9,"q":"甲告知乙，若乙願意出國比賽，不管有無得名次，即贈與乙200萬元。試問甲乙間之贈與契約的附款為何？","o":["期限","條件","負擔","約款"],"a":1},{"id":"105m10","year":105,"cat":"民法概要","n":10,"q":"甲於出國遊玩期間，適逢颱風來襲，甲家的大門因此破損，門戶洞開。鄰居乙擔心甲家遭遇盜賊，乃好心召來工匠為其修繕，支出8千元。試問乙得依下列何種法律關係向甲請求返還8千元？","o":["無因管理","侵權行為","不當得利","債務不履行"],"a":0},{"id":"105m11","year":105,"cat":"民法概要","n":11,"q":"有關契約之敘述，下列何者正確？","o":["契約為事實行為的一種","契約得因要約交錯之方式成立","契約皆須以書面方式為之，方得以成立","基於契約自由原則，醫生得拒絕醫治病情危急的情敵"],"a":1},{"id":"105m13","year":105,"cat":"民法概要","n":13,"q":"有關不當得利所應返還之客體，下列何者錯誤？","o":["原物所生之孳息","受領之原物或原權利","原物因受領人特殊能力導致之增值","原物毀損後，受益時之價額"],"a":2},{"id":"105m14","year":105,"cat":"民法概要","n":14,"q":"甲欲向乙租屋3年，雙方僅用通訊軟體Line互相協商，乙已於對話中允諾，但後來丙出更高租金，於是乙改將該屋出租給丙並交付之，後來丙得乙之同意將該屋再出租給丁，某日丁因大意未關爐火將該屋燒毀，下列敘述何者正確？","o":["乙可以向丁主張侵權行為責任","甲可主張乙丙之租賃契約未以書面簽訂，因此無效","丙可以向丁主張侵權行為責任","甲可以向丙主張有優先締約權，因此乙丙之租賃契約對甲係屬無效"],"a":0},{"id":"105m15","year":105,"cat":"民法概要","n":15,"q":"依侵權行為請求損害賠償之說明，下列敘述何者正確？","o":["純粹經濟上之損失亦屬於一種損害，與權利受損一樣，得依民法第184條第1項前段主張之","債權亦屬於一種財產權，被侵害時，祗得依民法第184條第1項前段主張，而不得依同條項後段主張之","我國侵權行為之保護客體僅限於權利，未及於利益","故意以背於善良風俗之方法加損害於他人之利益，受害人亦得依侵權行為主張之"],"a":3},{"id":"105m16","year":105,"cat":"民法概要","n":16,"q":"有關民法第250條規定之違約金類型有「損害賠償總額預定違約金」與「懲罰性違約金」兩種，下列敘述何者正確？","o":["「損害賠償總額預定違約金」，倘若債務人有債務不履行發生，惟債權人所受實際損害遠低於約定之額度時，債權人即不得請求此一違約金金額","「懲罰性違約金」，只要債務人有債務不履行發生時，即便債權人未因此而受損害，債權人仍得請求此一違約金金額","「損害賠償總額預定違約金」，債務人有債務不履行發生，導致債權人受損害時，債權人除此一違約金外，亦得請求其他損害賠償金額","「懲罰性違約金」，債務人有債務不履行發生，導致債權人受損害時，債權人除此一違約金外，不得請求其他損害賠償金額"],"a":1},{"id":"105m17","year":105,"cat":"民法概要","n":17,"q":"若買賣標的物為特定物時，買受人不得請求下列那一種物的瑕疵擔保之法定效果？","o":["減價","解約","損害賠償","另行交付他物"],"a":3},{"id":"105m19","year":105,"cat":"民法概要","n":19,"q":"有關贈與契約之敘述，下列何者正確？","o":["贈與契約一旦成立後，贈與人不得任意撤銷之","贈與契約為要式契約，因此必須作成贈與契約書","贈與屬於恩惠行為，故成立贈與契約無須受贈人之同意","因贈與契約為無償契約，故原則上贈與人不負瑕疵擔保責任"],"a":3},{"id":"105m20","year":105,"cat":"民法概要","n":20,"q":"依民法之規定，承租人因下列何種情形致失火而使租賃物毀損、滅失者，應對出租人負損害賠償責任？","o":["重大過失","不可抗力","具體輕過失","抽象輕過失"],"a":0},{"id":"105m21","year":105,"cat":"民法概要","n":21,"q":"有關物權之優先性，在同一標的物下，下列敘述何者正確？","o":["當所有權與定限物權併存時，所有權之效力依舊優先於定限物權","當內容或性質相衝突之物權併存時，二者效力均等","先成立用益物權，再設定擔保物權時，該擔保物權不得對抗該已成立之用益物權","先成立擔保物權，再設定用益物權時，該擔保物權人無論如何皆可主張塗銷該用益物權"],"a":2},{"id":"105m22","year":105,"cat":"民法概要","n":22,"q":"民法第796條規定，土地所有人建築房屋非因故意或重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋。假設甲僅有抽象輕過失，且乙知其越界未即提出異議，下列敘述何者正確？","o":["甲將自己之㕑廁建於鄰地所有人乙之部分土地上，甲可以主張㕑廁亦屬於該條之「建築房屋」，不得拆除","甲將房屋之全部建築在鄰地所有人乙之土地上，甲可以主張此符合「越界建築」之規定，不得拆除","甲之立體停車場越界建築在鄰地所有人乙之土地上，則鄰地所有人乙，可以主張停車場並非是該條之「建築房屋」而請求拆除","甲所建房屋整體之外，越界加建房屋，則鄰地所有人乙，可以請求拆除該加建之房屋"],"a":3},{"id":"105m23","year":105,"cat":"民法概要","n":23,"q":"有關地上權之敘述，下列何者正確？","o":["地上權乃為債權","地上權人必須支付地租","地上權之存續期間，有法定最長20年之限制","地上權人原則上得將其權利讓與他人或設定抵押權"],"a":3},{"id":"105m24","year":105,"cat":"民法概要","n":24,"q":"民法規定，區分地上權人得與其設定之土地上下有使用、收益權利之人，約定相互間使用收益之限制。其約定未經土地所有人同意者，於使用收益權消滅時，土地所有人不受該約定之拘束。此之「其設定之土地上下有使用、收益權利之人」不包含下列何種？","o":["普通地上權人","不動產役權人","農育權人","典權人"],"a":3},{"id":"105m25","year":105,"cat":"民法概要","n":25,"q":"以他人不動產供自己不動產通行、汲水、採光、眺望、電信或以其他特定便宜之用者，稱為：","o":["農育權","抵押權","不動產役權","土地租賃權"],"a":2},{"id":"105m26","year":105,"cat":"民法概要","n":26,"q":"有關抵押權之特性，下列敘述何者錯誤？","o":["當不動產所有人設定抵押權後，其抵押權不因該不動產之物權讓與而受影響","抵押之不動產如經分割，其抵押權不因該不動產經分割或讓與一部而受影響","以抵押權擔保之債權，其抵押權不因該債權經分割或讓與一部而受影響","抵押權之獨立性在於其得由債權分離而為讓與，或為其他債權之擔保"],"a":3},{"id":"105m27","year":105,"cat":"民法概要","n":27,"q":"有關抵押權之實行，下列敘述何者正確？","o":["土地所有人於設定抵押權後，在抵押之土地上營造建築物者，抵押權人於必要時，得於強制執行程序中聲請法院將其建築物與土地併付拍賣，對於建築物之價金，無優先受清償之權","以建築物設定抵押權者，於法院拍賣抵押物時，其抵押物存在所必要之權利得讓與者，應併付拍賣。但抵押權人對於該權利賣得之價金，有優先受清償之權","設定抵押權時，土地及其土地上之建築物，同屬一人所有，而僅以土地為抵押者，於抵押物拍賣時，得聲請併付拍賣，就土地賣得之價金，有優先受清償之權","設定抵押權時，土地及其土地上之建築物，同屬一人所有，而以土地及建築物為抵押者，如經拍賣，其土地與建築物之拍定人各異時，視為已有地上權之設定，其地租法院須逕以判決定之"],"a":0},{"id":"105m28","year":105,"cat":"民法概要","n":28,"q":"乙將其所有汽車為甲設定動產質權，以為其對甲借款債務之擔保。該車並已交付甲之占有。下列那種情形，甲之動產質權並不消滅？","o":["丙仗義相助幫乙清償該債務","甲將該車返還給乙","甲喪失對該車之占有，於第3年始請求返還","該車被盜後，隔年再讓與給善意第三人，甲對該第三人行使回復請求權時"],"a":3},{"id":"105m29","year":105,"cat":"民法概要","n":29,"q":"有關惡意占有人與善意占有人，在損害賠償請求方面，下列敘述何者正確？","o":["善意占有人就占有物之滅失或毀損，如係不可歸責於自己之事由所致者，對於回復請求人僅以滅失或毀損所受之利益為限，負賠償之責","惡意占有人或無所有意思之占有人，就占有物之滅失或毀損，如係不可歸責於自己之事由所致者，對於回復請求人，負賠償之責","善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還。但已就占有物取得孳息者，不得請求償還通常必要費用","惡意占有人，因保存占有物所支出之必要費用，對於回復請求人，得依關於不當得利之規定，請求償還"],"a":2},{"id":"105m30","year":105,"cat":"民法概要","n":30,"q":"有關動產善意受讓要件之說明，下列敘述何者正確？","o":["讓與人與受讓人須完成讓與動產之交付行為，此之交付不包含觀念交付","受讓人出於善意且有抽象輕過失者，不受占有之保護","讓與人必須是無權代理","盜贓物為金錢時，被害人不得向善意占有人請求回復"],"a":3},{"id":"105m31","year":105,"cat":"民法概要","n":31,"q":"下列何者違反近親禁婚範圍之規定？","o":["甲先收養丙男，再收養丁女，丙與丁之結婚","甲有一子乙，再收養一女丙，之後乙育有一子丁，丙育有一女戊，丁與戊之結婚","乙有一女丙，另外收養一女丁，戊有一子己，另外收養一子庚。未久，甲收養乙與戊，丙與己之結婚，丁與庚之結婚","甲與前妻育有一子乙，丙與前夫育有一女丁，甲與丙後來結婚，未久，乙與丁欲結婚"],"a":0},{"id":"105m32","year":105,"cat":"民法概要","n":32,"q":"下列何者非屬我國現行民法中所規定之約定財產制？","o":["統一財產制","分別財產制","一般共同財產制","勞力所得共同財產制"],"a":0},{"id":"105m33","year":105,"cat":"民法概要","n":33,"q":"有關夫妻財產制的規定，下列敘述何者正確？","o":["依民法規定，夫妻除可以選擇分別財產制及共同財產制外，亦得基於契約自由原則，選擇其他分配方式","夫妻選擇分別財產制，將來離婚時仍有剩餘財產分配請求權之適用","夫妻選擇共同財產制後，可以再變更為分別財產制，互相轉換並無次數上的限制","夫妻因未約定夫妻財產制而採用法定財產制時，將來就不得任意再變更"],"a":2},{"id":"105m34","year":105,"cat":"民法概要","n":34,"q":"有關法定夫妻財產制之敘述，下列何者錯誤？","o":["夫或妻各自管理、使用、收益及處分其財產","夫妻就其婚前財產及婚後財產，互負報告之義務","不論夫或妻之婚前財產或婚後財產，均屬夫或妻各自所有","夫或妻之婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產"],"a":1},{"id":"105m36","year":105,"cat":"民法概要","n":36,"q":"隱瞞已婚之乙女與甲同居數年後，某日生下丙隨即離甲而去，甲獨力扶養丙，俟丙19歲生日，甲對丙告知其生母為乙，當日丙因思母心切隨即趕赴乙家要求相認，相認時刻被乙女丈夫丁撞見，一切東窗事發，乙丁大吵。過了2年後，上述相關人等決心為此事作一了結。試問此刻以下何人有資格提起婚生否認之訴？","o":["甲","乙","丙","丁"],"a":2},{"id":"105m37","year":105,"cat":"民法概要","n":37,"q":"依我國民法之規定，當胎兒為繼承人時，他繼承人如未保留胎兒之應繼分而分割遺產者，其分割行為之效力如何？","o":["有效","無效","得撤銷","效力未定"],"a":1},{"id":"105m38","year":105,"cat":"民法概要","n":38,"q":"甲乙為夫妻育有二女丙與丁，甲為傳香火認識已婚之戊女，同居一年後生下己男，甲把己接回家中同住將其養育成人，但丙與己相處極為不睦，丙亦曾對己口出穢言且被判刑確定，某日丙與己再起爭執，己一時失手將丙刺成重傷，丁見狀，起身亦把己刺成重傷，丁與己嗣後雙雙被判重刑確定，乙為此人倫悲劇在眾人前以不堪字眼侮辱甲，甲亦默默承受，但隔日即因傷心過度辭世。試問本案中，何人對甲無繼承權？","o":["乙","丙","丁","己"],"a":3},{"id":"105m39","year":105,"cat":"民法概要","n":39,"q":"有關拋棄繼承之敘述，下列何者正確？","o":["向戶政機關為之","得以言詞或書面為之","於被繼承人死亡之時起3個月內為之","繼承之拋棄，溯及於繼承開始時發生效力"],"a":3},{"id":"105m40","year":105,"cat":"民法概要","n":40,"q":"下列那種情形，甲所立的遺囑為有效？","o":["甲6歲，經由其父母之代理而立之遺囑","甲15歲，預立遺囑後，得其父母之追認","甲10歲，但已得其父母之同意而立之遺囑","甲17歲，未得其父母之允許或承認而立之遺囑"],"a":3},{"id":"105v1","year":105,"cat":"不動產估價概要","n":1,"q":"依不動產估價技術規則之規定，公共設施用地及公共設施保留地之估價，以何種方法為原則？","o":["收益法","成本法","比較法","土地開發分析法"],"a":2},{"id":"105v2","year":105,"cat":"不動產估價概要","n":2,"q":"請問國內某大專院校擬購買鄰接學校之土地作為擴校之用，此以合併使用為目的之不動產買賣，係屬下列何種價格？","o":["正常價格","限定價格","特定價格","特殊價格"],"a":1},{"id":"105v3","year":105,"cat":"不動產估價概要","n":3,"q":"有關特殊價格的敘述，下列何者錯誤？","o":["總統府的估價是屬特殊價格","無法以貨幣金額表示","指對不具市場性之不動產所估計之價值","宗教建築物的估價是屬特殊價格"],"a":1},{"id":"105v4","year":105,"cat":"不動產估價概要","n":4,"q":"於不動產估價作業程序中，下列何者不屬於「確定估價基本事項」的內容？","o":["估價方法","價格日期","價格種類及條件","估價目的"],"a":0},{"id":"105v5","year":105,"cat":"不動產估價概要","n":5,"q":"就住宅用地之估價而言，下列何者非屬影響價格水準之區域因素？","o":["公共設施、公益設施等配置狀態","噪音、空氣污染、土壤污染等公害發生之程度","臨接道路之寬度","離市中心之距離及交通設施狀態"],"a":2},{"id":"105v6","year":105,"cat":"不動產估價概要","n":6,"q":"不動產與其環境配合，以保持協調一致之利用，則其收益才能發揮最大化，例如在學校附近開設餐廳或書局等。此現象就不動產估價原則而言，是屬下列何者？","o":["貢獻原則","均衡原則","供需原則","適合原則"],"a":3},{"id":"105v7","year":105,"cat":"不動產估價概要","n":7,"q":"依不動產估價技術規則之規定，評估何種價格種類時，應同時估計其正常價格？","o":["限定價格","正常租金","限定租金","特定價格"],"a":3},{"id":"105v8","year":105,"cat":"不動產估價概要","n":8,"q":"不動產估價常用之比較法、成本法與收益法，其評價基礎為何？","o":["均衡原則","適合原則","替代原則","外部性原則"],"a":2},{"id":"105v10","year":105,"cat":"不動產估價概要","n":10,"q":"客觀淨收益之評估，應符合何種估價原則，以作為評估之基準？","o":["最有效使用原則","替代原則","適合原則","外部性原則"],"a":0},{"id":"105v11","year":105,"cat":"不動產估價概要","n":11,"q":"臺灣老年人口的比例正大幅增加，高齡化社會已成為重大議題，此屬於何種影響價格因素？","o":["一般因素","區域因素","個別因素","特殊因素"],"a":0},{"id":"105v12","year":105,"cat":"不動產估價概要","n":12,"q":"某塊素地為都市計畫工業區土地，若以其變更為住宅區的前提來估價，請問評估之價格種類為：","o":["正常價格","限定價格","特定價格","特殊價格"],"a":2},{"id":"105v13","year":105,"cat":"不動產估價概要","n":13,"q":"地政機關辦理公告土地現值之估價方法，其主要之法令依據為：","o":["地價調查估計規則","不動產估價技術規則","土地徵收補償市價查估辦法","土地建築改良物估價規則"],"a":0},{"id":"105v14","year":105,"cat":"不動產估價概要","n":14,"q":"有關樓層別效用比率的敘述，下列何者錯誤？","o":["因建物各樓層之效用不同，造成價格有所差異，因此有不同的樓層別效用比率","樓層別效用比率是將各層樓之總價以百分率方式來表示","樓層別效用比率可能大於100%或小於100%","樓層別效用比率並非固定不變"],"a":1},{"id":"105v16","year":105,"cat":"不動產估價概要","n":16,"q":"在成本法中，使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，稱為下列何者？","o":["新建成本","建造成本","重置成本","重建成本"],"a":3},{"id":"105v17","year":105,"cat":"不動產估價概要","n":17,"q":"依不動產估價技術規則之規定，以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之何種租金為計算原則？","o":["實質租金","經濟租金","支付租金","契約租金"],"a":3},{"id":"105v18","year":105,"cat":"不動產估價概要","n":18,"q":"因同種類不動產，由於技術革新、設計變化等，致使勘估標的落伍了，由此發生之建物折舊減價，屬於下列何種折舊因素？","o":["物理性","外部性","功能性","經濟性"],"a":2},{"id":"105v19","year":105,"cat":"不動產估價概要","n":19,"q":"有關直接資本化法的敘述，下列何者錯誤？","o":["直接資本化法所求得之價格為收益價格","指勘估標的過去平均一年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","直接資本化法之收益資本化率可由加權平均資金成本法求取","直接資本化法之客觀淨收益應以勘估標的作最有效使用之客觀淨收益為基準，並參酌鄰近類似不動產在最有效使用情況下之收益推算之"],"a":1},{"id":"105v20","year":105,"cat":"不動產估價概要","n":20,"q":"有關租金估價的敘述，下列何者正確？","o":["續訂租約之租金屬正常租金","不動產租金估計，應視新訂租約與續訂租約分別為之","淨租金指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數","不動產租金估計，以估計勘估標的之支付租金為原則"],"a":1},{"id":"105v21","year":105,"cat":"不動產估價概要","n":21,"q":"有關建物殘餘價格率之敘述，下列何者錯誤？","o":["殘餘價格率是指建物於物理耐用年數屆滿後，其所賸餘之結構材料及內部設備仍能於市場上出售之價格占建物總成本之比率","建物之殘餘價格率應由不動產估價師公會全國聯合會公告","建物之殘餘價格率以不超過百分之十為原則","依殘餘價格率計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本"],"a":0},{"id":"105v22","year":105,"cat":"不動產估價概要","n":22,"q":"依不動產估價技術規則之規定，下列何者並非由不動產估價師公會全國聯合會公告？","o":["建物經濟耐用年數表","建築改良物標準單價表","營造或施工費標準表","廣告費、銷售費、管理費及稅捐之相關費率"],"a":1},{"id":"105v23","year":105,"cat":"不動產估價概要","n":23,"q":"有關房地估價之敘述，下列何者錯誤？","o":["實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用之現況估價，並敘明法定容積對估值之影響","附有違章建築之房地估價，其違建部分不予以評估","未達最有效使用狀態之房地估價，應先求取其最有效使用狀態之正常價格，再視其低度使用情況進行調整","建物已不具備使用價值，得將其基地視為素地估價。但應考量建物拆除成本予以調整之"],"a":0},{"id":"105v24","year":105,"cat":"不動產估價概要","n":24,"q":"有關比較法之敘述，下列何者錯誤？","o":["比較標的價格為基礎，經比較、分析及調整等，以推算勘估標的價格之方法","不動產估價師應採用五件以上比較標的","區域因素及個別因素進行價格調整時，其調整以百分率法為原則","以比較法所求得之價格為比較價格"],"a":1},{"id":"105v25","year":105,"cat":"不動產估價概要","n":25,"q":"有關市地重劃估價的敘述，下列何者錯誤？","o":["相關法令未明定重劃前後地價查估之價格日期","重劃前之地價應分別估計各宗土地地價及區段價","重劃後之地價應估計重劃後各路街之路線價或區段價","估計重劃前後地價應提地價評議委員會評定"],"a":1},{"id":"105v27","year":105,"cat":"不動產估價概要","n":27,"q":"有關不動產租金之估計，以估計勘估標的之何種租金為原則？","o":["契約租金","實質租金","支付租金","押租金"],"a":1},{"id":"105v28","year":105,"cat":"不動產估價概要","n":28,"q":"依不動產估價技術規則之規定，林地採成本法估價時，其總費用之計算，何者不是應考量之項目？","o":["造林費","營運費用","林地改良費","道路開挖費用"],"a":1},{"id":"105v29","year":105,"cat":"不動產估價概要","n":29,"q":"資本利息年利率為2%，土地價值：建物價值=6：4，開發年數3年，資本利息綜合利率為：","o":["2.4%","3.6%","4.8%","6%"],"a":2},{"id":"105v30","year":105,"cat":"不動產估價概要","n":30,"q":"不動產估價技術規則有關耐用年數之敘述，下列何者最為正確？","o":["建物折舊額計算應以經濟耐用年數為主","建物折舊額計算應以物理耐用年數為主","經濟耐用年數指建物因自然耗損或外力破壞至結構脆弱而不堪使用所經歷之年數","物理耐用年數指建物因功能或效益衰退至不值得使用所經歷之年數"],"a":0},{"id":"105v31","year":105,"cat":"不動產估價概要","n":31,"q":"依不動產估價技術規則之規定，下列何者非屬不動產估價師公會全國聯合會公告之項目？","o":["建物工程進度營造費用比例表","開發或建築利潤率","建造執照工程造價表","營造或施工費標準表"],"a":2},{"id":"105v32","year":105,"cat":"不動產估價概要","n":32,"q":"不動產估價技術規則有關廣告費、銷售費、管理費、稅捐及開發或建築利潤之規定，下列述敘何者正確？","o":["廣告費、銷售費等，於成本估價時必須計入","開發或建築利潤，可視勘估標的之性質，於成本估價時得不予計入","稅捐於成本估價時必須計入","管理費於成本估價時一律計入"],"a":1},{"id":"105v33","year":105,"cat":"不動產估價概要","n":33,"q":"某建物樓地板面積為100坪，重建每坪10萬元，若耐用年數為50年，殘值率為10%，目前已使用10年，採定額法折舊，請問該建物之現值為幾萬元？","o":["820","720","620","520"],"a":0},{"id":"105v34","year":105,"cat":"不動產估價概要","n":34,"q":"應用收益法進行不動產估價時，勘估標的總費用計算，不包括下列何者？","o":["地價稅","房屋稅","管理費","土地增值稅"],"a":3},{"id":"105v35","year":105,"cat":"不動產估價概要","n":35,"q":"下列何種估價方法，係以未來期望利益計算不動產價值？","o":["成本法","收益法","比較法","土地開發分析法"],"a":1},{"id":"105v36","year":105,"cat":"不動產估價概要","n":36,"q":"依不動產估價技術規則之規定，下列敘述何者正確？","o":["比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍稱為近鄰地區","勘估標的或比較標的周圍，供相同或類似用途之不動產，形成同質性較高之地區，稱為類似地區","所選用之比較標的與勘估標的不在同一近鄰地區內時，應進行區域因素調整","所選用之比較標的與勘估標的不在同一近鄰地區內時，應進行個別因素調整"],"a":2},{"id":"105v37","year":105,"cat":"不動產估價概要","n":37,"q":"依不動產估價技術規則第26條規定，檢討後試算價格之間差距達多少以上者，應排除該試算價格之適用？","o":["30%","20%","15%","10%"],"a":1},{"id":"105v38","year":105,"cat":"不動產估價概要","n":38,"q":"試算價格之調整運算過程中，下列何者符合不動產估價技術規則第25條之規定？","o":["各項因素內之任一單獨項目之價格調整率為12%時，必須敘明理由","各項因素內之任一單獨項目之價格調整率為20%時，不須敘明理由","各項因素內之任一單獨項目之價格調整率為30%時，不須敘明理由","各項因素內之任一單獨項目之價格調整率為17%時，必須敘明理由"],"a":3},{"id":"105v39","year":105,"cat":"不動產估價概要","n":39,"q":"依不動產估價技術規則之規定，附著於土地之工事及水利土壤之改良，應以何種方法估價為原則？","o":["比較法","收益法","成本法","土地開發分析法"],"a":2},{"id":"105v40","year":105,"cat":"不動產估價概要","n":40,"q":"某一住宅用地，面積1000坪，建蔽率50%，容積率225%，擬規劃地上7層地下2層之集合住宅。假設本案完工後總銷售金額為80000萬元，資本利息綜合利率為12%、利潤率為20%、開發或建築所需之直接成本為20000萬元、開發或建築所需之間接成本為8400萬元，以土地開發分析法估計本住宅用地的價格，請問下列何者最接近？","o":["46267萬元","42859萬元","38393萬元","31124萬元"],"a":3},{"id":"105l1","year":105,"cat":"土地法與土地相關稅法概要","n":1,"q":"有關土地法及平均地權條例規定照價收買之時機，下列何者正確？","o":["所有權人申報地價未達公告現值之百分之八十時","荒地限期使用並經加徵荒地稅滿2年後仍不使用者","土地所有權人認為標準地價過高，不能為其百分之二十以內增減之申報時，得聲請該管直轄市或縣（市）政府照價收買","私有土地超過最高限額限期1年未出售或使用者"],"a":2},{"id":"105l2","year":105,"cat":"土地法與土地相關稅法概要","n":2,"q":"依契稅條例規定，下列何種情形得免徵契稅？","o":["向法院標購所得之拍賣不動產者","政府因公務需要，以公有不動產交換取得不動產所有權者","依法標購公產者","先典後賣取得不動產者"],"a":1},{"id":"105l3","year":105,"cat":"土地法與土地相關稅法概要","n":3,"q":"有關地價稅之特別稅率，下列何項用地不適用千分之二之特別稅率？","o":["公有供公共使用土地","國民住宅用地","自用住宅用地","公共設施保留地供自用住宅使用者"],"a":0},{"id":"105l4","year":105,"cat":"土地法與土地相關稅法概要","n":4,"q":"甲有A地，乙有B地，二地相鄰，因地界不規則，雙方為建屋方便，故約定將相鄰部分的界址取直，因而逾越原界址的土地，均同意對方建屋，但未辦理土地所有權移轉登記，其後甲將A地出賣並移轉登記於丙。下列敘述何者正確？","o":["目前實務上認為該界址取直的約定得予以登記","最高法院決議認為本件有民法第796條越界建築規定之適用","最高法院決議認為該等土地之約定交互使用是使用借貸","最高法院決議認為丙不能主張乙係無權占有而請求拆屋還地"],"a":3},{"id":"105l5","year":105,"cat":"土地法與土地相關稅法概要","n":5,"q":"依房屋稅條例規定，房屋標準價格由下列何委員會負責？","o":["地價評議委員會","不動產仲裁委員會","不動產評議委員會","不動產評價委員會"],"a":3},{"id":"105l6","year":105,"cat":"土地法與土地相關稅法概要","n":6,"q":"依據房屋稅條例規定，房屋稅之納稅義務人不包括下列何者？","o":["所有權人","債權人","典權人","信託受託人"],"a":1},{"id":"105l7","year":105,"cat":"土地法與土地相關稅法概要","n":7,"q":"地價稅採累進稅率，關於累進起點地價之規定，下列何者正確？","o":["以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後5公畝之平均地價為準","以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後7公頃之平均地價為準","以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後7公畝之平均地價為準","以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後5公頃之平均地價為準"],"a":2},{"id":"105l8","year":105,"cat":"土地法與土地相關稅法概要","n":8,"q":"有關實施區段徵收之土地，其土地之租稅優惠，下列敘述何者錯誤？","o":["以現金補償其地價者，免徵土地增值稅","區段徵收領回抵價地後第一次移轉，免徵土地增值稅","以抵價地補償其地價者，免徵土地增值稅","自辦理完成之日起地價稅減半徵收2年"],"a":1},{"id":"105l9","year":105,"cat":"土地法與土地相關稅法概要","n":9,"q":"有關公告地價與公告土地現值的差別，下列敘述何者正確？","o":["公告地價為課徵地價稅之依據，公告土地現值為課徵土地增值稅之依據","公告地價每年公告1次，公告土地現值每3年公告1次","公告地價比公告土地現值更貼近市價","公告地價由地價及標準地價評議委員會評議決定之，公告土地現值由地方主管機關查估之"],"a":0},{"id":"105l10","year":105,"cat":"土地法與土地相關稅法概要","n":10,"q":"私有土地所有權消滅之情形眾多，下列何者為相對消滅之情形？","o":["因逾期未辦理土地總登記而消滅","因土地流失而消滅","因買賣而消滅","因拋棄而消滅"],"a":2},{"id":"105l11","year":105,"cat":"土地法與土地相關稅法概要","n":11,"q":"有關土地增值稅之優惠規定，下列何者正確？","o":["土地所有權人出售其自用住宅用地，得享一生一次之百分之五土地增值稅優惠稅率","土地所有權人於土地重劃後第一次移轉，得享土地增值稅減半徵收之優惠稅率","因繼承而移轉之土地，得免徵土地增值稅","政府出售公有土地，得享土地增值稅減半之優惠稅率"],"a":2},{"id":"105l12","year":105,"cat":"土地法與土地相關稅法概要","n":12,"q":"依最高法院民事庭會議決議的見解，下列敘述何者正確？","o":["甲將位於城市地方的A基地出租於乙蓋房屋供營業用，則乙不得請求甲協同申請地上權之登記","甲、乙、丙等三人共有A地，應有部分均等，甲與乙將A地全部設定有償地上權於丁時，丙依法得以同樣條件優先取得地上權","甲、乙、丙等三人公同共有A地，甲出賣其應有部分於丁時，乙與丙之先買權的競合，依其應有部分比例定之","甲將位於城市地方的A屋出租於乙供營業用，則其租金得超過A屋及其基地申報總價年息百分之十"],"a":3},{"id":"105l13","year":105,"cat":"土地法與土地相關稅法概要","n":13,"q":"關於徵收不動產的敘述，下列何者錯誤？","o":["甲出賣A地於乙，但A地仍登記為甲所有；嗣後A地經政府依法徵收，則乙得向甲請求讓與其徵收補償請求權","甲與乙二人公同共有的A地被徵收，該徵收補償金仍為甲與乙二人公同共有","甲將其A地設定最高限額抵押權於乙，嗣後A地被徵收，甲取得的徵收補償金為A地的代位物","甲的A地被徵收，於A地登記於需用土地人乙之時，甲始喪失A地所有權"],"a":3},{"id":"105l14","year":105,"cat":"土地法與土地相關稅法概要","n":14,"q":"甲、乙、丙等三人公同共有A屋，甲與乙擅自於105年8月8日將A屋出賣於丁。下列敘述何者錯誤？","o":["如採處分權說，且甲與乙債務不履行，則丙亦應負損害賠償責任","如採代理權說，則丙應負擔法律關係上出賣人的義務與責任","就契稅而言，甲、乙、丙均無庸申報納稅","甲、乙、丙、丁均無庸繳納特種貨物及勞務稅"],"a":0},{"id":"105l15","year":105,"cat":"土地法與土地相關稅法概要","n":15,"q":"依土地法規定，直轄市或縣（市）政府對於其所經管公有土地，須經民意機關同意，並經行政院核准後，方得進行一定行為。下列行為何者屬之？","o":["訂定5年租約","無償撥用","設定負擔","臨時使用"],"a":2},{"id":"105l16","year":105,"cat":"土地法與土地相關稅法概要","n":16,"q":"甲將A地設定地上權給乙蓋B屋後，甲將A地出賣並移轉登記給丙，嗣後乙將B屋連同地上權一併出賣於丁。依法院實務見解，下列敘述何者最正確？","o":["除另有約定外，乙不得將地上權讓與丁","丙不得主張優先承購權","丙得主張優先承購權，優先承購權的客體僅為B屋","丙得主張優先承購權，優先承購權的客體為B屋及地上權，而地上權原則上因混同而消滅"],"a":3},{"id":"105l17","year":105,"cat":"土地法與土地相關稅法概要","n":17,"q":"關於土地權利變更登記，依土地法規定，下列何種情況免繳納登記費？","o":["共有物分割登記","限制登記","移轉登記","繼承登記"],"a":1},{"id":"105l18","year":105,"cat":"土地法與土地相關稅法概要","n":18,"q":"甲、乙、丙、丁、戊等五人分別共有A屋，應有部分均等。下列何者錯誤？","o":["甲出賣其應有部分給庚，如乙主張先買權，依實務見解，則庚不得訴請甲移轉應有部分","甲擅自將Ａ屋全部出賣給辛，則辛得請求甲移轉其應有部分，此時，丙得就該應有部分主張先買權","依土地法第34條之1執行要點規定，如甲、乙與丙擅自將A屋全部出賣給壬，則丁的先買權客體為A屋全部","丙、丁與戊如有故意或過失以低價出售A屋全部，以致甲受有損害，依實務見解，即難謂非不法侵害甲之權利，甲得依據侵權行為之法則請求損害賠償"],"a":2},{"id":"105l19","year":105,"cat":"土地法與土地相關稅法概要","n":19,"q":"甲將其A屋賣給乙，但尚未為移轉登記，關於乙就A屋的移轉請求權申請預告登記，下列敘述何者錯誤？","o":["乙得單獨申請該預告登記，申請時並應提出甲的同意書","乙申請該預告登記時，法條規定甲於例外時應親自到場，其規範意旨在於確認身分及同意的真意，而非使甲成為登記申請人","該預告登記為保全登記、暫時登記，其登記免納登記費","甲如將A屋移轉於丙，學理上稱該移轉為中間處分"],"a":1},{"id":"105l21","year":105,"cat":"土地法與土地相關稅法概要","n":21,"q":"有關已辦理過地籍測量之地區，實施地籍圖重測與土地複丈之原因與目的，下列何者正確？","o":["地籍圖重測之原因包括地籍原圖破損、滅失等重大原因","土地複丈之原因包括原土地測量疏失、比例尺變更等原因","地籍圖重測之目的為訂正地籍原圖","土地複丈之目的為重新測製新的地籍原圖"],"a":0},{"id":"105l22","year":105,"cat":"土地法與土地相關稅法概要","n":22,"q":"甲向乙承租A地耕作，租約未經公證，租期自99年1月28日起至106年1月27日止，而乙於租期內將系爭A地以60萬元出售予丙，並於101年移轉予丙。乙雖未以書面通知甲行使先買權，然其確曾以口頭通知甲，而為甲所明確知悉，甲卻故意壓低價格，明示不願以60萬元購買，僅欲以50萬元買受，未行使先買權，並經證人證實上開情事。甲已知悉系爭買賣條件，待系爭A地價格上漲3倍餘後，以數年前之價格主張優先承購，有無理由？","o":["有理由，因乙違背土地法書面通知先買權的義務在先，故甲仍得主張先買權","有理由，因乙違背民法書面通知先買權的義務在先，故甲仍得主張先買權","有理由，因乙違背耕地三七五減租條例書面通知先買權的義務在先，故甲仍得主張先買權","無理由，因有其他證據證明通知，且縱認通知不生效力，甲如已主張讓與不破租賃，並持續付租金給丙，則甲先買權的主張已屬權利失效"],"a":3},{"id":"105l23","year":105,"cat":"土地法與土地相關稅法概要","n":23,"q":"平均地權條例對於農業用地之定義，下列敘述何者正確？","o":["僅指都市土地農業區、保護區範圍內土地","指非都市土地或都市土地農業區、保護區範圍內土地，依法供農作、森林、養殖、畜牧及保育使用者","指非都市土地或都市土地農業區、保護區、風景區範圍內土地，依法供農作使用者","僅指非都市土地供農作使用者"],"a":1},{"id":"105l24","year":105,"cat":"土地法與土地相關稅法概要","n":24,"q":"甲於105年9月1日將其A屋和其坐落的B地出售於乙。在未有特約的情形，下列敘述何者正確？","o":["乙就A屋和B地應繳納奢侈稅","乙就B地應繳納契稅","乙就B地應繳納土地增值稅","乙應繳納印花稅"],"a":3},{"id":"105l25","year":105,"cat":"土地法與土地相關稅法概要","n":25,"q":"A地及坐落其上之B屋原同屬甲所有。甲僅將B屋贈與並移轉給乙，乙以B屋設定抵押權給丙，其後，法院拍賣B屋而由丁拍定。下列敘述何者正確？","o":["由於法律規定甲乙間就A地視為有地上權關係，故甲得主張先買權","由於法律推定甲為出租人，故甲得主張先買權","由於實務上認為強制拍賣在性質上為公法上的買賣，故甲不得主張先買權","由於物權效力先買權不得任意創設，故甲不得主張先買權"],"a":1},{"id":"105l26","year":105,"cat":"土地法與土地相關稅法概要","n":26,"q":"依所得稅法之規定，下列關於土地房屋交易所得稅之敘述，何者正確？","o":["交易之房屋、土地係於103年1月1日之次日以後取得，並持有期間少於2年者，應予課徵所得稅","於103年1月1日之次日後取得依農業發展條例申請興建之農舍，應予課徵所得稅","交易前無出租、供營業或執行業務使用者，應免納所得稅","被徵收前先行協議價購之土地及其改良物，應予課徵所得稅"],"a":0},{"id":"105l27","year":105,"cat":"土地法與土地相關稅法概要","n":27,"q":"甲有A地一筆，關於「甲同意A地無償供不特定公眾通行」的資訊，依相關規定與實務見解，下列敘述何者正確？","o":["該資訊屬土地法規定應登記事項，且得登錄於土地參考資訊檔內","該資訊屬土地法規定應登記事項，但無法登錄於土地參考資訊檔內","該資訊非屬土地法規定應登記事項，但得登錄於土地參考資訊檔內","該資訊非屬土地法規定應登記事項，且無法登錄於土地參考資訊檔內"],"a":2},{"id":"105l28","year":105,"cat":"土地法與土地相關稅法概要","n":28,"q":"依相關規定與實務見解，關於地權與地用的敘述，下列何者最正確？","o":["甲與乙分別共有A地，則甲出賣其應有部分時，乙有先買權，且該先買權得預先拋棄","甲將其B基地出租於乙，乙於B地蓋有C屋，則於租賃期間，甲將B地出賣時，乙有先買權，且該先買權不得預先拋棄","甲於88年將其D耕地出租於乙，則於租賃期間，甲將D地出賣時，乙有先買權，且該先買權得預先拋棄","甲於89年將其E基地出租於乙蓋F屋，約定租賃期間20年，則於105年時，乙請求甲會同申請地上權登記的權利已消滅"],"a":0},{"id":"105l29","year":105,"cat":"土地法與土地相關稅法概要","n":29,"q":"A地原地目為「田」，經所有權人甲申請變更地目為「建」，嗣乙地政事務所認該地目變更係屬違法，請示丙縣政府如何處理，俟丙決議後，乙乃依丙決議之原則，維持「建」地目之登記，惟於A地之土地登記簿標示部其他登記事項欄註記：「本土地涉及違法地目變更，土地使用管制仍應受原『田』地目之限制」，並通知甲。依最高行政法院決議見解，甲如不服該註記，是否得循行政訴訟途徑請求救濟？","o":["該註記為行政處分，故甲得提起撤銷訴訟請求救濟","該註記為行政處分，故甲得提起課予義務訴訟請求救濟","該註記為事實行為，故甲得提起一般給付訴訟請求救濟","該註記並非行政處分，故甲不得循行政訴訟途徑請求救濟"],"a":2},{"id":"105l30","year":105,"cat":"土地法與土地相關稅法概要","n":30,"q":"都市計畫法所定義的都市計畫事業，下列何者不包括在內？","o":["公共設施建設","新市鎮建設","新市區建設","舊市區更新建設"],"a":1},{"id":"105l31","year":105,"cat":"土地法與土地相關稅法概要","n":31,"q":"甲於101年5月20日將其A耕地出租於乙。下列敘述何者正確？","o":["甲與乙約定該租賃契約租期7年，如未訂立書面契約，則視為不定期限租賃","租期屆滿後，如乙仍為A地之使用收益，而甲不即表示反對之意思，則視為不定期限繼續契約","在租賃期間，甲如自願出賣A地於丙，對乙有先買權通知的不真正義務（對己義務、間接義務）","在租賃期間，法院如拍賣A地而由丙拍定，實務上認為法院對乙有先買權的通知義務，待乙放棄先買權後，法院始通知丙繳價金"],"a":3},{"id":"105l32","year":105,"cat":"土地法與土地相關稅法概要","n":32,"q":"依實務見解，關於地籍、地用與地稅的敘述，下列何者錯誤？","o":["甲有已登記的A地，在占有人乙向地政機關申請時效取得地上權登記之前，甲向乙提起拆屋還地訴訟，倘乙於該訴訟繫屬中提起反訴，請求確認其地上權登記請求權存在及命甲容忍其辦理地上權登記，且其提起反訴於程序上並無不合，法院自應就其為訴訟標的之法律關係存否，為實體上裁判","甲有一工廠之A鐵塔，為專供機械設備用之建築物，可認為非房屋稅課徵之對象","原住民甲於山坡地範圍內的A原住民保留地取得農育權，並繼續自行經營滿5年，則甲得無償取得A地所有權","甲將其A基地出租於乙蓋B屋，於租賃期間，B屋因故滅失，則甲得收回A地"],"a":3},{"id":"105l33","year":105,"cat":"土地法與土地相關稅法概要","n":33,"q":"甲有A地與坐落A地上之B屋，但僅將A地自願出賣並移轉於乙；經查B屋並非區分所有建物，亦非農舍。下列敘述何者正確？","o":["甲僅將A地出賣並移轉於乙，違反處分一體化的法律規定","甲與乙間就A地視為已有租賃關係","甲與乙間就A地有法定地上權關係","日後甲出賣其B屋時，乙得主張先買權"],"a":3},{"id":"105l34","year":105,"cat":"土地法與土地相關稅法概要","n":34,"q":"甲、乙、丙、丁、戊、己等六人分別共有A地，其中的甲、乙、丙、丁將A地全部出賣給戊。依近年最高法院判決見解，下列敘述何者正確？","o":["甲、乙、丙、丁得將A地有償處分給戊","甲、乙、丙、丁不得將A地有償處分給戊，因為共有人不得為土地法第34條之1第1項的受讓人","甲、乙、丙、丁不得將A地有償處分給戊，因為有利害衝突顯失公平情形，難認正當","甲、乙、丙、丁將A地出賣給戊時，因為並非出賣應有部分，故己不得主張先買權"],"a":0},{"id":"105l35","year":105,"cat":"土地法與土地相關稅法概要","n":35,"q":"關於優先購買權之種類與效力，依土地法第104條規定，下列何者正確？","o":["基地出賣時，長期占有人具有優先購買權","基地出賣時，地上權人、典權人與承租人有依同樣條件優先購買之權，其順序以抽籤決定之","基地出賣時，優先購買權人於接到通知後30日內未表示者，視同放棄優先購買權","基地出賣時，地上權人之優先購買權效力大於共有土地他共有人之優先購買權效力"],"a":3},{"id":"105l37","year":105,"cat":"土地法與土地相關稅法概要","n":37,"q":"甲未依法繳納契稅，請問目前應移送何處強制執行？","o":["普通法院","行政法院","法務部行政執行署所屬行政執行分署","財政部國有財產署"],"a":2},{"id":"105l39","year":105,"cat":"土地法與土地相關稅法概要","n":39,"q":"甲有A地一筆，並將A地出賣給乙，約定由乙負擔以應辦理所有權移轉登記日當期之公告土地現值計算之土地增值稅；但甲遲延辦理A地所有權移轉登記，致乙多繳稅額。下列敘述何者正確？","o":["依目前最高法院見解，由乙負擔土地增值稅的約定係屬無效","依目前行政法院見解，由乙負擔土地增值稅的約定係屬違憲","依目前最高法院見解，乙得向甲請求給付遲延的損害賠償","依目前最高法院見解，乙不得向甲請求賠償"],"a":2},{"id":"105l40","year":105,"cat":"土地法與土地相關稅法概要","n":40,"q":"關於地用與徵收的敘述，下列何者正確？","o":["甲於90年將A耕地出租於乙，則須經甲同意，乙始得將A地轉租於丙","甲的A地被徵收，卻拒絕受領補償費，則於該補償費繳存土地徵收補償費保管專戶保管時，甲喪失A地所有權","甲將其A地出租於乙，如市地重劃後該租賃權消滅，則乙得主張具物權效力的先買權而請求塗銷因市地重劃而為之A地所有權移轉登記","甲於90年將位於苗栗縣的A耕地出租於乙，如因市地重劃致不能達原租賃目的，則由苗栗縣政府註銷其租約並通知甲與乙"],"a":1},{"id":"105r1","year":105,"cat":"不動產經紀相關法規概要","n":1,"q":"關於不動產經紀業為廣告行為之規範，下列敘述何者錯誤？","o":["經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售","委託契約內容與事實不符者，經紀業應依事實修正廣告內容","經紀業如為加盟店或加盟經營者，得逕以加盟店名稱替代直營店之法定經紀業名稱，以資消費者便於辨識","廣告對不動產之外在環境、視野或景觀之表示與事實不符者，得認定為不實廣告"],"a":2},{"id":"105r2","year":105,"cat":"不動產經紀相關法規概要","n":2,"q":"關於不動產經紀業違法行為之行政處罰，下列何種行為之法定最低罰鍰金額為最嚴重？","o":["經紀業未將經紀人到職與異動向主管機關報請備查","於雙方當事人簽訂租賃或買賣契約書時，經紀人未將不動產說明書交付與委託人交易之相對人","經紀業未於營業處所設置符合法定最低人數之經紀人","非經紀業（無經營執照）而經營仲介或代銷業務"],"a":3},{"id":"105r3","year":105,"cat":"不動產經紀相關法規概要","n":3,"q":"依新修正之「不動產說明書應記載及不得記載事項」規定，下列何者並非成屋契約之應記載事項？","o":["是否已辦理建物所有權第一次登記","各期價金之履約保證機制方式，及其受託或提供擔保者","建物型態與現況格局","本建物（專有部分）於產權持有期間是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情形，若有，應敘明"],"a":1},{"id":"105r4","year":105,"cat":"不動產經紀相關法規概要","n":4,"q":"依不動產經紀業管理條例規定，關於不動產經紀業者之行為規範，下列敘述何者錯誤？","o":["經營仲介業務者依民法禁止雙方代理原則，不得同時接受雙方之委託進行不動產買賣","經營代銷業務者，對於起造人或建築業委託代銷之案件，應於委託代銷契約屆滿或終止30日內，向主管機關申報登錄成交案件實際資訊","經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售","經紀業不得收取差價或其他報酬，其經營仲介業務者，並應依實際成交價金或租金按中央主管機關規定之報酬標準計收"],"a":0},{"id":"105r5","year":105,"cat":"不動產經紀相關法規概要","n":5,"q":"關於經紀人員違反不動產經紀業管理條例之情形中，下列何者並非予以申誡處分？","o":["委由經紀業仲介不動產買賣時，經紀業未指派經紀人於法定文件上簽章者","經紀人員對於因業務知悉或持有之他人秘密，無故洩漏者","經紀人員收取差價或其他報酬","經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說"],"a":2},{"id":"105r6","year":105,"cat":"不動產經紀相關法規概要","n":6,"q":"依不動產經紀業管理條例第19條規定，經紀業或經紀人員不得收取差價或其他報酬，違反規定者之處理，下列敘述何者正確？","o":["其已收取之差價或其他報酬，應返還支付人","其已收取之差價或其他報酬，應加倍返還支付人","其已收取之差價或其他報酬，應於加計利息後返還支付人","其已收取之差價或其他報酬，應於加計利息後加倍返還支付人"],"a":3},{"id":"105r7","year":105,"cat":"不動產經紀相關法規概要","n":7,"q":"經紀業應負賠償責任時，受害人於取得對經紀業之執行名義、經仲裁成立或營業保證基金管理委員會之決議支付後，得於該經紀業繳存營業保證金及提供擔保總額內，向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會為如何之請求？","o":["預為賠償","代為賠償","連帶賠償","不真正連帶賠償"],"a":1},{"id":"105r8","year":105,"cat":"不動產經紀相關法規概要","n":8,"q":"根據不動產說明書應記載及不得記載事項，關於預售屋的其他重要事項，應敘明最近多少時間內基地周邊半徑多少公尺範圍內有無申請水災淹水救助紀錄？","o":["最近3年內基地周邊半徑3百公尺範圍內","最近3年內基地周邊半徑5百公尺範圍內","最近5年內基地周邊半徑3百公尺範圍內","最近5年內基地周邊半徑5百公尺範圍內"],"a":2},{"id":"105r9","year":105,"cat":"不動產經紀相關法規概要","n":9,"q":"不動產經紀人資格的敘述，下列何者正確？","o":["經不動產經紀人考試及格者，應具備1年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書","經紀人證書有效期限為3年，期滿時，經紀人應檢附其於3年內在中央主管機關認可之機構、團體完成專業訓練30個小時以上之證明文件，向直轄市或縣（市）政府辦理換證","經紀人辦理換發證書時，應於證書有效期限屆滿前3個月內，檢附相關文件，向原核發機關申請之","經紀業不得僱用未具備經紀人員資格者從事仲介或代銷業務，違反者，處新臺幣3萬元以上15萬元以下罰鍰"],"a":0},{"id":"105r10","year":105,"cat":"不動產經紀相關法規概要","n":10,"q":"關於不動產經紀業及經紀人員的敘述，下列何者正確？","o":["經營國外不動產仲介業務者，以依法辦理登記之公司或商號為限","外國人依中華民國法律不得參加不動產經紀人考試或參加營業員訓練","經紀業取得主管機關許可，依法辦理公司或商業登記，即可開始營業","經紀業應於經紀人到職之日起15日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同"],"a":3},{"id":"105r11","year":105,"cat":"不動產經紀相關法規概要","n":11,"q":"不動產經紀業者進行房屋聯賣時，如業者間共同約束實施聯賣之不動產物件開發方擁有一定的專賣期間，致使已尋得交易相對人之其他不動產經紀業者受限於專賣權之規定而無法成交，對此共同約束行為之監督管理機關為：","o":["內政部營建署","法務部檢察司","經濟部商業司","公平交易委員會"],"a":3},{"id":"105r12","year":105,"cat":"不動產經紀相關法規概要","n":12,"q":"某不動產仲介業者甲，為同業競爭之目的，於某社區布告欄張貼散布乙業者有吞沒客戶斡旋金糾紛、浮報買賣物件開價之不實陳述，致乙業者業績慘跌，營業信譽受損，試問乙得向法院請求之權利，不包含下列何者？","o":["請求除去不法侵害行為","請求損害賠償","有侵害之虞時，得請求防止之","請求精神慰撫金"],"a":3},{"id":"105r13","year":105,"cat":"不動產經紀相關法規概要","n":13,"q":"事業違反公平交易法之規定致侵害他人權益者，被害人損害賠償請求權消滅時效的敘述，下列何者正確？","o":["自請求權人知有行為及賠償義務人時起，1年間不行使而消滅；自為行為時起，逾5年者亦同","自請求權人知有行為及賠償義務人時起，1年間不行使而消滅；自為行為時起，逾10年者亦同","自請求權人知有行為及賠償義務人時起，2年間不行使而消滅；自為行為時起，逾5年者亦同","自請求權人知有行為及賠償義務人時起，2年間不行使而消滅；自為行為時起，逾10年者亦同"],"a":3},{"id":"105r14","year":105,"cat":"不動產經紀相關法規概要","n":14,"q":"依公平交易法規定，主管機關為強化聯合行為查處，促進市場競爭秩序之健全發展，得設立何種基金？","o":["反托拉斯基金","管理維護基金","市場安定基金","市場重建基金"],"a":0},{"id":"105r15","year":105,"cat":"不動產經紀相關法規概要","n":15,"q":"事業不得為聯合行為。但因經濟不景氣，致同一行業之事業難以繼續維持或生產過剩，為有計畫適應需求而限制價格之共同行為，而有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。主管機關為許可時，應附多少時間之期限？","o":["不得逾1年","不得逾2年","不得逾3年","不得逾5年"],"a":3},{"id":"105r16","year":105,"cat":"不動產經紀相關法規概要","n":16,"q":"有關公平交易法對獨占規範之敘述，下列何者錯誤？","o":["獨占係指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者","二以上事業，實際上不為價格之競爭，而其全體之對外關係，具有在相關市場處於無競爭狀態之情形者，視為獨占","二事業全體於相關市場之占有率若未達二分之一者，不列入獨占事業認定範圍","獨占之事業，不得對商品價格或服務報酬，為不當之決定"],"a":2},{"id":"105r17","year":105,"cat":"不動產經紀相關法規概要","n":17,"q":"甲建商為銷售新屋建案，委請廣告代理業者乙為整體廣告行銷，由乙請來知名歌星丙代言房屋銷售。乙基於甲的指示，請求丙於廣告案中大力推薦該建案房屋地點近臺北市，開車只要15分鐘，每天可在天然溫泉泡湯，然事實上，甲、乙、丙均明知該建案房屋距離臺北市有相當距離，搭高鐵要30分鐘，且無天然溫泉。試問甲、乙、丙針對虛偽不實廣告行為，應負何種責任？","o":["甲、乙、丙均各自單獨負損害賠償責任","甲、乙應各自單獨負損害賠償責任，丙僅廣告薦證而無責任","甲應負損害賠償責任，乙、丙應與廣告主甲負連帶損害賠償責任","甲應負損害賠償責任，乙應與廣告主甲負連帶損害賠償責任，丙僅廣告薦證而無責任"],"a":2},{"id":"105r18","year":105,"cat":"不動產經紀相關法規概要","n":18,"q":"下列何種情形，係屬於公平交易法所稱之結合？","o":["無正當理由，對他事業給予差別待遇之行為","直接或間接控制他事業之業務經營或人事任免","具競爭關係之同一產銷階段事業，以契約共同決定商品或服務之價格","以不正當方法，使他事業不為價格之競爭"],"a":1},{"id":"105r19","year":105,"cat":"不動產經紀相關法規概要","n":19,"q":"公平交易法所規範不動產經紀業者涉及違法聯合行為之態樣，下列何者不屬之？","o":["共同決定服務報酬收費標準，或協議限制服務報酬之調整","協議拒絕其他不動產經紀業者參與聯賣","共同約束收取斡旋金之票期，致使斡旋金票期趨於一致","廣告宣稱「連續20年仲介服務第一品牌」，惟無銷售數字或意見調查等客觀數據為基礎，顯有虛偽不實或引人錯誤者"],"a":3},{"id":"105r20","year":105,"cat":"不動產經紀相關法規概要","n":20,"q":"關於不動產經紀業者之行為，下列何者係法律所允許？","o":["於受託房屋之廣告虛增房屋總坪數","未檢附具公信力之銷售數字、客戶調查等客觀數據，即於廣告上宣稱每年委託成交案量為全國第一","為招攬客戶，推出委託成交之抽獎活動，頭獎為價值15000元之平板電腦一台（名額3名）","與另一業者共同協議拒絕競爭對手參與聯賣"],"a":2},{"id":"105r21","year":105,"cat":"不動產經紀相關法規概要","n":21,"q":"甲向乙建設公司購買預售屋，雙方以書面訂立買賣定型化契約，關於本契約可能產生法律爭議之敘述，下列何者錯誤？","o":["若契約條款約定買方需繳回契約書，則該條款無效","若買賣雙方經個別磋商後約定契約審閱期間為20日，但契約定型化條款仍記載「買方享有5日之契約審閱期間」者，該條款牴觸個別磋商條款之部分為無效","若賣方乙公司於訂約時，突然口頭告知要求甲應同意：「如買方逾期繳交各期預售屋價金時，即視為違約，已繳交之價金不予退還」，甲未置可否仍簽下書面契約。由於契約訂立不限於書面要式，雖然乙之口頭內容未經記載於定型化契約中，但該口頭告知仍構成契約之條款而有效","若契約條款約定本案預售屋廣告僅供參考，則該條款無效"],"a":2},{"id":"105r22","year":105,"cat":"不動產經紀相關法規概要","n":22,"q":"關於消費爭議調解委員會的敘述，下列何者正確？","o":["直轄市、縣（市）政府應設消費爭議調解委員會，置委員5至11名","調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序應公開","關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人","當事人對於經參與調解委員過半數同意提出解決事件之方案，得於送達後20日之不變期間內，提出異議"],"a":2},{"id
