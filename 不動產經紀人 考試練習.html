:"不動產經紀相關法規概要","n":25,"q":"關於消費者保護團體，下列何者正確？","o":["消費者保護團體以社團法人、財團法人或行政法人為限","消費者保護團體之任務為監督消費者保護主管機關及指揮消費者保護官行使職權","消費者保護團體從事商品或服務檢驗，發表檢驗結果而有錯誤時，應使相關企業經營者有澄清之機會","消費者保護團體為商品或服務之調查、檢驗時，請求政府予以協助時，政府不應允許"],"a":2},{"id":"111m2","year":111,"cat":"民法概要","n":2,"q":"下列何種情況是非屬於近親禁止結婚之規範範圍？","o":["與離婚後無依無靠之前小姨子結婚","與終止收養後之前養女結婚","與自己兒子離婚後之前媳婦結婚","與叔叔死亡後孤苦守寡之叔母結婚"],"a":0},{"id":"111m3","year":111,"cat":"民法概要","n":3,"q":"下列何者得為被繼承人親屬中之法定繼承人？","o":["被繼承人兄弟之配偶","被繼承人父親之兄弟","被繼承人母親之兄弟之配偶","被繼承人所認領之非婚生子女"],"a":3},{"id":"111m4","year":111,"cat":"民法概要","n":4,"q":"下列敘述，何者錯誤？","o":["使用借貸契約必須是無償的契約","借用人得主張買賣不破使用借貸之抗辯","借用物為動物時，飼養費原則上應由借用人承擔","借用人對於借用物原則上並無轉租收益之權限"],"a":1},{"id":"111m5","year":111,"cat":"民法概要","n":5,"q":"依現行民法之規定，下列何者非為不動產登記前，即能取得不動產之所有權？","o":["不動產所有權因繼承而取得","不動產所有權之時效取得","不動產所有權因徵收而取得","不動產所有權因強制執行而取得"],"a":1},{"id":"111m6","year":111,"cat":"民法概要","n":6,"q":"下列何種情形，債務人之原有債務不會發生消滅之效果？","o":["債權人受領債務人以代物清償方式清償原有之債務","債務人對債權人已屆清償期之債權行使抵銷權，彼此間在抵銷數額之債權債務","債權與其債務發生混同之情形","債務人以間接給付之方式清償原有之債務"],"a":3},{"id":"111m7","year":111,"cat":"民法概要","n":7,"q":"在無因管理之規定中，若管理人管理事務時，利於本人，且不違反本人明示或可得推知之意思者，管理人不得向本人主張下列那種請求權？","o":["管理人管理本人事務之有益費用支出償還請求權","清償管理人因管理事務所負債務之請求權","管理人因管理事務所受損害之賠償請求權","管理人管理本人事務之報酬請求權"],"a":3},{"id":"111m8","year":111,"cat":"民法概要","n":8,"q":"有關現行民法代理制度之介紹，下列何者錯誤？","o":["未經本人事前同意之自己代理，對於本人而言，係無效之代理行為","民法第169條表見代理效力之發生，須無本人之授予代理權為其要件","間接代理人之代理行為不會對本人直接發生效力","代理人為代理行為時，被相對人詐欺，本人得自行撤銷該代理行為"],"a":0},{"id":"111m9","year":111,"cat":"民法概要","n":9,"q":"對於民法上有關法人規定之說明，下列何者正確？","o":["財團法人具有自律法人之性質","社員資格須經社團之董事會特別決議同意，且有正當理由時，方能開除之","財團法人之設立，得以遺囑為之","社團法人以社團董事會為其最高意思機關"],"a":2},{"id":"111m10","year":111,"cat":"民法概要","n":10,"q":"依現行民法有關住所之規定，下列何者錯誤？","o":["夫妻於雙方共同協議前，推定以共同戶籍地為其法定之住所","意定住所之設定須具備久住之意思及居住之事實","因特定行為選定居所，關於其行為，不得視為住所","16歲之年輕人，僅能以其父母之住所為法定住所"],"a":2},{"id":"111m11","year":111,"cat":"民法概要","n":11,"q":"關於民法第74條暴利行為之規定，下列敘述何者正確？","o":["當事人無論於財產給付前或給付後，均得聲請撤銷該暴利行為","撤銷權自該法律行為成立時起一年內不行使，罹於消滅時效而消滅","行使暴利行為之撤銷權時，應以意思表示向相對人為之","暴利行為自始當然無效"],"a":0},{"id":"111m12","year":111,"cat":"民法概要","n":12,"q":"下列何者非法律明文規定屬於連帶債務之性質？","o":["合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務","數人共同不法侵害他人權利所生之損害賠償債務","共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務","共有人對於他共有人因分割而得之物，所負之擔保責任債務"],"a":3},{"id":"111m13","year":111,"cat":"民法概要","n":13,"q":"下列何者非屬贈與人或其繼承人，得主張撤銷贈與契約之原因？","o":["附有負擔之贈與，贈與人已為給付而受贈人因過失不履行其負擔者","受贈人對於贈與人有扶養義務而不履行義務者","受贈人因故意不法行為致贈與人死亡者","定期給付之贈與，而受贈人已死亡者"],"a":3},{"id":"111m14","year":111,"cat":"民法概要","n":14,"q":"關於共有不動產分管契約之敘述，下列何者正確？","o":["分管契約應以共有人半數以上及其應有部分合計過半數，或應有部分合計逾三分之二之同意訂定之","分管契約訂定後，若因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之","共有人對於分管契約無法達成協議時，得訴請法院裁判定分管方式","分管契約訂定後，對於應有部分之受讓人於受讓時知悉其情事者，亦具有效力"],"a":1},{"id":"111m15","year":111,"cat":"民法概要","n":15,"q":"甲與乙結婚，生有三個女兒丙、丁、戊。丙因未婚生有二子庚及辛，曾與其母乙發生重大爭吵及言語侮辱情事，而遭甲表示剝奪其繼承權。丁則於甲生前即已向甲表示，當甲百年後將拋棄繼承權。設甲死亡時留有遺產現金600萬元，並未立有遺囑。問:甲之遺產依法應如何分配？","o":["乙、丙、丁、戊各150萬元","乙、戊各200萬元，庚、辛各100萬元","乙、丁、戊各150萬元，庚、辛各75萬元","乙、戊各300萬元"],"a":0},{"id":"111m16","year":111,"cat":"民法概要","n":16,"q":"關於限定繼承之敘述，下列何者正確？","o":["限定繼承係指繼承人自繼承開始時，僅承受被繼承人財產上之權利，而不繼承其債務","繼承人縱未依法開具遺產清冊陳報法院，並不當然喪失限定繼承之利益","繼承人隱匿被繼承人之遺產而情節重大者，仍可主張限定繼承之利益","繼承人應先對受遺贈人交付遺贈，其次償還優先權之債務，再清償普通債務"],"a":1},{"id":"111m17","year":111,"cat":"民法概要","n":17,"q":"關於夫妻法定財產制之規定，下列敘述何者正確？","o":["夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有","夫或妻於婚姻關係存續中就其婚後財產所為之無償行為，應將該財產追加計算，視為現存之婚後財產","夫或妻各自管理、使用、收益及處分其婚前及婚後財產，並各自對其債務負清償之責","剩餘財產差額分配請求權屬一身專屬性之權利，請求權人自法定財產制關係消滅時起，二年間不行使而消滅"],"a":2},{"id":"111m18","year":111,"cat":"民法概要","n":18,"q":"甲將其A地設定地上權予乙，乙於A土地上興建B屋一棟。其後甲為貸款擔保而將其A地設定抵押權予丙，乙亦因其貸款擔保而將B屋設定抵押權予丁。下列敘述何者正確？","o":["若丁實行抵押權拍賣B屋時，A地所有權應併付拍賣之","若丁實行抵押權拍賣B屋時，地上權應併付拍賣之","若丙實行抵押權拍賣A地所有權時，B屋應併付拍賣之","若丙實行抵押權拍賣A地所有權時，地上權應併付拍賣之"],"a":1},{"id":"111m19","year":111,"cat":"民法概要","n":19,"q":"甲無權占有乙之土地種植果樹，其果實歸屬於何人？","o":["果實在與果樹分離前或分離後，均屬於甲所有","果實在與果樹分離前或分離後，均屬於乙所有","果實在與果樹分離前屬於甲所有，分離後屬於乙所有","果實在與果樹分離前屬於乙所有，分離後屬於甲所有"],"a":1},{"id":"111m20","year":111,"cat":"民法概要","n":20,"q":"特定物買賣，若因物有瑕疵而出賣人依法應負物之瑕疵擔保責任時，下列何者非買受人依法所得主張之權利？","o":["解除買賣契約","請求減少買賣價金","請求另行交付無瑕疵之物","故意不告知瑕疵時，請求損害賠償"],"a":2},{"id":"111m21","year":111,"cat":"民法概要","n":21,"q":"關於租賃法律關係之敘述，下列何者正確？","o":["期限逾一年之不動產租賃契約，應以字據訂立之，否則契約無效","定有期限之不動產租賃，因其價值之昇降，當事人得聲請法院增減其租金","不動產之出租人就租金債權，對於承租人之物置於該不動產者，有法定質權","租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"],"a":3},{"id":"111m22","year":111,"cat":"民法概要","n":22,"q":"二人互負債務而其給付種類相同，並均屆清償期者，得以其債務與他方之債務互為下列何項主張，以消滅其債務？","o":["抵銷","抵充","免除","混同"],"a":0},{"id":"111m23","year":111,"cat":"民法概要","n":23,"q":"滿17歲且未受監護或輔助宣告之甲男，其所為之下列何種行為，依法須得法定代理人之同意始為有效？","o":["訂立遺囑為遺贈之行為","純獲法律上利益之行為","就他人之物所為之無權處分行為","授予他人代理權之行為"],"a":3},{"id":"111m24","year":111,"cat":"民法概要","n":24,"q":"關於財團法人之敘述，下列何者正確？","o":["財團法人得為公益或營利之目的而設立","財團法人於設立登記前，應得主管機關之許可","財團法人之最高意思機關為總會，且為必設之機關","財團法人若以營利為目的設立，其取得法人資格，依特別法之規定"],"a":1},{"id":"111m25","year":111,"cat":"民法概要","n":25,"q":"下列何者屬於當然無效之法律行為？","o":["單獨虛偽意思表示而該情形為相對人所明知者","詐欺之意思表示係由第三人所為，而相對人明知其事實或可得而知者","無權利人就權利標的物為處分後，取得其權利者","限制行為能力人用詐術使人信其為有行為能力人，所為之法律行為"],"a":0},{"id":"111v1","year":111,"cat":"不動產估價概要","n":1,"q":"平均地權條例近日研議抑制炒房之修法動向，其對不動產市場之影響，是屬於不動產估價影響因素中之下列何種因素？","o":["市場因素","一般因素","區域因素","個別因素"],"a":1},{"id":"111v2","year":111,"cat":"不動產估價概要","n":2,"q":"不動產估價應敘明價格種類，當不動產估價師受託辦理龜山島估價，您認為應屬於何種價格種類？","o":["正常價格","限定價格","特定價格","特殊價格"],"a":3},{"id":"111v3","year":111,"cat":"不動產估價概要","n":3,"q":"收益資本化率或折現率應綜合評估最適宜之方法決定，如採用債務保障比率方式決定，其計算式債務保障比率除了乘以貸款資金占不動產價格比率外，應再乘以下列何者？","o":["債務保障常數","市場常數","存款常數","貸款常數"],"a":3},{"id":"111v4","year":111,"cat":"不動產估價概要","n":4,"q":"依據不動產估價技術規則之規定，在一宗土地內有不同法定用途時，應如何估價？","o":["應考量不同用途之合併或分割前後之價格變動情形，予酌量增減","應以合併用途後估價，並以合併用途前各筆土地價值比例分算其土地價格","應考慮不同用途之建築物對宗地價格造成之影響，予以酌量增減","應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價"],"a":3},{"id":"111v5","year":111,"cat":"不動產估價概要","n":5,"q":"不動產估價原則是估價之根基，不動產估價技術規則對「最有效使用」原則有所定義，請問下列敘述何者錯誤？","o":["得以獲致最高利益之使用","基於合法、實質可能前提","正當合理、財務可行前提下者","具有超凡意識及使用能力者"],"a":3},{"id":"111v6","year":111,"cat":"不動產估價概要","n":6,"q":"利用計量模型分析法進行估價，應蒐集相當數量具代表性之比較標的，在計量模型的影響不動產價格之因素中，現有6項區域因素，5項個別因素，因此至少要蒐集多少數量以上之比較標的才符合不動產估價技術規則之規定？","o":["55筆以上","40筆以上","30筆以上","25筆以上"],"a":0},{"id":"111v7","year":111,"cat":"不動產估價概要","n":7,"q":"不動產估價成本法對勘估標的之營造或施工費，其中「指以類似勘估標的之比較標的或標準建物之單位面積（或體積）營造或施工費單價為基礎，經比較並調整價格後，乘以勘估標的之面積（或體積）總數，以求取勘估標的營造或施工費。」方法，係指何方法？","o":["單位工程法","淨計法","單位面積（或體積）比較法","工程造價比較法"],"a":2},{"id":"111v8","year":111,"cat":"不動產估價概要","n":8,"q":"不動產估價作業程序依不動產估價技術規則規定，總共有八項作業程序，其中第七個步驟為何？","o":["製作估價報告書","整理、比較、分析資料","運用估價方法推算勘估標的價格","決定勘估標的價格"],"a":3},{"id":"111v9","year":111,"cat":"不動產估價概要","n":9,"q":"目前內政部積極推動試辦電腦估價，所應用計量模型分析法係指「蒐集相當數量具代表性之比較標的，透過計量模型分析，求出各主要影響價格因素與比較標的價格二者之關係式，以推算各主要影響價格因素之調整率及調整額之方法。」請問應用時應符合條件中，截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於多少？","o":["百分之五","百分之六","百分之七","百分之八"],"a":0},{"id":"111v10","year":111,"cat":"不動產估價概要","n":10,"q":"不動產估價應就不同估價方法估價所獲得之價格進行綜合比較，視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格。若以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種方法應視前項情形賦予相對較大之權重？","o":["比較法","直接資本化法之收益價格","折現現金流量分析法之收益價格","成本法"],"a":2},{"id":"111v11","year":111,"cat":"不動產估價概要","n":11,"q":"不動產估價比較法經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達多少以上者，應排除該試算價格之適用？","o":["百分之五","百分之十","百分之十五","百分之二十"],"a":3},{"id":"111v12","year":111,"cat":"不動產估價概要","n":12,"q":"不動產估價之限定價格指具有市場性之不動產，在下列限定條件之一所形成之價值，並以貨幣金額表示者。請問下列何者非屬限定條件？","o":["以不動產所有權以外其他權利與所有權合併為目的","以不動產合併為目的","以違反經濟合理性之不動產分割為前提","經適當市場行銷及正常交易條件形成"],"a":3},{"id":"111v13","year":111,"cat":"不動產估價概要","n":13,"q":"不動產估價，應註明其價格種類；以何種價格估價時應敘明其估價條件，並同時估計其正常價格？","o":["限定價格","特殊價格","特定價格","特別價格"],"a":2},{"id":"111v14","year":111,"cat":"不動產估價概要","n":14,"q":"不動產估價比較法於市場成交資訊充足時廣為運用，有關比較法之敘述，下列何者錯誤？","o":["通常採用三件以上比較標的","試算價格之調整運算過程中，任一單獨項目之價格調整率大於百分之十五，應排除該比較標的之適用","試算價格之調整運算過程中，總調整率大於百分之三十時，應排除該比較標的之適用","其調整以差額法為原則"],"a":3},{"id":"111v15","year":111,"cat":"不動產估價概要","n":15,"q":"某建物於五年前取得使用執照，目前重建成本1,000萬元，殘餘價格率5%，經濟耐用年數50年，請問以定額法估算之建物成本價格為何？","o":["850萬元","865萬元","895萬元","905萬元"],"a":3},{"id":"111v16","year":111,"cat":"不動產估價概要","n":16,"q":"某開發商擬於新開發區開發建築，預計興建樓板面積2,000坪。若推定銷售單價平均60萬元/坪，利潤率20%、資本利息綜合利率5%、直接成本2億元、間接成本4千萬元，請問土地開發分析價格多少萬元？","o":["71,238","69,526","64,878","62,106"],"a":0},{"id":"111v17","year":111,"cat":"不動產估價概要","n":17,"q":"某公寓為談危老改建，經委託不動產估價師就1至4樓之單價分別查估為80、60、55、50萬元/坪，若全棟建物成本價格占全棟房地總價格比率為30%，請問1至4樓之樓層別效用比分別為？","o":["170%、130%、120%、100%","160%、120%、110%、100%","150%、110%、105%、100%","140%、120%、110%、100%"],"a":1},{"id":"111v18","year":111,"cat":"不動產估價概要","n":18,"q":"不動產估價人員應針對不動產勘估標的之價格日期當時的價值進行估價，而所謂價格日期是指：","o":["估價人員撰寫估價報告書之日期","勘估標的價格之基準日期","至勘估標的現場從事調查的日期","勘估標的交易之日期"],"a":1},{"id":"111v19","year":111,"cat":"不動產估價概要","n":19,"q":"以收益法估價時，對於客觀淨收益的計算應以何種情形為計算基準？","o":["以比較標的作最有效使用為計算基準","以勘估標的作最大效益使用為計算基準","以比較標的作最大效益使用為計算基準","以勘估標的作最有效使用為計算基準"],"a":3},{"id":"111v20","year":111,"cat":"不動產估價概要","n":20,"q":"某高鐵站周圍地區的新建住宅大樓平均成交價格，由三年前每坪35萬元上漲到現今每坪接近50萬元，此現象可以不動產估價中那一原則加以解釋？","o":["變動原則","預期原則","貢獻原則","日期原則"],"a":0},{"id":"111v21","year":111,"cat":"不動產估價概要","n":21,"q":"依據不動產估價技術規則，在進行不動產估價作業程序時，下列何者屬於估價要確定的基本事項？","o":["作業所需時間","估價目的","勘估標的之狀態","勘估標的相關交易、收益及成本資料"],"a":1},{"id":"111v22","year":111,"cat":"不動產估價概要","n":22,"q":"科學園區附近的農業用地，未來可能變更為建地，土地所有權人要求估價人員針對其農地未來可能變更為建地情況進行估價，請問該筆土地的價格屬於何種類？","o":["正常價格","特定價格","限定價格","特殊價格"],"a":1},{"id":"111v23","year":111,"cat":"不動產估價概要","n":23,"q":"某甲有一棟5層透天住宅，其中第一層到第四層為合法建築物，頂樓層為違章建築物，某甲委託估價人員進行房地估價，並要求估價人員對所有樓層進行估價，估價人員應如何估價較為恰當？","o":["僅針對合法建築物進行估價","拒絕對建築物估價","就合法建築物與違章建築物分別標示各該部分之價格","合法建築物以成本法估價，違章建築物則以加速折舊方式估價"],"a":2},{"id":"111v24","year":111,"cat":"不動產估價概要","n":24,"q":"有一比較標的於110年10月以800萬元成交，當時的價格指數為103.6%，不動產勘估標的之價格日期為111年3月，當時的價格指數為100.3%。假設其他條件相同，請問該勘估標的經價格日期調整後的價格為多少？","o":["834.7萬元","826.3萬元","789.6萬元","774.5萬元"],"a":3},{"id":"111v25","year":111,"cat":"不動產估價概要","n":25,"q":"在土地開發分析法之估價程序中，應進行現況勘查與環境發展程度調查與分析，下列何者不屬於要勘查與調查分析的事項：","o":["影響總銷售金額、成本及費用等因素","勘估標的之工程進度、施工及環境狀況","比較標的之工程進度、施工及環境狀況","週遭環境土地建物及公共設施開發程度"],"a":2},{"id":"111l1","year":111,"cat":"土地法與土地相關稅法概要","n":1,"q":"下列有關未辦繼承登記不動產處理方式之敘述，何者正確？","o":["未辦繼承登記不動產，於繼承開始之日起逾六個月未辦理繼承登記者，該管直轄市或縣市地政機關於查明後，應即公告繼承人於一個月內聲請登記","未辦繼承登記不動產，由該管直轄市或縣市地政機關列冊管理期間為十年","未辦繼承登記不動產，逾期仍未辦繼承而由該管直轄市或縣市地政機關公開標售時，土地或建築改良物租賃期間未超過五年者，於標售後以五年為限","逾期未辦繼承登記不動產於經公開標售之價款儲存設立在國庫專戶時，繼承人得依其法定應繼分申請領取"],"a":3},{"id":"111l2","year":111,"cat":"土地法與土地相關稅法概要","n":2,"q":"下列有關共有不動產處分等之敘述，何者錯誤？","o":["共有土地或建築改良物的處分、變更及設定地上權、農育權、不動產役權或典權，應有共有人過半數及其應有部分合計過半數之同意","共有土地或建築改良物的處分、變更或設定負擔，共有人應事先以書面通知他共有人；如不能以書面通知時，應依法公示催告之","共有人對共有土地或建築改良物的處分、變更及設定地上權、農育權、不動產役權或典權，對於他共有人應得之對價或補償，負連帶清償責任","甲乙丙公同共有一筆土地，甲依法得出賣該共有土地時，乙丙得以同一價格單獨優先承購"],"a":1},{"id":"111l3","year":111,"cat":"土地法與土地相關稅法概要","n":3,"q":"依土地稅法規定，土地所有權人辦理土地移轉繳納土地增值稅時，在其持有土地期間內，因重新規定地價增繳之地價稅，准予抵繳其應納之土地增值稅之總額，以不超過土地移轉時應繳增值稅總額多少為限？","o":["百分之一","百分之二","百分之三","百分之五"],"a":3},{"id":"111l4","year":111,"cat":"土地法與土地相關稅法概要","n":4,"q":"依房屋稅條例之規定，下列有關房屋稅納稅義務人之敘述，何者錯誤？","o":["原則上向房屋所有人徵收之","未辦建物所有權第一次登記且所有人不明之房屋，向使用執照所載起造人徵收之","未辦建物所有權第一次登記且所有人不明之房屋，無使用執照者，向建造執照所載起造人徵收之","未辦建物所有權第一次登記且所有人不明之房屋，無使用執照、亦無建造執照者，暫不徵收之"],"a":3},{"id":"111l5","year":111,"cat":"土地法與土地相關稅法概要","n":5,"q":"依契稅條例之規定，下列敘述何者錯誤？","o":["買賣契稅，應由出賣人申報納稅","典權契稅，應由典權人申報納稅","買賣契稅之稅率為其契價百分之六","分割契稅之稅率為其契價百分之二"],"a":0},{"id":"111l6","year":111,"cat":"土地法與土地相關稅法概要","n":6,"q":"依契稅條例之規定，以不動產為信託財產時，在信託關係人間移轉所有權時，何種情形須課徵契稅？","o":["因信託行為成立，委託人與受託人間","信託契約明定信託財產之歸屬人為第三人者，信託關係消滅時，委託人與歸屬人間","因信託行為不成立，委託人與受託人間","信託關係存續中受託人變更時，原受託人與新受託人間"],"a":1},{"id":"111l7","year":111,"cat":"土地法與土地相關稅法概要","n":7,"q":"依契稅條例之規定，下列何種契約的契稅稅率最低？","o":["買賣契約","典權契約","分割契約","贈與契約"],"a":2},{"id":"111l8","year":111,"cat":"土地法與土地相關稅法概要","n":8,"q":"依規定，非都市土地甲種建築用地之建蔽率為百分之六十，容積率為百分之二百四十。倘甲有1筆100坪的甲種建築用地想規劃蓋1棟豪宅自住，請問甲的房屋每層樓最大建坪有幾坪？可蓋幾層樓高？","o":["最大建坪60坪，4層樓高","最大建坪60坪，5層樓高","最大建坪100坪，2層樓高","最大建坪100坪，3層樓高"],"a":0},{"id":"111l9","year":111,"cat":"土地法與土地相關稅法概要","n":9,"q":"依都市計畫法指定供公用事業設施使用之公共設施保留地，應由各該事業機構依法徵收或購買；其餘由公用事業設施所屬政府或鄉、鎮、縣轄市公所依何種方式取得？","o":["徵收、區段徵收、市地重劃","協議價購、公私土地交換、都市更新","都市更新、市地重劃、區段徵收","徵收、協議價購、公私土地交換"],"a":0},{"id":"111l10","year":111,"cat":"土地法與土地相關稅法概要","n":10,"q":"下列何類徵收事業之需用土地人在補償費未發給完竣前，或未核定發給抵價地前，因公共安全急需，得先進入被徵收土地內工作？","o":["國防事業、平價住宅事業、水利事業","交通事業、水利事業、社會福利事業","高齡化事業、少子化事業、防疫事業","國防事業、交通事業、水利事業"],"a":3},{"id":"111l11","year":111,"cat":"土地法與土地相關稅法概要","n":11,"q":"依土地徵收條例之規定，下列敘述何者正確？","o":["撤銷或廢止徵收者，徵收前原設定之他項權利及耕地租約得予回復","撤銷或廢止徵收者，如原土地所有權人及他項權利人申請於發給之抵價地上設定抵押權或典權時，其原抵押權或典權不予回復","撤銷或廢止徵收，由需用土地人向中央主管機關申請之","撤銷或廢止徵收，由該管直轄市或縣（市）主管機關單獨向中央主管機關申請之"],"a":2},{"id":"111l12","year":111,"cat":"土地法與土地相關稅法概要","n":12,"q":"都市計畫地區於訂定分區發展優先次序後，第一期發展地區應於主要計畫發布實施後，多久期限完成細部計畫？並於細部計畫發布後，多久期限完成公共設施建設？","o":["五年內完成細部計畫，細部計畫發布後二年內完成公共設施建設","四年內完成細部計畫，細部計畫發布後三年內完成公共設施建設","三年內完成細部計畫，細部計畫發布後四年內完成公共設施建設","二年內完成細部計畫，細部計畫發布後五年內完成公共設施建設"],"a":3},{"id":"111l13","year":111,"cat":"土地法與土地相關稅法概要","n":13,"q":"依土地法第34條之1規定，共有土地之處分、變更，下列何比例之同意，方得行之？","o":["共有人三分之一及其應有部分合計過二分之一之同意","共有人二分之一及其應有部分合計過三分之一之同意","共有人合計逾三分之二之同意","應有部分合計逾三分之二之同意"],"a":3},{"id":"111l14","year":111,"cat":"土地法與土地相關稅法概要","n":14,"q":"依土地法第17條規定，下列何項土地得租賃於外國人？","o":["林地","牧地","漁地","鹽地"],"a":1},{"id":"111l15","year":111,"cat":"土地法與土地相關稅法概要","n":15,"q":"依土地法規定，私有土地所有權之移轉或租賃，妨害基本國策者，下列何者得報請行政院制止之？","o":["監察院","國有財產署","中央地政機關","不動產經紀人員獎懲委員會"],"a":2},{"id":"111l16","year":111,"cat":"土地法與土地相關稅法概要","n":16,"q":"依土地法規定，租用建築房屋之基地，發生下列何種情形時，出租人不得收回？","o":["承租人以基地供違反法令之使用時","承租人轉租基地於他人時","承租人積欠租金額，除以擔保現金抵償外，達二個月以上時","承租人違反租賃契約時"],"a":2},{"id":"111l17","year":111,"cat":"土地法與土地相關稅法概要","n":17,"q":"依土地徵收條例規定，區段徵收範圍內土地，經規劃整理後，有關其處理方式，下列敘述何者錯誤？","o":["抵價地發交被徵收土地所有權人領回","國民住宅用地得以讓售","安置原住戶所需土地得以讓售","可供建築土地依規定標租時，其期限不得逾二十五年"],"a":3},{"id":"111l18","year":111,"cat":"土地法與土地相關稅法概要","n":18,"q":"甲為中華民國境內居住之個人，他在A市持有已長達10年的1筆面積為300坪土地，於民國（下同）107年間參加自辦市地重劃。該自辦市地重劃區於110年6月1日完成分配公告程序後，在110年10月1日完成重劃土地登記，在110年10月20日完成土地交接，甲取回150坪土地，重劃後評定價格每坪為30萬元。甲在111年5月1日趁土地高價時將150坪土地全數出售，每坪售價40萬元。請問甲依法要繳多少稅率的房地交易所得稅？","o":["稅率為百分之四十五","稅率為百分之三十五","稅率為百分之二十","稅率為百分之十五"],"a":3},{"id":"111l20","year":111,"cat":"土地法與土地相關稅法概要","n":20,"q":"聲請為土地權利變更登記之案件，在登記尚未完畢前，登記機關接獲法院為何種囑託登記時，應即改辦之？","o":["查封登記、預告登記","假處分登記、滅失登記","假扣押登記、破產登記","輔助宣告登記、監護宣告登記"],"a":2},{"id":"111l21","year":111,"cat":"土地法與土地相關稅法概要","n":21,"q":"徵收土地或土地改良物應發給之補償費，需用土地人應於公告期滿後十五日內將補償費繳交該管直轄市或縣（市）主管機關發給完竣，逾期者該部分土地或土地改良物之法律效力為何？","o":["仍具徵收效力","徵收從此失其效力","被徵收之所有權人得申請撤銷徵收","需用土地人得申請保留徵收"],"a":1},{"id":"111l22","year":111,"cat":"土地法與土地相關稅法概要","n":22,"q":"依平均地權條例規定，土地所有權移轉或設定典權時，有關申報移轉現值之審核標準，下列敘述何者正確？","o":["遺贈之土地，以遺贈人簽立遺囑當期之公告土地現值為準","申報人逾訂定契約之日起三十日始申報者，以訂約日當期之公告土地現值為準","依法院判決移轉登記者，以法院終局判決日當期之公告土地現值為準","經法院拍賣之土地，以拍定日當期之公告土地現值為準"],"a":3},{"id":"111l23","year":111,"cat":"土地法與土地相關稅法概要","n":23,"q":"依平均地權條例規定，實施市地重劃時，重劃區內供公共使用之道路等十項用地，應優先以下列何種土地抵充？","o":["原廣場、綠地、停車場、零售市場地","原公有道路、溝渠、河川及未登記地","原兒童遊樂場、鄰里公園、國民小學、國民中學地","原國有地、學產地、直轄市縣（市）有地、鄉鎮（市）有地"],"a":1},{"id":"111l24","year":111,"cat":"土地法與土地相關稅法概要","n":24,"q":"下列何者不屬於平均地權條例獎勵土地所有權人自行辦理市地重劃事業之獎勵事項？","o":["優先興建重劃區之公共設施","免收或減收換發權利書狀費用","免徵或減徵地價稅與田賦","給予免息之重劃貸款"],"a":3},{"id":"111l25","year":111,"cat":"土地法與土地相關稅法概要","n":25,"q":"依平均地權條例規定，下列銷售預售屋者相關規定之敘述，何者錯誤？","o":["應於銷售前將預售屋買賣定型化契約，報請預售屋坐落基地所在之直轄市、縣（市）主管機關備查","原則上應於簽訂買賣契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄資訊","向買受人收受定金，應以書面契據確立買賣價金等事項，並不得約定不利於買受人之事項","向買受人收受定金所訂立之書面契據，得轉售予第三人"],"a":3},{"id":"111r1","year":111,"cat":"不動產經紀相關法規概要","n":1,"q":"依不動產經紀業管理條例規定，不動產經紀業得請求退還原繳存之營業保證金之情形，不包含那一項？","o":["公司組織申請解散者","商號組織申請歇業者","營業項目經變更登記後，該公司或商號已無不動產仲介經紀業及不動產代銷經紀業而組織仍存續者","退出所在地或鄰近直轄市或縣（市）仲介經紀業同業公會"],"a":3},{"id":"111r2","year":111,"cat":"不動產經紀相關法規概要","n":2,"q":"不動產經紀業管理條例對不動產經紀人員之規定，下列敘述何者正確？","o":["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書","經紀人證書有效期限為三年","經紀營業員訓練不得少於三十個小時","未具備經紀人員資格者，於簽訂專任約後，經紀業得僱用其從事仲介或代銷業務"],"a":2},{"id":"111r3","year":111,"cat":"不動產經紀相關法規概要","n":3,"q":"依不動產經紀業管理條例之規定，經營仲介業務者應揭示於營業處所明顯之處的文件，不包含那一項？","o":["不動產經紀人員之經歷與獲獎資料","不動產經紀人證書","報酬標準及收取方式","仲介相關證照及許可文件"],"a":0},{"id":"111r4","year":111,"cat":"不動產經紀相關法規概要","n":4,"q":"依不動產經紀業管理條例之規定，雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由何人在不動產說明書上簽章？","o":["不動產經紀人","相對人","地政士","公司代表人"],"a":1},{"id":"111r5","year":111,"cat":"不動產經紀相關法規概要","n":5,"q":"依不動產經紀業管理條例關於獎懲之規定，下列敘述何者錯誤？","o":["非經紀業而經營仲介或代銷業務者，主管機關應禁止其營業，並處公司負責人、商號負責人或行為人罰鍰","經紀業開始營業後自行停止營業連續六個月以上者，直轄市或縣（市）主管機關得廢止其許可","中央主管機關對於經紀人員獎懲事項，應設置獎懲委員會處理之","依本條例所處罰鍰，經通知繳納而逾期不繳納者，移送法院強制執行"],"a":2},{"id":"111r6","year":111,"cat":"不動產經紀相關法規概要","n":6,"q":"依公平交易法之規定，下列定義何者錯誤？","o":["競爭指一以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為","相關市場指事業就一定之商品或服務，從事競爭之區域或範圍","交易相對人指與事業進行或成立交易之供給者或需求者","事業所組成之同業公會視為本法所稱事業"],"a":0},{"id":"111r7","year":111,"cat":"不動產經紀相關法規概要","n":7,"q":"公平交易法關於結合之規定，下列敘述何者錯誤？","o":["直接或間接控制他事業之業務經營或人事任免屬於結合之一種","事業因結合而使其市場占有率達四分之一應先向主管機關提出申報","對於事業結合之申報，如其結合，對整體經濟利益大於限制競爭之不利益者，主管機關不得禁止其結合","主管機關就事業結合之申報，得徵詢外界意見，必要時得委請學術研究機構提供產業經濟分析意見"],"a":1},{"id":"111r8","year":111,"cat":"不動產經紀相關法規概要","n":8,"q":"甲建商為廣告主，委託乙廣告代理業製作廣告，請來丙明星擔任廣告薦證者，在丁廣告媒體業之電子媒體刊登引人錯誤之廣告，下列敘述何者錯誤？","o":["乙廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與甲建商負連帶損害賠償責任","甲建商不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵","丙明星明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與乙廣告代理業負連帶損害賠償責任","丁廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，與甲建商負連帶損害賠償責任"],"a":2},{"id":"111r9","year":111,"cat":"不動產經紀相關法規概要","n":9,"q":"主管機關收到對於涉有違反公平交易法規定之檢舉，而發動調查得進行之程序敘述，何者錯誤？","o":["通知當事人及關係人到場陳述意見","通知當事人及關係人提出帳冊、文件及其他必要之資料或證物","派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查","因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償"],"a":3},{"id":"111r10","year":111,"cat":"不動產經紀相關法規概要","n":10,"q":"當事人對主管機關依公平交易法所為之處分或決定不服者，應如何處理？","o":["直接適用行政訴訟程序","依訴願法提起訴願","對主管機關提出民事訴訟","直接適用國家賠償程序"],"a":0},{"id":"111r11","year":111,"cat":"不動產經紀相關法規概要","n":11,"q":"企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約，依消費者保護法之規定，屬於下列何者之定義？","o":["通訊交易","定型化契約","訪問交易","個別磋商契約"],"a":2},{"id":"111r12","year":111,"cat":"不動產經紀相關法規概要","n":12,"q":"甲建商與乙消費者訂立預售屋定型化契約前，並沒有給合理期間供乙審閱全部條款內容，依消費者保護法之規定，乙可以如何主張權利？","o":["要求甲建商回收該批商品或停止其服務","主張甲建商應負損害賠償責任","主張除去其危害","主張其條款不構成契約之內容。但乙得主張該條款仍構成契約之內容"],"a":3},{"id":"111r13","year":111,"cat":"不動產經紀相關法規概要","n":13,"q":"中央主管機關得擬訂特定行業定型化契約應記載或不得記載事項。下列應記載或不得記載事項之敘述何者錯誤？","o":["中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容","違反中央主管機關公告之定型化契約應記載或不得記載事項之定型化契約，其定型化契約條款無效","企業經營者使用定型化契約者，主管機關得隨時派員查核","不得記載事項得包括預付型交易之履約擔保"],"a":3},{"id":"111r14","year":111,"cat":"不動產經紀相關法規概要","n":14,"q":"企業經營者與消費者簽訂定型化之分期付款買賣契約，依消費者保護法規定，該契約書應載明之事項不包含下列那一項？","o":["頭期款","企業經營者保留契約內容或期限之變更權或解釋權","各期價款與其他附加費用合計之總價款與現金交易價格之差額","利率"],"a":1},{"id":"111r15","year":111,"cat":"不動產經紀相關法規概要","n":15,"q":"企業經營者對於消費者之申訴，依消費者保護法規定，應於申訴之日起，至多幾日內妥適處理之？","o":["七日","十日","十五日","三十日"],"a":2},{"id":"111r16","year":111,"cat":"不動產經紀相關法規概要","n":16,"q":"企業經營者在提供契約條款供他人參考時，下列那一種表示內容不會屬於定型化契約條款之一部分？","o":["以書面傳真提供給單一個別客戶之優惠條款內容","以電視字幕放映提供之廣告字幕","以書面產品型錄提供之內容","以網際網路提供之廣告資訊"],"a":0},{"id":"111r17","year":111,"cat":"不動產經紀相關法規概要","n":17,"q":"依公寓大廈管理條例之規定，下列之定義何者正確？","o":["約定專用部分：指公寓大廈專有部分經約定供共同使用者","管理負責人：指由區分所有權人會議決議執行建築物管理維護事務之公寓大廈管理服務人員或管理維護公司","專有部分：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權","公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地"],"a":3},{"id":"111r18","year":111,"cat":"不動產經紀相關法規概要","n":18,"q":"公寓大廈共用部分不得獨立使用供做專有部分。依公寓大廈管理條例之規定，其為特定情形者，並不得為約定專用部分。下列情形非屬前述之特定情形？","o":["公寓大廈本身所占之地面","公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造","其他有固定使用方法，並屬區分所有權人生活利用上不可或缺之專用部分","連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄"],"a":2},{"id":"111r19","year":111,"cat":"不動產經紀相關法規概要","n":19,"q":"依公寓大廈管理條例之規定，區分所有權人或住戶積欠應繳納之公共基金或應分擔或其他應負擔之費用，至少逾多少期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息？","o":["一期","二期","三期","六期"],"a":1},{"id":"111r20","year":111,"cat":"不動產經紀相關法規概要","n":20,"q":"規約除應載明專有部分及共用部分範圍外，有特定之情形，非經載明於規約者，不生效力。下列敘述何者非屬之？","o":["違反義務之處理方式","禁止住戶飼養動物之特別約定","財務運作之監督規定","他住戶因維護、修繕專有部分，必須進入或使用其專有部分或約定專用部分時，不得拒絕"],"a":3},{"id":"111r22","year":111,"cat":"不動產經紀相關法規概要","n":22,"q":"依消費者保護法第17條之規定，定型化契約應記載事項，依契約之性質及目的，其內容不包括下列那一項？","o":["預付型交易之履約擔保","企業經營者之義務或責任之免除","契約之終止權","違反契約之法律效果"],"a":1},{"id":"111r23","year":111,"cat":"不動產經紀相關法規概要","n":23,"q":"如果有一交易違反公平交易法，下列有關於行使損害賠償之敘述何者正確？","o":["自此一交易日起二年不行使請求權，請求權時效消滅","被害人不論何時得知損害，自得知之日起逾二年不行使請求權，請求權時效消滅","自此一交易日起逾十年，請求權時效消滅","被害人自此一交易日起，其請求權之行使沒有時效限制"],"a":2},{"id":"111r24","year":111,"cat":"不動產經紀相關法規概要","n":24,"q":"對經紀人違反不動產經紀業管理條例規定之懲戒，下列何者正確？","o":["經紀人員違反規定收取差價或其他報酬，應予申誡","經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說，應予申誡","經紀人員無故洩漏對於因業務知悉或持有之他人秘密，應予六個月以上三年以下之停止執行業務處分","經紀人員受申誡處分三次者，應廢止其經紀人員證書或證明"],"a":1},{"id":"111r25","year":111,"cat":"不動產經紀相關法規概要","n":25,"q":"經紀業尚未與委託人簽訂委託契約書便刊登廣告及銷售時，依規定由直轄市、縣（市）主管機關處多少罰鍰？","o":["新臺幣六千元以上三萬元以下罰鍰","新臺幣一萬元以上五萬元以下罰鍰","新臺幣三萬元以上十五萬元以下罰鍰","新臺幣六萬元以上三十萬元以下罰鍰"],"a":3},{"id":"110m1","year":110,"cat":"民法概要","n":1,"q":"甲與乙訂立買賣契約，契約條款記載「…價金新臺幣陸拾捌萬元整（NT$860,000）。前揭捌拾陸萬元價金應於訂約後10日內支付。」若嗣後雙方就價金金額爭訟時，法院應如何決定價金？","o":["應認為價金為最後書寫之文字：捌拾陸萬元","應先探求當事人原意","應認為價金為兩項金額之平均值：柒拾柒萬元","如法院不能決定當事人原意，應以數字為準：NT$860,000"],"a":1},{"id":"110m2","year":110,"cat":"民法概要","n":2,"q":"關於胎兒的敘述，下列何者正確？","o":["人之權利能力，始於出生，終於死亡。胎兒無權利能力","胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生","胎兒為繼承人時，於胎兒出生前，他繼承人不得分割遺產","胎兒為繼承人時，以其母為繼承人"],"a":1},{"id":"110m3","year":110,"cat":"民法概要","n":3,"q":"關於失蹤人的敘述，下列何者正確？","o":["失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告","失蹤人為八十歲以上者，得於失蹤滿五年後，為死亡之宣告","失蹤人為遭遇特別災難者，得於特別災難終了滿三個月後，為死亡之宣告","失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依破產法之規定"],"a":0},{"id":"110m4","year":110,"cat":"民法概要","n":4,"q":"關於行為能力之敘述，下列何者錯誤？","o":["受監護宣告之人之意思表示，無效，應由其法定代理人代為意思表示，並代受意思表示","限制行為能力人未得法定代理人之允許，所為之單獨行為，無效","未滿法定結婚年齡之男女，其結婚之法律效果並非無效，而是得撤銷","為保障胎兒之行為能力，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生"],"a":3},{"id":"110m5","year":110,"cat":"民法概要","n":5,"q":"關於代理的敘述，下列何者正確？","o":["代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以書面授權方式代理為之","代理人有數人者，其代理行為應單獨為之。但法律另有規定或本人另有意思表示者，不在此限","由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限","代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。而無代理權人以代理人之名義所為之法律行為則為無效"],"a":2},{"id":"110m6","year":110,"cat":"民法概要","n":6,"q":"下列何種法律行為屬法定書面要式行為？","o":["動產所有權之拋棄","子女之收養","贈與契約","演藝經紀契約"],"a":1},{"id":"110m7","year":110,"cat":"民法概要","n":7,"q":"關於意思表示不一致的敘述，下列何者正確？","o":["表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示無效","表意人無欲為其意思表示所拘束之意，而為意思表示，其情形為相對人所明知者，其意思表示有效","表意人與相對人通謀而為虛偽意思表示者，其意思表示不因之無效","虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定"],"a":3},{"id":"110m8","year":110,"cat":"民法概要","n":8,"q":"關於抵押權所擔保而得優先受償之利息，以於抵押權人實行抵押權聲請強制執行前幾年內發生及於強制執行程序中發生者為限？","o":["二年","五年","十年","十五年"],"a":1},{"id":"110m9","year":110,"cat":"民法概要","n":9,"q":"依現行民法規定，下列何者須經登記始生法律效力？","o":["遺產之繼承","土地買賣契約","設定抵押權之物權行為","夫妻就共同財產制之約定"],"a":2},{"id":"110m10","year":110,"cat":"民法概要","n":10,"q":"下列何者屬於授與代理權？","o":["甲創作民法總則一書，授權乙出版社於五年間印製出版該書","甲有一A車，授權乙以甲本人名義買賣A車","甲為知名影星，授權乙週刊使用甲肖像照片","甲有一昆蟲標本，授權乙予以拍攝"],"a":1},{"id":"110m11","year":110,"cat":"民法概要","n":11,"q":"民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？","o":["同時履行抗辯","撤銷訴權","追索權抗辯","先訴抗辯"],"a":3},{"id":"110m12","year":110,"cat":"民法概要","n":12,"q":"關於連帶債務的敘述，下列何者正確？","o":["連帶債務人相互間，縱因債務人中之一人應單獨負責之事由所致之損害及支付之費用，仍應平均分擔義務","連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，但不得請求利息","連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之","連帶債務人中之一人，不能償還其分擔額，而他債務人中之一人應分擔之部分已免責者，無須負其責任"],"a":2},{"id":"110m13","year":110,"cat":"民法概要","n":13,"q":"下列何種情形，當事人一方須以向法院聲請撤銷方式為之？","o":["因受詐欺所為之意思表示","債務人所為之無償行為，有害及債權者","締結違反公共秩序之契約","違反民法第983條特定親屬間禁止結婚規定之結婚行為"],"a":1},{"id":"110m14","year":110,"cat":"民法概要","n":14,"q":"關於合夥的敘述，下列何者正確？","o":["各合夥人之出資及其他合夥財產，為合夥人全體之分別共有","合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務","合夥財產不足清償合夥之債務時，各合夥人對於不足之額，無須負其責任","合夥人退夥後，對於其退夥前合夥所負之債務，無須負其責任"],"a":1},{"id":"110m15","year":110,"cat":"民法概要","n":15,"q":"關於買賣瑕疵擔保的敘述，下列何者正確？","o":["買受人對於由他地送到之物，主張有瑕疵，不願受領者，買受人無暫為保管之責","從物有瑕疵者，買受人得就主物併同從物，解除全部契約","為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除，但當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約","買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。出賣人就另行交付之物，不負擔保責任"],"a":2},{"id":"110m16","year":110,"cat":"民法概要","n":16,"q":"關於果實自落於鄰地，而鄰地非為公用地者，下列何者正確？","o":["視為遺失物","視為無主物","視為屬於鄰地所有人","視為屬於原土地所有人"],"a":2},{"id":"110m17","year":110,"cat":"民法概要","n":17,"q":"地上權未定有期限者，存續期間逾多少年或地上權成立之目的已不存在時，法院得因當事人之請求，斟酌地上權成立之目的、建築物或工作物之種類、性質及利用狀況等情形，定其存續期間或終止其地上權。下列何者正確？","o":["二十年","十五年","十年","五年"],"a":0},{"id":"110m18","year":110,"cat":"民法概要","n":18,"q":"依民法第880條規定，實行抵押權期間以抵押權擔保之債權，其請求權已因時效而消滅，如抵押權人，於消滅時效完成後，幾年間不實行其抵押權者，其抵押權消滅？","o":["一","二","三","五"],"a":3},{"id":"110m19","year":110,"cat":"民法概要","n":19,"q":"關於夫妻財產制契約的敘述，下列何者正確？","o":["夫妻得於結婚前以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。結婚後則不行","夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以聯合財產制，為其夫妻財產制","夫妻財產制契約之訂立、變更或廢止，非經登記，不生效力","夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力"],"a":3},{"id":"110m20","year":110,"cat":"民法概要","n":20,"q":"分別財產制有關夫妻債務的敘述，下列何者正確？","o":["夫妻於行為時明知有損於婚姻關係消滅後他方之剩餘財產分配請求權者，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷之","夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配","夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算","夫妻各自對其債務負清償之責"],"a":3},{"id":"110m21","year":110,"cat":"民法概要","n":21,"q":"關於共同財產所負之債務，而以共同財產清償者，下列何者正確？","o":["不生補償請求權","不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算","有補償請求權，但於婚姻關係存續中，不得請求","有補償請求權，雖於婚姻關係存續中，亦得請求"],"a":0},{"id":"110m22","year":110,"cat":"民法概要","n":22,"q":"民法關於非婚生子女之規定，下列何者錯誤？","o":["如有受推定為婚生子女情形，夫妻之一方或子女能證明子女非為婚生子女者，得提起認領之訴","非婚生子女，其生父與生母結婚者，視為婚生子女","非婚生子女經生父認領者，視為婚生子女","非婚生子女或其生母，對於生父之認領，得否認之"],"a":0},{"id":"110m23","year":110,"cat":"民法概要","n":23,"q":"甲早年父母雙亡，僅有一兄長乙，甲與配偶離異後獨自養育一子丙。某日甲死亡，於丙拋棄繼承前，乙亦不幸意外死亡，留下乙之配偶丁。下列何者錯誤？","o":["甲之遺產繼承人順序，丙優先於乙","配偶丁與乙有相互繼承遺產之權","就甲之遺產，既然丙已拋棄繼承，應由次順序之乙繼承，雖然乙早於丙拋棄繼承前死亡，仍應由丁繼承乙所繼承自甲之遺產","拋棄繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之"],"a":2},{"id":"110m24","year":110,"cat":"民法概要","n":24,"q":"關於喪失繼承權情事的敘述，下列何者正確？","o":["故意致被繼承人或應繼承人於死，或雖未致死因而受刑之宣告者","以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之，因而受刑之宣告者","以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之，因而受刑之宣告者","偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑，因而受刑之宣告，但經被繼承人宥恕者"],"a":0},{"id":"110m25","year":110,"cat":"民法概要","n":25,"q":"關於遺產分割的敘述，下列何者正確？","o":["繼承人於服喪三年後得隨時請求分割遺產","遺囑禁止遺產之分割者，其禁止之效力以二十年為限","遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就應清償時債務人之支付能力，負擔保之責","繼承人之連帶責任，自遺產分割時起，如債權清償期在遺產分割後者，自清償期屆滿時起，經過五年而免除"],"a":3},{"id":"110v1","year":110,"cat":"不動產估價概要","n":1,"q":"政府宣布實價登錄2.0新制自110年7月1日施行，此為影響不動產價格之何種因素？","o":["情況因素","一般因素","區域因素","個別因素"],"a":1},{"id":"110v2","year":110,"cat":"不動產估價概要","n":2,"q":"不動產所在地區對外連絡道路為中山路，路寬30公尺，並有兩線捷運經過。請問此為影響不動產價格之何種因素？","o":["情況因素","一般因素","區域因素","個別因素"],"a":2},{"id":"110v3","year":110,"cat":"不動產估價概要","n":3,"q":"不動產因鄰近殯儀館，造成價格之減損，此屬於何種原則？","o":["競爭原則","供需原則","替代原則","外部性原則"],"a":3},{"id":"110v4","year":110,"cat":"不動產估價概要","n":4,"q":"公寓因加裝電梯而價格提昇，此屬於何種不動產估價原則？","o":["外部性原則","貢獻原則","替代原則","遞增原則"],"a":1},{"id":"110v5","year":110,"cat":"不動產估價概要","n":5,"q":"建物總成本1,000萬元，經濟耐用年數50年，建物殘餘價格率10%。若每年折舊額皆相同，請問每年折舊率為何？","o":["1.5%","1.8%","2%","2.2%"],"a":1},{"id":"110v6","year":110,"cat":"不動產估價概要","n":6,"q":"有一500坪建地可興建大樓出售，預期新大樓之總銷售金額為10億元，若營建施工費為3億元、管理銷售費用等間接成本為9千萬元、要求的利潤率為18%、資本綜合利率為5%。請問該建地每坪價格約為多少？","o":["100.5萬元","83.4萬元","65.8萬元","41.7萬元"],"a":1},{"id":"110v7","year":110,"cat":"不動產估價概要","n":7,"q":"對不具市場性之不動產所估計之價值，並以貨幣金額表示者，為何種價格？","o":["正常價格","限定價格","特定價格","特殊價格"],"a":3},{"id":"110v8","year":110,"cat":"不動產估價概要","n":8,"q":"勘估標的之營造或施工費，依不動產估價技術規則之規定，不包含下列那一項目？","o":["間接材料費","稅捐","資本利息","廣告費"],"a":3},{"id":"110v9","year":110,"cat":"不動產估價概要","n":9,"q":"就同一供需圈內近鄰地區或類似地區中，選擇與勘估標的類似之比較標的或標準建物，經比較與勘估標的營造或施工費之條件差異並作價格調整，以求取勘估標的營造或施工費的方法為何？","o":["直接法","間接法","淨計法","單位工程法"],"a":1},{"id":"110v10","year":110,"cat":"不動產估價概要","n":10,"q":"100坪之辦公室出租，每月每坪正常租金為1,000元，推估該辦公室合理空置率為8%，每年之地價稅、房屋稅、保險費、管理費及維修費為120,000元，貸款支出為200,000元。該辦公室每年之淨收益為多少？","o":["1,080,000元","984,000元","880,000元","784,000元"],"a":1},{"id":"110v11","year":110,"cat":"不動產估價概要","n":11,"q":"依不動產估價技術規則規定，以不動產證券化為估價目的者，其折現現金流量分析法之總費用應依何種資料加以推算？","o":["市場相關資料","信託計畫資料","類似產品資料","歷史費用資料"],"a":1},{"id":"110v12","year":110,"cat":"不動產估價概要","n":12,"q":"比較標的於110年1月以2,000萬元成交，當時之價格指數為95；勘估標的之價格日期為110年9月，價格指數為101。假設其他條件皆相同，請問勘估標的經價格日期調整後之價格約為多少？","o":["2,020萬元","2,105萬元","2,126萬元","2,188萬元"],"a":2},{"id":"110v13","year":110,"cat":"不動產估價概要","n":13,"q":"依不動產估價技術規則規定，下列有關租金之兩種敘述，何者正確？","o":["不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則","不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則","不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之契約租金計算為原則","不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益亦以勘估標的之契約租金計算為原則"],"a":2},{"id":"110v14","year":110,"cat":"不動產估價概要","n":14,"q":"都市更新權利變換前之透天厝（僅有一所有權人）房地總價為1,500萬元，房地價值比為1:9。若該基地素地價格經評估為1,300萬元整，請問該基地之權利價值依不動產估價技術規則規定應為多少？","o":["1,500萬元","1,400萬元","1,350萬元","1,300萬元"],"a":2},{"id":"110v15","year":110,"cat":"不動產估價概要","n":15,"q":"依不動產估價技術規則規定，下列有關特殊宗地之估價，何者敘述錯誤？","o":["公共設施保留地之估價，以比較法估價為原則","林地之估價，以比較法估價為原則","農場之估價，以比較法估價為原則","墓地之估價，以比較法估價為原則"],"a":1},{"id":"110v16","year":110,"cat":"不動產估價概要","n":16,"q":"土地承租人欲購買所承租土地供未來繼續使用，委託不動產估價師進行估價，其價格種類為何？","o":["正常價格","限定價格","特定價格","特殊價格"],"a":1},{"id":"110v17","year":110,"cat":"不動產估價概要","n":17,"q":"近年受疫情影響，各地商圈人潮減少、店面空置率提高，此屬於何種價格影響因素？","o":["一般因素","區域因素","個別因素","總體因素"],"a":0},{"id":"110v18","year":110,"cat":"不動產估價概要","n":18,"q":"勘估標的乙之價格日期、勘察日期分別為110年8月15日、110年9月15日，若比較標的交易日期為110年7月10日（經查110年7至9月不動產指數分別為：106%、108%、107%），其價格日期調整百分率為何？","o":["98%","99%","101%","102%"],"a":3},{"id":"110v19","year":110,"cat":"不動產估價概要","n":19,"q":"勘估標的若為未完工之建物，應依何種方式估價？","o":["未完工之建物應依比準建物進行估價","未完工之建物應依實際完成部分估價","未完工之建物應待完工後再進行估價","未完工之建物無法產生正常報酬，不予估計"],"a":1},{"id":"110v20","year":110,"cat":"不動產估價概要","n":20,"q":"某房地之淨收益100萬元/年，其中建物淨收益60萬元/年。假設土地、建物之收益資本化率分別為2%、4%，請問土地收益價格為？","o":["1,000萬元","2,000萬元","2,500萬元","5,000萬元"],"a":1},{"id":"110v21","year":110,"cat":"不動產估價概要","n":21,"q":"依據不動產估價技術規則第43條規定，收益資本化率應考慮之因素不包括下列何者？","o":["貨幣變動之狀況","銀行定期存款利率","不動產投資之損益","不動產價格變動趨勢"],"a":2},{"id":"110v22","year":110,"cat":"不動產估價概要","n":22,"q":"勘估標的丙之市場價格1,000萬元，經分析當地同類型不動產之租金收益率5%，必要費用20萬元/年，租賃所得稅約2萬元。若丙為新訂租約，根據上開資料估計之年租金為？","o":["50萬元","52萬元","70萬元","72萬元"],"a":2},{"id":"110v23","year":110,"cat":"不動產估價概要","n":23,"q":"續訂租約之租金估計方法中，差額分配法係指下列何種差額？","o":["市場經濟租金與原契約租金之差額","原實質租金與市場經濟租金之差額","市場正常租金與原實質租金之差額","原契約租金與市場正常租金之差額"],"a":0},{"id":"110v24","year":110,"cat":"不動產估價概要","n":24,"q":"實際建築使用之容積率超過法定容積率之房地，應以何種方式估價？","o":["以原規定之法定容積進行估價","以原規定法定容積的上限進行估價","以實際建築使用部分之現況進行估價","以實際建築使用合法部分之現況估價"],"a":3},{"id":"110v25","year":110,"cat":"不動產估價概要","n":25,"q":"某區分所有建物位於住宅大樓十樓，其樓層別效用比為110%，平均樓層別效用比為105%。假設全棟建物成本價格占全棟房地總價格比率為40%，該區分所有建物之地價分配率為何？","o":["65%","66%","68%","70%"],"a":2},{"id":"110l1","year":110,"cat":"土地法與土地相關稅法概要","n":1,"q":"依土地法規定，外國人投資有助於國內重大建設、整體經濟或農牧經營而需要取得土地時，應先經下列何者程序？","o":["中央地政機關備查","中央目的事業主管機關同意","該直轄市或縣（市）民意機關同意","該直轄市或縣（市）政府層請行政院同意"],"a":1},{"id":"110l2","year":110,"cat":"土地法與土地相關稅法概要","n":2,"q":"有關重新實施地籍測量時，依土地法規定，下列敘述何者正確？","o":["土地所有權人發生界址爭議時，應由該管直轄市或縣（市）地政機關予以調處","土地所有權人不服界址爭議調處者，應於接到調處通知後三十日內，向司法機關訴請處理","土地所有權人認為測量結果有錯誤時，得於重測結果公告期滿三十日內聲請複丈","重測結果未經聲請複丈者，地政機關應即據以辦理土地更正登記"],"a":0},{"id":"110l3","year":110,"cat":"土地法與土地相關稅法概要","n":3,"q":"依土地法之規定，無保管或使用機關之公有土地及因地籍整理而發現之公有土地，應如何處理？","o":["由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為國有","由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為國有","由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為直轄市或縣（市）有","由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為直轄市或縣（市）有"],"a":1},{"id":"110l4","year":110,"cat":"土地法與土地相關稅法概要","n":4,"q":"依土地法規定，聲請為土地權利變更登記，應繳納登記費，下列敘述何者正確？","o":["由權利人與義務人雙方共同按公告地價或權利價值千分之一繳納登記費","由權利人按公告現值或權利價值千分之二繳納登記費","由權利人按申報地價或權利價值千分之一繳納登記費","由義務人按公告現值或權利價值千分之二繳納登記費"],"a":2},{"id":"110l5","year":110,"cat":"土地法與土地相關稅法概要","n":5,"q":"依土地法規定，房屋租用相關規定，下列何者錯誤？","o":["城市地方房屋之租金，以不超過土地及其建築物申報總價年息百分之十為限","約定房屋租金，超過土地法規定者，該管直轄市或縣（市）政府得依土地法所定標準強制減定之","房屋租金擔保之金額，不得超過二個月房屋租金之總額","以現金為租賃之擔保者，其現金視為租金之一部"],"a":3},{"id":"110l6","year":110,"cat":"土地法與土地相關稅法概要","n":6,"q":"依土地法之規定，遇有荒歉，直轄市或縣（市）政府得按照當地當年收穫實況為減租或免租之決定。但應經何機關同意？","o":["行政院","財政部","民意機關","農業發展委員會"],"a":2},{"id":"110l7","year":110,"cat":"土地法與土地相關稅法概要","n":7,"q":"依平均地權條例規定，應納地價稅額因公告地價調整致納稅義務人繳納困難者，得於規定繳納期間內，向稅捐稽徵機關申請延期繳納，延期繳納期間最長不得逾多久？","o":["3個月","6個月","1年","3年"],"a":1},{"id":"110l8","year":110,"cat":"土地法與土地相關稅法概要","n":8,"q":"平均地權條例第35條之1規定，私人捐贈予財團法人供興辦社會福利事業使用之土地，免徵土地增值稅；但有三種情形之一者，除追補應納之土地增值稅外，並處應納土地增值稅額二倍之罰鍰。下列何者不是規範中的情形？","o":["未辦理用地變更者","未按捐贈目的使用土地者","違反各該事業設立宗旨者","土地收益未全部用於各該事業者"],"a":0},{"id":"110l9","year":110,"cat":"土地法與土地相關稅法概要","n":9,"q":"有關平均地權條例對違反申報登錄之規定中，直轄市、縣（市）主管機關應先令其限期改正，屆期未改正者，處新臺幣六千元以上三萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰的情形係指下列何種狀況？","o":["申報登錄價格資訊不實","申報登錄價格以外資訊不實","未依限申報登錄資訊、申報登錄價格或交易面積資訊不實","金融機構、權利人、義務人、地政士或不動產經紀業規避、妨礙或拒絕查核"],"a":1},{"id":"110l10","year":110,"cat":"土地法與土地相關稅法概要","n":10,"q":"依平均地權條例規定，預售屋買受人將已付定金，確立買賣標的物及價金等事項之書面契據，轉售予第三人時，由直轄市、縣（市）主管機關按戶（棟）處罰新臺幣多少元？","o":["三萬元以上十五萬元以下罰鍰","六萬元以上三十萬元以下罰鍰","十五萬元以上一百萬元以下罰鍰","三十萬元以上一百萬元以下罰鍰"],"a":2},{"id":"110l11","year":110,"cat":"土地法與土地相關稅法概要","n":11,"q":"下列有關平均地權條例對以經營土地買賣，違背土地法律，從事土地壟斷、投機者處罰規定之敘述，何者正確？","o":["處一年以下有期徒刑，並得併科五千元以下罰金","處三年以下有期徒刑，並得併科七千元以下罰金","處一年以下有期徒刑，並得併科八千元以下罰金","處三年以下有期徒刑，並得併科一萬元以下罰金"],"a":1},{"id":"110l12","year":110,"cat":"土地法與土地相關稅法概要","n":12,"q":"拒絕受領之徵收補償費，依土地徵收條例規定存入專戶保管，並通知應受補償人。自通知送達發生效力之日起，最長逾幾年未領取之補償費，歸屬國庫？","o":["5年","10年","15年","20年"],"a":2},{"id":"110l13","year":110,"cat":"土地法與土地相關稅法概要","n":13,"q":"依土地徵收條例規定，建築改良物之補償費，按徵收當時該建築改良物之下列何種價格估定之？","o":["市價","重置價格","重建價格","房屋評定現值"],"a":2},{"id":"110l14","year":110,"cat":"土地法與土地相關稅法概要","n":14,"q":"依土地法規定，未辦理繼承登記之土地經列冊管理達多久後，逾期仍未聲請登記者，該土地應如何處理？","o":["列冊管理期間為15年，由財務部國有財產署公開標售","列冊管理期間為15年，由地政機關公開標售","列冊管理期間為20年，由法院公開拍賣","列冊管理期間為20年，逕登記為國有土地"],"a":0},{"id":"110l18","year":110,"cat":"土地法與土地相關稅法概要","n":18,"q":"依非都市土地使用管制規則規定，土地使用編定後，其原有使用或原有建築物不合土地使用分區規定者，其使用限制，下列敘述何者錯誤？","o":["在政府令其變更使用或拆除建築物前，得為從來之使用","原有建築物除准修繕和增建外，不得改建","若該土地或建築物，對公眾安全、衛生及福利有重大妨礙者，該管直轄市或縣（市）政府應限期令其變更或停止使用、遷移、拆除或改建","政府令其變更或停止使用，所受損害應予適當補償"],"a":1},{"id":"110l20","year":110,"cat":"土地法與土地相關稅法概要","n":20,"q":"依土地稅法免徵土地增值稅之土地，主管稽徵機關依相關規定核定其移轉現值並發給免稅證明，以憑辦理土地所有權移轉登記，下列有關移轉現值核定之敘述何者正確？","o":["各級政府出售之公有土地，以實際出售價額為準","各級政府贈與或受贈之土地，以土地點交日之公告土地現值為準","區段徵收抵價地，以區段徵收時實際測量及登記完竣之地價為準","私人捐贈供興辦社會福利事業之土地，以社會福利事業核准日之公告土地現值為準"],"a":0},{"id":"110l21","year":110,"cat":"土地法與土地相關稅法概要","n":21,"q":"平均地權條例第74條規定，依第26條規定限期建築之土地，有下列三種情形之一者，土地所有權人應於接到限期使用通知後，與承租人、借用人或地上權人協議建築、增建或改建；協議不成時，得終止租約、借貸或撤銷地上權。下列何者是規範中的情形？","o":["土地所有權人將其土地出租、貸與或設有地上權者","土地所有權人將其土地設定典權或設定不動產役權者","土地所有權人將其所有之農作改良物出租或貸與他人使用者","土地承典人或地役權人將其所有建築改良物出租或貸與他人使用者"],"a":0},{"id":"110l22","year":110,"cat":"土地法與土地相關稅法概要","n":22,"q":"依契稅條例規定，以不動產為信託財產，受託人乙依信託本旨移轉信託財產與委託人甲以外之歸屬權利人丙時，應由何人估價立契，在規定之期限申報契稅？又其契稅稅率為何？","o":["由乙申報契稅，稅率為6%","由乙申報契稅，稅率為2%","由丙申報契稅，稅率為6%","由甲申報契稅，稅率為2%"],"a":2},{"id":"110l23","year":110,"cat":"土地法與土地相關稅法概要","n":23,"q":"有關中華民國境內居住之個人，依所得稅法規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30條第1項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，其稅率計算下列何者正確？","o":["持有房屋、土地之期間在三年以內者，稅率為百分之四十五","持有房屋、土地之期間超過三年，未逾五年者，稅率為百分之三十五","持有房屋、土地之期間超過五年，未逾十年者，稅率為百分之三十","持有房屋、土地之期間超過十年者，稅率為百分之十五"],"a":3},{"id":"110l24","year":110,"cat":"土地法與土地相關稅法概要","n":24,"q":"依所得稅法規定，個人出售自住房屋、土地，依規定繳納之稅額，申請房地合一所得稅重購退稅之敘述，下列何者錯誤？","o":["需自完成移轉登記之日起算二年內，重購自住房屋、土地者","得於重購自住房屋、土地完成移轉登記次日起算二年內，申請退稅","申請按重購價額占出售價額之比率，自所繳納稅額計算退還","重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原退還稅額"],"a":1},{"id":"110l25","year":110,"cat":"土地法與土地相關稅法概要","n":25,"q":"依所得稅法規定，陳先生在110年10月以900萬元出售其於107年以700萬元購入之房地產，110年當期土地之公告現值為800萬元，陳先生個人未提示因取得、改良及移轉而支付之費用時，稽徵機關得以多少元計算其費用？","o":["24萬元","27萬元","30萬元","45萬元"],"a":1},{"id":"110r1","year":110,"cat":"不動產經紀相關法規概要","n":1,"q":"依據公寓大廈管理條例有關起造人之規定，下列敘述何者錯誤？","o":["公寓大廈建築物之起造人有召集第1次區分所有權人會議之義務","公寓大廈建築物起造人要領得建造執照，始可辦理公寓大廈銷售","公寓大廈建築物起造人負有移交共用部分等之義務及移交期限","公寓大廈建築物之起造人於申請使用執照時，應檢附規約草約"],"a":3},{"id":"110r2","year":110,"cat":"不動產經紀相關法規概要","n":2,"q":"住戶違反公寓大廈管理條例第9條第2項關於公寓大廈變更使用限制規定，以下敘述何者錯誤？","o":["直轄市、縣（市）主管機關得令住戶限期改善；屆期不改善者，得連續處罰之","住戶經制止而不遵從者，由直轄市、縣（市）主管機關處4萬元以上20萬元以下罰鍰","管理委員會應予制止，並得按其性質請求各該主管機關為必要之處置。如有損害並得請求損害賠償","由管理委員會促請住戶改善，住戶於3個月內仍未改善者，由管理委員會決議訴請法院強制其遷離"],"a":3},{"id":"110r3","year":110,"cat":"不動產經紀相關法規概要","n":3,"q":"依據公寓大廈管理條例規定，下列敘述何者正確？","o":["在住戶互相協議同意之下，住戶在樓梯間即得放置雜物","未經申請主管建築機關之核准，住戶為修繕時不得破壞建築物之主要構造","住戶對於退縮空地，不得依規約或區分所有權人會議決議供營業使用","依規約或區分所有權人會議決議，住戶即可在公共走道加設鐵門"],"a":1},{"id":"110r4","year":110,"cat":"不動產經紀相關法規概要","n":4,"q":"有關公寓大廈區分所有權人會議決議之特別生效要件，下列何者正確？","o":["無線電台基地台等類似強波發射設備，設置於屋頂者，應經頂層住戶同意；設置其他樓層者，應經該樓層住戶同意","約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經區分所有權人會議決議者，不在此限","專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意","共用部分經依區分所有權人會議約定為約定專用部分者，應經該專有部分區分所有權人同意"],"a":2},{"id":"110r5","year":110,"cat":"不動產經紀相關法規概要","n":5,"q":"下列何者不是公寓大廈管理委員會之職務？","o":["管理服務人之委任、僱傭及監督","共用部分、約定專用部分及其附屬設施設備之點收及保管","公寓大廈發生重大事故有及時處理之必要，請求召開區分所有權人臨時會議","住戶違規情事之制止及相關資料之提供"],"a":1},{"id":"110r6","year":110,"cat":"不動產經紀相關法規概要","n":6,"q":"公寓大廈之區分所有權人因違反規約情節重大者，管理委員會如何要求區分所有權人出讓其區分所有權及其基地所有權應有部分？","o":["依管理委員會議之決議訴請法院命其強制出讓","依區分所有權人會議之決議訴請法院命其強制出讓","依管理委員會議之決議報請直轄市、縣（市）政府強制執行","依區分所有權人會議之決議報請直轄市、縣（市）政府強制執行"],"a":1},{"id":"110r7","year":110,"cat":"不動產經紀相關法規概要","n":7,"q":"公寓大廈公共基金之來源及運用、管理方式，下列何者正確？","o":["起造人就公寓大廈領得建造執照一年內之管理維護事項，應按工程造價一定比例或金額提列為公共基金","區分所有權人依管理委員會決議繳納公共基金","公共基金經區分所有權人會議決議交付信託者，由管理委員會主任委員交付信託","公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理"],"a":3},{"id":"110r8","year":110,"cat":"不動產經紀相關法規概要","n":8,"q":"依不動產經紀業管理條例規定，對經營仲介業務者申報登錄資訊之敘述，下列何者錯誤？","o":["經營仲介業務者對於仲介成交買賣案件之申報登錄案件，應於簽訂買賣契約書並辦竣所有權移轉登記後三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊","經營仲介業務者對於經手所成交之租賃案件，應於簽訂租賃契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊","直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得向經營仲介業者要求查詢、取閱有關文件或提出說明","直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得委任所屬機關辦理"],"a":0},{"id":"110r9","year":110,"cat":"不動產經紀相關法規概要","n":9,"q":"依不動產經紀業管理條例規定，有關不動產經紀營業員之敘述，下列何者正確？","o":["經中央主管機關或其認可之機構、團體舉辦不動產經紀營業員訓練合格者，即得充任不動產經紀營業員","領有不動產經紀人考試及格證書者，即得充任不動產經紀營業員","取得不動產經紀營業員資格訓練不得少於二十個小時，其證明有效期限為四年","不動產經紀營業員證明因受破產之宣告尚未復權而被撤銷者，於原因消滅後，得重新請領證明"],"a":3},{"id":"110r10","year":110,"cat":"不動產經紀相關法規概要","n":10,"q":"依不動產經紀業管理條例規定，經營代銷業務的公司甲，若有申報登錄價格、交易面積資訊不實之情形，直轄市、縣（市）主管機關得為何種處分？","o":["令公司甲限期改正並處新臺幣一萬元以上五萬元以下罰鍰","令公司甲限期改正；屆期未改正，處新臺幣六千元以上三萬元以下罰鍰","按公司甲申報之戶（棟）處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰","按違規情形，停止公司甲之營業處分或併科新臺幣三萬元以上十五萬元以下罰鍰"],"a":2},{"id":"110r11","year":110,"cat":"不動產經紀相關法規概要","n":11,"q":"有關不動產經紀人請領或換發、補發證書之相關規定，下列敘述何者正確？","o":["不動產經紀人考試及格後，並領取其考試及格證書，即得請領不動產經紀人證書","不動產經紀人辦理換發證書時，應於證書有效期限屆滿前六個月內申辦之","不動產經紀人換發之證書，其有效期限自原證書有效期限屆滿之日起算四年","不動產經紀人證書滅失、申請補發者，應敘明其滅失之原因，向中央機關申請之"],"a":1},{"id":"110r12","year":110,"cat":"不動產經紀相關法規概要","n":12,"q":"甲要委託A房仲介公司不動產經紀營業員乙銷售自己的一戶房子。依不動產經紀業管理條例，下列敘述何者正確？","o":["甲與乙一定要先口頭定約定委託銷售之事宜","甲與A房仲介公司必須簽訂委託銷售契約書","乙刊登廣告及銷售內容，應與事實大致相符","乙刊登銷售房子廣告要註明營業員乙的名稱"],"a":1},{"id":"110r13","year":110,"cat":"不動產經紀相關法規概要","n":13,"q":"不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者，應由何機關依法處理？","o":["由直轄市、縣（市）政府依公平交易法處理","由行政院依消費者保護法處理","由行政院公平交易委員會依公平交易法處理","由內政部依不動產經紀業管理條例處理"],"a":3},{"id":"110r14","year":110,"cat":"不動產經紀相關法規概要","n":14,"q":"消費爭議調解委員會於不違反消費爭議兩造當事人之主要意思範圍內，依職權所提出解決事件之方案，當事人得於該方案送達後幾日內，提出異議，就視為調解不成立？","o":["10日","15日","20日","30日"],"a":0},{"id":"110r15","year":110,"cat":"不動產經紀相關法規概要","n":15,"q":"依消費者保護法規定，下列有關消費者保護團體提起團體訴訟之敘述，何者錯誤？","o":["消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請內政部評定優良者，得以自己之名義提起訴訟","消費者保護團體依規定提起訴訟者，應委任律師代理訴訟","消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟","消費者保護團體得以自己之名義，提起第50條消費者損害賠償訴訟或第53條不作為訴訟"],"a":0},{"id":"110r16","year":110,"cat":"不動產經紀相關法規概要","n":16,"q":"依消費者保護法規定，下列有關通訊交易或訪問交易之消費者解除契約之敘述，何者正確？","o":["消費者得於收受商品或接受服務後十日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用","訪問交易有合理例外情事者，不適用消費者保護法之猶豫期間及解約權規定","消費者依規定以書面通知解除契約者，除當事人另有個別磋商外，企業經營者應於收到通知之次日起十五日內，至原交付處所或約定處所取回商品","企業經營者應於取回商品、收到消費者退回商品或解除服務契約通知之日起十五日內，返還消費者已支付之對價"],"a":2},{"id":"110r17","year":110,"cat":"不動產經紀相關法規概要","n":17,"q":"定型化契約中之定型化契約條款於下列何種情形下，其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容？","o":["定型化契約條款違反誠信原則，對消費者顯失公平","定型化契約條款牴觸個別磋商條款之約定","企業經營者與消費者訂立定型化契約前，未依法提供合理期間，供消費者審閱全部條款內容","企業經營者以定型化契約條款使消費者拋棄契約審閱權利"],"a":2},{"id":"110r18","year":110,"cat":"不動產經紀相關法規概要","n":18,"q":"依消費者保護法規定，各類企業經營者對消費者應負之損害賠償責任，下列敘述何者錯誤？","o":["輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，負製造者責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限","從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限","從事設計、生產、製造商品或提供服務之企業經營者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任","從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任"],"a":0},{"id":"110r19","year":110,"cat":"不動產經紀相關法規概要","n":19,"q":"依消費者保護法規定，關於小額消費爭議之調解，當事人之一方無正當理由，不於調解期日到場之處理方式為何？","o":["調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意","調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意","調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意","調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意"],"a":3},{"id":"110r20","year":110,"cat":"不動產經紀相關法規概要","n":20,"q":"下列何者屬於公平交易法之適用範圍？","o":["依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之正當行為","不動產仲介業與不動產買方有關斡旋金返還之糾紛處理","不動產開發業者銷售預售屋時要求購屋人須給付定金始提供預售屋買賣契約書攜回審閱之情形","不動產經紀業加盟店未於廣告中標明加盟店或加盟經營字樣之處理"],"a":2},{"id":"110r21","year":110,"cat":"不動產經紀相關法規概要","n":21,"q":"下列有關公平交易法對於事業聯合行為規定之敘述，何者錯誤？","o":["主管機關對事業聯合行為原則上是採限制原則","主管機關對事業聯合行為有益於整體經濟與公共利益時得例外許可","主管機關對事業聯合行為之許可事項得附加條件","主管機關對事業聯合行為許可事項及其有關之條件、負擔、期限，應主動公開"],"a":0},{"id":"110r22","year":110,"cat":"不動產經紀相關法規概要","n":22,"q":"不動產經紀業者倘與具競爭關係之事業，以契約、協議共同決定服務之價格、交易對象、交易地區等相互約束事業活動之行為，而足以影響服務供需之市場功能者，將構成公平交易法之何種行為？","o":["不公平競爭","聯合行為","欺罔或顯失公平","違法結合"],"a":1},{"id":"110r23","year":110,"cat":"不動產經紀相關法規概要","n":23,"q":"經營代銷業務者，依不動產經紀業管理條例之規定，應指派不動產經紀人簽章之文件，下列何者錯誤？","o":["不動產廣告稿","不動產出租、出售委託契約書","不動產租賃、買賣契約書","不動產說明書"],"a":1},{"id":"110r24","year":110,"cat":"不動產經紀相關法規概要","n":24,"q":"有關公平交易法第22條對於事業仿冒行為要件之規定，下列敘述何者錯誤？","o":["所使用之名稱或表徵必須達到著名之程度","相同或近似之名稱或表徵必須使用於同一或類似的服務","公司名稱或營業服務表徵限於依法取得註冊商標權者","必須產生與他人提供之服務設施或活動混淆的結果"],"a":2},{"id":"110r25","year":110,"cat":"不動產經紀相關法規概要","n":25,"q":"依公平交易法規定，廣告相關業者與廣告主之間對於不實廣告應負之損害賠償責任，下列何者錯誤？","o":["專業人士或機構之廣告薦證者明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與廣告主負連帶損害賠償責任","非屬知名公眾人物之廣告薦證者不知情其所從事之薦證有引人錯誤之虞，仍為薦證者，僅於受廣告主報酬十倍之範圍內，與廣告主負連帶損害賠償責任","廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，與廣告主負連帶損害賠償責任","廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任"],"a":1},{"id":"109m1","year":109,"cat":"民法概要","n":1,"q":"下列關於法律上之物的敘述，何者正確？","o":["從物在客觀上需常助主物之效用，且與主物為各自獨立之兩個物，動產或不動產均可為從物","物之成分或其天然孳息，分離後原則上屬於該成分或天然孳息之占有人","無權占有他人土地建築房屋，建築完成時，該房屋原則上屬於土地所有人所有","已足避風雨，可達經濟上使用目的，但屋頂尚未完全完工之房屋，屬土地之成分"],"a":0},{"id":"109m2","year":109,"cat":"民法概要","n":2,"q":"下列何者非消滅時效適用之客體？","o":["人格權受侵害時之除去妨害請求權","夫妻因離婚所約定之贍養費請求權","繼承權受侵害時之回復請求權","未登記不動產所有權人之返還請求權"],"a":0},{"id":"109m3","year":109,"cat":"民法概要","n":3,"q":"甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及危險，下列何者正確？","o":["於甲與乙簽訂汽車買賣契約時起，由乙承受","自該車辦理過戶登記於乙時，由乙承受","自該車交付於乙時起，由乙承受","於乙支付價金完畢時，由乙承受"],"a":2},{"id":"109m4","year":109,"cat":"民法概要","n":4,"q":"下列有關契約成立之敘述，何者錯誤？","o":["契約得以要約與承諾之意思表示合致而成立","契約得以要約交錯之方式而成立","契約得以承諾交錯之方式而成立","契約得以要約與意思實現方式而成立"],"a":2},{"id":"109m5","year":109,"cat":"民法概要","n":5,"q":"下列關於利息之敘述，何者正確？","o":["應付利息之債務，其利率未經約定亦無法律可據者，原則上以週年利率為百分之六計算","約定利率逾週年百分之十二者，經一年後，債務人得隨時清償原本。但須於一個月前預告債權人","約定利率，超過週年百分之二十者，其約定當然無效，此時應以法定利率計算應給付之利息","債權人受領超過最高利率之利息，對於超過部分之利息係不當得利，應返還債務人"],"a":1},{"id":"109m6","year":109,"cat":"民法概要","n":6,"q":"下列有關定金之敘述，何者正確？","o":["訂約當事人之一方，由他方受有定金時，其契約視為成立","定金為諾成契約，於當事人約定時即成立","契約因可歸責於付定金當事人之事由，致不能履行時，定金不得請求返還","契約因不可歸責於雙方當事人之事由，致不能履行時，定金視為債務不履行損害賠償之總額"],"a":2},{"id":"109m7","year":109,"cat":"民法概要","n":7,"q":"甲借給乙100萬元，借期屆至，甲請求乙返還100萬元借款，乙因此開立100萬元之本票交由甲受領。下列敘述，何者正確？","o":["甲所受領乙開立的100萬元本票，是債之內容更改","甲所受領乙開立的100萬元本票，是抵銷","甲所受領乙開立的100萬元本票，是代物清償","甲所受領乙開立的100萬元本票，是新債清償"],"a":3},{"id":"109m8","year":109,"cat":"民法概要","n":8,"q":"下列關於房屋租賃之敘述，何者正確？","o":["出租人將租賃之房屋交付承租人後，非經承租人同意，不得將其所有權讓與第三人","出租人出賣租賃之房屋時，承租人有依同樣條件優先承買之權利","除有反對之約定外，承租人依法得將其一部分轉租於他人","房屋租賃之租金，當事人得因其價值之昇降，聲請法院增減之，但以定期租賃為限"],"a":2},{"id":"109m9","year":109,"cat":"民法概要","n":9,"q":"甲將其名下之房屋出售並交付乙占有，惟尚未辦理所有權登記之前，甲又出售該屋於善意之丙且辦理所有權登記完畢。則乙對丙之主張，下列何者正確？","o":["乙得依據其與甲所訂立之買賣契約而請求丙塗銷房屋所有權登記","乙得向丙主張不當得利而請求丙塗銷房屋所有權登記","乙得向丙主張撤銷權而請求丙塗銷房屋所有權登記","乙無法請求丙塗銷房屋所有權登記，只得向甲請求債務不履行之損害賠償"],"a":3},{"id":"109m10","year":109,"cat":"民法概要","n":10,"q":"甲將其土地出售乙，但因價金給付方式仍有爭議，故甲拒絕交付予乙，亦不辦理登記，乙起訴請求甲履行買賣契約之給付義務，經判決勝訴確定。下列敘述，何者正確？","o":["因甲已將其土地出售乙，故所有權屬於乙","因乙已取得土地買賣契約給付請求權勝訴確定，故所有權屬於乙","因甲尚未辦理土地所有權移轉登記於乙，故所有權仍屬於甲","因該地尚未交付予乙占有，故所有權仍屬於甲"],"a":2},{"id":"109m11","year":109,"cat":"民法概要","n":11,"q":"關於委任契約受任人之報酬，下列敘述，何者錯誤？","o":["委任關係因可歸責於受任人之事由，而於委任事務處理完畢前經終止者，受任人仍得就已經處理之部分比例請求報酬","受任人受有報酬之注意義務，高於受任人未受報酬之注意義務","當事人縱未約定報酬，但依交易習慣或委任事務之性質應給與報酬者，受任人得請求報酬","除契約另有規定外，原則上於委任關係終止時，受任人須明確報告始末後才能請求報酬"],"a":0},{"id":"109m12","year":109,"cat":"民法概要","n":12,"q":"甲將自己所有的違章建築A屋賣給乙，有關於買賣違章建築之法律關係。下列敘述，依實務見解，何者錯誤？","o":["土地與土地上之違章建築同屬於一人所有，嗣將違章建築與土地分別讓與相異之人，仍有民法第425條之1推定租賃關係規定之適用","違章建築之買受人對於無權占用房屋之人，得行使民法第767條之物上請求權","違章建築遭拍賣，拍定人自取得法院權利移轉證書之日起，取得該違章建築之權利","甲、乙買賣違章建築，所讓與的是事實上之處分權"],"a":1},{"id":"109m13","year":109,"cat":"民法概要","n":13,"q":"甲乙丙共同出資購買一筆A土地，應有部分各三分之一。下列何種行為應經甲乙丙三個共有人全體同意，始為有效？","o":["共有人之一將其應有部分移轉予第三人","共有人之一將其應有部分設定抵押權予第三人","共有人之一將A土地設定抵押權予第三人","共有人之一將A土地設定有償之地上權予第三人"],"a":2},{"id":"109m14","year":109,"cat":"民法概要","n":14,"q":"下列何者非屬公同共有之性質？","o":["繼承人有數人時，其繼承取得之遺產","合夥人之合夥財產","屬於社團法人名下之財產","屬於夫妻共同財產制下之財產"],"a":2},{"id":"109m15","year":109,"cat":"民法概要","n":15,"q":"甲現年十七歲，在山中拾獲名貴木材一塊，嗣後該木材遭乙竊取，乙請人雕刻成名貴的佛像，以高價出售於惡意的丙，並交付之。下列敘述，何者正確？","o":["甲因未滿二十歲，不得占有該木材","乙不能取得名貴的佛像所有權","乙將名貴的佛像讓與並交付予丙，係屬無權處分","甲得向乙請求償還該木材的價額"],"a":3},{"id":"109m16","year":109,"cat":"民法概要","n":16,"q":"甲、乙共有一筆A土地，面積400坪，應有部分各為二分之一。下列敘述，何者正確？","o":["甲、乙對於共有之A土地，各有一個所有權，但其權利之行使應受應有部分之限制","甲、乙對於共有之A土地，各有200坪所有權","應有部分各為二分之一是甲、乙對於共有土地所有權之比例","對於共有之A土地，甲、乙分別享有處分權及管理權"],"a":2},{"id":"109m17","year":109,"cat":"民法概要","n":17,"q":"甲、乙、丙、丁四人共有一筆A土地，應有部分各登記為四分之一，甲未經乙、丙、丁之同意，擅自占有A土地四分之三面積的土地，在其上興建一B屋。下列敘述，何者正確？","o":["乙、丙、丁僅得分別請求甲返還占用A土地四分之一之土地","乙、丙、丁得分別請求甲返還所占用A土地四分之三之土地","乙、丙、丁應共同請求甲返還所占用A土地四分之一之土地","乙、丙、丁應共同請求甲返還所占用A土地四分之三之土地"],"a":1},{"id":"109m18","year":109,"cat":"民法概要","n":18,"q":"下列關於地上權之敘述，何者正確？","o":["地上權人若因不可抗力，妨礙其土地之使用，依法即得請求免除或減少租金","土地所有權讓與時，地上權人已預付之地租，非經登記，不得對抗第三人","地上權人須連續積欠地租達二年，土地所有人始得終止地上權","地上權無支付地租之約定者，地上權人應於一年前通知土地所有人，始得拋棄其權利"],"a":1},{"id":"109m19","year":109,"cat":"民法概要","n":19,"q":"以建築物設定抵押權者，下列何者非抵押權效力所及之標的物範圍？","o":["抵押物扣押後，抵押人就抵押物所得收取之租金","抵押之建築物存在所必要且性質上得讓與之權利","設定抵押權後所增建附加於該建築物，而不具獨立性之部分","抵押之建築物滅失後殘餘之鋼筋"],"a":1},{"id":"109m20","year":109,"cat":"民法概要","n":20,"q":"下列關於夫妻財產制契約之訂立，何者正確？","o":["夫妻於結婚前或結婚後，均得以書面約定夫妻財產制契約","夫妻財產制契約之訂立應經登記，否則不生效力","夫妻財產制契約之訂立，當事人如為未成年人時，應得其法定代理人之同意始為有效","夫妻於婚姻關係存續中，得以契約廢止其財產制契約，或改用他種約定財產制，但以一次為限"],"a":0},{"id":"109m21","year":109,"cat":"民法概要","n":21,"q":"甲、乙結婚並約定共同財產制為夫妻財產制，共同財產制關係存續中二人之共同財產為2000萬元，若甲、乙離婚而無特別約定時，則乙可分得若干共同財產？","o":["2000萬元","1000萬元","1500萬元","500萬元"],"a":1},{"id":"109m22","year":109,"cat":"民法概要","n":22,"q":"下列關於夫妻法定財產制之敘述，何者正確？","o":["於法定財產制下，夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有","於法定財產制下，夫或妻之婚前及婚後財產，於婚姻關係存續中所生之孳息，均屬於婚後財產之範圍","無論採何種約定財產，當夫或妻其財產不足清償其債務時，法院得因他方之請求，宣告改用法定財產制","夫或妻各自管理、使用、收益其婚前財產與婚後財產，但對於婚後財產為處分時，應得他方之同意"],"a":1},{"id":"109m23","year":109,"cat":"民法概要","n":23,"q":"甲乙夫妻育有丙、丁二子及戊女。丙與己女結婚，婚後育有一子庚，戊女未婚生下一子辛。多年後甲死亡，而戊早於甲死亡，丙則拋棄繼承。設甲留有遺產900萬元，則甲之遺產應如何繼承？","o":["乙、丁、庚各繼承300萬元","乙、丁、辛各繼承300萬元","乙、丁各繼承450萬元","乙、丁、庚、辛各繼承225萬元"],"a":1},{"id":"109m24","year":109,"cat":"民法概要","n":24,"q":"甲、乙為夫妻，並無子女。丙、丁為甲之父母。甲死亡時留有350萬元之現金及對丙有50萬元之債權。試問，於遺產分割時，丙可以分得多少遺產？","o":["50萬元","100萬元","200萬元","350萬元"],"a":0},{"id":"109m25","year":109,"cat":"民法概要","n":25,"q":"甲乙夫妻婚後育有一子丙，三人與甲寡居之母親丁同住。甲乙兩人因感情不睦，故協議離婚，惟某日前往辦理離婚登記途中，甲不幸發生事故身亡。甲生前曾預立有效遺囑一份，記載將來所有遺產均由獨子丙繼承。甲身後遺有現金600萬元。若繼承人主張特留分扣減權時，甲之遺產應如何分配？","o":["乙繼承300萬元，丙繼承300萬元","乙繼承150萬元，丙繼承450萬元","乙繼承200萬元，丁繼承200萬元，丙繼承200萬元","乙繼承100萬元，丁繼承100萬元，丙繼承400萬元"],"a":1},{"id":"109v1","year":109,"cat":"不動產估價概要","n":1,"q":"下列有關成本法之建物殘餘價格之敘述，何者正確？","o":["建物之殘餘價格率以不超過百分之二十為原則","建物耐用年數終止後無殘餘價格者，於計算折舊時以最低殘餘價格率提列","殘餘價格率，指建物於經濟耐用年數屆滿後，於市場上出售之價格占房地總價格之比率","計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本"],"a":3},{"id":"109v2","year":109,"cat":"不動產估價概要","n":2,"q":"某一建築物重建成本為800萬元，經濟耐用年數為40年，物理耐用年數為50年，該建築物殘餘價格為80萬元，現已完工使用經過10年，請問該建築物以等速折舊計算時，每年折舊額為多少？","o":["14.4萬元","16萬元","18萬元","20萬元"],"a":2},{"id":"109v3","year":109,"cat":"不動產估價概要","n":3,"q":"進行宗地估價時，下列敘述何者錯誤？","o":["以分割為前提之宗地估價，應考慮分割前與分割後之價格變動情形，而予酌量增減","數筆土地合併為一宗進行土地利用之估價，應以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格","一宗土地內有數種不同法定用途時，應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價","土地之上下有其他設施通過，致使用受限制之宗地，應先估算其特定價格，再考量該設施通過造成土地利用之影響，並計算其地價減損額後，從特定價格中扣除之，以其餘額為該宗地之價格"],"a":3},{"id":"109v4","year":109,"cat":"不動產估價概要","n":4,"q":"經分析考量市場上類似不動產之正常租金為每年每坪12,000元，合理空置率為5%，淨收益率為75%，貸款資金占不動產價格比率80%，有效總收入乘數為15，請以有效總收入乘數法計算出收益資本化率為多少？","o":["4.27%","4.67%","5.0%","5.33%"],"a":2},{"id":"109v5","year":109,"cat":"不動產估價概要","n":5,"q":"對於區分所有建物估價運用樓層別效用比時，下列敘述何者正確？","o":["樓層別效用比是各層樓區分所有建物之立體地價差異所形成的樓層別效用比率","樓層別效用比可從各層樓出售價格案例，扣除開發利潤與土地成本費用後，推算區分所有建物各樓層效用比","樓層別效用比包含區分所有建物的土地效用與建築物效用","樓層別效用比通常地面層是最高，4樓為最低；當樓層數越高，樓層別效用比就越高"],"a":2},{"id":"109v6","year":109,"cat":"不動產估價概要","n":6,"q":"比較法以比較標的價格為基礎，下列那一項比較標的在正常情況下應排除適用？","o":["比較標的A的比較因素調整中，情況調整率+5%，價格日期調整率-9%，區域因素調整率-12%，個別因素調整率+10%","比較標的B的比較因素調整中，情況調整率+5%，價格日期調整率-9%，區域因素調整率+12%，個別因素調整率+10%","比較標的C的比較因素調整中，情況調整率+5%，價格日期調整率+9%，區域因素調整率-12%，個別因素調整率-10%","比較標的D的比較因素調整中，情況調整率-5%，價格日期調整率-9%，區域因素調整率-12%，個別因素調整率-10%"],"a":3},{"id":"109v7","year":109,"cat":"不動產估價概要","n":7,"q":"某大樓座落於原為住宅區變更為商業區之土地，依據目前土地使用管制相關法令規定，該大樓應以商業與一般事務所為其法定用途，今勘估標的某層建物未變更為商業區前之原核定用途為住宅使用，請問勘估標的之估價處理方式，下列何者較為適當？","o":["以現行商業區允許之商業與一般事務所估價，並於估價報告書中敘明","以現行商業區允許之商業與一般事務所估價，並就住宅用途與建物法定用途估價之差額於估價報告書中敘明","以原核定住宅用途估價，並於估價報告書中敘明","以現行商業區允許之商業與一般事務所估價，同時以原核定住宅用途估價，再以兩者平均數為估價結論，並於估價報告書中敘明"],"a":1},{"id":"109v8","year":109,"cat":"不動產估價概要","n":8,"q":"有關都市更新權利變換估價，下列敘述何者錯誤？","o":["權利變換前為區分所有建物者，應以全棟建物價值比率，分算各區分所有建物房地總價之基地權利價值","權利變換前區分所有建物之基地總價值低於區分所有建物坐落基地之素地總價值者，應以各區分所有建物房地總價乘上基地價值比率，計算出各區分所有建物之基地權利價值","權利變換前之基地未建築使用者，以素地價值推估其土地權利價值","權利變換前為非屬區分所有之建物者，應以該建物之房地總價乘以基地價值比率計算基地權利價值"],"a":0},{"id":"109v9","year":109,"cat":"不動產估價概要","n":9,"q":"勘估標的為辦公大樓之第10層，建物登記面積50坪，每月每坪正常租金收入為2,000元，該建物大樓經合理市場分析推算空置率為5%，勘估標的每年地價稅、房屋稅及保險費等相關總費用推算為200,000元。請問該建物以直接資本化法估價時，推算其有效總收入為多少？","o":["940,000元","1,000,000元","1,140,000元","1,200,000元"],"a":2},{"id":"109v10","year":109,"cat":"不動產估價概要","n":10,"q":"某一筆建築用地將以土地開發分析法推估價格，其資本利息綜合利率為4.8%，該土地開發之土地價值比率占60%，建物價值比率占40%，預計開發年數為2年，請問資本利息年利率應為多少？","o":["2.4%","3.0%","7.68%","9.6%"],"a":1},{"id":"109v11","year":109,"cat":"不動產估價概要","n":11,"q":"以下直接資本化法之定義敘述，何者為正確？","o":["係指勘估標的未來平均1年期間之客觀淨收益，應用調查日期當時適當之收益資本化率推算勘估標的價格之方法","係指勘估標的未來平均1年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","係指比較標的未來平均1年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","係指比較標的未來平均3年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法"],"a":1},{"id":"109v12","year":109,"cat":"不動產估價概要","n":12,"q":"正常價格的定義中，不包含下列那一要件？","o":["形成正常價格的不動產具備市場性","係為有意願的買賣雙方，依專業知識分析與謹慎行動的交易","有意願之買賣雙方不受債權債務關係或親友關係人等等壓力或脅迫","經適當市場行銷及交易雙方條件形成之價值"],"a":3},{"id":"109v13","year":109,"cat":"不動產估價概要","n":13,"q":"不動產市場是一動態的市場，對於估價的變動原則，下列敘述何者錯誤？","o":["不動產估價應掌握影響價格的一般因素、區域因素與個別因素變動，以切合勘察日期當時之價值","影響不動產價格因素不斷變動，因此估價報告書應載明價格日期與勘察日期","運用成本法估價時，應分析使用建築材料隨時間變動的成本差異對不動產造成的價格影響","分析不動產價格景氣週期性變動，以利不動產價格變動趨勢之掌握"],"a":0},{"id":"109v14","year":109,"cat":"不動產估價概要","n":14,"q":"某商用不動產之自有資金要求報酬率8%、向銀行融資之利率4%，當自有資金的比重為50%，以加權平均資金成本法估算之收益法折現率為何？","o":["4%","6%","8%","10%"],"a":1},{"id":"109v15","year":109,"cat":"不動產估價概要","n":15,"q":"估價人員應用收益法估價時，若某建物經濟耐用年數45年、經歷年數10年、殘價率10%，當採取等速折舊型時，建物價格日期當時價值未來每年折舊提存率為何？","o":["2%","2.25%","2.5%","3%"],"a":2},{"id":"109v16","year":109,"cat":"不動產估價概要","n":16,"q":"某建築開發公司擬開發建地，開發或建築後預期總銷售金額估計8.8億元，開發直接成本3億元、間接成本8千萬元，開發商要求利潤率20%、資本利息綜合利率4%，試問土地開發分析價格多少？","o":["32513萬元","31083萬元","30886萬元","30562萬元"],"a":0},{"id":"109v17","year":109,"cat":"不動產估價概要","n":17,"q":"依據不動產估價技術規則，有關成本法資本利息的敘述，下列敘述何者錯誤？","o":["資金中自有資金之計息利率應不高於1年期定存利率","資金中自有資金之計息利率應不低於活存利率","借款則以銀行短期放款利率計息","預售收入之資金以定存利率計息"],"a":3},{"id":"109v18","year":109,"cat":"不動產估價概要","n":18,"q":"成本法營造施工費求取方式，有分為直接法及間接法兩大類，其中以建築細部工程之各項目單價乘以該工程施工數量合計之方法係指下列何者？","o":["淨計法","單位工程法","工程造價比較法","單位面積（或體積）比較法"],"a":1},{"id":"109v19","year":109,"cat":"不動產估價概要","n":19,"q":"依據不動產估價技術規則規定，試算價格之調整運算過程中，情況、價格日期、區域因素及個別因素等調整的總調整率大於多少幅度時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用？","o":["15%","20%","25%","30%"],"a":3},{"id":"109v20","year":109,"cat":"不動產估價概要","n":20,"q":"內政部近年積極試辦電腦輔助大量估價(CAMA)，於應用計量模型分析法應符合之條件，下列敘述何者錯誤？","o":["計量模型分析採迴歸分析者，相關係數不得低於零點八","須蒐集應用計量模型分析關係式自變數個數五倍以上之比較標的","計量模型分析採迴歸分析者，其調整後判定係數不得低於零點七","截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於百分之五"],"a":0},{"id":"109v21","year":109,"cat":"不動產估價概要","n":21,"q":"估價人員就某建物使用與勘估標的相同之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，是指下列何者？","o":["重置成本","重製成本","重建成本","複舊成本"],"a":2},{"id":"109v22","year":109,"cat":"不動產估價概要","n":22,"q":"國內已有不動產證券化的個案，依據不動產估價技術規則規定，以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度情形賦予相對較大之權重？","o":["比較法之實例價格","土地開發分析價格","直接資本化法之收益價格","折現現金流量分析法之收益價格"],"a":3},{"id":"109v24","year":109,"cat":"不動產估價概要","n":24,"q":"依據不動產估價技術規則規定，不動產估價應敘明價格種類，請問辦理東沙島估價，此屬於何種價格？","o":["正常價格","特殊價格","限定價格","特定價格"],"a":1},{"id":"109v25","year":109,"cat":"不動產估價概要","n":25,"q":"某三層樓獨棟透天新成屋，建物登記面積為40坪，坐落基地登記面積為20坪，房地之正常價格為1200萬元，經參酌當地市場調查資料，運用估價方法計算出建物價值比率為占房地價格的30%，請問該基地單價應為多少？","o":["18萬元/坪","30萬元/坪","42萬元/坪","60萬元/坪"],"a":2},{"id":"109l1","year":109,"cat":"土地法與土地相關稅法概要","n":1,"q":"依房屋稅條例規定，下列敘述何者錯誤？","o":["合法登記之工廠供直接生產使用之自有房屋，免徵房屋稅","受重大災害，毀損面積佔整棟面積五成以上，必須修復始能使用之私有房屋，免徵房屋稅","房屋標準價格，每三年重行評定一次，並應依其耐用年數予以折舊，按年遞減其價格","各級政府機關及地方自治機關之公有辦公房屋及其員工宿舍，免徵房屋稅"],"a":0},{"id":"109l2","year":109,"cat":"土地法與土地相關稅法概要","n":2,"q":"關於契稅稅率依契稅條例之規定，下列敘述何者錯誤？","o":["買賣契稅為其契價百分之六","贈與契稅為其契價百分之六","占有契稅為其契價百分之六","典權契稅為其契價百分之六"],"a":3},{"id":"109l3","year":109,"cat":"土地法與土地相關稅法概要","n":3,"q":"土地所有權人於出售土地後，依土地稅法規定，下列何種情形得申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額？","o":["土地所有權人於先購買土地後，自完成移轉登記之日起二年後，始行出售土地者","其新購土地地價超過原出售土地地價，扣除繳納房地交易所得稅後之餘額者","自耕之農業用地出售後，於二年內另行購買仍供自耕之農業用地者","土地出售前一年內，曾供營業使用或出租者"],"a":2},{"id":"109l4","year":109,"cat":"土地法與土地相關稅法概要","n":4,"q":"依土地稅法規定，有關地價稅優惠稅率與減免，下列敘述何者錯誤？","o":["依都市計畫法劃設並經目的事業主管機關核准供公眾停車使用之停車場用地，按千分之十計徵地價稅","經目的事業主管機關核准設立之私立公園、體育場所使用範圍內之土地，免徵地價稅","公有土地按基本稅率徵收地價稅。但公有土地供公共使用者，免徵地價稅","都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依第17條之規定外，統按千分之六計徵地價稅"],"a":1},{"id":"109l5","year":109,"cat":"土地法與土地相關稅法概要","n":5,"q":"依平均地權條例規定，為促進土地利用，擴大辦理市地重劃，得獎勵土地所有權人自行組織重劃會辦理市地重劃，下列對獎勵土地所有權人辦理市地重劃之敘述，何者錯誤？","o":["減半收取土地權利變更登記及換發權利書狀費用","土地所有權人參加自辦市地重劃所需費用，得向政府指定之銀行或實施平均地權基金申請低利貸款","自辦市地重劃區抵費地出售時，不計徵土地增值稅","免徵或減徵地價稅與田賦"],"a":0},{"id":"109l6","year":109,"cat":"土地法與土地相關稅法概要","n":6,"q":"依都市計畫法之規定，關於都市計畫之變更，下列敘述何者正確？","o":["都市計畫之變更，如直接限制一定區域人民之權利者，則其性質即屬公法上之觀念通知","都市計畫之變更屬法規性質，並非行政處分，都市計畫個別變更範圍外之人民，如因都市計畫個別變更致其權利或法律上利益受侵害時，無法提起行政訴訟以資救濟","為適應國防或經濟發展之需要而變更都市計畫時，應以通盤檢討變更之方式辦理","為避免重大災害之發生而變更都市計畫時，應以個案迅行變更之方式辦理"],"a":3},{"id":"109l7","year":109,"cat":"土地法與土地相關稅法概要","n":7,"q":"依非都市土地使用管制規則規定，關於區域計畫擬定機關核發開發許可後，直轄市或縣（市）政府應報經區域計畫擬定機關廢止原開發許可之情形，下列敘述何者錯誤？","o":["興辦事業計畫經目的事業主管機關廢止或依法失其效力、整地排水計畫之核准經直轄市或縣（市）政府廢止或水土保持計畫之核准經水土保持主管機關廢止或依法失其效力","申請人自行申請廢止","與水源供應、鄰近之交通設施、排水系統、電力、電信及垃圾處理等公共設施及公用設備服務未能相互配合者","違反核定之土地使用計畫、目的事業或環境影響評估等相關法規，經該管主管機關提出要求處分並經限期改善而未改善"],"a":2},{"id":"109l8","year":109,"cat":"土地法與土地相關稅法概要","n":8,"q":"關於規定地價，依平均地權條例之規定，下列敘述何者正確？","o":["規定地價後，每三年重新規定地價一次。但必要時得延長之","直轄市或縣（市）主管機關辦理規定地價或重新規定地價時，須分區調查最近一年之土地買賣價格或收益價格","土地所有權人申報之地價未滿公告地價百分之八十時，得徵收之","土地所有權人未於公告期間申報地價者，以公告地價為其申報地價"],"a":1},{"id":"109l9","year":109,"cat":"土地法與土地相關稅法概要","n":9,"q":"都市計畫法有關公共設施保留地之規定，下列敘述何者正確？","o":["公共設施保留地劃設逾二十五年未經政府取得者，得優先辦理徵收","公共設施保留地，其地價補償以徵收當期毗鄰公共設施保留地之平均公告土地現值為準，必要時得加成補償之","都市計畫公共設施保留地臨時建築使用辦法，由直轄市、縣（市）政府定之","依法指定之公共設施保留地，得繼續為原來之使用或改為妨礙目的較輕之使用"],"a":3},{"id":"109l10","year":109,"cat":"土地法與土地相關稅法概要","n":10,"q":"依平均地權條例之規定，土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起幾日內，檢同契約及有關文件，共同申請土地所有權移轉或設定典權登記，並共同申報其土地移轉現值？","o":["10日","20日","30日","40日"],"a":2},{"id":"109l11","year":109,"cat":"土地法與土地相關稅法概要","n":11,"q":"關於原土地所有權人申請已徵收土地之收回權，依土地徵收條例規定，下列敘述何者錯誤？","o":["被徵收之土地，依原徵收計畫開始使用後未滿五年，不繼續依原徵收計畫使用者","原土地所有權人應於該管直轄市或縣（市）主管機關通知後三個月內繳還原受領之補償地價及地價加成補償，逾期視為放棄收回權","申請收回土地案件，應由該管直轄市或縣（市）主管機關受理","被徵收之土地，徵收補償費發給完竣屆滿三年，未依徵收計畫開始使用者"],"a":1},{"id":"109l12","year":109,"cat":"土地法與土地相關稅法概要","n":12,"q":"有關徵收補償，依土地徵收條例相關規定，下列敘述何者正確？","o":["農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在1年以內者，按成熟時之孳息估定之","徵收當期市價指徵收公告期滿次日起算第十日經地價評議委員會評定之當期市價","建築改良物之補償費，按起造當時該建築改良物之重建價格估定之","被徵收土地在都市計畫區內之公共設施保留地，應按毗鄰公共設施保留地之平均市價補償其地價"],"a":0},{"id":"109l13","year":109,"cat":"土地法與土地相關稅法概要","n":13,"q":"關於耕地終止租約與補償，依平均地權條例規定，下列敘述何者正確？","o":["耕地出租人依規定終止租約收回耕地時，應補償承租人為改良土地所支付之費用及已收穫之農作改良物","耕地出租人依規定終止租約，實際收回耕地屆滿二年後，不依照使用計畫建築使用者，直轄市或縣（市）政府得照價收買之","耕地出租人依規定終止租約收回耕地時，承租人得向出租人請求按公告當期該土地之公告土地現值三分之一之補償","出租耕地經依法編為建築用地者，出租人為收回自行建築或出售作為建築使用時，得終止租約"],"a":3},{"id":"109l14","year":109,"cat":"土地法與土地相關稅法概要","n":14,"q":"甲有A屋一棟，出租給乙居住使用。依土地法第100條之規定，出租人因下列何項情形，得收回房屋？","o":["承租人乙因疾病、意外產生有長期住院療養之需要時","承租人乙積欠租金額，以擔保金抵償之後，尚有1個月租金未繳時","承租人乙違反民法第443條第1項規定，將該屋轉租給他高中同學時","承租人乙因為工作調動，無法繼續居住時"],"a":2},{"id":"109l15","year":109,"cat":"土地法與土地相關稅法概要","n":15,"q":"土地或建築改良物，自繼承開始之日起逾1年未辦理繼承登記者，依土地法之規定，其處理程序何者正確？","o":["經縣市地政機關查明後，應即公告繼承人於6個月內聲請登記；逾期仍未聲請者，得由地政機關予以列冊管理","繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租賃期間超過5年者，於標售後以5年為限","標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾15年無繼承人申請提領該價款者，歸屬國庫","標售土地或建築改良物前應公告10日，繼承人、合法使用人或其他共有人就其使用範圍依序有優先購買權"],"a":1},{"id":"109l16","year":109,"cat":"土地法與土地相關稅法概要","n":16,"q":"甲有A屋，與乙簽訂買賣契約但尚未為移轉登記，乙對甲的A屋移轉請求權申請預告登記。下列敘述何者最正確？","o":["該預告登記為保全登記、暫時登記，其登記免納登記費","該預告登記，對於因繼承、強制執行、徵收、法院判決而為之新登記，無排除之效力","預告登記完畢後，如甲將A屋移轉於丙，該處分絕對無效","嗣後甲欲就A屋申辦抵押權次序變更登記時，應檢附乙的同意書，始得為之"],"a":0},{"id":"109l17","year":109,"cat":"土地法與土地相關稅法概要","n":17,"q":"依土地法規定，下列何種土地不得移轉、設定負擔或租賃於外國人？","o":["農地","墳場用地","礦地","學校用地"],"a":2},{"id":"109l18","year":109,"cat":"土地法與土地相關稅法概要","n":18,"q":"依契稅條例規定，買賣契稅，應由下列何者申報納稅？","o":["銀行","出賣人","買受人","不動產仲介公司"],"a":2},{"id":"109l19","year":109,"cat":"土地法與土地相關稅法概要","n":19,"q":"依房屋稅條例規定，房屋為信託財產者，於信託關係存續中，下列何者為房屋稅之納稅義務人？","o":["委託人","受託人","受益人","監察人"],"a":1},{"id":"109l20","year":109,"cat":"土地法與土地相關稅法概要","n":20,"q":"依土地徵收條例第25條規定，被徵收之土地，所有權人死亡未辦竣繼承登記，其徵收補償費如何處理？","o":["歸屬國庫","納入平均地權基金","歸目的事業主管機關所有","得由部分繼承人按其應繼分領取之"],"a":3},{"id":"109l21","year":109,"cat":"土地法與土地相關稅法概要","n":21,"q":"依都市計畫法規定，下列何種公共設施應按閭鄰單位或居民分布情形適當配置之？","o":["社會福利設施","垃圾處理場","污水處理廠","屠宰場"],"a":0},{"id":"109l22","year":109,"cat":"土地法與土地相關稅法概要","n":22,"q":"依土地法規定，土地登記損害賠償之請求，如經該地政機關拒絕，受損害人得向下列何者起訴？","o":["監察院","行政院","立法院","司法機關"],"a":3},{"id":"109l23","year":109,"cat":"土地法與土地相關稅法概要","n":23,"q":"依土地法第53條規定，因地籍整理而發現之公有土地，下列敘述何者正確？","o":["視為無主土地","應辦理囑託登記","地政機關逕為登記","登記時所有權人欄註明為縣（市）有"],"a":2},{"id":"109l24","year":109,"cat":"土地法與土地相關稅法概要","n":24,"q":"關於不動產共有關係，依土地法第34條之1規定，下列敘述何者正確？","o":["甲、乙、丙共有一筆土地，其應有部分各三分之一，該地之應有部分出賣時，地上權人、典權人或房屋承租人有依同樣條件優先購買之權","土地共有人欲出租共有土地於他人時，得以共有人過半數及其應有部分合計過半數之同意行之","區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人所有者，應適用土地法第34條之1第4項規定","依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處。不服調處者，應於接到調處通知後十五日內，向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之"],"a":3},{"id":"109l25","year":109,"cat":"土地法與土地相關稅法概要","n":25,"q":"依國土計畫法規定，縣（市）主管機關應於縣（市）國土計畫公告實施後幾年內，依中央主管機關指定之日期，公告國土功能分區圖？","o":["一","二","三","四"],"a":3},{"id":"109r1","year":109,"cat":"不動產經紀相關法規概要","n":1,"q":"關於不動產經紀業管理條例立法目的之敘述，下列何者正確？","o":["加強公寓大廈之管理維護","發展租賃住宅服務業","保障國民消費生活安全","促進不動產交易市場健全發展"],"a":3},{"id":"109r2","year":109,"cat":"不動產經紀相關法規概要","n":2,"q":"不動產經紀業管理條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府何等局處？","o":["都市發展、城鄉發展","產業發展","地政","財政"],"a":2},{"id":"109r4","year":109,"cat":"不動產經紀相關法規概要","n":4,"q":"根據公平交易法，二以上事業，實際上不為價格之競爭，而其全體之對外關係，具有此等規定之情形者，視為下列何者？","o":["寡占","獨占","結合","聯合"],"a":1},{"id":"109r5","year":109,"cat":"不動產經紀相關法規概要","n":5,"q":"公平交易法第二十條規定，有下列各款行為之一，而有限制競爭之虞者，事業不得為之。其事項「不」包括下列何者？","o":["無正當理由，對他事業給予差別待遇之行為","為加強貿易效能，而就國外商品或服務之輸入採取共同行為","以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為","以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"],"a":1},{"id":"109r6","year":109,"cat":"不動產經紀相關法規概要","n":6,"q":"關於不實廣告之敘述，下列何者正確？","o":["廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，應自負損害賠償責任，與廣告主無涉","廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，應與廣告代理業負連帶損害賠償責任","廣告薦證者，指廣告主以外，於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果之人或機構","廣告薦證者非屬知名公眾人物、專業人士或機構，僅於受有報酬二十倍之範圍內，與廣告代理業負連帶損害賠償責任"],"a":2},{"id":"109r7","year":109,"cat":"不動產經紀相關法規概要","n":7,"q":"事業違反公平交易法，致侵害他人權益者，如為事業之故意行為，法院得酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？","o":["一倍","三倍","五倍","十倍"],"a":1},{"id":"109r8","year":109,"cat":"不動產經紀相關法規概要","n":8,"q":"依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額幾倍以下之懲罰性賠償金？","o":["一倍","三倍","五倍","十倍"],"a":2},{"id":"109r9","year":109,"cat":"不動產經紀相關法規概要","n":9,"q":"根據消費者保護法，通訊交易或訪問交易之消費者，得於收受商品或接受服務後幾日內，以退回商品或書面通知方式解除契約？","o":["五日","七日","十日","十五日"],"a":1},{"id":"109r10","year":109,"cat":"不動產經紀相關法規概要","n":10,"q":"關於企業經營者與消費者分期付款買賣契約之敘述，下列何者正確？","o":["企業經營者應於契約書載明各期價款與其他附加費用合計之總價款與現金交易價格之差額","企業經營者未於契約書記載總價款者，消費者不負現金交易價格加計週年利率百分之五以外價款之給付義務","企業經營者未於契約書記載利率者，其利率按總價款週年利率百分之六計算之","企業經營者未於契約書記載利率者，消費者不負現金交易價格以外價款之給付義務"],"a":0},{"id":"109r11","year":109,"cat":"不動產經紀相關法規概要","n":11,"q":"企業經營者違反消費者保護法之定型化契約應記載或不得記載事項者，經主管機關令其限期改正而屆期不改正者，第一次處多少罰鍰？","o":["新臺幣一萬元以上十萬元以下","新臺幣二萬元以上二十萬元以下","新臺幣三萬元以上三十萬元以下","新臺幣十萬元以上一百萬元以下"],"a":2},{"id":"109r12","year":109,"cat":"不動產經紀相關法規概要","n":12,"q":"關於公寓大廈之公共基金，下列敘述何者正確？","o":["起造人就公寓大廈領得使用執照三年內之管理維護事項，應按工程造價一定比例或金額提列","區分所有權人依管理委員會議決議繳納","區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉","區分所有權人積欠應繳納之公共基金已逾一期或達相當金額，經催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付"],"a":2},{"id":"109r13","year":109,"cat":"不動產經紀相關法規概要","n":13,"q":"公寓大廈應成立管理委員會或推選管理負責人。下列何種管理委員，不受連選得連任一次之限制？","o":["主任委員","監察委員","財務委員","消防委員"],"a":3},{"id":"109r15","year":109,"cat":"不動產經紀相關法規概要","n":15,"q":"近來針對不動產經紀業的廣告行為，發生許多爭議。依不動產經紀業管理條例之規定，下列敘述何者正確？","o":["經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售","廣告及銷售內容，應與事實相符，並應註明廣告業名稱","廣告及銷售內容與事實不符者，經紀業應負行政之損失補償責任","主管機關僅能就經紀業違反得刊登廣告及銷售時間之規定，處罰經紀業新臺幣六萬元以上三十萬元以下罰鍰"],"a":0},{"id":"109r16","year":109,"cat":"不動產經紀相關法規概要","n":16,"q":"關於不動產經紀業管理條例之用辭定義，下列敘述何者正確？","o":["預售屋指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物","差價係指買方支付斡旋金之交易價格與賣方委託銷售價格之差額","經紀人員包含經紀人或經紀營業員。經紀人指依本條例規定經營仲介或代銷業務之公司或商號；經紀營業員之職務為協助經紀人執行仲介或代銷業務","加盟經營者係指經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督"],"a":3},{"id":"109r17","year":109,"cat":"不動產經紀相關法規概要","n":17,"q":"不動產經紀業者從事不動產買賣之仲介業務時，在向買方收取斡旋金前，未以書面告知買方斡旋金契約與內政部版「要約書」之區別及其替代關係等資訊，將違反下列那一項規定？","o":["構成欺罔行為，且足以影響交易秩序者，將違反公平交易法第二十五條規定","不當爭取交易之機會，將違反公平交易法第二十三條規定","為虛偽不實或引人錯誤之表示或表徵，將違反公平交易法第二十一條規定","致與他人營業或服務之設施或活動混淆者，將違反公平交易法第二十二條規定"],"a":0},{"id":"109r18","year":109,"cat":"不動產經紀相關法規概要","n":18,"q":"依公平交易法之規定，事業不得為限制競爭之行為，下列敘述何者錯誤？","o":["事業不得限制消費者，就供給之商品轉售與第三人或第三人再轉售時之價格","以不正當限制交易相對人之事業活動為條件，而與其交易之行為","以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為","無正當理由，對他事業給予差別待遇之行為"],"a":0},{"id":"109r19","year":109,"cat":"不動產經紀相關法規概要","n":19,"q":"消費者保護法針對企業經營者在定型化契約中所用之條款，有非常多的規定。下列敘述何者正確？","o":["企業經營者應給與消費者定型化契約書。但依其契約之性質致給與顯有困難者，不在此限","企業經營者應向消費者明示定型化契約條款之內容；明示其內容顯有困難者，應以顯著之方式，公告其內容後，該條款立即成為契約之內容","定型化契約書經消費者簽名或蓋章者，企業經營者應給與消費者該定型化契約書副本","定型化契約條款如有疑義時，應為有利於雙方當事人之解釋"],"a":0},{"id":"109r20","year":109,"cat":"不動產經紀相關法規概要","n":20,"q":"甲於網路上看到乙不動產開發商委託丙廣告媒體經營者刊登不動產買賣廣告後，向乙購買了一戶房屋。於交屋後發現有廣告不實的爭議。下列敘述何者錯誤？","o":["乙應確保廣告內容之真實，其對甲所負之義務不得低於廣告之內容。乙之商品或服務廣告內容，於契約成立後，應確實履行","甲可以向消費者保護團體提出廣告爭議之申訴、調解，或是直接向直轄市或縣（市）消費爭議調解委員會申請調解","丙明知或可得而知廣告內容與事實不符者，就甲因信賴該廣告所受之損害與企業經營者負連帶責任","甲與乙因商品或服務發生廣告之消費爭議時，甲得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴"],"a":1},{"id":"109r21","year":109,"cat":"不動產經紀相關法規概要","n":21,"q":"甲為A屋的所有權人，委託乙仲介公司幫忙賣房子。關於甲乙適用消費者保護法的情形，下列敘述何者錯誤？","o":["甲和乙所發生之法律關係，屬於消費關係","乙提出乙定型化契約條款作為契約內容而訂立之委託銷售契約屬於定型化契約","甲和乙訂定買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態，屬於分期付款之契約","甲和乙如果適用乙所提出的定型化契約，仍然可以由契約當事人個別磋商而合意擬定個別磋商條款"],"a":2},{"id":"109r22","year":109,"cat":"不動產經紀相關法規概要","n":22,"q":"為維護消費者之權益，保障消費者之健康與安全，消費者保護法於第二章第一節規定「健康與安全保障」專節。下列敘述何者錯誤？","o":["從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任","企業經營者對消費者或第三人之損害賠償責任，不得預先約定限制或免除","輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，需負第三人責任","企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，應即回收該批商品或停止其服務"],"a":2},{"id":"109r23","year":109,"cat":"不動產經紀相關法規概要","n":23,"q":"約定專用部分係指公寓大廈共用部分經約定供特定區分所有權人使用者。請問，就公寓大廈管理條例之規定，下列敘述何者錯誤？","o":["於維護、修繕約定專用部分，必須使用共用部分時，應經區分所有權人會議之同意後為之","公寓大廈本身所占之地面不得為約定專用部分","規約除應載明專有部分及共用部分範圍外，約定專用部分之範圍及使用主體，非經載明於規約者，不生效力","成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限"],"a":0},{"id":"109r24","year":109,"cat":"不動產經紀相關法規概要","n":24,"q":"某公寓大廈社區將原本為甲所有之專有部分，經約定後供共同使用。請問該約定共用部分，於公寓大廈管理條例之規定中，下列敘述何者錯誤？","o":["公寓大廈之起造人於申請建造執照時，應檢附資料包含約定共用部分標示之詳細圖說及規約草約。於設計變更時亦同","約定共用部分之修繕、管理、維護，由專有部分區分所有權人甲負擔之","約定共用部分，若涉及公共環境清潔衛生之維持、公共消防滅火器材之維護、公共通道溝渠及相關設施之修繕，其費用政府得視情況予以補助","專有部分經依區分所有權人會議約定為約定共用部分者，應經甲之同意，否則不生效力"],"a":1},{"id":"109r25","year":109,"cat":"不動產經紀相關法規概要","n":25,"q":"公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者，為共用部分。公寓大廈管理條例對於共用部分權利義務關係之規定，下列敘述何者錯誤？","o":["管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕","共用部分之修繕費係因可歸責於區分所有權人或住戶之事由所致者，由該區分所有權人或住戶負擔。其費用若區分所有權人會議或規約另有規定者，從其規定","各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定","共用部分及其相關設施之拆除，應由管理負責人或管理委員會決定為之"],"a":3},{"id":"108m1","year":108,"cat":"民法概要","n":1,"q":"下列何者非屬我國民法上所稱之「土地的定著物」？","o":["燈塔","房屋","柏油馬路","蓄水池"],"a":2},{"id":"108m2","year":108,"cat":"民法概要","n":2,"q":"依我國民法之規定，以下關於行為能力之敘述，何者錯誤？","o":["無行為能力人之意思表示，無效","限制行為能力人未得法定代理人之允許，所為之單獨行為，效力未定","限制行為能力人所訂立之契約，未經承認前，相對人得撤回之","限制行為能力人用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效"],"a":1},{"id":"108m3","year":108,"cat":"民法概要","n":3,"q":"甲受丙之詐欺，而授權乙向不知情的丁購買A屋，請問依我國民法的規定，下列敘述何者正確？","o":["甲因受丙之詐欺而為意思表示，故可撤銷其授權乙之行為","甲因受丙之詐欺而為意思表示，故可撤銷A屋之買賣契約","甲若欲行使民法第92條之撤銷權，應於發現詐欺後，一年內為之。但自意思表示後，經過十年，不得撤銷","甲因受丙之詐欺而為授權行為，其撤銷意思表示時，可以對抗善意第三人"],"a":2},{"id":"108m4","year":108,"cat":"民法概要","n":4,"q":"依我國民法的規定，下列關於最高限額抵押權之敘述，何者錯誤？","o":["稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權","最高限額抵押權人就已確定之原債權，僅得於其約定之最高限額範圍內，行使其權利","最高限額抵押權所擔保之原債權，未約定確定之期日者，抵押人或抵押權人得隨時請求確定其所擔保之原債權","最高限額抵押權得約定其所擔保原債權應確定之期日，並得於確定之期日後，不待變更登記即變更之"],"a":3},{"id":"108m5","year":108,"cat":"民法概要","n":5,"q":"依我國民法之規定，下列關於夫妻財產制之敘述，何者錯誤？","o":["夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以共同財產制，為其夫妻財產制","夫妻財產制契約之訂立、變更或廢止，應以書面為之","夫妻財產制契約之訂立、變更或廢止，非經登記，不得以之對抗第三人","夫妻於婚姻關係存續中，得以契約廢止其財產契約，或改用他種約定財產制"],"a":0},{"id":"108m6","year":108,"cat":"民法概要","n":6,"q":"依我國民法之規定，下列關於監護之敘述，何者正確？","o":["已結婚的未成年人而無父母，或父母均不能行使、負擔對於其未成年子女之權利、義務時，應置監護人","父母對其未成年之子女，得因特定事項，於一定期限內，以書面委託他人行使監護之職務","為保護未成年子女之權益，監護人不得辭任其職務","監護人得受讓受監護人之財產"],"a":1},{"id":"108m7","year":108,"cat":"民法概要","n":7,"q":"依我國民法的規定，下列關於抵押權之敘述，何者錯誤？","o":["稱普通抵押權者，謂債權人對於債務人或第三人不移轉占有而供其債權擔保之不動產，得就該不動產賣得價金優先受償之權","抵押權所擔保者為原債權、利息、遲延利息、違約金及實行抵押權之費用。但契約另有約定者，不在此限","抵押權之效力，及於抵押物之從物而不及於從權利","不動產所有人設定抵押權後，得將不動產讓與他人。但其抵押權不因此而受影響"],"a":2},{"id":"108m8","year":108,"cat":"民法概要","n":8,"q":"依我國民法，下列關於地上權之敘述，何者錯誤？","o":["地上權設定後，因土地價值之昇降，依原定地租給付顯失公平者，當事人得請求法院增減之","地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金","地上權人得將其權利讓與他人或設定抵押權。但契約另有約定或另有習慣者，不在此限","地上權人積欠地租達一年之總額，除另有習慣外，土地所有人得定相當期限催告地上權人支付地租"],"a":3},{"id":"108m9","year":108,"cat":"民法概要","n":9,"q":"依我國民法之規定，下列關於租賃契約之敘述何者正確？","o":["甲將自己所有之A屋租予乙後，又將A屋租予丙並交付占有予丙，乙得知後可向丙主張交付A屋","甲將自己所有之A屋租予乙，並交付占有予乙後，A屋竟遭丙無權占有。此時，乙可對丙主張占有物返還請求權","甲將自己所有之A屋租予乙供居住之用，乙雖於訂約時已知A屋為輻射屋，但因輻射屋會危及乙的健康，故乙仍得主張減少價金","甲將自己所有之A屋租予乙，約定由甲負修繕義務。按民法規定，乙得自行修繕再請求出租人償還費用"],"a":1},{"id":"108m10","year":108,"cat":"民法概要","n":10,"q":"甲未婚生有乙、丙、丁三子，某日甲因細故與乙口角，乙遂憤而毆打甲成傷，當時丙雖在場，然畏懼乙身強體壯，並未勸阻。甲心灰意冷，當場表示自己百年後，乙不得繼承其財產；事後更逢人便訴說丙也不孝，未挺身護甲。丙得知此事甚為憤怒，認為自己僅求自保並沒有錯，遂在某日憤而持刀殺甲，經丁阻止而未得逞，但日後仍經法院判決殺人未遂而受刑之宣告確定。不久甲因年老體衰而去世，請問下列敘述，何者正確？","o":["甲僅表示乙不得繼承其財產，未表示丙不得繼承，故丙仍可繼承其財產","甲雖表示乙不得繼承其財產，但並未追訴乙之傷害罪，乙既未受刑之宣告，故乙仍得繼承甲的財產","甲若宥恕丙之行為，則乙、丙、丁三人可以一起繼承甲的財產","僅有丁可以繼承甲的財產"],"a":3},{"id":"108m11","year":108,"cat":"民法概要","n":11,"q":"依我國民法之規定，下列關於居間契約之敘述何者錯誤？","o":["稱居間者，謂當事人約定，一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約","約定之報酬，較居間人所任勞務之價值，為數過鉅失其公平者，法院得因報酬給付義務人之請求酌減之。報酬已給付者，得請求返還","因婚姻居間而約定報酬者，就其報酬無請求權","居間人就其媒介所成立之契約，無為當事人給付或受領給付之權"],"a":1},{"id":"108m12","year":108,"cat":"民法概要","n":12,"q":"10歲的男童A去同學B家中一起打電動遊戲時，因一言不合吵起來，一氣之下摔壞B父甲新購買的筆電。請問下列敘述何者錯誤？","o":["若摔壞筆電時A有識別能力，則由A單獨負責，甲不可向A之法定代理人乙求償","若摔壞筆電時A有識別能力，則A和其法定代理人乙必須連帶負賠償責任","若摔壞筆電時A無識別能力，則A無須負責","若摔壞筆電時A無識別能力，則由其法定代理人乙單獨負責，但乙可舉證免責"],"a":0},{"id":"108m13","year":108,"cat":"民法概要","n":13,"q":"甲並無將其所有價值十萬元之A手錶出售的意思，卻向乙表示欲以五千元出售之，乙明知甲無出售A手錶之意思，仍當場表示願意以五千元購買時，甲出售A手錶之意思表示的效力如何？","o":["有效","無效","甲得撤銷","效力未定"],"a":1},{"id":"108m14","year":108,"cat":"民法概要","n":14,"q":"甲授與甫滿十八歲之乙代理權，由乙處理出售甲所有之A機車的事宜。乙乃以甲之代理人的名義，以一萬元價金與丙訂立買賣A機車的契約。乙與丙所締結之買賣契約的效力如何？","o":["對甲發生效力","甲未承認前，效力未定","乙之法定代理人未承認前，效力未定","乙之法定代理人得撤銷之"],"a":0},{"id":"108m15","year":108,"cat":"民法概要","n":15,"q":"甲、乙締結買賣甲所有之A屋的契約，乙並先為部分價金之給付。其後，乙未依約定期限給付剩餘價金。就甲以乙履行遲延而解除A屋買賣契約之情形，下列敘述，何者正確？","o":["經甲定期間催告乙履行，甲得於經相當期限後，不須再為催告，即得解除契約","甲僅限於法律規定之事由始得解除，不得與乙約定合意解除之事由","契約經解除後，甲、乙互負回復原狀的義務，甲不得向乙請求損害賠償","契約經解除後，因乙有可歸責事由，甲返還乙已給付之價金時，不須附加利息"],"a":0},{"id":"108m16","year":108,"cat":"民法概要","n":16,"q":"就下列甲、乙間之法律關係，何者為非經登記不生效力的情形？","o":["甲、乙間締結買賣甲之不動產的契約時","乙繼承被繼承人甲之不動產時","甲以其土地供乙設定不動產役權時","甲將其有抵押權擔保之債權讓與予乙時"],"a":2},{"id":"108m17","year":108,"cat":"民法概要","n":17,"q":"就甲、乙、丙三人對丁負有平均分擔之300萬元連帶債務的情形，下列敘述，何者正確？","o":["甲對丁為債務之承認而中斷時效時，其效力亦及於乙、丙之債務","丁請求甲支付全額獲勝訴判決後，仍未能自甲受償時，得再請求乙支付全額","甲清償全額後，如乙不能償還其分擔額，甲亦僅能向丙求償100萬元","甲對丁清償100萬元後，丁即不得再次向甲請求支付剩餘之200萬元"],"a":1},{"id":"108m18","year":108,"cat":"民法概要","n":18,"q":"甲、乙分別共有A地，各有二分之一應有部分。在甲乙未有任何協議之情形下，下列敘述，何者正確？","o":["甲得以其應有部分供丙設定普通地上權","甲不得將其應有部分出賣、並移轉登記予丁","甲僅得於其應有部分種植作物","甲得以其應有部分供戊設定普通抵押權"],"a":3},{"id":"108m19","year":108,"cat":"民法概要","n":19,"q":"下列何者不得為抵押權之標的物？","o":["不動產役權","地上權","農育權","典權"],"a":0},{"id":"108m20","year":108,"cat":"民法概要","n":20,"q":"甲育有子女乙，丙育有子女丁、戊，乙男與丁女結婚後育有子女己。就此情形，下列敘述何者錯誤？","o":["甲、丁為直系姻親","乙、戊為旁系姻親","甲、丙為旁系姻親","己、戊為旁系血親"],"a":2},{"id":"108m21","year":108,"cat":"民法概要","n":21,"q":"甲將其所有之A土地上之B建物讓與乙時，在房屋得使用期限內，乙與甲間有何法律關係？","o":["推定有租賃關係","視為有租賃關係","推定有普通地上權關係","視為有普通地上權關係"],"a":0},{"id":"108m22","year":108,"cat":"民法概要","n":22,"q":"甲、乙婚後生育有子女丙、丁、戊。戊與己結婚生育有子女庚、辛後，不幸早於其父母去世。就甲高齡過世後遺下之財產，下列法定繼承人之應繼分比例，何者正確？","o":["乙二分之一、丙四分之一、丁四分之一","乙三分之一、丙三分之一、丁三分之一","乙四分之一、丙四分之一、丁四分之一、己四分之一","乙四分之一、丙四分之一、丁四分之一、庚八分之一、辛八分之一"],"a":3},{"id":"108m23","year":108,"cat":"民法概要","n":23,"q":"下列關於遺囑之敘述，何者正確？","o":["十八歲之限制行為能力人所為之遺囑，當然無效","受輔助宣告之成年人所為之遺囑，當然無效","口授遺囑，自遺囑人能依其他方式為遺囑之時起，經過三個月而失其效力","公證人的受僱人得為公證遺囑之見證人"],"a":2},{"id":"108m24","year":108,"cat":"民法概要","n":24,"q":"依我國民法之規定，下列關於子女姓氏之敘述，何者錯誤？","o":["父母於子女出生登記前，應以書面約定子女從父姓或母姓。未約定或約定不成者，於戶政事務所抽籤決定之","子女經出生登記後，於未成年前，得由父母以書面約定變更為父姓或母姓","子女已成年者，得變更為父姓或母姓","非婚生子女從母姓。經生父認領者，從父姓"],"a":3},{"id":"108m25","year":108,"cat":"民法概要","n":25,"q":"甲乙為夫妻，育有一子丙，並共同收養丁為養子。某日甲因交通意外去世，未留有遺囑，請問依我國民法的規定，下列敘述，何者錯誤？","o":["乙、丙、丁三人得以繼承","乙、丙、丁三人之應繼分各為三分之一","在分割遺產前，乙、丙、丁三人對於遺產全部按其應繼分為分別共有","繼承人對於甲之債務，以因繼承所得遺產為限，負清償責任"],"a":2},{"id":"108v1","year":108,"cat":"不動產估價概要","n":1,"q":"甲君擬購買相鄰兩塊土地合併建築，請問在此目的下所評估出的價值，以貨幣金額表示者，稱為：","o":["正常價格","限定價格","特定價格","特殊價格"],"a":1},{"id":"108v2","year":108,"cat":"不動產估價概要","n":2,"q":"有一筆建地面積1,000坪，預期興建為住宅大樓後的總銷售金額為3.8億元，若營建施工費為1億元，管理銷售及規劃設計等費用為1,100萬元，合理利潤率為16%，資本利息綜合利率為2%，請問該筆建地每坪單價約為：","o":["210萬元","420萬元","21萬元","42萬元"],"a":2},{"id":"108v3","year":108,"cat":"不動產估價概要","n":3,"q":"不動產面臨道路之寬度，此屬於影響不動產價格之何種因素？","o":["個別因素","區域因素","一般因素","特別因素"],"a":0},{"id":"108v4","year":108,"cat":"不動產估價概要","n":4,"q":"設三宗土地合併後整體開發利用，其合併後價格為2,500萬元，合併前價格分別為800萬元、500萬元及700萬元。則對於原來700萬元之土地，其合併後之價格應為何？","o":["825萬元","850萬元","875萬元","895萬元"],"a":2},{"id":"108v5","year":108,"cat":"不動產估價概要","n":5,"q":"某4層樓公寓，其各層面積均相同，若四樓每坪售價23萬元，三樓每坪售價20萬元，二樓每坪售價24萬元，一樓每坪售價30萬元，若三樓之樓層別效用比為100%，則一樓之樓層別效用比為何？","o":["120%","130%","140%","150%"],"a":3},{"id":"108v6","year":108,"cat":"不動產估價概要","n":6,"q":"不動產估價師應兼採二種以上估價方法推算勘估標的價格。以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種方法之價格應賦予相對較大之權重？","o":["成本法","土地開發分析法","折現現金流量分析法","比較法"],"a":2},{"id":"108v7","year":108,"cat":"不動產估價概要","n":7,"q":"經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討後試算價格差距如下，何者應排除該試算價格之適用？","o":["百分之二十五","百分之十五","百分之十","百分之五"],"a":0},{"id":"108v8","year":108,"cat":"不動產估價概要","n":8,"q":"對於估價目的為不動產買賣交易之參考所為之不動產估價，應評估的價格為：","o":["買方希望之價格","賣方希望之價格","市場中最可能之成交價格","買賣雙方希望價格之平均數"],"a":2},{"id":"108v9","year":108,"cat":"不動產估價概要","n":9,"q":"勘估標的因位於垃圾掩埋場附近，造成其價格下降，此屬於何種原則？","o":["替代原則","最有效原則","外部性原則","供需原則"],"a":2},{"id":"108v10","year":108,"cat":"不動產估價概要","n":10,"q":"使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，稱為：","o":["重建成本","重置成本","直接成本","間接成本"],"a":0},{"id":"108v12","year":108,"cat":"不動產估價概要","n":12,"q":"政府宣布實施空屋稅政策，此屬於何種影響價格之因素？","o":["個別因素","情況因素","一般因素","區域因素"],"a":2},{"id":"108v13","year":108,"cat":"不動產估價概要","n":13,"q":"就勘估標的之構成部分或全體，調查其使用材料之種別、品級、數量及所需勞力種別、時間等，並以勘估標的所在地區於價格日期之各種單價為基礎，計算其營造或施工費的方法為：","o":["直接法","間接法","工程造價比較法","單位面積比較法"],"a":0},{"id":"108v14","year":108,"cat":"不動產估價概要","n":14,"q":"推算總收入及有效總收入時，應與相關資料校核比較，下列何者非屬該相關資料？","o":["目前或未來可能之計畫收入","相同產業或具替代性比較標的總收入及有效總收入","期末價值","勘估標的往年之總收入及有效總收入"],"a":2},{"id":"108v15","year":108,"cat":"不動產估價概要","n":15,"q":"有關比較法試算價格之調整運算過程中，遇有下列之情形，須判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。何者為正確？","o":["區域因素調整率、個別因素調整率，各大於百分之三十","區域因素及個別因素內之任一單獨項目之價格調整率大於百分之十五","區域因素調整率與個別因素調整率之和，大於百分之三十","比較標的性質特殊或區位特殊缺乏市場交易資料，並於估價報告書中敘明者，不在此限"],"a":1},{"id":"108v16","year":108,"cat":"不動產估價概要","n":16,"q":"不動產估價技術規則第99條之計算公式，勘估標的之基地價格＝勘估標的之房地價格－勘估標的之建物成本價格。請問此為何種學說之主張？","o":["土地貢獻說","建物貢獻說","聯合貢獻說","合併貢獻說"],"a":0},{"id":"108v17","year":108,"cat":"不動產估價概要","n":17,"q":"有關直接資本化法，下列敘述何者為正確？","o":["指勘估標的過去平均一年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","指勘估標的過去平均三年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","指勘估標的未來平均一年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","指勘估標的未來平均三年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法"],"a":2},{"id":"108v18","year":108,"cat":"不動產估價概要","n":18,"q":"不動產估價師蒐集比較實例時，應依循之原則，下列敘述何者錯誤？","o":["實例價格形成日期與勘估標的之價格日期接近者","須蒐集與勘估標的使用性質或使用管制相同者之實例","須蒐集與勘估標的位於同一供需圈之近鄰地區或類似地區者之實例","實例價格屬正常價格、可調整為正常價格或與勘估標的價格種類相同者"],"a":1},{"id":"108v19","year":108,"cat":"不動產估價概要","n":19,"q":"有關區域因素之調整，下列敘述何者為正確？","o":["此項調整，係以比較標的之區域價格水準為基礎，就區域因素不同所產生之價格差異，逐項進行之分析與調整","此項調整為將勘估標的之價格轉化為與比較標的同一近鄰地區內之價格水準","所選用之比較標的係位於同一供需圈但不在同一類似地區內","所謂區域因素，指影響類似地區不動產價格水準之因素"],"a":0},{"id":"108v20","year":108,"cat":"不動產估價概要","n":20,"q":"下列敘述何者為正確？","o":["百分率法與差額法均為將影響勘估標的及比較標的價格差異的一般因素、區域因素與個別因素逐項比較進行價格調整之方法","採比較法估價時，應先進行「情況調整」，再進行「價格日期調整」、「個別因素修正」，最後是「區域因素修正」","對勘估標的價格進行情況調整及價格日期調整","對比較標的價格進行情況調整及價格日期調整"],"a":3},{"id":"108v21","year":108,"cat":"不動產估價概要","n":21,"q":"依不動產估價技術規則之規定，運用計量模型分析法進行估價，下列敘述何者錯誤？","o":["須蒐集應用計量模型分析關係式自變數個數五倍以上之比較標的","本法須先求出各主要影響價格因素與比較標的價格二者之關係式，以推算各主要影響價格因素之調整率及調整額之方法","採迴歸分析者，其調整後判定係數不得低於零點八","截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於百分之五"],"a":2},{"id":"108v22","year":108,"cat":"不動產估價概要","n":22,"q":"下列何者非屬不動產估價師受理委託估價之勘估標的？","o":["土地及其權利估價","建築改良物及其權利估價","不動產租金估計","不動產稅負之估算"],"a":3},{"id":"108v23","year":108,"cat":"不動產估價概要","n":23,"q":"不動產估價師在收集比較標的相關交易等案例及資料時，得向當事人、四鄰、其他不動產估價師、不動產經紀人員、地政士、地政機關、金融機構、公地管理機關、司法機關、媒體或有關單位收集之。請問：到實價登錄系統查詢交易案例相關資訊，屬向何者收集資料？","o":["不動產經紀人","地政士","地政機關","媒體"],"a":2},{"id":"108v24","year":108,"cat":"不動產估價概要","n":24,"q":"對具有市場性之不動產，以違反經濟合理性之不動產分割為前提，查估其所形成之價值，並以貨幣金額表示者，屬下列那一種價格？","o":["特殊價格","特定價格","正常價格","限定價格"],"a":3},{"id":"108v25","year":108,"cat":"不動產估價概要","n":25,"q":"下列敘述何者為正確？","o":["具有市場性之不動產，以不動產所有權以外其他權利與所有權合併為目的，查估其所形成之價值，並以貨幣金額表示者，屬「限定價格」","具有市場性之不動產，基於特定條件下形成之價值，並以貨幣金額表示者，為「特殊價格」","對不具市場性之不動產所估計之價值，並以貨幣金額表示者，為「特定價格」","對不具市場性之不動產，以不動產合併為目的，查估其所形成之價值，並以貨幣金額表示者，屬「限定價格」"],"a":0},{"id":"108l1","year":108,"cat":"土地法與土地相關稅法概要","n":1,"q":"私有土地所有權之移轉、設定負擔或租賃，如有妨害基本國策者，中央地政機關得報請下列何機關制止之？","o":["立法院","司法院","行政院","監察院"],"a":2},{"id":"108l2","year":108,"cat":"土地法與土地相關稅法概要","n":2,"q":"因登記錯誤遺漏或虛偽致受有損害者，由該地政機關負損害賠償責任，此項損害賠償之請求，如經該地政機關拒絕，受損害人得採取下列何種處理方式？","o":["向行政院申訴","向立法院告發","向司法機關起訴","向監察院告發"],"a":2},{"id":"108l3","year":108,"cat":"土地法與土地相關稅法概要","n":3,"q":"平均地權條例規定照價收買後之土地，其權屬應為？","o":["國有","直轄市、縣（市）有","鄉鎮有","公營事業有"],"a":1},{"id":"108l4","year":108,"cat":"土地法與土地相關稅法概要","n":4,"q":"下列有關土地徵收條例的優先購買權敘述，何者正確？","o":["行使主體係被徵收之原土地所有權人或其繼承人","行使原因須被徵收土地經依徵收計畫使用後，依法變更原使用目的而讓售","行使條件須與讓售條件相同，且應公告三個月","行使期間須於讓售決定後十日內表示優先購買"],"a":0},{"id":"108l5","year":108,"cat":"土地法與土地相關稅法概要","n":5,"q":"下列有關基地房屋之優先購買權敘述，何者正確？","o":["基地出賣時，抵押權人有依同樣條件優先購買之權","房屋出賣時，抵押權人有依同樣條件優先購買之權","優先購買權人，於接到出賣通知後一個月內不表示者，其優先權視為放棄","出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人"],"a":3},{"id":"108l6","year":108,"cat":"土地法與土地相關稅法概要","n":6,"q":"下列有關土地所有權移轉或設定典權，申報移轉現值之審核標準，係以何時之當期公告土地現值為準？","o":["申報人逾訂定契約之日起三十日始申報者，以訂約日","遺贈之土地，以遺贈人死亡後六個月","依法院判決移轉登記者，以申報人向法院起訴日","經法院拍賣之土地，以強制執行日"],"a":2},{"id":"108l7","year":108,"cat":"土地法與土地相關稅法概要","n":7,"q":"下列有關平均地權條例及土地稅法中有關累進課地價稅之敘述，何者正確？","o":["超過累進起點地價未達五倍者，就其超過部分課徵千分之三十","超過累進起點地價五倍至十倍者，就其超過部分課徵千分之三十五","超過累進起點地價十倍至十五倍者，就其超過部分課徵千分之四十","超過累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"],"a":3},{"id":"108l8","year":108,"cat":"土地法與土地相關稅法概要","n":8,"q":"預告登記，對於因下列何種法律行為或事實而為之新登記，無排除之效力？","o":["重劃","繼承","徵收","都市更新"],"a":2},{"id":"108l9","year":108,"cat":"土地法與土地相關稅法概要","n":9,"q":"山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地之類別前，適用何種管制？","o":["林業用地","農牧用地","國土保安用地","原住民保留地"],"a":0},{"id":"108l10","year":108,"cat":"土地法與土地相關稅法概要","n":10,"q":"下列敘述何者正確？","o":["個人房屋、土地交易損失，得自交易日以後五年內之房屋、土地交易所得減除之","個人房屋、土地交易損失，得自交易日以後七年內之房屋、土地交易所得減除之","重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原扣抵或退還稅額","重購之自住房屋、土地，於重購後七年內改作其他用途或再行移轉時，應追繳原扣抵或退還稅額"],"a":2},{"id":"108l11","year":108,"cat":"土地法與土地相關稅法概要","n":11,"q":"依土地稅法規定，關於地價稅之納稅義務人，下列何項敘述錯誤？","o":["信託土地，於信託關係存續中，為受託人","設有典權土地，為出典人","承領土地，為承領人","承墾土地，為耕作權人"],"a":1},{"id":"108l12","year":108,"cat":"土地法與土地相關稅法概要","n":12,"q":"依都市計畫法規定，都市計畫區內之公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之幾？","o":["百分之十","百分之十二","百分之十五","百分之十七"],"a":0},{"id":"108l13","year":108,"cat":"土地法與土地相關稅法概要","n":13,"q":"依平均地權條例之規定，直轄市或縣（市）政府對於尚未建築之私有建築用地之處理方式，下列何項敘述錯誤？","o":["除有特殊情形外，應限制尚未建築用地面積最高額以十公畝為限","對於超額私有建築用地，應通知土地所有權人於二年內出售或建築使用","逾期未出售或未建築使用者，得予照價收買","照價收買價格，按收買當時查估之正常市價"],"a":3},{"id":"108l14","year":108,"cat":"土地法與土地相關稅法概要","n":14,"q":"出租之公、私有耕地因實施市地重劃致不能達到原租賃之目的者，可由直轄市或縣（市）政府逕為註銷其租約並通知當事人，如重劃後分配土地者，承租人得請求之補償，下列何項為正確？","o":["按重劃計畫書公告當期該土地公告土地現值減除預計土地增值稅後餘額之三分之一","按重劃計畫書公告當期該土地查估之市價減除預計土地增值稅後餘額之三分之一","按重劃計畫書公告當期該土地之公告土地現值之三分之一","按重劃計畫書公告當期該土地查估之市價之三分之一"],"a":2},{"id":"108l15","year":108,"cat":"土地法與土地相關稅法概要","n":15,"q":"都市計畫應依據現在及既往情況，並預計未來幾年內之發展情形訂定之？","o":["十五年","二十年","二十五年","三十年"],"a":2},{"id":"108l16","year":108,"cat":"土地法與土地相關稅法概要","n":16,"q":"甲將其所有X地號土地出售予乙後，由甲會同乙申辦土地買賣移轉登記時，請問本案應按何標準計收千分之一的登記費？","o":["該筆土地的公告現值","該筆土地的公告地價","該筆土地的買賣實價","該筆土地的申報地價"],"a":3},{"id":"108l17","year":108,"cat":"土地法與土地相關稅法概要","n":17,"q":"已公告徵收之土地，需用土地人應切實按核准計畫及所定期限使用。在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由其上級事業主管機關列管。有下列那種情形，應辦理撤銷徵收？","o":["因工程變更設計，致原徵收之土地不在工程用地範圍內","土地徵收計畫開始使用前，興辦之事業改變、興辦事業計畫經註銷、開發方式改變或取得方式改變","公告徵收時，都市計畫已規定以市地重劃或其他方式開發","已依徵收計畫開始使用，尚未依徵收計畫完成使用之土地，因情事變更，致原徵收土地之全部或一部已無徵收之必要"],"a":2},{"id":"108l18","year":108,"cat":"土地法與土地相關稅法概要","n":18,"q":"下列土地何者屬於土地法第四條所稱的公有土地？","o":["所有權人登記為台灣糖業股份有限公司","所有權人登記為臺灣石門農田水利會","所有權人登記為國家中山科學研究院","所有權人登記為埔里鎮"],"a":3},{"id":"108l19","year":108,"cat":"土地法與土地相關稅法概要","n":19,"q":"依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理？","o":["十五日","二十日","二十五日","三十日"],"a":0},{"id":"108l20","year":108,"cat":"土地法與土地相關稅法概要","n":20,"q":"非都市土地申請開發達一定規模者，應辦理土地使用分區變更，下列何項敘述錯誤？","o":["申請開發社區之計畫達五十戶或土地面積在一公頃以上，應變更為鄉村區","申請開發為工業使用之土地面積達十公頃以上，應變更為工業區","申請開發遊憩設施之土地面積達五公頃以上，應變更為特定專用區","申請開發高爾夫球場之土地面積達五公頃以上，應變更為特定專用區"],"a":3},{"id":"108l21","year":108,"cat":"土地法與土地相關稅法概要","n":21,"q":"關於繼承登記，下列何項敘述錯誤？","o":["繼承登記，得自繼承開始之日起，六個月內為之。申請逾期者，每逾一個月得處應納登記費額一倍之罰鍰","自繼承開始之日起逾六個月未辦繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內申請登記；逾期仍未申請者，得由地政機關予以列冊管理","前項列冊管理期間為十五年，逾期仍未申請登記者，由地政機關將該土地或建築改良物清冊移請財政部國有財產署公開標售","標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取，逾十年無繼承人申請提領該價款者，歸屬國庫"],"a":1},{"id":"108l22","year":108,"cat":"土地法與土地相關稅法概要","n":22,"q":"土地所有權辦理買賣移轉登記時，申報土地移轉現值之審核標準，下列何項敘述錯誤？","o":["申報人於訂定契約之日起三十日內申報者，以訂約日當期之公告土地現值為準","申報人逾訂定契約之日起三十日始申報者，以受理申報機關收件日當期之公告土地現值為準","遺贈之土地，以遺贈人死亡日當期之公告土地現值為準","依法院判決移轉登記者，以判決確定日當期之公告土地現值為準"],"a":3},{"id":"108l23","year":108,"cat":"土地法與土地相關稅法概要","n":23,"q":"區段徵收土地時，地價補償得經土地所有權人申請，以徵收後可供建築之抵價地折算抵付，而抵價地總面積，以徵收總面積百分之五十為原則，如因情況特殊，經上級主管機關核准者，不在此限，但不得少於百分之四十；惟曾經農地重劃者，該重劃地區部分之抵價地不得少於多少？","o":["百分之四十三","百分之四十五","百分之四十七","百分之四十九"],"a":1},{"id":"108l24","year":108,"cat":"土地法與土地相關稅法概要","n":24,"q":"依規定民國109年需辦理重新規定地價，下列對規定地價或重新規定地價之敘述，何項錯誤？","o":["規定地價或重新規定地價後，每二年重新規定地價一次，但必要時得延長之","須分區調查最近一年之土地買賣價格或收益價格","公告及申報地價，其期限為三十日","申報地價未滿公告地價百分之八十時，得照價收買或以公告地價為其申報地價"],"a":3},{"id":"108l25","year":108,"cat":"土地法與土地相關稅法概要","n":25,"q":"非都市土地依區域計畫法施行細則之規定，得劃定幾種使用區？編定幾種使用地？","o":["十種使用區；十八種使用地","十種使用區；十九種使用地","十一種使用區；十八種使用地","十一種使用區；十九種使用地"],"a":3},{"id":"108r1","year":108,"cat":"不動產經紀相關法規概要","n":1,"q":"關於不動產經紀業營業保證金之敘述，以下何者錯誤？","o":["營業保證金除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押或設定負擔","不動產經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金。但不包括營業保證金之孳息","應繳之營業保證金及繳存或提供擔保之辦法，由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會定之","經紀業因合併、變更組織時對其所繳存之營業保證金之權利應隨之移轉"],"a":2},{"id":"108r2","year":108,"cat":"不動產經紀相關法規概要","n":2,"q":"依不動產經紀業管理
