<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>物件比較分析｜祐承店長 信義房屋 文心高工店</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --sinyi:#0a6e3f;--sinyi-d:#064d2b;--sinyi-l:#f0f8f4;--sinyi-m:#b8dfc4;
  --red:#C00000;--ink:#1a1410;--paper:#faf8f5;--card:#fff;
  --border:#e0dad3;--border-d:#c8bfb5;--muted:#9a8e84;--dim:#5a4e44;
  --gold:#b8860b;--gold-l:#fffbeb;--gold-m:#fcd34d;
  --sh1:0 1px 4px rgba(0,0,0,.06);--sh2:0 4px 20px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;min-height:100vh;}
header{background:var(--sinyi);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15);}
a.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
a.logo:focus-visible{outline:2px solid #fff;outline-offset:3px;}
.logo-mark{width:30px;height:30px;background:white;display:flex;align-items:center;justify-content:center;}
.logo-name{font-family:"Noto Serif TC",serif;font-size:.92rem;font-weight:700;color:white;letter-spacing:.08em;line-height:1.1;}
.logo-name small{display:block;font-size:.58rem;color:rgba(255,255,255,.7);font-weight:400;letter-spacing:0;}
.page-h{font-size:.78rem;color:rgba(255,255,255,.75);font-weight:500;font-family:"Noto Sans TC",sans-serif;}
main{max-width:1100px;margin:0 auto;padding:28px 18px 80px;}
.input-card{background:var(--card);border:1.5px solid var(--border);padding:24px;margin-bottom:18px;box-shadow:var(--sh1);}
.sec-label{font-size:.68rem;color:var(--sinyi);letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--sinyi-m),transparent);}
textarea.paste{width:100%;min-height:130px;border:1.5px solid var(--border);padding:12px;font-size:.83rem;font-family:"Noto Sans TC",sans-serif;color:var(--ink);resize:vertical;outline:none;line-height:1.75;background:var(--card);}
textarea.paste:focus{border-color:var(--sinyi);box-shadow:0 0 0 3px var(--sinyi-l);}
textarea.paste::placeholder{color:var(--muted);font-size:.78rem;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:20px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sinyi-l);border:1px solid var(--sinyi-m);padding:3px 10px;font-size:.7rem;color:var(--sinyi);font-family:"JetBrains Mono",monospace;border-radius:2px;}
.chip a{color:inherit;opacity:.55;font-size:.62rem;}
.go-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:var(--sinyi);border:none;color:white;font-family:"Noto Serif TC",serif;font-size:.92rem;font-weight:700;cursor:pointer;transition:all .18s;margin-top:14px;letter-spacing:.06em;}
.go-btn:hover:not(:disabled){background:var(--sinyi-d);}
.go-btn:disabled{background:var(--muted);cursor:not-allowed;}
.prog-wrap{margin-top:10px;display:none;}
.prog-bar{height:4px;background:var(--sinyi-m);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--sinyi);width:0%;transition:width .4s ease;}
.prog-label{font-size:.72rem;color:var(--sinyi);margin-top:5px;text-align:center;}
.detail-notice{display:none;background:#fffbeb;border:1px solid var(--gold-m);color:#6b4e00;padding:10px 12px;font-size:.78rem;line-height:1.65;margin-bottom:12px;}
.summary{background:var(--ink);padding:16px 22px;display:flex;flex-wrap:wrap;margin-bottom:14px;box-shadow:var(--sh2);}
.sb{flex:1;min-width:130px;padding:6px 14px;border-right:1px solid rgba(255,255,255,.08);}
.sb:last-child{border-right:none;}
.sb-l{font-size:.6rem;color:rgba(255,255,255,.45);letter-spacing:.1em;margin-bottom:3px;}
.sb-v{font-family:"Noto Serif TC",serif;font-size:1.2rem;font-weight:700;color:white;}
.sb-v.g{color:#4ade80;}.sb-v.y{color:#fcd34d;}
.sort-tip,.formula{font-size:.73rem;color:var(--muted);margin-bottom:8px;line-height:1.6;}
.formula{color:var(--dim);}
.m-sort{display:none;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.m-sort select,.m-sort button{font-family:inherit;font-size:.78rem;padding:6px 8px;border:1.5px solid var(--border-d);background:#fff;color:var(--ink);}
.swipe-hint{display:none;text-align:center;font-size:.72rem;color:var(--muted);margin:0 0 8px;}
.swipe-hint.on{display:block;}
.tbl-wrap{overflow-x:auto;}
table.cmp{width:100%;border-collapse:collapse;background:var(--card);box-shadow:var(--sh1);font-size:.81rem;}
table.cmp thead tr{background:var(--sinyi);}
table.cmp th{padding:9px 11px;text-align:center;font-weight:600;font-size:.73rem;letter-spacing:.04em;white-space:nowrap;border-right:1px solid rgba(255,255,255,.12);color:white;}
table.cmp th:last-child{border-right:none;}
table.cmp th.s{cursor:pointer;}
table.cmp th.s:hover,table.cmp th.act{background:var(--sinyi-d);}
table.cmp th.s:focus-visible{outline:2px solid #fff;outline-offset:-3px;}
.arrows{display:inline-flex;flex-direction:column;font-size:.52rem;line-height:1;margin-left:3px;}
table.cmp tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
table.cmp tbody tr:hover{background:#f5faf7;}
table.cmp tbody tr.best{background:var(--sinyi-l);}
table.cmp tbody tr.best:hover{background:#e0f0e8;}
.td-img{padding:7px;width:96px;position:relative;}
.td-img img{display:block;width:82px;height:58px;object-fit:cover;}
.badge-best{position:absolute;top:9px;left:9px;background:var(--sinyi);color:white;font-size:.58rem;font-weight:700;padding:2px 5px;}
.td-name{padding:8px 11px;min-width:120px;max-width:180px;}
.n-title{font-weight:600;font-size:.81rem;color:var(--ink);line-height:1.35;margin-bottom:1px;}
.n-comm{font-size:.67rem;color:var(--sinyi);font-weight:500;margin-bottom:1px;}
.n-code{font-size:.63rem;color:var(--muted);font-family:"JetBrains Mono",monospace;}
.n-rooms,.n-road{font-size:.68rem;color:var(--dim);margin-top:1px;}
.td-road{padding:8px 11px;font-size:.77rem;color:var(--dim);white-space:nowrap;}
.td-n{padding:8px 11px;text-align:center;font-family:"JetBrains Mono",monospace;white-space:nowrap;}
.bp{color:var(--red);font-weight:700;}.bu{color:var(--sinyi);font-weight:700;}
.bm{font-size:.58rem;font-weight:700;padding:1px 5px;margin-top:2px;display:inline-block;border-radius:2px;}
.bm-r{background:var(--red);color:white;}.bm-g{background:var(--sinyi);color:white;}
.unk{font-family:"Noto Sans TC",sans-serif;font-size:.68rem;font-weight:700;color:#8a5a00;white-space:normal;line-height:1.35;}
.row-warn{display:inline-block;margin-top:4px;font-size:.62rem;color:#8a5a00;background:#fffbeb;border:1px solid #fcd34d;padding:1px 5px;}
.park-lab{display:flex;align-items:center;justify-content:center;gap:3px;font-size:.62rem;color:var(--muted);margin-top:3px;font-family:"Noto Sans TC",sans-serif;}
.park-lab input{width:62px;border:1px solid var(--border-d);padding:2px 4px;font-size:.72rem;font-family:"JetBrains Mono",monospace;color:var(--ink);}
.park-pdf{display:none;font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--ink);line-height:1.4;}
body.pdf-export .park-in{display:none !important;}
body.pdf-export .park-pdf{display:inline !important;}
.td-link a{display:inline-block;padding:4px 9px;font-size:.7rem;color:var(--sinyi);border:1px solid var(--sinyi-m);text-decoration:none;border-radius:2px;white-space:nowrap;transition:all .15s;}
.td-link a:hover{background:var(--sinyi);color:white;}
.card-list{display:none;}
.pcard{background:var(--card);border:1px solid var(--border);box-shadow:var(--sh1);padding:12px;}
.pcard.best{background:var(--sinyi-l);border-color:var(--sinyi-m);}
.pcard-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.pcard-metrics div{background:rgba(255,255,255,.72);padding:6px 8px;}
.pcard-metrics dt{font-size:.62rem;color:var(--muted);}
.pcard-metrics dd{font-family:"JetBrains Mono",monospace;font-size:1rem;font-weight:700;margin-top:2px;}
.pcard-metrics dd.unk{font-size:.78rem;}
.pcard-meta{margin-top:8px;font-size:.72rem;color:var(--dim);line-height:1.6;}
.pcard-actions{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.report-meta{background:var(--card);border:1.5px solid var(--border);padding:18px 22px;margin-top:14px;}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.mf label{font-size:.7rem;color:var(--muted);display:block;margin-bottom:4px;}
.mf input{width:100%;border:1.5px solid var(--border);padding:7px 11px;font-size:.83rem;font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s;}
.mf input:focus{border-color:var(--sinyi);}
.act-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:9px 18px;font-size:.78rem;font-family:inherit;cursor:pointer;border-radius:2px;transition:all .15s;border:1.5px solid;font-weight:500;}
.btn-p{background:var(--sinyi);border-color:var(--sinyi);color:white;}
.btn-p:hover{background:var(--sinyi-d);}
.btn-o{background:var(--card);border-color:var(--border-d);color:var(--dim);}
.btn-o:hover{border-color:var(--sinyi);color:var(--sinyi);}
.share-box{display:none;margin-top:10px;padding:9px 13px;background:var(--sinyi-l);border:1px solid var(--sinyi-m);font-size:.76rem;word-break:break-all;}
.overlay{position:fixed;inset:0;background:rgba(10,110,63,.93);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.overlay.on{display:flex;}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ov-text{color:white;font-size:.9rem;font-weight:500;}
.ov-sub{color:rgba(255,255,255,.6);font-size:.75rem;}
@media(max-width:640px){
  header{padding:0 12px;height:50px;}
  .logo-name{font-size:.82rem;}
  .page-h{font-size:.68rem;}
  main{padding:16px 10px 60px;}
  .sb{min-width:45%;}
  .meta-grid{grid-template-columns:1fr;}
  .card-list{display:flex;flex-direction:column;gap:10px;}
  .tbl-wrap{display:none;}
  .m-sort{display:flex;}
  .sort-tip{display:none;}
  .td-img,th.col-img{display:none;}
}

<script>
var PC = window.PropCompare;
var props = [];
var sortKey = "unitPrice";
var sortAsc = true;
var reportShown = false;
var loadGen = 0;
var restoreSortFocus = false;
var DEFAULT_AGENT = "祐承店長";
var DEFAULT_PHONE = "0933-317-625";
var DEFAULT_STORE = "文心高工店";
var brandStore = DEFAULT_STORE;
var parsedAgent = "";

function updateBrand() {
  var agentEl = document.getElementById("agent");
  var agent = (agentEl && agentEl.value.trim()) || DEFAULT_AGENT;
  var sub = document.getElementById("brand-sub");
  if (sub) sub.textContent = (brandStore || DEFAULT_STORE) + "・" + agent;
}

function applyHeader(text, force) {
  var header = PC.parseHeader(text || "");
  if (header.store) brandStore = header.store;
  var agentEl = document.getElementById("agent");
  if (header.agent && (force || !agentEl.value || agentEl.value === DEFAULT_AGENT || agentEl.value === parsedAgent)) {
    agentEl.value = header.agent;
    parsedAgent = header.agent;
  }
  if (header.phone && (force || document.getElementById("phone").value === DEFAULT_PHONE)) {
    document.getElementById("phone").value = header.phone;
  }
  updateBrand();
}

function detect() {
  var list = PC.parseText(document.getElementById("paste").value);
  document.getElementById("chips").innerHTML = list.map(function (p) {
    var href = "https://www.sinyi.com.tw/buy/house/" + p.code;
    return "<div class='chip'>" + PC.esc(p.code) + " <a href='" + PC.esc(href) + "' target='_blank' rel='noopener noreferrer'>↗</a></div>";
  }).join("");
  var btn = document.getElementById("go-btn");
  if (list.length) { btn.disabled = false; btn.textContent = "🔍 分析 " + list.length + " 件物件"; }
  else { btn.disabled = true; btn.textContent = "🔍 分析物件（請先貼入物件訊息）"; }
}

function fmtTrim(n) {
  if (!(n > 0) || !isFinite(n)) return "—";
  var s = (Math.round(n * 100) / 100).toFixed(2);
  if (s.slice(-3) === ".00") return s.slice(0, -3);
  if (s.slice(-1) === "0") return s.slice(0, -1);
  return s;
}
function fmtUnit(n) {
  if (!(n > 0) || !isFinite(n)) return "—";
  return n.toFixed(2);
}
function fmtAge(n) {
  if (!(Number(n) > 0) || !isFinite(Number(n))) return "—";
  var s = (Math.round(Number(n) * 10) / 10).toFixed(1);
  return s.slice(-2) === ".0" ? s.slice(0, -2) : s;
}
function parkVal(p, field) {
  if (!p[field + "Known"] || p[field] == null) return "";
  return String(p[field]);
}
function loadingText() { return "<span class='unk'>載入中…</span>"; }
function rowFlag(p) {
  if (p.detailStatus === "loading") return "<div class='row-warn'>載入中…</div>";
  if (p.detailStatus === "failed" || p.detailFailed) return "<div class='row-warn'>⚠ 未取得詳細資料</div>";
  return "";
}
function parkInputs(p) {
  var dis = p.detailStatus === "loading" ? " disabled" : "";
  var ph = p.detailStatus === "loading" ? "載入中…" : "未填";
  return "<label class='park-lab'>車位坪<input class='park-in' type='number' min='0' step='0.01' inputmode='decimal' data-code='" + PC.esc(p.code) + "' data-field='parkArea' aria-label='" + PC.esc(p.code + " 車位坪數") + "' placeholder='" + ph + "' value='" + PC.esc(parkVal(p, "parkArea")) + "'" + dis + "><span class='park-pdf'></span></label>" +
    "<label class='park-lab'>車位價(萬)<input class='park-in' type='number' min='0' step='0.01' inputmode='decimal' data-code='" + PC.esc(p.code) + "' data-field='parkPrice' aria-label='" + PC.esc(p.code + " 車位價（萬）") + "' placeholder='" + ph + "' value='" + PC.esc(parkVal(p, "parkPrice")) + "'" + dis + "><span class='park-pdf'></span></label>";
}
function unitHtml(d, best) {
  if (d.unitPrice != null) {
    return "<strong>" + fmtUnit(d.unitPrice) + "</strong>" + (best ? "<div class='bm bm-g'>最低</div>" : "");
  }
  return "<span class='unk'>" + PC.esc(d.unitLabel || "—") + "</span>";
}
function linkHtml(p) {
  var href = PC.safeUrl(p.url);
  if (!href) return "<span class='unk'>無連結</span>";
  return "<a href='" + PC.esc(href) + "' target='_blank' rel='noopener noreferrer'>查看 ↗</a>";
}
function proxiedImg(url) {
  var safe = PC.safeUrl(url, "img");
  if (!safe) return "";
  return "/api/prop-img?u=" + encodeURIComponent(safe);
}
function imgHtml(p, cls) {
  var src = proxiedImg(p.img);
  if (!src) return "";
  return "<img src='" + PC.esc(src) + "' alt='" + PC.esc("物件照片 " + p.code) + "' class='" + (cls || "") + "'>";
}

function rows() {
  return PC.sortProps(props, sortKey, sortAsc).map(function (p) {
    var d = PC.calcRow(p);
    d.code = p.code;
    d.title = p.title;
    d.community = p.community;
    d.address = p.address;
    d.price = p.price;
    d.area = p.area;
    d.age = p.age;
    d.floor = p.floor;
    d.totalFloor = p.totalFloor;
    d.rooms = p.rooms;
    d.parkType = p.parkType;
    d.hasPark = p.hasPark;
    d.mgmtFee = p.mgmtFee;
    d.url = p.url;
    d.img = p.img;
    d.detailFailed = p.detailFailed;
    d.parkArea = p.parkArea;
    d.parkPrice = p.parkPrice;
    d.parkAreaKnown = p.parkAreaKnown;
    d.parkPriceKnown = p.parkPriceKnown;
    return d;
  });
}

function renderReport() {
  var data = rows();
  var prices = data.map(function (d) { return Number(d.price); }).filter(function (n) { return n > 0; });
  var units = data.map(function (d) { return d.unitPrice; }).filter(function (n) { return n > 0; });
  var avg = function (a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; };
  var rangeText = prices.length ? fmtTrim(Math.min.apply(null, prices)) + "～" + fmtTrim(Math.max.apply(null, prices)) + " 萬" : "—";
  var avgText = units.length ? avg(units).toFixed(2) + " 萬/坪" : (data.length ? "未填" : "—");
  var minText = units.length ? Math.min.apply(null, units).toFixed(2) + " 萬/坪" : (data.length ? "未填" : "—");
  var avgLabel = "平均扣車單價" + (units.length && units.length < data.length ? "（" + units.length + "／" + data.length + "）" : "");
  document.getElementById("summary").innerHTML =
    "<div class='sb'><div class='sb-l'>比較物件數</div><div class='sb-v'>" + data.length + " 件</div></div>" +
    "<div class='sb'><div class='sb-l'>總價範圍</div><div class='sb-v y'>" + rangeText + "</div></div>" +
    "<div class='sb'><div class='sb-l'>" + PC.esc(avgLabel) + "</div><div class='sb-v g'>" + PC.esc(avgText) + "</div></div>" +
    "<div class='sb'><div class='sb-l'>最低扣車單價</div><div class='sb-v y'>" + PC.esc(minText) + "</div></div>";

  var loading = props.filter(function (p) { return p.detailStatus === "loading"; });
  var failed = props.filter(function (p) { return p.detailStatus === "failed" || (p.detailFailed && p.detailStatus !== "loading"); });
  var notice = document.getElementById("detail-notice");
  if (loading.length) {
    notice.style.display = "block";
    notice.textContent = "正在逐筆補齊屋齡、樓別、管理費與車位（" + loading.length + " 件載入中…）。表格已先用您貼上的總價與坪數。";
  } else if (failed.length) {
    notice.style.display = "block";
    var why = failed[0].detailError ? "（" + failed[0].detailError + "）" : "";
    notice.textContent = "⚠ 有 " + failed.length + " 件未能取得信義房屋詳細資料" + why + "。總價與坪數仍用您貼上的內容，車位可手動填。";
  } else {
    notice.style.display = "none";
    notice.textContent = "";
  }

  var minU = units.length ? Math.min.apply(null, units) : null;
  var minP = prices.length ? Math.min.apply(null, prices) : null;
  var cols = [
    { k: "img", l: "照片", s: false, cls: "col-img" },
    { k: "title", l: "案名", s: false },
    { k: "price", l: "總價（萬）", s: true },
    { k: "withParkUnit", l: "含車單價", s: true },
    { k: "unitPrice", l: "扣車單價", s: true },
    { k: "area", l: "總建坪", s: true },
    { k: "address", l: "路段", s: false },
    { k: "age", l: "屋齡", s: true },
    { k: "floor", l: "樓別", s: true },
    { k: "parkType", l: "車位", s: false },
    { k: "mgmtFee", l: "管理費/月", s: true },
    { k: "link", l: "連結", s: false }
  ];
  var thead = "<thead><tr>" + cols.map(function (c) {
    var isAct = c.s && sortKey === c.k;
    var up = isAct && sortAsc ? "1" : ".25";
    var down = isAct && !sortAsc ? "1" : ".25";
    var arrows = c.s ? "<span class='arrows' aria-hidden='true'><span style='opacity:" + up + "'>▲</span><span style='opacity:" + down + "'>▼</span></span>" : "";
    var aria = c.s ? " tabindex='0' role='columnheader' aria-sort='" + (isAct ? (sortAsc ? "ascending" : "descending") : "none") + "' data-sort='" + c.k + "'" : "";
    return "<th class='" + (c.cls || "") + (c.s ? " s" : "") + (isAct ? " act" : "") + "'" + aria + "><div style='display:flex;align-items:center;justify-content:center;gap:3px;'>" + c.l + arrows + "</div></th>";
  }).join("") + "</tr></thead>";

  var tbody = "<tbody>" + data.map(function (p) {
    var isBU = minU != null && p.unitPrice != null && p.unitPrice.toFixed(2) === minU.toFixed(2);
    var isBP = minP != null && Number(p.price) > 0 && Number(p.price).toFixed(2) === minP.toFixed(2);
    var flr = p.floor && p.totalFloor ? p.floor + "F／" + p.totalFloor + "F" : p.floor ? p.floor + "F" : "—";
    var mgmt = Number(p.mgmtFee) > 0 ? Number(p.mgmtFee).toLocaleString("zh-TW") + " 元" : "—";
    var pk = p.parkType && p.parkType !== "無" ? p.parkType : p.hasPark ? "有" : "無";
    return "<tr class='" + (isBU ? "best" : "") + "'>" +
      "<td class='td-img'>" + imgHtml(p) + (isBU ? "<div class='badge-best'>★ 最優</div>" : "") + "</td>" +
      "<td class='td-name'><div class='n-title'>" + PC.esc(p.title) + "</div>" +
      (p.community ? "<div class='n-comm'>" + PC.esc(p.community) + "</div>" : "") +
      "<div class='n-code'>" + PC.esc(p.code) + "</div>" +
      (p.rooms ? "<div class='n-rooms'>" + PC.esc(p.rooms) + "</div>" : "") +
      rowFlag(p) + "</td>" +
      "<td class='td-n " + (isBP ? "bp" : "") + "'><strong>" + fmtTrim(p.price) + "</strong>" + (isBP ? "<div class='bm bm-r'>最低</div>" : "") + "</td>" +
      "<td class='td-n'>" + (p.withParkUnit != null ? fmtUnit(p.withParkUnit) : "—") + "</td>" +
      "<td class='td-n " + (isBU ? "bu" : "") + "'>" + unitHtml(p, isBU) + "</td>" +
      "<td class='td-n'>" + fmtTrim(p.area) + "</td>" +
      "<td class='td-road'>" + PC.esc(p.address || "—") + "</td>" +
      "<td class='td-n'>" + (p.detailStatus === "loading" ? loadingText() : fmtAge(p.age)) + "</td>" +
      "<td class='td-n'>" + (p.detailStatus === "loading" ? loadingText() : flr) + "</td>" +
      "<td class='td-n' style='font-size:.74rem;'>" + (p.detailStatus === "loading" ? loadingText() : PC.esc(pk)) + parkInputs(p) + "</td>" +
      "<td class='td-n' style='font-size:.74rem;'>" + (p.detailStatus === "loading" ? loadingText() : mgmt) + "</td>" +
      "<td class='td-link'>" + linkHtml(p) + "</td>" +
      "</tr>";
  }).join("") + "</tbody>";
  document.getElementById("table").innerHTML = thead + tbody;

  document.getElementById("cards").innerHTML = data.map(function (p) {
    var isBU = minU != null && p.unitPrice != null && p.unitPrice.toFixed(2) === minU.toFixed(2);
    var isBP = minP != null && Number(p.price) > 0 && Number(p.price).toFixed(2) === minP.toFixed(2);
    var flr = p.floor && p.totalFloor ? p.floor + "F／" + p.totalFloor + "F" : p.floor ? p.floor + "F" : "—";
    var mgmt = Number(p.mgmtFee) > 0 ? Number(p.mgmtFee).toLocaleString("zh-TW") + " 元" : "—";
    var pk = p.parkType && p.parkType !== "無" ? p.parkType : p.hasPark ? "有車位" : "無車位";
    return "<article class='pcard" + (isBU ? " best" : "") + "'>" +
      "<div class='n-title'>" + PC.esc(p.title) + (isBU ? " <span class='bm bm-g'>★ 最優</span>" : "") + "</div>" +
      (p.community ? "<div class='n-comm'>" + PC.esc(p.community) + "</div>" : "") +
      "<div class='n-code'>" + PC.esc(p.code) + "</div>" +
      "<div class='n-road'>" + PC.esc(p.address || "路段未填") + (p.rooms ? " · " + PC.esc(p.rooms) : "") + "</div>" +
      rowFlag(p) +
      "<dl class='pcard-metrics'>" +
      "<div><dt>總價（萬）</dt><dd class='" + (isBP ? "bp" : "") + "'>" + fmtTrim(p.price) + (isBP ? " 最低" : "") + "</dd></div>" +
      "<div><dt>總建坪</dt><dd>" + fmtTrim(p.area) + "</dd></div>" +
      "<div><dt>含車單價</dt><dd>" + (p.withParkUnit != null ? fmtUnit(p.withParkUnit) : "—") + "</dd></div>" +
      "<div><dt>扣車單價</dt><dd class='" + (p.unitPrice != null ? (isBU ? "bu" : "") : "unk") + "'>" + (p.unitPrice != null ? fmtUnit(p.unitPrice) + (isBU ? " 最低" : "") : PC.esc(p.unitLabel || "—")) + "</dd></div>" +
      "</dl>" +
      "<div class='park-row' style='display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;'>" + parkInputs(p) + "</div>" +
      "<div class='pcard-meta'>" + (p.detailStatus === "loading" ? "屋齡、樓別、車位載入中…" : ("屋齡 " + fmtAge(p.age) + " 年 · " + flr + " · " + PC.esc(pk) + " · 管理費 " + mgmt)) + "</div>" +
      "<div class='pcard-actions'><span></span>" + linkHtml(p) + "</div>" +
      "</article>";
  }).join("");

  var sel = document.getElementById("m-sort");
  if (sel && sel.value !== sortKey) sel.value = sortKey;
  document.getElementById("m-dir").textContent = sortAsc ? "由低到高" : "由高到低";
  document.getElementById("report-wrap").style.display = "block";
  if (!reportShown) {
    reportShown = true;
    document.getElementById("report-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  updateSwipeHint();
}

function updateSwipeHint() {
  var wrap = document.getElementById("tbl-wrap");
  var hint = document.getElementById("swipe-hint");
  if (!wrap || !hint) return;
  var mobile = window.matchMedia("(max-width: 640px)").matches;
  var overflows = wrap.scrollWidth > wrap.clientWidth + 8;
  hint.classList.toggle("on", !mobile && overflows);
  hint.textContent = "← 左右滑動查看更多欄位 →";
}

function doSort(k, fromKeyboard) {
  if (!k) return;
  if (sortKey === k) sortAsc = !sortAsc;
  else { sortKey = k; sortAsc = true; }
  restoreSortFocus = !!fromKeyboard;
  renderReport();
  if (restoreSortFocus) {
    var th = document.querySelector("th[data-sort='" + k + "']");
    if (th) th.focus();
    restoreSortFocus = false;
  }
}

function setPark(code, field, value) {
  if (field !== "parkArea" && field !== "parkPrice") return;
  var x = null;
  for (var i = 0; i < props.length; i++) if (props[i].code === code) x = props[i];
  if (!x) return;
  var raw = String(value == null ? "" : value).trim();
  if (raw === "") {
    x[field] = null;
    x[field + "Known"] = false;
  } else {
    var n = Number(raw);
    if (!isFinite(n) || n < 0) {
      x[field] = null;
      x[field + "Known"] = false;
    } else {
      x[field] = n;
      x[field + "Known"] = true;
      if (n > 0) x.hasPark = true;
    }
  }
  renderReport();
}

function sleep(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

async function fetchPropOnce(p) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 28000);
  try {
    var res = await fetch("/api/scrape-prop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: p.code }),
      signal: ctrl.signal
    });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok || !data || data.detailFailed || data.error) {
      return PC.applyDetail(p, { detailFailed: true, error: (data && data.error) || ("讀取失敗（" + res.status + "）") });
    }
    return PC.applyDetail(p, data);
  } catch (e) {
    return PC.applyDetail(p, { detailFailed: true, error: "無法連線，請稍後再試" });
  } finally {
    clearTimeout(timer);
  }
}

async function startAll() {
  var text = document.getElementById("paste").value;
  applyHeader(text, true);
  var list = PC.parseText(text);
  if (!list.length) { alert("未偵測到有效物件訊息"); return; }
  var gen = ++loadGen;
  props = list.map(function (p) {
    p.detailStatus = "loading";
    return p;
  });
  document.getElementById("prog-wrap").style.display = "block";
  var fill = document.getElementById("prog-fill");
  var lbl = document.getElementById("prog-label");
  fill.style.width = "0%";
  lbl.textContent = "表格已用貼上的資料。正在逐筆補齊詳細資料…";
  sortKey = "unitPrice";
  sortAsc = true;
  reportShown = false;
  renderReport();
  for (var i = 0; i < props.length; i++) {
    if (gen !== loadGen) return;
    lbl.textContent = "補齊詳細資料 " + (i + 1) + "/" + props.length + "：" + props[i].code;
    fill.style.width = ((i / props.length) * 100) + "%";
    var prev = props[i];
    var row = await fetchPropOnce(prev);
    if (gen !== loadGen) return;
    if (prev.parkAreaKnown) { row.parkArea = prev.parkArea; row.parkAreaKnown = true; }
    if (prev.parkPriceKnown) { row.parkPrice = prev.parkPrice; row.parkPriceKnown = true; }
    row.detailStatus = row.detailFailed ? "failed" : "ok";
    props[i] = row;
    renderReport();
  }
  if (gen !== loadGen) return;
  fill.style.width = "100%";
  lbl.textContent = "詳細資料已補齊";
}

function shareReport() {
  var payload = {
    props: props.map(PC.sanitizeProp).filter(Boolean),
    agent: document.getElementById("agent").value,
    phone: document.getElementById("phone").value,
    client: document.getElementById("client").value,
    note: document.getElementById("note").value,
    store: brandStore
  };
  if (!payload.props.length) { alert("沒有可分享的物件"); return; }
  var enc = PC.encodeShare(payload);
  var url = location.origin + location.pathname + "?r=" + encodeURIComponent(enc);
  if (url.length > 7000) { alert("分享連結過長，請減少物件筆數後再試"); return; }
  document.getElementById("share-url").textContent = url;
  document.getElementById("share-box").style.display = "block";
}
function copyUrl() {
  var t = document.getElementById("share-url").textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { alert("已複製！"); }, function () { alert("請手動複製連結"); });
  } else {
    alert("請手動複製連結");
  }
}

function loadFromUrl() {
  var raw = new URLSearchParams(location.search).get("r");
  if (!raw) return;
  var pl = PC.decodeShare(raw);
  if (!pl) return;
  props = pl.props;
  if (pl.agent) document.getElementById("agent").value = pl.agent;
  if (pl.phone) document.getElementById("phone").value = pl.phone;
  if (pl.client) document.getElementById("client").value = pl.client;
  if (pl.note) document.getElementById("note").value = pl.note;
  if (pl.store) brandStore = pl.store;
  if (pl.agent) parsedAgent = pl.agent;
  updateBrand();
  document.getElementById("input-card").style.display = "none";
  renderReport();
}

async function genPDF() {
  var el = document.getElementById("report-wrap");
  var ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(10,110,63,.9);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;";
  ov.innerHTML = "<div style='width:38px;height:38px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;'></div><div style='color:white;font-size:.88rem;'>PDF 產生中...</div>";
  document.body.appendChild(ov);
  try {
    await loadPdfLibs();
    document.querySelectorAll(".park-in").forEach(function (input) {
      var span = input.parentElement && input.parentElement.querySelector(".park-pdf");
      if (span) span.textContent = input.value.trim() || "未填";
    });
    document.body.classList.add("pdf-export");
    await new Promise(function (r) { setTimeout(r, 50); });
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation: "landscape", unit: "px", format: "a4" });
    var pW = pdf.internal.pageSize.getWidth();
    var pH = pdf.internal.pageSize.getHeight();
    var canvas = await html2canvas(el, { scale: 1.4, useCORS: true, backgroundColor: "#faf8f5" });
    var imgData = canvas.toDataURL("image/jpeg", 0.88);
    var imgH = canvas.height * pW / canvas.width;
    var y = 0, pg = 0;
    while (y < imgH) {
      if (pg > 0) pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, -y, pW, imgH);
      y += pH;
      pg++;
    }
    var c = (document.getElementById("client").value || "客戶").replace(/[\\/:*?"<>|]/g, "").slice(0, 40) || "客戶";
    pdf.save("物件比較報告_" + c + "_" + new Date().toLocaleDateString("zh-TW").replace(/\//g, "") + ".pdf");
  } catch (e) {
    alert("PDF 產生失敗：" + (e && e.message ? e.message : e));
  } finally {
    document.body.classList.remove("pdf-export");
    if (ov.parentNode) document.body.removeChild(ov);
  }
}

function resetAll() {
  props = [];
  loadGen++;
  reportShown = false;
  document.getElementById("paste").value = "";
  document.getElementById("chips").innerHTML = "";
  document.getElementById("report-wrap").style.display = "none";
  document.getElementById("prog-wrap").style.display = "none";
  document.getElementById("input-card").style.display = "block";
  document.getElementById("go-btn").disabled = true;
  document.getElementById("go-btn").textContent = "🔍 分析物件（請先貼入物件訊息）";
  document.getElementById("share-box").style.display = "none";
  document.getElementById("agent").value = DEFAULT_AGENT;
  document.getElementById("phone").value = DEFAULT_PHONE;
  brandStore = DEFAULT_STORE;
  parsedAgent = "";
  updateBrand();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("paste").addEventListener("input", function () {
  detect();
  applyHeader(document.getElementById("paste").value, false);
});
document.getElementById("agent").addEventListener("input", updateBrand);
document.getElementById("go-btn").addEventListener("click", startAll);
document.getElementById("share-btn").addEventListener("click", shareReport);
document.getElementById("pdf-btn").addEventListener("click", genPDF);
document.getElementById("reset-btn").addEventListener("click", resetAll);
document.getElementById("copy-btn").addEventListener("click", copyUrl);
document.getElementById("m-sort").addEventListener("change", function () {
  sortKey = this.value;
  sortAsc = true;
  renderReport();
});
document.getElementById("m-dir").addEventListener("click", function () {
  sortAsc = !sortAsc;
  renderReport();
});
document.getElementById("report-wrap").addEventListener("click", function (e) {
  var th = e.target.closest ? e.target.closest("th[data-sort]") : null;
  if (th) doSort(th.getAttribute("data-sort"));
});
document.getElementById("report-wrap").addEventListener("keydown", function (e) {
  var th = e.target.closest ? e.target.closest("th[data-sort]") : null;
  if (!th) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doSort(th.getAttribute("data-sort"), true); }
});
document.getElementById("report-wrap").addEventListener("change", function (e) {
  var t = e.target;
  if (!t || !t.classList || !t.classList.contains("park-in")) return;
  setPark(t.getAttribute("data-code"), t.getAttribute("data-field"), t.value);
});
window.addEventListener("resize", updateSwipeHint);
window.addEventListener("load", loadFromUrl);
</script>
