name: 屋主報告書：夜間預抓信義社區資料
on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天凌晨 3:17
    - cron: "17 19 * * *"
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/owner-report/sinyi_cache.py
        timeout-minutes: 40
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/sinyi-cache
          git commit -m "屋主報告書：夜間預抓信義社區資料" || echo "no changes"
          git pull --rebase -q && git push
