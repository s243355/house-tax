name: listing probe
on:
  push:
    branches: [listing-probe]
    paths: [".github/workflows/listing-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          for c in 7424LN 2140885CT 2140716CT; do
            curl -sSL --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Accept-Language: zh-TW,zh;q=0.9" -o probe/$c.html -w "$c %{http_code} %{size_download}\n" "https://www.sinyi.com.tw/buy/house/$c" || echo "$c failed"
            curl -sS --max-time 30 -o probe/$c-A.jpg -w "$c img %{http_code} %{size_download}\n" "https://res.sinyi.com.tw/buy/$c/bigimg/A.JPG" || true
          done
          ls -la probe
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe sinyi listings" && git push
