name: 抓取實價登錄資料
on:
  workflow_dispatch:
  schedule:
    # 內政部每月 1、11、21 日發布，隔天台灣時間早上 6 點抓
    - cron: "0 22 1,11,21 * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_lvr.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lvr
          git commit -m "更新實價登錄資料（內政部開放資料）" || echo "no changes"
          git push
