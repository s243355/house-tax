name: 實價登錄自動更新
on:
  workflow_dispatch:
  schedule:
    # 內政部每月 1、11、21 日發布，隔天台灣時間早上 6 點抓
    - cron: "0 22 1,11,21 * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_lvr.py
      - name: 重算社區行情並重建頁面
        run: bash scripts/yucheng/build.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lvr data/yucheng yucheng-communities.html yucheng-location.html yucheng-a-*.html
          git commit -m "實價登錄自動更新：重算社區行情與購屋分析頁" || echo "no changes"
          git push
