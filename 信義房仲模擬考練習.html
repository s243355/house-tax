<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00843d">
<title>信義房仲 模擬考練習</title>
<style>
:root{
  --green:#00843d; --green-d:#006b31; --green-l:#e6f3ec;
  --ink:#1c1f1d; --sub:#5c6360; --line:#e3e6e4; --bg:#f6f7f6; --card:#ffffff;
  --ok:#0f8a43; --ok-bg:#e7f5ec; --no:#c62f3b; --no-bg:#fbeaeb;
  --star:#e0a400;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  font-size:16px; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}

/* top bar */
.top{
  position:sticky; top:0; z-index:20;
  background:var(--green); color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex; align-items:center; gap:10px;
}
.top .brand{font-weight:800; letter-spacing:.5px; font-size:17px; display:flex; align-items:center; gap:8px}
.top .mark{width:22px;height:22px;border-radius:6px;background:#fff;color:var(--green);
  display:grid;place-items:center;font-weight:900;font-size:14px}
.top .spacer{flex:1}
.top button.link{background:none;border:none;color:#fff;font-size:15px;font-weight:600;padding:6px 8px;border-radius:8px}
.top button.link:active{background:rgba(255,255,255,.15)}

.main{flex:1; padding:16px}

/* home */
.hero{
  background:linear-gradient(135deg,var(--green),var(--green-d));
  color:#fff; border-radius:18px; padding:20px; margin-bottom:16px;
  box-shadow:var(--sh);
}
.hero h1{margin:0 0 4px; font-size:20px; font-weight:800}
.hero p{margin:0; opacity:.9; font-size:14px}
.stats{display:flex; gap:10px; margin-top:16px}
.stat{flex:1; background:rgba(255,255,255,.14); border-radius:12px; padding:10px 8px; text-align:center}
.stat .n{font-size:22px; font-weight:800; line-height:1.1}
.stat .l{font-size:12px; opacity:.9; margin-top:2px}

.sec-title{font-size:14px; font-weight:700; color:var(--sub); margin:20px 4px 10px}
.menu{display:flex; flex-direction:column; gap:10px}
.mbtn{
  display:flex; align-items:center; gap:14px; width:100%;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px; text-align:left; box-shadow:var(--sh); color:var(--ink);
  font-family:inherit; font-size:16px; cursor:pointer;
}
.mbtn:active{transform:scale(.99); background:#fafbfa}
.mbtn .ico{width:44px;height:44px;border-radius:12px;background:var(--green-l);color:var(--green);
  display:grid;place-items:center;font-size:22px;flex-shrink:0}
.mbtn .tx{flex:1}
.mbtn .tx .t{font-weight:700}
.mbtn .tx .d{font-size:13px;color:var(--sub);margin-top:1px}
.mbtn .cnt{font-size:13px;color:var(--sub);font-weight:700}
.mbtn.wrong .ico{background:var(--no-bg);color:var(--no)}
.mbtn.review .ico{background:#eef1ff;color:#3a55c9}
.mbtn:disabled{opacity:.5}
.mbtn .arrow{color:var(--sub);font-size:20px}

/* quiz */
.qhead{margin-bottom:12px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
.progress > i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.qmeta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub)}
.qmeta .tag{background:var(--green-l);color:var(--green-d);font-weight:700;padding:2px 10px;border-radius:99px}
.qmeta .live{font-weight:700}
.qmeta .live b{color:var(--ok)}
.qmeta .live s{color:var(--no);text-decoration:none}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.qtext{font-size:17px;font-weight:600;line-height:1.7;margin-bottom:16px}
.qtext .idx{color:var(--green);font-weight:800;margin-right:6px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;
  background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:14px;text-align:left;font-family:inherit;font-size:15.5px;line-height:1.6;
  color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;
}
.opt:active{background:#f7f9f8}
.opt .k{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--sub);flex-shrink:0;
  background:#fff;transition:all .15s;
}
.opt .otx{flex:1;padding-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.disabled{cursor:default}
.opt.dim{opacity:.6}
.opt .badge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;align-self:center;flex-shrink:0}
.opt.correct .badge{background:var(--ok);color:#fff}
.opt.wrong .badge{background:var(--no);color:#fff}

/* explain */
.explain{margin-top:16px;border-radius:12px;padding:14px;font-size:14.5px;line-height:1.75;display:none}
.explain.show{display:block;animation:fade .25s}
.explain.pass{background:var(--ok-bg);border:1px solid #bfe6cd}
.explain.fail{background:var(--no-bg);border:1px solid #f2c6ca}
.explain .r{font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:15px}
.explain.pass .r{color:var(--ok)}
.explain.fail .r{color:var(--no)}
.explain .lbl{font-weight:800;color:var(--green-d);display:block;margin-bottom:2px}
.explain .body{color:#25302a}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

.qactions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:15px;border-radius:12px;border:none;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:active{background:var(--green-d)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);flex:0 0 auto;width:56px;font-size:22px}
.btn.ghost.on{color:var(--star);border-color:var(--star)}
.btn:disabled{opacity:.4}

/* result */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--sh);text-align:center}
.ring{width:150px;height:150px;margin:6px auto 14px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .p{font-size:34px;font-weight:900;line-height:1}
.ring .mid .l{font-size:13px;color:var(--sub);margin-top:2px}
.rmsg{font-size:17px;font-weight:800;margin-bottom:4px}
.rsub{font-size:14px;color:var(--sub);margin-bottom:16px}
.rgrid{display:flex;gap:10px;margin-bottom:8px}
.rgrid .b{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}
.rgrid .b .n{font-size:22px;font-weight:800}
.rgrid .b .l{font-size:12px;color:var(--sub)}
.rgrid .b.ok .n{color:var(--ok)} .rgrid .b.no .n{color:var(--no)}

/* browse / wrong list */
.filter{display:flex;gap:8px;margin-bottom:14px}
.chip{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:var(--sh)}
.item .h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item .h .tag{font-size:11px;font-weight:800;background:var(--green-l);color:var(--green-d);padding:2px 8px;border-radius:99px}
.item .h .miss{font-size:11px;font-weight:800;background:var(--no-bg);color:var(--no);padding:2px 8px;border-radius:99px;margin-left:auto}
.item .q{font-weight:600;font-size:15px;line-height:1.6;margin-bottom:10px}
.item .ans{font-size:14px;line-height:1.6;background:var(--ok-bg);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.item .ans b{color:var(--ok)}
.item .ex{font-size:13.5px;color:#333;line-height:1.7}
.item .ex b{color:var(--green-d)}

.empty{text-align:center;color:var(--sub);padding:48px 20px}
.empty .e{font-size:44px;margin-bottom:10px}
.empty .t{font-weight:800;font-size:17px;color:var(--ink);margin-bottom:4px}

.foot{text-align:center;color:#9aa19d;font-size:12px;padding:18px 0 26px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark">信</span><span>房仲模擬考</span></div>
    <div class="spacer"></div>
    <button class="link" id="homeBtn" onclick="go('home')">首頁</button>
  </div>

  <div class="main">
    <!-- HOME -->
    <section id="view-home">
      <div class="hero">
        <h1>模擬考互動練習</h1>
        <p>兩份考卷共 100 題，答錯自動進錯題本重複練習</p>
        <div class="stats">
          <div class="stat"><div class="n" id="stAcc">—</div><div class="l">歷史答對率</div></div>
          <div class="stat"><div class="n" id="stWrong">0</div><div class="l">待複習錯題</div></div>
          <div class="stat"><div class="n" id="stDone">0</div><div class="l">累計作答</div></div>
        </div>
      </div>

      <div class="sec-title">開始練習</div>
      <div class="menu">
        <button class="mbtn" onclick="start('A')">
          <span class="ico">A</span>
          <span class="tx"><span class="t">模擬考 A</span><span class="d">第 1～50 題．依序作答</span></span>
          <span class="cnt">50 題</span><span class="arrow">›</span>
        </button>
        <button class="mbtn" onclick="start('B')">
          <span class="ico">B</span>
          <span class="tx"><span class="t">模擬考 B</span><span class="d">第 1～50 題．依序作答</span></span>
          <span class="cnt">50 題</span><span class="arrow">›</span>
        </button>
        <button class="mbtn" onclick="start('random')">
          <span class="ico">⚡</span>
          <span class="tx"><span class="t">隨機測驗</span><span class="d">從全題庫抽 20 題快速練習</span></span>
          <span class="cnt">20 題</span><span class="arrow">›</span>
        </button>
      </div>

      <div class="sec-title">加強與複習</div>
      <div class="menu">
        <button class="mbtn wrong" id="wrongBtn" onclick="start('wrong')">
          <span class="ico">✕</span>
          <span class="tx"><span class="t">錯題本重練</span><span class="d">只練你答錯的題，答對才移除</span></span>
          <span class="cnt" id="wrongCnt">0 題</span><span class="arrow">›</span>
        </button>
        <button class="mbtn review" id="starBtn" onclick="start('star')">
          <span class="ico">★</span>
          <span class="tx"><span class="t">重點標記</span><span class="d">練習你標星號的題目</span></span>
          <span class="cnt" id="starCnt">0 題</span><span class="arrow">›</span>
        </button>
        <button class="mbtn" onclick="go('browse')">
          <span class="ico">☰</span>
          <span class="tx"><span class="t">全題庫瀏覽</span><span class="d">看題目、正解與觀念解析</span></span>
          <span class="cnt">100 題</span><span class="arrow">›</span>
        </button>
      </div>
      <div class="foot">資料為信義房仲模擬考題．進度僅存於本機瀏覽器</div>
    </section>

    <!-- QUIZ -->
    <section id="view-quiz" class="hidden">
      <div class="qhead">
        <div class="progress"><i id="prog"></i></div>
        <div class="qmeta">
          <span><span class="tag" id="qTag">A</span> <span id="qPos">1 / 50</span></span>
          <span class="live">已答 <b id="liveOk">0</b> · <s id="liveNo">0</s></span>
        </div>
      </div>
      <div class="qcard">
        <div class="qtext" id="qText"></div>
        <div class="opts" id="qOpts"></div>
        <div class="explain" id="qExp">
          <div class="r" id="expR"></div>
          <div class="body"><span class="lbl">觀念解析</span><span id="expBody"></span></div>
        </div>
      </div>
      <div class="qactions">
        <button class="btn ghost" id="starToggle" title="標記重點" onclick="toggleStar()">☆</button>
        <button class="btn primary" id="nextBtn" onclick="next()" disabled>選擇答案</button>
      </div>
    </section>

    <!-- RESULT -->
    <section id="view-result" class="hidden">
      <div class="rcard">
        <div class="ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="64" fill="none" stroke="#eef0ef" stroke-width="14"/>
            <circle id="ringFg" cx="75" cy="75" r="64" fill="none" stroke="#00843d" stroke-width="14"
              stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402"/>
          </svg>
          <div class="mid"><div class="p" id="rPct">0%</div><div class="l">答對率</div></div>
        </div>
        <div class="rmsg" id="rMsg">練習完成</div>
        <div class="rsub" id="rSub"></div>
        <div class="rgrid">
          <div class="b ok"><div class="n" id="rOk">0</div><div class="l">答對</div></div>
          <div class="b no"><div class="n" id="rNo">0</div><div class="l">答錯</div></div>
          <div class="b"><div class="n" id="rTot">0</div><div class="l">總題數</div></div>
        </div>
      </div>
      <div class="qactions" style="margin-top:16px">
        <button class="btn ghost" style="width:auto;flex:1;font-size:16px;font-weight:800" onclick="go('home')">回首頁</button>
        <button class="btn primary" id="rRetry" onclick="retryWrong()">重練本次錯題</button>
      </div>
      <div id="rList" style="margin-top:16px"></div>
    </section>

    <!-- BROWSE -->
    <section id="view-browse" class="hidden">
      <div class="filter">
        <button class="chip on" data-f="ALL" onclick="filterBrowse('ALL',this)">全部</button>
        <button class="chip" data-f="A" onclick="filterBrowse('A',this)">模擬考A</button>
        <button class="chip" data-f="B" onclick="filterBrowse('B',this)">模擬考B</button>
        <button class="chip" data-f="WRONG" onclick="filterBrowse('WRONG',this)">錯題</button>
      </div>
      <div id="browseList"></div>
    </section>
  </div>
</div>

<script>
const QUESTIONS = [{"id": "A1", "e": "A", "n": 1, "q": "甲售屋給乙，交屋後乙發現房屋裡面有三個白蟻窩，於是向甲主張瑕疵權利，甲主張買賣契約清楚載明「現況交屋」，因此一定不必負責，請問有無理由？", "o": ["有理由", "無理由", "仲介公司認定", "法院認定"], "a": 1, "x": "一般合約書如記載現況交屋，不當然即有免除瑕疵擔保責任之意思，除非雙方有明確免除之意思。法院見解認為，所謂現況是指交屋時雙方共知的現況，題示買方簽約時並不知白蟻存在，因此賣方不可以主張以現況交屋而免除責任。"}, {"id": "A2", "e": "A", "n": 2, "q": "一般推估旅館的價格通常用收益法來推估，以下有關價格推估的主張，哪一位同仁有誤：", "o": ["小蕾：先以房間數×房價×365天×住房率＋其他收益來估計可能的毛收益，即可據此推估旅館價格", "小悟：如果旅館的滿租收益率有相對高的穩定性，推估的價格自然會比較高", "小川：旅館價格可依旅館營運者所經營創造的收益，或本身的建築物價值來做推算", "小平：需將旅館的毛收益，扣除人事管銷成本等後的淨收益，來據以推估旅館價格"], "a": 0, "x": "一般推估旅館的價格通常用收益法來推估，所謂的收益係指小平所主張的淨收益，而非小蕾主張的毛收益，因此小蕾的主張有誤。"}, {"id": "A3", "e": "A", "n": 3, "q": "申請補發土地所有權狀，依法應該公告多久？", "o": ["15天", "30天", "3個月", "6個月"], "a": 1, "x": "依土地登記規則第155條，申請補發土地所有權狀，依法應該公告30天。"}, {"id": "A4", "e": "A", "n": 4, "q": "甲出租房屋給乙，三天後乙搬入居住，並依約繳交房租，下列敘述何者最正確？", "o": ["關於房屋租金之請求權，其消滅時效期間為兩年", "租賃期間若甲將房屋出賣給丙，甲與乙之租賃關係即消滅", "甲若將房屋贈與丁，並移轉房屋所有權給丁，則乙之租賃契約對丁繼續存在", "甲若先後將房屋出賣給戊與辛，則基於優先性之考量，僅甲與戊之買賣契約生效"], "a": 2, "x": "租金請求權，依民法第126條規定為五年，而債權沒有成立時間先後的問題，一律平等。（買賣不破租賃，故租約對受讓人繼續存在）"}, {"id": "A5", "e": "A", "n": 5, "q": "以下有關強制執行的說明，何者有誤：", "o": ["係指債權人取得執行名義，向法院聲請強制執行", "強制執行在請求對債務人的財產進行查封、拍賣", "強制債務人履行債務", "私人借據可以作為強制執行的依據"], "a": 3, "x": "私人之間的借據並非政府發給的公文書，無法作為確認債權及強制執行的依據。"}, {"id": "A6", "e": "A", "n": 6, "q": "銷售帶租約的住宅產品時，下列敘述何者有誤？", "o": ["屋況概略看過即可，以不打擾承租方為優先", "要清楚知道租約的內容並告知買方", "須告知是否有增建進、以及了解鄰居間相處狀況", "換約時需釐清押金移交"], "a": 0, "x": "為確保每間房間屋況，若盡可能可以看到每間房屋的屋況最佳，以免後續爭議。"}, {"id": "A7", "e": "A", "n": 7, "q": "有關新成屋的經營方式何者為是？", "o": ["建立社區服務4.0，當尚未交屋時建立基本專業能力，才能即時有效提供客戶的問題", "交屋完即寄送賀卡，裏頭除介紹自己外，食衣住行育樂資訊都要有，並定錨在客戶心中", "綁定社區與門市的連結、行銷物傘架、魚、樹等，並美盡社區活動內容", "以上皆是"], "a": 3, "x": "選項皆是。"}, {"id": "A8", "e": "A", "n": 8, "q": "依據公司買賣契約之約定，如違章建築物部份在交屋前被通知須拆除（或被拆除）者，買賣雙方應如何辦理？", "o": ["由賣方向主管機關陳情", "由買方向主管機關陳情", "由公司委託估價師鑑價後辦理減少價金", "由賣方委託估價師鑑價後辦理減少價金"], "a": 2, "x": "依現行不動產買賣契約約定，若交屋前發生違建被拆除或通知拆除，由公司委託估價師鑑價後辦理減少價金。"}, {"id": "A9", "e": "A", "n": 9, "q": "買方交屋後發現有漏水，導致裝潢損失一百萬，請問屋主必須負責嗎？", "o": ["要", "不要", "故意不告知才要", "屋主需負一半費用"], "a": 2, "x": "裝潢損失屬於損害賠償範圍，法律上必須屋主故意不告知或特別保證無瑕疵才可以請求，此部分不是無過失責任。"}, {"id": "A10", "e": "A", "n": 10, "q": "以下有關禁止處分的說明，何者正確：", "o": ["發出禁止處分命令的機構有二，一是法院，另一是稅捐處", "為保護受害人受損害賠償的權益，可以向加害人發出禁止處分命令", "加害人發出禁止處分命令，可以是法官，也可以是檢察官", "一般而言，由法院發出禁止處分的情形比稅捐處發出的多"], "a": 3, "x": "由法院發出禁止處分的情形較少，比較多見的是因為積欠國稅或地方稅，而由國稅局或稅捐處發出禁止處分，由地政事務所在欠稅納稅義務人的土地或建物謄本上加註禁止處分，待納稅義務人繳稅後，再行塗銷。"}, {"id": "A11", "e": "A", "n": 11, "q": "如果使用遺產分割協議書，需要繳交印花稅多少費用（現值）？", "o": ["千分之一", "百分之一", "十分之一", "無須繳納"], "a": 0, "x": "遺產分割協議書（協議分割）要交印花稅（現值千分之一）。"}, {"id": "A12", "e": "A", "n": 12, "q": "買方謝小姐看了房子很喜歡，立即以支票支付斡旋金給小義，以下事項都是小義需加以檢視以避免款項兌現風險，其中哪一項才有符合公司要求：", "o": ["謝小姐開立支票的兌現日期是支付當下的日期，也是所謂的即期支票", "謝小姐開立沒有劃線的支票", "謝小姐開立沒有禁止背書轉讓的支票", "謝小姐沒有在憑證支付處註明收受人"], "a": 0, "x": "若無畫線，代表收受人可要求金融機構支付現金；若無禁背，該支票可背書轉讓；依公司規定以支票支付斡旋金，需載明收受人為安信建築經理股份有限公司或賣方。故只有「即期支票」符合斡旋金收受規定。"}, {"id": "A13", "e": "A", "n": 13, "q": "陳媽媽未依規定期限辦理申報房屋稅，因而發生漏稅，除責令補繳應納稅額外，還會照所漏稅額處多少罰鍰？", "o": ["處兩倍以下罰鍰", "處三倍以下罰鍰", "處五倍以下罰鍰", "處十倍以下罰鍰"], "a": 0, "x": "未依規定期限辦理申報房屋稅，因而發生漏稅，除責令補繳應納稅額外，還照所漏稅額處兩倍以下罰鍰。"}, {"id": "A14", "e": "A", "n": 14, "q": "斡旋金契約（或要約書）經賣方簽名同意出售後，但經紀人漏未於契約上載明簽立不動產買賣合約之日期，賣方嗣後有悔賣之意，遂主張簽約日未定，下列敘述何者為是？", "o": ["未載明簽約日，只要買方另定適當時間通知賣方出面簽約，作為補正即可", "未載明簽約日，賣方拒不出面簽約即不生違約問題", "因未載明簽約日，買方僅得接受一年後簽約", "因未載明簽約日，斡旋契約無效"], "a": 0, "x": "民法第229條第2項：給付無確定期限者，債務人於債權人得請求給付時，經其催告而未為給付，自受催告時起，負遲延責任。第3項：前項催告定有期限者，債務人自期限屆滿時起負遲延責任。"}, {"id": "A15", "e": "A", "n": 15, "q": "公寓大廈的一樓住戶王先生因為想要做個小本生意，經與全體住戶約定讓他在公寓大廈通往室外之庭院出入口擺置麵攤，經營賣麵生意，此舉是否合法？", "o": ["合法，因住戶約定就可以", "不合法，違反公寓大廈管理條例的約定專用限制", "合法，因麵攤不是定著在社區土地上隨時可以推走", "違反禁止任意設攤之相關法規，但沒有違反公寓大廈管理條例"], "a": 1, "x": "公寓大廈管理條例第7條規定，通往室外之通路或門廳等不得為約定專用部分。本題王先生縱使事先與其他住戶約定，仍不能在公寓大廈出入口處擺麵攤。"}, {"id": "A16", "e": "A", "n": 16, "q": "管委會主委針對不繳管理費或嚴重違反規約的住戶，是否可以逕行斷水斷電、鎖門、禁止（門禁卡消磁）住戶進住？", "o": ["可以，為了維護整體住戶的利益", "不可以，因為這不是主委的權責", "可以，這是公寓大廈管理條例賦予主委的權責", "可以，但要會同管委與里長"], "a": 1, "x": "公寓大廈管理條例並未賦予管理委員會有禁止住戶使用其所有權之權利，故擅自阻止住戶進入及斷水斷電行為，可能觸犯刑法上妨害他人行使權利之罪名（強制罪）。"}, {"id": "A17", "e": "A", "n": 17, "q": "當遇到客戶想要出售或購買的房子不在你的主商圈範圍內時，下列敘述何者錯誤？", "o": ["若要自己服務時，就要對該區域多做功課與了解", "一律拒絕客戶，或是請客戶自行連絡該區域的分店", "如果pass給友店同仁的話，要注意營績分配比例問題", "要pass客戶給友店同事時要做好交接"], "a": 1, "x": "一律拒絕客戶並不是信義人該有的服務態度。"}, {"id": "A18", "e": "A", "n": 18, "q": "買方甲交屋後發現房屋有滲水，心想反正暫不入住，等二個月回國後再處理，請問甲回國後再向屋主主張瑕疵擔保，是否有理？", "o": ["有", "沒有", "要看雙方背景", "法院認定"], "a": 1, "x": "買受人應按物之性質，依通常程序從速檢查其所受領之物（民法第356條）。買受人怠於通知者，除依通常檢查不能發見之瑕疵外，視為承認其所受領之物，即喪失瑕疵擔保之權利。"}, {"id": "A19", "e": "A", "n": 19, "q": "有關遺產繼承的敘述，下列何者錯誤？", "o": ["配偶不能單獨繼承", "六個月內需申報遺產稅、辦戶繼承登記", "繼承／贈與／遺產稅皆以實際買賣價格計算", "媳婦原則上不能繼承公公遺產"], "a": 2, "x": "繼承／贈與／遺產稅皆以現值計算，非實價登入。"}, {"id": "A20", "e": "A", "n": 20, "q": "買方透過本公司成交一房屋，買賣合約書內之成交價為新台幣1000萬元整；買方企圖超貸，乃私下製作一份買賣合約書成交價為新台幣1200萬元整，買方之行為觸犯刑法何罪？", "o": ["偽造變造私文書罪", "偽造變造公文書罪", "妨害信用罪", "誹謗罪"], "a": 0, "x": "刑法第210條規定（偽造變造私文書）：偽造、變造私文書，足以生損害於公眾或他人者，處五年以下有期徒刑。"}, {"id": "A21", "e": "A", "n": 21, "q": "關於既成道路下列敘述何者有誤？", "o": ["既成道路是供不特定人通行", "不能任意廢止", "因為是私人的土地所以可以加設圍籬物"], "a": 2, "x": "因為是既成道路，有公用地役權存在，所以不可以任意廢止，不能私自占用，不可以加設圍籬物來阻礙通行。"}, {"id": "A22", "e": "A", "n": 22, "q": "房屋稅之納稅義務人未依規定之期限申報，因而發生漏稅者，除責令補繳應納稅額外，並按所漏稅額處幾倍以下罰鍰？", "o": ["一倍", "二倍", "三倍", "四倍"], "a": 1, "x": "處二倍以下罰鍰。"}, {"id": "A23", "e": "A", "n": 23, "q": "下列哪一情形，可免徵房屋稅：", "o": ["業經立案之私立學校及學術研究機構，完成財團法人登記者，其供校舍或辦公使用之自有房屋", "業經立案之私立慈善救濟事業，不以營利為目的，完成財團法人登記者，其直接供辦理事業所使用之自有房屋", "無償供政府機關公用或供軍用之房屋", "以上皆是"], "a": 3, "x": "皆符合免徵稅條件。"}, {"id": "A24", "e": "A", "n": 24, "q": "「朱太太，我是信義的Mike啦！他們這樣說其實是想辦法『不讓我們成交』！是不是還告訴您手頭上已經有人可以出價更高？或是折讓服務費退給您。所以，朱太太我早說過…」從這段對話中，你可以判斷Mike早就做過哪一點？", "o": ["落實做好回報", "與客戶誠懇溝通", "多聽客戶心聲", "預應同業破壞"], "a": 3, "x": "Mike告訴朱太太『我早說過』，代表有做好預應同業破壞的準備。這題要選「預應同業破壞」。"}, {"id": "A25", "e": "A", "n": 25, "q": "阿義無法親自服務時，在做好客戶交接上，應注意事項中，以下何者正確？", "o": ["最好的交接方式是透過電話或通訊軟體來做交接", "要將客戶資訊給友店同仁之前，一定要告知客戶原因並取得同意", "最好的交接方式是由交接方同仁自行面訪客戶", "兩家分店對業績比例的分配，在成交時再行討論確定即可"], "a": 1, "x": "最好的交接方式是與交接方同仁親自面訪客戶以示尊重；業績比例分配兩家分店一開始就要先有共識，並建議留下文字或訊息為證，以避免爭議。"}, {"id": "A26", "e": "A", "n": 26, "q": "斡轉定後，買方向左右鄰居詢問，竟得知所承買之標的物3年前曾發生跳樓自殺案件，但賣方認為死亡結果未發生於標的物內，故不同意解約，下列何者正確？", "o": ["買賣雙方必須先簽立不動產買賣合約書後始可辦理解約", "雖然並非死在屋內，但是仍屬於現場之一，故買方可以要求解約", "看跳樓原因，如果是家庭因素才可以", "需當事人死亡於室內始可要求解約"], "a": 1, "x": "依據內政部之解釋，跳樓自殺屬於求死行為，一旦在屋內有求死行為，縱非死於屋內，仍屬於非自然身故之標的。"}, {"id": "A27", "e": "A", "n": 27, "q": "商用產品的不動產說明書注意事項上會有很多需要在轉定前約定的提醒項目，以下哪一項不需在轉定前確認：", "o": ["先到建管處申請竣工圖、使照圖、結構圖，查詢違章現況是否有違建增改或被報拆紀錄", "買方公司登記遷出的時間或過往公司來註銷的營業登記", "商用不動產的價格漲跌趨勢以及租金行情", "排除租約或繼受租約"], "a": 2, "x": "「商用不動產的價格漲跌趨勢以及租金行情」係促成交易期間的努力重點，以便買賣雙方成交價格靠近，非屬轉定前的提醒項目。"}, {"id": "A28", "e": "A", "n": 28, "q": "住戶規約已明定頂樓平台歸頂樓住戶專有使用，其他住戶能否要求拆除頂樓加蓋？", "o": ["因為規約已明定，故不得要求拆除", "約定由某一戶專用頂樓平台，不代表其可以加蓋建造，故住戶仍可要求拆除", "若有影響結構安全就可以要求拆除，若無影響就不能要求拆除", "頂樓加蓋若有出租就能要求拆除，若無出租就不能要求拆除"], "a": 1, "x": "約定專用限於符合法規限制之利用方式，於頂樓平台加蓋屬於違建行為，顯然已超過住戶合意之權限範圍，故仍得請求拆除。"}, {"id": "A29", "e": "A", "n": 29, "q": "請問有關遺產轉移的敘述，下列何者錯誤？", "o": ["配偶不能單獨繼承", "遺產繼承人除配偶外，繼承順序為1.直系血親卑親屬 2.父母 3.兄弟姊妹 4.祖父母", "兩個月內需申報遺產稅、過戶繼承登記", "以協議分割處理可以方便以房養老"], "a": 2, "x": "六個月內需申報遺產稅、過戶繼承登記。"}, {"id": "A30", "e": "A", "n": 30, "q": "異業合作你覺得要注意的事情有哪些？", "o": ["找出合作對象的癢點協助解決", "雙向增客", "活動簡單明瞭，異業不用付出大量的人力、成本", "以上皆是"], "a": 3, "x": "選項皆是。"}, {"id": "A31", "e": "A", "n": 31, "q": "假設母親有遺產3000萬＋ABC三間房，若以「協議分割」方式處理，請問家中的爸爸、兒子、女兒會如何分到這些財產？", "o": ["三個人各拿1000萬，ABC三間房三位皆有名分", "三個人各拿1000萬，ABC三間房一人一間", "三個人各拿1000萬，ABC三間房三位協議平分", "三個人各拿1000萬，ABC三間房自由平分"], "a": 1, "x": "協議分割會將財產依個數平均分配，不會每個物件都有名分。（協議分割＝一人一間）"}, {"id": "A32", "e": "A", "n": 32, "q": "下列何者屬於個人資料？", "o": ["擔任獅子會會長", "擁有不動產之情形", "血型", "以上皆是"], "a": 3, "x": "凡得以直接或間接方式識別該個人之資料者，均屬個人資料。"}, {"id": "A33", "e": "A", "n": 33, "q": "在房地合一稅2.0新制中，若想節稅可考慮申請「自住房地租稅優惠」，請問關於自住房地優惠的適用條件何者有「誤」？", "o": ["個人或其配偶、未成年子女於該自住房屋設有戶籍，持有並居住於該房屋連續滿3年", "交易該自住房屋土地的前6年內，未將該房屋土地出租、供營業或執行業務使用", "個人與其配偶及未成年子女於交易自住房屋土地前6年內，未曾適用本自住房地租稅優惠", "課稅所得超過400萬元者，免稅額為400萬元，超過部分並按10%優惠稅率計算應納稅額"], "a": 0, "x": "應為：設有戶籍、持有並居住於該房屋連續滿「6」年（非3年）。"}, {"id": "A34", "e": "A", "n": 34, "q": "有關強制執行的裁判，可以分為裁定和判決，以下說明何者有誤：", "o": ["不論是裁定或判決，若有不服，均需在十日內提出上訴或抗告", "若對實體事項作結論時，是為判決；若對程序事項作結論，則為裁定", "若對判決不服，可提出上訴；若對裁定不服，則可提出抗告", "裁定只需進行書面審查，而判決則需進行實質審查，並需出庭當面對質"], "a": 0, "x": "若對裁定不服，可在十日內提出抗告；若對判決不服，可在二十日內提出上訴。（期間不同）"}, {"id": "A35", "e": "A", "n": 35, "q": "下列何者不是判斷A、B、C級辦公的主要項目？", "o": ["地段", "門廳", "管理", "室內裝潢"], "a": 3, "x": "室內裝潢非主要判斷依據。"}, {"id": "A36", "e": "A", "n": 36, "q": "請問下列何者『非』屬於房地合一稅課徵的交易日期認定基準。", "o": ["完成所有權移轉登記日", "訂定房地買賣契約之日", "預售屋買賣交易日", "符合視為房地交易之股份或出資額交易日"], "a": 1, "x": "成屋買賣以『所有權移轉登記日』為準，其餘預售屋或股權交易皆以契約簽約日為準。"}, {"id": "A37", "e": "A", "n": 37, "q": "主管在進行「日常溝通與通訊」時，下列哪種行為已跨越紅線進入「職場霸凌」的範疇？", "o": ["在合理工作時間與頻率內，與部屬討論專案進度", "部屬工作犯錯時，選擇私下嚴厲指正並給予明確改善方法", "非緊急情況下，於下班時間進行長期、密集的訊息轟炸與情緒勒索"], "a": 2, "x": "下班後長期密集訊息轟炸與情緒勒索屬於霸凌行為；合理的績效與指導則屬於合法管理。"}, {"id": "A38", "e": "A", "n": 38, "q": "小名想把爸爸的遺產過戶給媽媽，但發現爸爸底下還有一個妹妹，請問他要怎麼做才能將遺產順利過戶給媽媽？", "o": ["以應繼分處理", "以協議分割處理", "媽媽可以直接取得所有財產", "媽媽在協議後可直接取得全部財產"], "a": 1, "x": "應先透過協議分割處理，再以贈與方式將所有權全部給媽媽。"}, {"id": "A39", "e": "A", "n": 39, "q": "志明受託出售一間金店面，現有承租方，據賣方表示租金10萬元／月，請問志明是否可以把租賃收益每月10萬元這件事納入廣告用語？", "o": ["可以，因為屋主已經說有出租", "可以，因為符合行情", "不可以，廣告列示具體租金容易引發爭議", "不可以，因為屋主欠服務費"], "a": 2, "x": "營業／出租使用之物件，因承租方可能藉機期前終止租約，故將租金數字列入廣告中易造成糾紛，應予避免。如無法取得租賃契約，廣告不得標明。"}, {"id": "A40", "e": "A", "n": 40, "q": "經營社群媒體重視的是什麼？", "o": ["分享很多房子連結", "吸引目光的獨特性", "滿滿的落落長文字分享", "走一個跟自己個性不一樣的路"], "a": 1, "x": "經營社群媒體的重點在於能創造吸引目光的獨特性。"}, {"id": "A41", "e": "A", "n": 41, "q": "甲之房屋有壁癌現象，因擔心影響價格，於委託前請人重新粉刷，並要求在買賣契約中約定甲對之後屋況概不負責，交屋後買方果然發現壁癌又復發，請問買方可以要甲負責嗎？（請選最佳答案）", "o": ["可以，因為買方不知情", "可以，因為甲故意欺瞞", "有理由，因為瑕疵擔保責任屋主無過失責任", "不可以，因為已經修過了"], "a": 1, "x": "瑕疵擔保責任可經賣方約定而免除，但前提是賣方不可以有瑕疵不告知之行為，如有故意行為，依民法第366條，其免責約定無效，甚至構成詐欺責任。第1個選項雖沒錯，但非免責約定無效的原因，故不是最佳答案。"}, {"id": "A42", "e": "A", "n": 42, "q": "主管針對低績同仁特別安排一對一面談時間及輔導改善計畫，下列哪一項描述正確？", "o": ["主管僅針對績效較低的特定員工進行輔導，已屬差別待遇，因此構成職場霸凌", "只要是針對特定員工進行輔導與改善要求，即代表主管濫用管理權限，應盡免採取此類措施", "若輔導內容係基於客觀績效資料，設定合理明確的改善目標、期限及必要協助措施，屬合理管理範圍，不當然構成職場霸凌"], "a": 2, "x": "主管基於業務需求，針對績效未達標準之員工進行一對一溝通、績效改善輔導（如改善計畫、教育訓練、定期追蹤），屬於正常管理職責，並不會因為「只針對特定人員」就當然構成職場霸凌。"}, {"id": "A43", "e": "A", "n": 43, "q": "請問下列關於不動產說明書「內容」的描述，何者有誤？", "o": ["種類中，須包含物件的用途、建材、屋齡、坪數、所有權、他項權利及注意事項等", "費類中，因為每個房屋的交易費用不同，所以於成屋交易再出示交易時所需的費用即可，無須在不動產說明書中提供各項概算金額", "圖類是確認本物件原登記時的人與物與現況是否相符，常使用建物測量成果圖、地籍圖，可確認現況空間是否有增建占用等情況", "委託證明附上屋主簽名的委託書及附近成交行情資訊，是為了讓買賣雙方資訊對等"], "a": 1, "x": "費類一定要包含買賣雙方交易時所需的費用提醒及概算，並附上相關法令規定，以方便同仁向客戶說明。"}, {"id": "A44", "e": "A", "n": 44, "q": "要約書、斡旋金契約、定金收據，拒絕給予客戶三天審閱期，買方亦未勾選放棄行使審閱權，效果如何？", "o": ["契約全部無效", "違反消保法規定，消費者得主張部分條款不構成契約內容", "因仲介瑕疵，公司不得向買方收取契費", "若賣主願意出售並成交，買方得拒絕履行買賣契約"], "a": 1, "x": "消保法第11之1條第1項：企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。同條第2項：違反者，其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容。"}, {"id": "A45", "e": "A", "n": 45, "q": "關於主管對同仁的「績效要求與工作分配」，下列何者屬於「合理管理」？", "o": ["對全體同仁採一致標準，設定具挑戰性但可達成且能說明理由的目標", "針對特定部屬專案加碼，設定客觀上完全無法達成的績效目標", "利用業務調整名義，刻意將特定同仁邊緣化並給予差別待遇"], "a": 0, "x": "目標具挑戰性但可達成、標準一致且能說明理由者屬合法管理；專挑特定人刁難則屬霸凌。"}, {"id": "A46", "e": "A", "n": 46, "q": "有關強制執行的裁判，可以分為裁定和判決，以下說明何者有誤：", "o": ["不論是裁定或判決，若有不服，均需在十日內提出上訴或抗告", "若對實體事項作結論時，是為判決；若對程序事項作結論，則為裁定", "若對判決不服，可提出上訴；若對裁定不服，則可提出抗告", "裁定只需進行書面審查，而判決則需進行實質審查，並需出庭當面對質"], "a": 0, "x": "若對裁定不服，可在十日內提出抗告；若對判決不服，可在二十日內提出上訴。"}, {"id": "A47", "e": "A", "n": 47, "q": "哪一個系統可以查詢土地有無供公眾通行之道路？", "o": ["違建查報系統", "全國地政電子謄本系統", "地籍圖資網路便民服務系統"], "a": 2, "x": "地籍圖資網路便民服務系統。"}, {"id": "A48", "e": "A", "n": 48, "q": "簽土地委託前，使用土地委託Check List，對簽委託的幫助，何者敘述有誤？", "o": ["可以針對委託標地初步查檢", "若有需委託人配合查詢資料，可事先說明，避免來返確認", "可以快篩出是不是屬於法定空地機率較高者", "可以談到一個好的銷售價格"], "a": 3, "x": "銷售價格須與土地所有權人協商，並非Check List的功能。"}, {"id": "A49", "e": "A", "n": 49, "q": "關於土地上有地上物之處理方式敘述，下列何者有誤？", "o": ["詢問所有權人有哪些地上物並請所有權人填寫於契據上", "不用特別理會，因為僅出售土地", "業務仔細查檢現場"], "a": 1, "x": "不能因為僅出售土地就不理會地上物。"}, {"id": "A50", "e": "A", "n": 50, "q": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值之多少？", "o": ["百分之一點二", "百分之一點五", "百分之二", "百分之三"], "a": 0, "x": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值之1.2%。"}, {"id": "B1", "e": "B", "n": 1, "q": "店長為提升團隊業績，規定每週例會時，由當週績效排名最後一名的同仁站立參與會議，並要求其說明業績未達標原因及改善方式。關於此管理措施，下列何者描述最正確？", "o": ["店長已事先公布規則，且目的是提升業績，因此屬於合理管理措施，員工應配合遵守", "績效表現本來就是員工責任，只要未達成績效目標，採取站立處罰方式屬正常管理，不涉及職場霸凌", "以站立方式要求特定績效較差員工於公開場合接受檢視，除可能具有懲罰性質外，也可能造成公開羞辱，主管應避免採取此類管理方式"], "a": 2, "x": "主管有權進行績效管理（設定目標、檢視成果、要求改善、績效輔導），然而管理方式仍須符合合理性、必要性及尊重人格尊嚴的原則。"}, {"id": "B2", "e": "B", "n": 2, "q": "媽媽未得女兒同意，要出售女兒名下的房屋，並且在授權代理人出售的授權書上為女兒簽名，媽媽這種行為，會觸犯什麼罪？", "o": ["背信罪", "侵占罪", "偽造文書罪", "因為他們是母女，所以媽媽替女兒簽名不會構成刑事責任"], "a": 2, "x": "刑法上所謂偽造文書，是以無制作權之人冒用他人名義而制作文書為條件；所謂他人，除自己外，父母、妻子、兄弟均包括在內，不因有親屬關係而例外。"}, {"id": "B3", "e": "B", "n": 3, "q": "主動與分店共買客戶接洽時，請協助阿德挑出電話拜訪共享買方客戶時「恰當」的預應。甲：「客戶搬出個資法追問電話號碼哪裡來時，我會如實告知電話是透過何種管道取得」乙：「客戶主動跟我反應某人服務不好時，我直接把電話轉給店長處理」丙：「若客戶表達目前暫無需求，我得恭喜對方成交，並登入系統註記『勿擾』」丁：「若客戶願告知新屋添購的地點，我可以視情況追問原住房子是否有規劃出售」", "o": ["甲乙", "乙丁", "乙丙", "甲丁"], "a": 3, "x": "接洽時應提前主動告知電話取得方式（甲對）；客戶反應同仁服務問題應耐心聽完、事後反應給店長處理，而非直接轉接；系統設[勿擾]是指客戶明示不願受打擾時的註記，而非客戶告知已成交後之作法。故甲、丁恰當。"}, {"id": "B4", "e": "B", "n": 4, "q": "下列有關財產交易所得稅（舊制）重購退稅適用要件之敘述，何者正確？", "o": ["於出售自用住宅房屋完成移轉登記日起2年內重購者，先購後售者亦適用之", "重購房屋的市值必須超過出售的房屋市價", "出售或重購之房屋以納稅義務人本人或其配偶名義登記者都可以退稅", "出售土地於出售前半年內未曾供營業使用或出租行為"], "a": 2, "x": "重購退稅要件：1.以2次產權移轉日計算，相距期間應為2年內；2.看土地地價；3.一年內沒有營業使用或出租行為。"}, {"id": "B5", "e": "B", "n": 5, "q": "請問有關遺產轉移的敘述，下列何者錯誤？", "o": ["配偶不能單獨繼承", "遺產繼承人除配偶外，繼承順序為1.直系血親卑親屬 2.父母 3.兄弟姊妹 4.祖父母", "兩個月內需申報遺產稅、辦戶繼承登記", "以協議分割處理可以方便以房養老"], "a": 2, "x": "六個月內需申報遺產稅、過戶繼承登記。"}, {"id": "B6", "e": "B", "n": 6, "q": "所有權人為境內之「營利事業」，修法後改為適用短期交易重稅並依持有期間課徵不同稅率。關於營利事業所得應適用之房地合一稅率下列何者有「誤」？", "o": ["2年內移轉：課45%", "持有逾2年，未滿5年：課35%", "持有逾5年，未滿10年：課20%", "持有逾10年以上：課15%"], "a": 3, "x": "營利事業課徵之房地合一稅率最低為20%，持有逾10年以上仍然維持20%稅率（而非15%）。"}, {"id": "B7", "e": "B", "n": 7, "q": "共用部分、約定共用部分之修繕、管理、維護，以下何者為「非」？", "o": ["由管理負責人為之", "管理委員會為之", "由公共基金支付", "由最近鄰該修繕處所之區分所有權人負擔"], "a": 3, "x": "依公寓大廈管理條例第10條第2項規定，並非由最近該修繕處所之區分所有權人負擔，故選項4為錯誤。"}, {"id": "B8", "e": "B", "n": 8, "q": "一般而言，零售商場的租金一般習慣採用什麼制度來計算收益率？", "o": ["固定租金", "抽成", "包底", "包底抽成"], "a": 3, "x": "零售商場的租金一般習慣採用包底抽成制度來計算收益率。"}, {"id": "B9", "e": "B", "n": 9, "q": "因他人拋棄繼承而應為繼承之人，為拋棄繼承時，應於知悉其得繼承之日起多久為之？", "o": ["一個月", "二個月", "三個月", "六個月"], "a": 2, "x": "民法第1174條：繼承人得拋棄其繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之。"}, {"id": "B10", "e": "B", "n": 10, "q": "以下哪一類法人客戶的財產處分需依法有會員或會員代表過半數之出席，應有出席人數三分之二以上表決同意：", "o": ["股份有限公司", "公益社團法人", "財團法人", "有限合夥公司"], "a": 1, "x": "依人民團體法，公益社團法人其財產之處分應取得會員（代表）大會之決議，應有會員（代表）過半數之出席，出席人數三分之二以上表決同意。"}, {"id": "B11", "e": "B", "n": 11, "q": "在房地合一稅2.0新制中，若想節稅可考慮申請「自住房地租稅優惠」，請問關於自住房地優惠的適用條件何者有「誤」？", "o": ["個人或其配偶、未成年子女於該自住房屋設有戶籍，持有並居住於該房屋連續滿3年", "交易該自住房屋土地的前6年內，未將該房屋土地出租、供營業或執行業務使用", "個人與其配偶及未成年子女於交易自住房屋土地前6年內，未曾適用本自住房地租稅優惠", "課稅所得超過400萬元者，免稅額為400萬元，超過部分並按10%優惠稅率計算應納稅額"], "a": 0, "x": "應為：設有戶籍、持有並居住於該房屋連續滿「6」年（非3年）。"}, {"id": "B12", "e": "B", "n": 12, "q": "房地合一稅制自105年1月1日生效以來已執行多年，請問本次修法2.0的主要目的與方向為何？", "o": ["抑制個人短期炒作不動產", "防杜個人藉由設立營利事業短期買賣房地，規避稅負", "防杜藉由預售屋交易炒作房地產規避稅負", "防杜利用高於公告土地現值之土地移轉現值方式規避所得稅負", "以上皆是"], "a": 4, "x": "選項皆是。"}, {"id": "B13", "e": "B", "n": 13, "q": "小明是頂樓住戶，最近社區決議要與行動通訊業者簽約在頂樓設置基地台，所得作為公共基金，但小明不同意，請問住戶大會這項決議有無問題？", "o": ["沒有，多數決是民主的表現，小明只能遵守", "有問題，因為未經小明同意，所以決議不生效力", "如果出席人數合法就沒有問題", "以上皆非"], "a": 1, "x": "公寓大廈管理條例第33條第2款：於樓頂平臺設置基地台等設備，設置於屋頂者，應經頂層區分所有權人同意。故小明（頂層住戶）不同意，決議有問題。"}, {"id": "B14", "e": "B", "n": 14, "q": "專有部分、約定專用部分之修繕、管理、維護，應由何人進行，並負擔其費用？", "o": ["各該區分所有權人", "約定共用部分之使用人", "管理負責人", "管理委員會"], "a": 0, "x": "依公寓大廈管理條例第10條第1項，專有部分、約定專用部分之修繕、管理、維護，由各該區分所有權人為之，並負擔其費用。"}, {"id": "B15", "e": "B", "n": 15, "q": "依照房地合一稅2.0之計算公式，若所有權人未提示『相關費用』證明文件者，依照新制之『相關費用』數額應如何認定？", "o": ["成交價額之5%", "成交價額之3%", "金額上限為30萬元", "成交價額之3%且金額上限為30萬元"], "a": 3, "x": "本次修法將個人房地交易推計費用率由5%調降為3%，並同時增訂費用金額上限為新臺幣30萬元。故無法提出證明文件者，課稅所得將提高。"}, {"id": "B16", "e": "B", "n": 16, "q": "有關強制執行的裁判，可以分為裁定和判決，以下說明何者有誤：", "o": ["不論是裁定或判決，若有不服，均需在十日內提出上訴或抗告", "若對實體事項作結論時，是為判決；若對程序事項作結論，則為裁定", "若對判決不服，可提出上訴；若對裁定不服，則可提出抗告", "裁定只需進行書面審查，而判決則需進行實質審查，並需出庭當面對質"], "a": 0, "x": "若對裁定不服，可在十日內提出抗告；若對判決不服，可在二十日內提出上訴。"}, {"id": "B17", "e": "B", "n": 17, "q": "有關「土壤污染評估調查及檢測資料」，下列敘述何者有誤？", "o": ["中央主管機關公告之事業所使用的土地，在移轉前需要提供「土壤污染評估調查及檢測資料」給地方主管機關備查取得備查函", "若未取得「土壤污染評估調查及檢測資料」備查函，就辦理土地移轉登記，會被處罰緩", "所有的工業用地在移轉前都需要提供「土壤污染評估調查及檢測資料」給地方主管機關備查取得備查函"], "a": 2, "x": "不是所有的工業用地在移轉前都需要提供「土壤污染評估調查及檢測資料」給地方主管機關備查取得備查函。"}, {"id": "B18", "e": "B", "n": 18, "q": "依據公司買賣契約之約定，如賣方委託時其社區已經決議須每戶另繳交十萬元作大樓外牆整修費用，但賣方因未住該社區而不知情，交屋後買方才知道此事，請問該費用應由何人負擔？", "o": ["買方", "賣方", "仲介公司", "買賣雙方平均負擔"], "a": 1, "x": "依現行不動產買賣契約約定，若交屋前有重大修繕決議須由住戶另外付費者，賣方應告知買方；如未告知，除買方已知悉者外，應由賣方負擔費用。"}, {"id": "B19", "e": "B", "n": 19, "q": "有關新成屋的經營方式何者為是？", "o": ["建立社區服務4.0，當尚未交屋時建立基本專業能力，才能即時有效提供客戶的問題", "交屋完即寄送賀卡，裏頭除介紹自己外，食衣住行育樂資訊都要有，並定錨在客戶心中", "綁定社區與門市的連結、行銷物傘架、魚、樹等，並美盡社區活動內容", "以上皆是"], "a": 3, "x": "選項皆是。"}, {"id": "B20", "e": "B", "n": 20, "q": "關於不動產說明書的注意事項，請問何者錯誤？", "o": ["物件有增建或同棟它戶有疑似非自然身故等狀況，一定要在注意事項中詳細記載，並向客戶解說", "若在不動產說明書上有發現不懂的地方，可以參考線上的注意事項解說手冊，或直接詢問店長", "不動產說明書上若有可能因物價指數波動或年度重新公告而更改稅額，皆須註記並提醒客戶", "若所有權人不願意提供物件的用途、建材、屋齡、坪數、所有權、他項權利，不可強制要求提供"], "a": 3, "x": "物件的用途、建材、屋齡、坪數、所有權、他項權利是必須提供的，業務可要求所有權人提供。"}, {"id": "B21", "e": "B", "n": 21, "q": "賣方Tina因新買的房子裝潢延期，須延後三個月才能入住，希望新屋屋主讓她再住三個月，買賣雙方同意採用「售後回租」。身為專業房仲，哪一項「不是」你應當發揮的功能？", "o": ["此法可彌補買方雖無入住卻須繳交房貸所產生的利息損失；原屋主Tina也不用多搬一次家", "我會提醒交屋前一定要讓雙方做好屋況確認，避免雙方身份轉換後因原本屋況瑕疵造成爭議", "我會告知客戶Tina，交屋後在回租期間內若有新產生的屋況瑕疵，會由新屋主處理", "由於是售後回租，因此必須在轉屋合約上直接載明因回租而延後交屋的新交屋日期，而非簽訂租賃契約"], "a": 3, "x": "售後回租是在售後發生的權宜型雙方合議租賃行為，與延後交屋無關。應確保Tina與新屋主另簽訂租賃契約，把租金、租期、附贈物、瑕疵處理方式等細項寫清楚，故選項4的作法錯誤。"}, {"id": "B22", "e": "B", "n": 22, "q": "小明家中疑似因公共管線漏水遭受波及，為了修繕必須進入樓上阿花家勘查，但阿花拒絕，請問小明在法律上有何權利基礎可以請阿花配合？", "o": ["民法的侵權行為", "刑法的妨害自由", "公寓大廈管理條例的相關規定", "刑法的公共危險罪"], "a": 2, "x": "因修繕專有或共用部分時，如有必要進入任一方之專有部分或約定專用部分時，該住戶不得拒絕。此為公寓大廈管理條例第6條第1項第2款所明定。"}, {"id": "B23", "e": "B", "n": 23, "q": "以下貸款條件不佳的物件中，哪一個說明是正確的：", "o": ["只有地上權的物件，因為沒有土地所有權，而不易爭取到好的貸款條件", "工業住宅因為工業區建物需求性低，而不易爭取到好的貸款條件", "隔套收租產品，因為轉手複本率高，而不易爭取到好的貸款條件", "特殊屋況如漏水／海砂／凶宅／傾斜物件，因為銀行作業成本高，而不易爭取到好的貸款條件"], "a": 0, "x": "地上權、工業住宅、隔套收租、特殊屋況都是貸款條件不佳的物件；但選項理由只有「地上權因無土地所有權」是正確的（工業住宅是土地使用分區問題、隔套收租是結構安全疑慮、特殊屋況是根本安全風險，皆與銀行作業成本無關）。"}, {"id": "B24", "e": "B", "n": 24, "q": "小花於民國115年死亡，遺有一棟價值1,300萬元的房屋，假設無其他遺產，且暫不考慮其他扣除額，請問應繳納多少遺產稅？", "o": ["130萬元", "133.3萬元", "260萬元", "無須繳納"], "a": 3, "x": "遺產稅免稅額由1200萬（110年）提高至1333萬（111年）。1300萬未超過免稅額，故無須繳納。"}, {"id": "B25", "e": "B", "n": 25, "q": "關於張貼「實體廣告」，誰的認知是對的？小天：親自去附近社區的信箱做派報投遞。小賴：將宣傳看板丟置公車站牌下方增加曝光率。小何：將建商建案廣告圍籬同樣做成宣傳單。小田：可先張貼完廣告後再補送廣告核准編號申請。", "o": ["小天", "小賴", "小何", "小田"], "a": 0, "x": "任何類型廣告一定要先取得廣告核准編號才可進行後續動作。小賴放置看板須確認是否影響安全動線；小何不可使用未經著作人授權的圖像；小田必須在申請核准編號後才能張貼。故只有小天正確。"}, {"id": "B26", "e": "B", "n": 26, "q": "買方交屋後發現房屋有傾斜，經鑑定後發現是簽約後流程中因隔壁工地施工所致，請問賣方要負責嗎？", "o": ["要", "不要", "不一定", "法院認定"], "a": 0, "x": "瑕疵擔保責任以交付為責任分界基準，交屋前已發生的瑕疵屋主必須負責。本題在簽約後、交屋前發生鄰損傾斜，屋主必須負責。"}, {"id": "B27", "e": "B", "n": 27, "q": "下列何者不是評估店面價值關鍵的項目？", "o": ["廣告面寬", "租金投報", "裝潢新舊", "商圈地段"], "a": 2, "x": "評估店面價值關鍵項目為：廣告面寬、租金投報、商圈地段。裝潢新舊非關鍵。"}, {"id": "B28", "e": "B", "n": 28, "q": "台東市有一棟正在被法拍的物件，市值1000萬，若進到第四拍，請問拍賣底價可能為多少錢？", "o": ["800萬", "400萬", "640萬", "600萬"], "a": 2, "x": "若進到第四拍會進行減價或另行估價；若選擇減價，則會低於第三拍價格：1000×80%×80%＝640萬。"}, {"id": "B29", "e": "B", "n": 29, "q": "為了確保分店現址沒有不符合法規的違建，可以透過哪兩項圖資來做確認？", "o": ["google map＋格局圖", "格局圖＋地籍圖", "建物測量成果圖＋竣工圖", "謄本＋使用執照"], "a": 2, "x": "建物測量成果圖能針對所有權人的建物外框範圍做判斷；是否牽涉違建違法使用則須用竣工圖來確認。"}, {"id": "B30", "e": "B", "n": 30, "q": "若所有權人為隱匿名字，可利用「二類謄本查詢」，輸入下列哪個資訊，比對是否為信義經營過的客戶。", "o": ["身分證號碼", "縣市＋姓＋身分證前4碼＋末1碼", "出生年月日", "縣市＋姓＋身分證號碼"], "a": 1, "x": "可於系統上輸入縣市＋姓＋身分證前4碼＋末1碼進行查詢。"}, {"id": "B31", "e": "B", "n": 31, "q": "賣方在房屋四周裝設高價之監視器，今出售該屋，於交屋後將監視設備拆走，買方主張屬固定物、賣方不可以拆走，有無理由？", "o": ["有理由", "無理由", "要看價值多寡", "仲介公司認定"], "a": 1, "x": "監視設備雖是固定的，但並非法律上之固定物，亦非建物之一部，因此除非雙方有約定贈與，否則賣方是可以拆走的。"}, {"id": "B32", "e": "B", "n": 32, "q": "申請補發土地所有權狀，依法應該公告多久？", "o": ["15天", "30天", "3個月", "6個月"], "a": 1, "x": "依土地登記規則第155條，申請補發土地所有權狀，依法應該公告30天。"}, {"id": "B33", "e": "B", "n": 33, "q": "依民法規定，買賣契約是何時成立？", "o": ["簽立買賣契約書時", "買賣雙方就標的物及其價金互相同意時", "賣方收受定金時", "交屋時"], "a": 1, "x": "民法第345條第2項：當事人就標的物及其價金互相同意時，買賣契約即為成立。"}, {"id": "B34", "e": "B", "n": 34, "q": "假扣押和假處分的「假」，係指：", "o": ["真真假假的假", "假是暫時之意", "假是提前之意", "與假執行的假同意"], "a": 1, "x": "假扣押和假處分的假是「暫時」之意（暫時扣押、暫時處分）；假執行的假則是提前執行之意，意涵不同，都不是真真假假的假。"}, {"id": "B35", "e": "B", "n": 35, "q": "阿義於108年12月1日出售A屋自宅，移轉現值100萬元，已繳土地增值稅10萬元。109年12月購買一棟房子，移轉現值95萬元，登記完成並本人設籍，阿義可申請退還多少土地增值稅稅款？", "o": ["可以退稅，退2萬", "可以退稅，退5萬", "不可以申請退稅", "可以退稅，退10萬"], "a": 1, "x": "原出售土地地價100萬－已繳土增稅10萬＝餘額90萬，只要買超過90萬即可退稅：買91萬退1萬、買92萬退2萬…買95萬退5萬。"}, {"id": "B36", "e": "B", "n": 36, "q": "以下同仁在客戶服務範圍是在友店或友區時，判斷是否要親自服務的原則，何者係屬合宜？", "o": ["小平：如果客戶非我服務不可，天涯海角我都親力親為", "小安：PASS給別人自己業績就變少了，堅持不pass", "小順：如果案子太小，不要接比較不會浪費時間", "小新：如果本身對該區域不熟，PASS給當地的分店來服務會是對客戶最有利的方式"], "a": 3, "x": "小平若力有未及，應跟客戶溝通並請當地分店同仁接手服務；小安太自私，沒把客戶利益放前面；小順太勢利眼。故小新最合宜。"}, {"id": "B37", "e": "B", "n": 37, "q": "引導買方出價又得同時符合公司理念最好的方式為？", "o": ["銷售前預應案件搶手，決定速度要快", "帶看時加碼促銷力道，爭取當下收斡旋", "平時建立良好信任感，同理心對待", "請同仁陪同帶看，加強促斡力道"], "a": 2, "x": "平時建立良好信任感、同理心對待是最好的方式。"}, {"id": "B38", "e": "B", "n": 38, "q": "主席跟馬拉桑買小米酒，並簽發本票給馬拉桑作為擔保，但後主席不付款，馬拉桑可以向法院聲請何種程序保障權益？", "o": ["公示催告", "本票裁定", "除權判決", "公示送達"], "a": 1, "x": "依票據法第123條及非訟事件法規定，可以持本票向法院聲請裁定准予強制執行（本票裁定）。"}, {"id": "B39", "e": "B", "n": 39, "q": "某建物共有五戶，大家約定頂樓由其中五樓使用，於是該戶就在頂樓大興土木蓋違建，二樓住戶提出抗議無效，遂向法院起訴，請問誰有理由？", "o": ["五樓有理，因為已經分管", "二樓有理，因為二樓比較大聲", "二樓有理，因為就算有分管協議也不可以蓋違建", "不一定，要看當時其他住戶意見"], "a": 2, "x": "依法院實務見解，頂樓之功能僅止於休憩景觀之用，縱有分管協議也不可以加蓋違建，所以違建必須拆除。"}, {"id": "B40", "e": "B", "n": 40, "q": "小明是不動產經紀營業員，當他換證時，必須檢附在中央主管機關認可之機構、團體完成專業訓練多久時間以上之證明文件？", "o": ["15小時以上", "20小時以上", "25小時以上", "30小時以上"], "a": 1, "x": "應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練二十個小時以上之證明文件辦理換證（不動產經紀業管理條例第19條）。"}, {"id": "B41", "e": "B", "n": 41, "q": "依不動產經紀業管理條例之規定，下列有關經紀人員業務及責任之敘述，何者有誤？", "o": ["經紀人員不得收取差價", "經紀人員收取差價者，應無息返還支付人", "經紀人員在執行業務過程中，應以經委託人簽章之不動產說明書向買方進行解說", "經紀人員對於因業務所知悉或持有之他人秘密，不得無故洩漏"], "a": 1, "x": "依不動產經紀業管理條例第19條，經紀業或經紀人員不當收取差價或其他報酬者，應於加計利息後加倍返還支付人（非無息返還）。"}, {"id": "B42", "e": "B", "n": 42, "q": "買方以第三人之票據（客票）做為斡旋金支票時，應特別注意下列何種事項？", "o": ["請買方於客票簽名背書轉讓給賣方", "電洽銀行詢問支存有無足夠存款", "向銀行辦理票據掛失止付", "將票據拿去貼現後以現金做為斡旋金"], "a": 0, "x": "於票據簽名者始負擔票據責任，且買方未背書轉讓給賣方，賣方無法向銀行提示票據兌現，故應請買方於客票上簽名背書轉讓予賣方。"}, {"id": "B43", "e": "B", "n": 43, "q": "甲出租房屋給乙，三天後乙搬入居住，並依約繳交房租，下列敘述何者最正確？", "o": ["關於房屋租金之請求權，其消滅時效期間為兩年", "租賃期間若甲將房屋出賣給丙，甲與乙之租賃關係即消滅", "甲若將房屋贈與丁，並移轉房屋所有權給丁，則乙之租賃契約對丁繼續存在", "甲若先後將房屋出賣給戊與辛，則基於優先性之考量，僅甲與戊之買賣契約生效"], "a": 2, "x": "租金請求權依民法第126條規定為五年，而債權沒有成立時間先後的問題，一律平等。（買賣不破租賃）"}, {"id": "B44", "e": "B", "n": 44, "q": "假設父親有遺產3000萬＋ABC三間房，若以「應繼分」方式處理，請問家中的媽媽、兒子、女兒會如何分到這些財產？", "o": ["三個人各拿1000萬，ABC三間房三位皆有名分", "三個人各拿1000萬，ABC三間房一人一間", "三個人各拿1000萬，ABC三間房三位協議平分", "三個人各拿1000萬，ABC三間房自由平分"], "a": 0, "x": "應繼分即為所有財產平均分配（每間房三位皆有應有部分／名分）。"}, {"id": "B45", "e": "B", "n": 45, "q": "熊先生買1000萬的房子，已付定金100萬元，但賣方王先生表示後悔不賣，熊先生要求返還100萬元及違約金100萬元共200萬元。為避免王先生脫產，熊先生應採取以下限制登記的哪一項作為：", "o": ["預告登記", "破產登記", "假扣押", "禁止處分"], "a": 2, "x": "由於熊先生要的是金錢的請求，合宜的作為是聲請假扣押，即暫時扣押王先生的房子，待其出售房產可確保獲得給付。"}, {"id": "B46", "e": "B", "n": 46, "q": "下列何者非工業用地？", "o": ["非都市地區乙種建築用地", "產業園區", "科技園區"], "a": 0, "x": "非都市地區乙種建築用地不是工業用地。"}, {"id": "B47", "e": "B", "n": 47, "q": "「提前預應」可以讓客戶理解同業破壞的話術，請挑出以下四位新人在Line上給客戶的預應中「不合宜」的說帖？", "o": ["小芸：謝謝王大哥給我專任委託的服務機會，如果最近突然有同業主動與您聯繫、直稱手上有客戶可以馬上購買，那很有可能是同業製造假客戶的競爭手段", "小新：陳阿姨，買方目前的出價已經很接近我們的期望價格了，近期如果您有接到同業打給您說價格賣低了、或退服務費的情形，那可能是同業為中斷我們洽談的拖延歡術", "阿齋：張爺爺你要注意，巷口那間xx房屋，聽網路上人家說專門拐騙像您這樣的退休公務員，角色扮演客戶、丟假斡旋，您可別被騙了", "阿敬：呂先生，這是我整理給您的本棟大樓近三年來的成交行情資訊，請您放心，我們不會刻意壓低屋主價格，但競爭的同業還是有可能散發訊息說我們公司如何，但行情資訊都是公開的，我們不可能造假"], "a": 2, "x": "可跟客戶預應同業可能的破壞方式，但切勿加油添醋，甚至傳達網路上的謠言或臆測。阿齋針對特定同業、引用未經查證的資訊，因此不適宜。"}, {"id": "B48", "e": "B", "n": 48, "q": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值多少？", "o": ["百分之一點二", "百分之一點五", "百分之二", "百分之三"], "a": 0, "x": "依房屋稅條例規定，住家用房屋之課徵稅率為房屋現值之1.2%。"}, {"id": "B49", "e": "B", "n": 49, "q": "「朱太太，我是信義的Mike啦！…所以，朱太太我早說過…」從這段對話中，你可以判斷Mike早就做過哪一點？", "o": ["落實做好回報", "與客戶誠懇溝通", "多聽客戶心聲", "預應同業破壞"], "a": 3, "x": "Mike告訴朱太太『我早說過』，代表有做好預應同業破壞的準備。這題要選「預應同業破壞」。"}, {"id": "B50", "e": "B", "n": 50, "q": "對於沒有繳管理費的住戶，由於金額不大，一般可由管委會主委向法院聲請：", "o": ["支付命令", "假扣押", "假執行", "強制執行"], "a": 0, "x": "當債權金額不大、不值得耗時花錢取得執行名義來確保債權時，可以聲請支付命令為之。"}];
const LS = 'sinyi_quiz_v1';

function loadState(){
  try{ return JSON.parse(localStorage.getItem(LS)) || {} }catch(e){ return {} }
}
function saveState(){ try{ localStorage.setItem(LS, JSON.stringify(state)) }catch(e){} }
let state = loadState();
state.wrong = state.wrong || {};      // id -> true (待複習)
state.star  = state.star  || {};      // id -> true
state.totalDone = state.totalDone || 0;
state.totalOk   = state.totalOk   || 0;

const $ = s=>document.querySelector(s);
const byId = id => QUESTIONS.find(q=>q.id===id);
const KEYS = ['A','B','C','D','E'];

// ---- session ----
let ses = null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function start(mode){
  let list=[], title='';
  if(mode==='A'){ list=QUESTIONS.filter(q=>q.e==='A'); title='模擬考 A'; }
  else if(mode==='B'){ list=QUESTIONS.filter(q=>q.e==='B'); title='模擬考 B'; }
  else if(mode==='random'){ list=shuffle(QUESTIONS).slice(0,20); title='隨機測驗'; }
  else if(mode==='wrong'){
    list=shuffle(QUESTIONS.filter(q=>state.wrong[q.id]));
    if(!list.length){ alert('目前沒有待複習的錯題，先去做幾份考卷吧！'); return; }
    title='錯題本重練';
  }
  else if(mode==='star'){
    list=shuffle(QUESTIONS.filter(q=>state.star[q.id]));
    if(!list.length){ alert('你還沒有標記任何重點題目。作答時點左下角星號即可加入。'); return; }
    title='重點標記';
  }
  ses={mode,title,list,i:0,ok:0,no:0,wrongIds:[],answered:false};
  go('quiz'); renderQ();
}

function renderQ(){
  const q=ses.list[ses.i];
  $('#qTag').textContent = q.e==='A'?'模擬考A':(q.e==='B'?'模擬考B':q.e);
  $('#qTag').textContent = (q.e==='A')?'考A':'考B';
  $('#qPos').textContent = (ses.i+1)+' / '+ses.list.length;
  $('#prog').style.width = (ses.i/ses.list.length*100)+'%';
  $('#liveOk').textContent=ses.ok; $('#liveNo').textContent=ses.no;
  $('#qText').innerHTML = '<span class="idx">Q'+q.n+'</span>'+esc(q.q);

  const wrap=$('#qOpts'); wrap.innerHTML='';
  q.o.forEach((opt,idx)=>{
    const b=document.createElement('button');
    b.className='opt'; b.dataset.i=idx;
    b.innerHTML='<span class="k">'+KEYS[idx]+'</span><span class="otx">'+esc(opt)+'</span>';
    b.onclick=()=>choose(idx);
    wrap.appendChild(b);
  });
  const exp=$('#qExp'); exp.className='explain';
  ses.answered=false;
  const nb=$('#nextBtn'); nb.disabled=true; nb.textContent='選擇答案';
  // star
  const st=$('#starToggle'); const on=!!state.star[q.id];
  st.textContent=on?'★':'☆'; st.classList.toggle('on',on);
}

function choose(idx){
  if(ses.answered) return;
  const q=ses.list[ses.i];
  ses.answered=true;
  const correct = idx===q.a;
  // stats
  state.totalDone++; if(correct) state.totalOk++;
  if(correct){
    ses.ok++;
    if(state.wrong[q.id]) delete state.wrong[q.id];  // 答對移除錯題
  }else{
    ses.no++; ses.wrongIds.push(q.id);
    state.wrong[q.id]=true;
  }
  saveState();

  document.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i; b.classList.add('disabled'); b.onclick=null;
    if(i===q.a){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend','<span class="badge">正解</span>'); }
    else if(i===idx){ b.classList.add('wrong'); b.insertAdjacentHTML('beforeend','<span class="badge">你選的</span>'); }
    else b.classList.add('dim');
  });
  const exp=$('#qExp');
  exp.className='explain show '+(correct?'pass':'fail');
  $('#expR').textContent = correct?'✓ 答對了':'✕ 答錯了（此題已加入錯題本）';
  $('#expBody').textContent=q.x;
  $('#liveOk').textContent=ses.ok; $('#liveNo').textContent=ses.no;
  $('#prog').style.width=((ses.i+1)/ses.list.length*100)+'%';
  const nb=$('#nextBtn'); nb.disabled=false;
  nb.textContent = (ses.i+1<ses.list.length)?'下一題':'看結果';
  refreshHome();
}

function next(){
  if(!ses.answered) return;
  if(ses.i+1<ses.list.length){ ses.i++; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }
  else showResult();
}

function toggleStar(){
  const q=ses.list[ses.i];
  if(state.star[q.id]) delete state.star[q.id]; else state.star[q.id]=true;
  saveState();
  const st=$('#starToggle'); const on=!!state.star[q.id];
  st.textContent=on?'★':'☆'; st.classList.toggle('on',on);
  refreshHome();
}

function showResult(){
  const tot=ses.list.length, ok=ses.ok, pct=Math.round(ok/tot*100);
  $('#rPct').textContent=pct+'%';
  $('#rOk').textContent=ok; $('#rNo').textContent=ses.no; $('#rTot').textContent=tot;
  const off=402-402*(pct/100); $('#ringFg').style.strokeDashoffset=off;
  let msg,sub;
  if(pct===100){msg='滿分！觀念很扎實 🎉';sub=ses.title+'．全部答對';}
  else if(pct>=80){msg='表現不錯，快通關了';sub='再把錯題本清完就穩了';}
  else if(pct>=60){msg='及格邊緣，加強一下';sub='錯題已收好，建議馬上重練';}
  else {msg='多練幾次就會了';sub='先從錯題本開始複習吧';}
  $('#rMsg').textContent=msg; $('#rSub').textContent=sub;
  $('#rRetry').style.display = ses.wrongIds.length?'block':'none';

  const list=$('#rList');
  if(ses.wrongIds.length){
    let h='<div class="sec-title" style="margin-top:4px">本次答錯（'+ses.wrongIds.length+'）</div>';
    ses.wrongIds.forEach(id=>{ const q=byId(id); h+=itemHTML(q,true); });
    list.innerHTML=h;
  }else list.innerHTML='';
  go('result'); window.scrollTo({top:0});
  refreshHome();
}

function retryWrong(){
  const ids=ses.wrongIds.slice();
  ses={mode:'retry',title:'重練錯題',list:shuffle(ids.map(byId)),i:0,ok:0,no:0,wrongIds:[],answered:false};
  go('quiz'); renderQ(); window.scrollTo({top:0});
}

// ---- browse ----
let browseFilter='ALL';
function filterBrowse(f,el){
  browseFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  renderBrowse();
}
function renderBrowse(){
  let list=QUESTIONS;
  if(browseFilter==='A') list=QUESTIONS.filter(q=>q.e==='A');
  else if(browseFilter==='B') list=QUESTIONS.filter(q=>q.e==='B');
  else if(browseFilter==='WRONG') list=QUESTIONS.filter(q=>state.wrong[q.id]);
  const box=$('#browseList');
  if(!list.length){
    box.innerHTML='<div class="empty"><div class="e">🎯</div><div class="t">沒有錯題</div><div>做完考卷後答錯的題會出現在這裡</div></div>';
    return;
  }
  box.innerHTML=list.map(q=>itemHTML(q,state.wrong[q.id])).join('');
}
function itemHTML(q,miss){
  return '<div class="item">'
    +'<div class="h"><span class="tag">'+(q.e==='A'?'考A':'考B')+' Q'+q.n+'</span>'
    +(miss?'<span class="miss">待複習</span>':'')+'</div>'
    +'<div class="q">'+esc(q.q)+'</div>'
    +'<div class="ans"><b>正解 '+KEYS[q.a]+'．</b>'+esc(q.o[q.a])+'</div>'
    +'<div class="ex"><b>解析：</b>'+esc(q.x)+'</div></div>';
}

// ---- nav ----
function go(v){
  ['home','quiz','result','browse'].forEach(x=>$('#view-'+x).classList.toggle('hidden',x!==v));
  $('#homeBtn').style.visibility = (v==='home')?'hidden':'visible';
  if(v==='home') refreshHome();
  if(v==='browse') renderBrowse();
  if(v==='quiz'){
    // guard against leaving mid-quiz
  }
  window.scrollTo({top:0});
}

function refreshHome(){
  const w=Object.keys(state.wrong).length;
  const s=Object.keys(state.star).length;
  $('#stWrong').textContent=w;
  $('#stDone').textContent=state.totalDone;
  $('#stAcc').textContent = state.totalDone? Math.round(state.totalOk/state.totalDone*100)+'%':'—';
  $('#wrongCnt').textContent=w+' 題';
  $('#starCnt').textContent=s+' 題';
  $('#wrongBtn').disabled = w===0;
  $('#starBtn').disabled = s===0;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

refreshHome();
go('home');
</script>
</body>
</html>
