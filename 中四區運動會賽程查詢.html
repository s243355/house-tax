  cell=(cell||"").trim();
  if(!cell) return {forfeit:false,people:[]};
  if(/棄權/.test(cell)) return {forfeit:true,people:[]};
  const re=new RegExp("("+STORES.join("|")+")\\s*[：:]","g");
  let m, idxs=[];
  while((m=re.exec(cell))) idxs.push({store:m[1], start:m.index, after:re.lastIndex});
  const people=[];
  const pushNames=(txt,store)=>{
    txt=(txt||"").replace(/[，,]/g,"、");
    txt.split(/[、\s]+/).forEach(raw=>{
      raw=raw.trim(); if(!raw) return;
      let note="";
      const mm=raw.match(/[（(]([^）)]*)[）)]/);
      if(mm){ note=mm[1]; raw=raw.replace(/[（(][^）)]*[）)]/,"").trim(); }
      if(raw) people.push({n:raw, s:store||"", note});
    });
  };
  if(idxs.length===0){ pushNames(cell, fb); return {forfeit:false,people}; }
  if(idxs[0].start>0) pushNames(cell.slice(0,idxs[0].start), fb);
  for(let i=0;i<idxs.length;i++){
    const seg=cell.slice(idxs[i].after, i+1<idxs.length?idxs[i+1].start:cell.length);
    pushNames(seg, idxs[i].store);
  }
  return {forfeit:false,people};
}
function parseCSV(text){
  const rows=[]; let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{ if(c==='"') q=true; else if(c===","){row.push(f);f="";}
      else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";}
      else if(c!=="\r") f+=c; }
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
async function loadLive(){
  try{
    const res=await fetch(LIVE_URL,{cache:"no-store"});
    if(!res.ok) throw 0;
    const rows=parseCSV(await res.text());
    const h=rows.findIndex(r=>r.some(c=>c&&c.indexOf("排序時間")>=0));
    if(h<0) throw 0;
    const head=rows[h].map(x=>(x||"").trim());
    const col=k=>head.findIndex(x=>x.indexOf(k)>=0);
    const cN=col("報名項目"), cF=col("最終"), cNeed=col("需求");
    if(cN<0||cF<0) throw 0;
    let n=0;
    for(let r=h+1;r<rows.length;r++){
      const nm=(rows[r][cN]||"").trim(); if(!nm) continue;
      const ev=EV.find(e=>e.name===nm); if(!ev) continue;
      const pr=parseRoster(rows[r][cF], ev.store);
      ev.people=pr.people; ev.forfeit=pr.forfeit;
      if(cNeed>=0 && (rows[r][cNeed]||"").trim()) ev.need=rows[r][cNeed].trim();
      n++;
    }
    if(!n) throw 0;
    setStatus(true); rebuild();
  }catch(e){ setStatus(false); }
}
function setStatus(live){
  const el=document.getElementById("status");
  if(live){ el.className="status live"; el.textContent="🟢 名單來源：Google 試算表（即時同步）"; }
  else{ el.className="status local"; el.textContent="📄 名單來源：內建名單（更新 8/21，未連上試算表）"; }
}

/* ============ 通用 ============ */
let allNames=[];
function rebuild(){
  allNames=[...new Set(EV.flatMap(e=>e.people.map(p=>p.n)))].sort();
  document.getElementById("nameList").innerHTML=allNames.map(n=>`<option value="${n}">`).join("");
  if(!document.getElementById("viewAll").classList.contains("hidden")) renderAll();
  if(lastQuery) doSearch(true);
}
function switchTab(which){
  const mine=which==="mine";
  document.getElementById("viewMine").classList.toggle("hidden",!mine);
  document.getElementById("viewAll").classList.toggle("hidden",mine);
  document.getElementById("tabMine").classList.toggle("active",mine);
  document.getElementById("tabAll").classList.toggle("active",!mine);
  if(!mine) renderAll();
  window.scrollTo(0,0);
}

/* ============ 我的賽程 ============ */
let lastQuery="";
function doSearch(keep){
  const q=(keep?lastQuery:document.getElementById("nameInput").value).trim().replace(/\s/g,"");
  lastQuery=q;
  const box=document.getElementById("mineResult");
  if(!q){box.innerHTML="";return;}
  const hit=p=> p.n===q || (q.length>=2&&p.n.indexOf(q)>=0) || (p.n.length>=2&&q.indexOf(p.n)>=0);
  let mine=EV.filter(e=>e.people.some(hit)).sort((a,b)=>a.arr-b.arr);
  if(!mine.length){
    box.innerHTML=`<div class="empty"><div class="big">🔍</div>
      <h3>名單裡查不到「${q}」</h3>
      <p>可能是候補、或名字打法不同。<br>可從輸入框建議清單挑選，或問窗口確認。</p></div>`;
    return;
  }
  const earliest=mine[0].t, venues=[...new Set(mine.map(e=>e.venue))];
  const flags={};
  for(let i=1;i<mine.length;i++){
    const a=mine[i-1],b=mine[i],gap=b.arr-a.end;
    if(b.arr<a.end) (flags[i]=flags[i]||[]).push({lv:"hard",msg:`與「${a.name}」時間重疊，需擇一或安排替補`});
    else if(a.venue!==b.venue&&gap<20) (flags[i]=flags[i]||[]).push({lv:"tight",msg:`從「${a.name}」（${V[a.venue].name}）趕過來只有約 ${gap} 分鐘，且要換場館`});
  }
  let html=`<div class="summary"><div class="who">${q}</div>
    <div class="stats">
      <div class="stat"><b>${mine.length}</b>項比賽</div>
      <div class="stat"><b>${earliest}</b>最早到場</div>
      <div class="stat"><b>${venues.length}</b>個場館</div>
    </div>
    <div class="stat" style="margin-top:8px">場館：${venues.map(v=>V[v].name).join("、")}</div></div><div class="rail">`;
  mine.forEach((e,i)=>{
    const me=e.people.find(hit), vc=V[e.venue].cls;
    html+=`<div class="card ${vc}">
      <div class="ctop"><div class="ctime"><small>最早到場</small>${e.t}</div>
        <div class="vtag ${vc}">${V[e.venue].name}</div></div>
      <div class="cname">${e.name}</div>
      <div class="cmeta"><span class="loc">📍 ${e.loc}</span></div>
      <div class="cmeta">🕐 ${e.detail}</div>
      ${me&&me.s?`<div class="cmeta">👤 代表：${me.s}${me.s!==e.store&&e.store?`（窗口：${e.store}）`:""}</div>`:""}
      ${me&&me.note?`<div class="pnote">※ ${me.note}</div>`:""}
      ${(flags[i]||[]).map(f=>`<div class="flag ${f.lv}"><span class="ic">${f.lv==="hard"?"⚠":"⏱"}</span><span>${f.msg}</span></div>`).join("")}
    </div>`;
  });
  box.innerHTML=html+"</div>";
}

/* ============ 全部流程 ============ */
let activeFilter="all";
function renderFilters(){
  const items=[["all","全部"],["heping","和平"],["track","田徑場"],["daan","大安"]];
  document.getElementById("filters").innerHTML=items.map(([k,l])=>
    `<div class="fchip ${activeFilter===k?"on":""}" onclick="setFilter('${k}')">${l}</div>`).join("");
}
function setFilter(k){activeFilter=k;renderFilters();renderAll();}
function renderAll(){
  renderFilters();
  const list=EV.filter(e=>activeFilter==="all"||e.venue===activeFilter);
  document.getElementById("allResult").innerHTML=list.map(e=>{
    const vc=V[e.venue].cls, g={};
    e.people.forEach(p=>{(g[p.s||"—"]=g[p.s||"—"]||[]).push(p.n+(p.note?`（${p.note}）`:""));});
    const roster=Object.entries(g).map(([s,ns])=>`<b>${s}</b>：${ns.join("、")}`).join("　");
    return `<div class="fcard ${vc} ${e.forfeit?"forfeit":""}">
      <div class="ftop"><div class="ftime">${e.t}</div>
        ${e.forfeit?'<span class="forfeit-tag">棄權</span>':`<span class="fstore">窗口 ${e.store||"—"}</span>`}</div>
      <div class="fname">${e.name}</div>
      <div class="fmeta">📍 ${e.loc}　·　🕐 ${e.detail}</div>
      <div class="fmeta">需求 ${e.need} 人${e.note?"　·　"+e.note:""}</div>
      ${e.people.length?`<details><summary>看名單（${e.people.length}）</summary><div class="roster">${roster}</div></details>`:""}
    </div>`;
  }).join("");
}

/* ============ 啟動 ============ */
setStatus(false);
rebuild();
loadLive();
</script>
