</head>

/* ============ 名單解析（自動更新用）============ */
const STORES=["中三區","復興","大國","大園","心高","彰化","彰美","湖濱","中正","國光","心興","大興","大芳","高工","公園"];
function parseRoster(cell, fb){
  cell=(cell||"").trim();
  if(!cell) return {forfeit:false,people:[]};
  if(/棄權/.test(cell)) return {forfeit:true,people:[]};
  const re=new RegExp("("+STORES.join("|")+")\\s*[：:]","g");
  let m, idxs=[];
  while((m=re.exec(cell))) idxs.push({store:m[1], after:re.lastIndex, start:m.index});
  const people=[];
  const push=(txt,store)=>{ (txt||"").replace(/[，,]/g,"、").split(/[、\s]+/).forEach(raw=>{
    raw=raw.trim(); if(!raw) return; let note="";
    const mm=raw.match(/[（(]([^）)]*)[）)]/); if(mm){note=mm[1];raw=raw.replace(/[（(][^）)]*[）)]/,"").trim();}
    if(raw) people.push({n:raw,s:store||"",note}); }); };
  if(!idxs.length){ push(cell,fb); return {forfeit:false,people}; }
  if(idxs[0].start>0) push(cell.slice(0,idxs[0].start),fb);
  for(let i=0;i<idxs.length;i++) push(cell.slice(idxs[i].after, i+1<idxs.length?idxs[i+1].start:cell.length), idxs[i].store);
  return {forfeit:false,people};
}
function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{ if(c==='"')q=true; else if(c===","){row.push(f);f="";}
      else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";} else if(c!=="\r")f+=c; } }
  if(f!==""||row.length){row.push(f);rows.push(row);} return rows;}
async function loadLive(){
  try{
    const res=await fetch(LIVE_URL,{cache:"no-store"}); if(!res.ok) throw 0;
    const rows=parseCSV(await res.text());
    const h=rows.findIndex(r=>r.some(c=>c&&c.indexOf("排序時間")>=0)); if(h<0) throw 0;
    const head=rows[h].map(x=>(x||"").trim()); const col=k=>head.findIndex(x=>x.indexOf(k)>=0);
    const cN=col("報名項目"),cF=col("最終"),cNeed=col("需求"); if(cN<0||cF<0) throw 0;
    let n=0;
    for(let r=h+1;r<rows.length;r++){ const nm=(rows[r][cN]||"").trim(); if(!nm) continue;
      const ev=EV.find(e=>e.name===nm); if(!ev) continue;
      const pr=parseRoster(rows[r][cF],ev.store); ev.people=pr.people; ev.forfeit=pr.forfeit;
      if(cNeed>=0&&(rows[r][cNeed]||"").trim()) ev.need=rows[r][cNeed].trim(); n++; }
    if(!n) throw 0; setStatus(true); rebuild();
  }catch(e){ setStatus(false); }
}
function setStatus(live){ const el=document.getElementById("status");
  if(live){el.className="status live";el.textContent="🟢 名單來源：Google 試算表（即時同步）";}
  else{el.className="status local";el.textContent="📄 名單來源：內建名單（更新 8/21，未連上試算表）";} }

/* ============ 即時 ============ */
function getNow(){
  const p=new URLSearchParams(location.search).get("demo");
  if(p&&/^\d{1,2}:\d{2}$/.test(p)){const[a,b]=p.split(":");return{day:true,min:(+a)*60+(+b)};}
  const d=new Date();
  const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return {day: iso===EVENT_DATE, min:d.getHours()*60+d.getMinutes()};
}
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function evState(e,now){ if(!now.day) return ""; if(now.min>=e.arr&&now.min<e.end) return "live"; if(now.min>=e.end) return "done"; return ""; }
function tickClock(){ const now=getNow(); const el=document.getElementById("clock");
  el.textContent = now.day ? "🔴 現在 "+hhmm(now.min) : ""; }

function esc(s){return (s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");}
function downloadICS(name){
  const evs=EV.filter(e=>!e.forfeit&&e.people.some(p=>same(p.n,name))).sort((a,b)=>a.arr-b.arr);
  const dt="20260902", p2=n=>String(n).padStart(2,"0"), T=m=>dt+"T"+p2(Math.floor(m/60))+p2(m%60)+"00";
  let L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//中四區圓夢運動會//TW//","CALSCALE:GREGORIAN"];
  evs.forEach((e,i)=>{ L.push("BEGIN:VEVENT","UID:sport0902-"+i+"-"+Date.now()+"@local","DTSTAMP:20260821T000000Z",
    "DTSTART:"+T(e.arr),"DTEND:"+T(Math.max(e.end,e.arr+10)),
    "SUMMARY:"+esc(e.name+"（"+V[e.venue].name+"）"),"LOCATION:"+esc(e.loc),
    "DESCRIPTION:"+esc("最早到場 "+e.t+"　"+e.detail),
    "BEGIN:VALARM","TRIGGER:-PT20M","ACTION:DISPLAY","DESCRIPTION:"+esc(e.name+" 準備報到"),"END:VALARM","END:VEVENT"); });
  L.push("END:VCALENDAR");
  const blob=new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name+"_圓夢運動會賽程.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

  if(r.list&&r.list.length) s+=`<div class="rrow"><b>比賽規則</b><ol>${r.list.map(x=>`<li>${x}</li>`).join("")}</ol></div>`;
  if(r.extra) s+=`<div class="rrow"><div class="rx">${r.extra}</div></div>`;
  if(r.note) s+=`<div class="rrow"><b>注意事項</b>${r.note}</div>`;
  if(r.pts) s+=`<div class="rrow"><b>積分</b>${r.pts}</div>`;
  return s+`</div></details>`;
}

/* ============ 我的賽程 ============ */
let lastQuery="";
function doSearch(keep){
  const q=(keep?lastQuery:document.getElementById("nameInput").value).trim().replace(/\s/g,"");
  lastQuery=q; const box=document.getElementById("mineResult");
  if(!q){box.innerHTML="";return;}
  const hit=p=>same(p.n,q);
  let mine=EV.filter(e=>e.people.some(hit)).sort((a,b)=>a.arr-b.arr);
  if(!mine.length){ box.innerHTML=`<div class="empty"><div class="big">🔍</div>
    <h3>名單裡查不到「${q}」</h3><p>可能是候補、或名字打法不同。<br>可從輸入框建議清單挑選，或問窗口確認。</p></div>`; return; }
  const now=getNow();
  const earliest=mine[0].t, venues=[...new Set(mine.map(e=>e.venue))];
  const flags={};
  for(let i=1;i<mine.length;i++){const a=mine[i-1],b=mine[i],gap=b.arr-a.end;
    if(b.arr<a.end)(flags[i]=flags[i]||[]).push({lv:"hard",msg:`與「${a.name}」時間重疊，需擇一或安排替補`});
    else if(a.venue!==b.venue&&gap<20)(flags[i]=flags[i]||[]).push({lv:"tight",msg:`從「${a.name}」（${V[a.venue].name}）趕過來只有約 ${gap} 分鐘，且要換場館`});}
  // banner
  let banner="";
  if(now.day){
    const liveEv=mine.find(e=>now.min>=e.arr&&now.min<e.end);
    const nextEv=mine.find(e=>now.min<e.arr);
    if(liveEv||nextEv){
      banner=`<div class="banner live">`;
      if(liveEv) banner+=`<b>正在進行：${liveEv.name}</b>（${V[liveEv.venue].name}）`;
      if(nextEv) banner+=`<span class="nx">下一場：${nextEv.name}・${nextEv.t} 到場（還有 ${nextEv.arr-now.min} 分）→ ${V[nextEv.venue].name}</span>`;
      if(!liveEv&&!nextEv) banner+=`今日賽程已全部結束 🎉`;
      banner+=`</div>`;
    } else banner=`<div class="banner live">今日賽程已全部結束 🎉</div>`;
  } else {
    banner=`<div class="banner pre">🗓 活動當天（9/2）打開，這裡會即時顯示「正在進行 / 下一場倒數」。</div>`;
  }
  let html=banner+`<div class="summary"><div class="who">${q}</div>
    <div class="stats"><div class="stat"><b>${mine.length}</b>項比賽</div>
      <div class="stat"><b>${earliest}</b>最早到場</div><div class="stat"><b>${venues.length}</b>個場館</div></div>
    <div class="stat" style="margin-top:8px">場館：${venues.map(v=>V[v].name).join("、")}</div>
    <button class="calbtn" onclick="downloadICS('${q}')">📆 加入手機行事曆（賽前20分提醒）</button></div><div class="rail">`;
  const nextEv=now.day?mine.find(e=>now.min<e.arr):null;
  mine.forEach((e,i)=>{
    const me=e.people.find(hit), vc=V[e.venue].cls, st=evState(e,now);
    const isNext=nextEv&&e===nextEv&&st!=="live";
    const stTag = st==="live"?`<div class="cstate live">進行中</div>`: st==="done"?`<div class="cstate done">已結束</div>`: isNext?`<div class="cstate next">下一場</div>`:"";
    html+=`<div class="card ${vc} ${st} ${isNext?'next':''}">${stTag}
      <div class="ctop"><div class="ctime"><small>最早到場</small>${e.t}</div><div class="vtag ${vc}">${V[e.venue].name}</div></div>
      <div class="cname">${e.name}</div>
      <div class="cmeta"><span class="loc">📍 ${e.loc}</span>　${locLink(e)}</div>
      <div class="cmeta">🕐 ${e.detail}</div>
      ${me&&me.s?`<div class="cmeta">👤 代表：${me.s}${me.s!==e.store&&e.store?`（窗口：${e.store}）`:""}</div>`:""}
      ${me&&me.note?`<div class="pnote">※ ${me.note}</div>`:""}
      ${(flags[i]||[]).map(f=>`<div class="flag ${f.lv}"><span class="ic">${f.lv==="hard"?"⚠":"⏱"}</span><span>${f.msg}</span></div>`).join("")}
      ${rulesHTML(e)}
    </div>`;
  });
  box.innerHTML=html+"</div>";
}

/* ============ 全部流程 ============ */
let activeFilter="all";
function renderFilters(){ const items=[["all","全部"],["heping","和平"],["track","田徑場"],["daan","大安"]];
  document.getElementById("filters").innerHTML=items.map(([k,l])=>`<div class="fchip ${activeFilter===k?"on":""}" onclick="setFilter('${k}')">${l}</div>`).join(""); }
function setFilter(k){activeFilter=k;renderFilters();renderAll();}
function renderAll(){
  renderFilters(); const now=getNow();
  const list=EV.filter(e=>activeFilter==="all"||e.venue===activeFilter);
  document.getElementById("allResult").innerHTML=list.map(e=>{
    const vc=V[e.venue].cls, g={}; const live=now.day&&now.min>=e.arr&&now.min<e.end;
    e.people.forEach(p=>{(g[p.s||"—"]=g[p.s||"—"]||[]).push(p.n+(p.note?`（${p.note}）`:""));});
    const roster=Object.entries(g).map(([s,ns])=>`<b>${s}</b>：${ns.join("、")}`).join("　");
    return `<div class="fcard ${vc} ${e.forfeit?"forfeit":""}">
      <div class="ftop"><div class="ftime">${e.t}</div>
        ${e.forfeit?'<span class="forfeit-tag">棄權</span>':(live?'<span class="nowtag">進行中</span>':`<span class="fstore">窗口 ${e.store||"—"}</span>`)}</div>
      <div class="fname">${e.name}</div>
      <div class="fmeta">📍 ${e.loc}　${locLink(e)}</div>
      <div class="fmeta">🕐 ${e.detail}　·　需求 ${e.need} 人${e.note?"　·　"+e.note:""}</div>
      ${e.people.length?`<details><summary>看名單（${e.people.length}）</summary><div class="roster">${roster}</div></details>`:""}
      ${rulesHTML(e)}
    </div>`;
  }).join("");
}

/* ============ 窗口找人 ============ */
function prevOf(name, E){
  const mine=EV.filter(x=>x!==E&&!x.forfeit&&x.people.some(p=>same(p.n,name))).sort((a,b)=>a.arr-b.arr);
  const before=mine.filter(x=>x.arr<E.arr);
  return before.length?before[before.length-1]:null;
}
function renderFind(){
  const box=document.getElementById("findResult");
  const v=document.getElementById("findEvent").value;
  if(v===""){ box.innerHTML=`<div class="empty"><div class="big">🧭</div><h3>選一個項目</h3><p>會列出參賽者，並依「上一場在哪個場館」分組，方便你去找人。</p></div>`; return; }
  const E=EV[+v], vc=V[E.venue].cls;
  let head=`<div class="ehead ${vc}"><div class="en">${E.name}</div>
    <div class="em">🕐 ${E.detail}</div>
    <div class="em">📍 ${E.loc}　${locLink(E)}</div>
    <div class="em">需求 ${E.need} 人・目前名單 ${E.people.length} 人</div>${rulesHTML(E)}</div>`;
  if(E.forfeit){ box.innerHTML=head+`<div class="empty"><div class="big">🚫</div><h3>此項目已棄權</h3></div>`; return; }
  if(!E.people.length){ box.innerHTML=head+`<div class="empty"><h3>尚無名單</h3></div>`; return; }
  const same_v=[], first=[], byV={};
  E.people.forEach(p=>{
    const pv=prevOf(p.n,E);
    if(!pv) first.push({p});
    else if(pv.venue===E.venue) same_v.push({p,pv});
    else (byV[pv.venue]=byV[pv.venue]||[]).push({p,pv});
  });
  const nameCell=(o,cross)=>{
    const tight = o.pv && (E.arr-o.pv.end)<20 && o.pv.venue!==E.venue;
    return `<div class="prow ${tight?'tight':''}"><div class="pn">${o.p.n}<small>${o.p.s||""}</small></div>
      ${o.pv?`<div class="pp">上一場：${o.pv.t} ${o.pv.name}（${V[o.pv.venue].name}）${tight?'・⏱ 可能剛結束、較晚到':''}</div>`:`<div class="pp">本日首場（從報到處／外部到）</div>`}</div>`;
  };
  let html=head;
  if(same_v.length) html+=`<div class="grp"><h4>✅ 已在本場館（上一場同場地，好找）・${same_v.length}人</h4>${same_v.map(o=>nameCell(o)).join("")}</div>`;
  Object.keys(byV).forEach(vv=>{ html+=`<div class="grp cross"><h4>🚶 從 ${V[vv].name} 過來・${byV[vv].length}人</h4>${byV[vv].map(o=>nameCell(o,true)).join("")}</div>`; });
  if(first.length) html+=`<div class="grp first"><h4>🆕 本日首場（從報到處／外部到）・${first.length}人</h4>${first.map(o=>nameCell(o)).join("")}</div>`;
  box.innerHTML=html;
}

/* ============ 啟動 ============ */
setStatus(false); rebuild(); tickClock(); loadLive();
setInterval(()=>{ tickClock();
  const now=getNow();
  if(now.day){ if(lastQuery&&!document.getElementById("view-mine").classList.contains("hidden")) doSearch(true);
    if(!document.getElementById("view-all").classList.contains("hidden")) renderAll(); }
},60000);
</script>
