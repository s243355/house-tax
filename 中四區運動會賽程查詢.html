<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a8a43">
<title>中四區・圓夢運動會 9/2 賽程查詢</title>
<style>
  :root{
    --green:#0a8a43; --green-d:#076c34; --green-l:#e7f4ec;
    --ink:#122017; --muted:#5c6b60; --line:#e2e8e2; --bg:#f5f8f4; --card:#ffffff;
    --heping:#e07a2f; --track:#2f6fb3; --daan:#7a54c2;
    --warn:#c0392b; --warn-bg:#fdecea; --tight:#b8791b; --tight-bg:#fdf3e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    font-size:15px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto; min-height:100vh; background:var(--bg)}
  .num{font-variant-numeric:tabular-nums; letter-spacing:.5px}

  /* Header */
  header{
    background:linear-gradient(160deg,var(--green) 0%,var(--green-d) 100%);
    color:#fff; padding:18px 20px 20px; position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(7,108,52,.18);
  }
  .eyebrow{font-size:12px; letter-spacing:2px; opacity:.85; font-weight:600}
  header h1{font-size:20px; font-weight:800; margin-top:3px; letter-spacing:.5px}
  .datechip{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    background:rgba(255,255,255,.16); padding:5px 11px; border-radius:20px;
    font-size:12.5px; font-weight:600;
  }
  .datechip b{font-size:13px}

  /* Tabs */
  .tabs{display:flex; gap:6px; padding:12px 16px 4px; position:sticky; top:78px; background:var(--bg); z-index:15}
  .tab{
    flex:1; text-align:center; padding:10px 8px; border-radius:12px; font-weight:700;
    font-size:14px; background:#fff; color:var(--muted); border:1px solid var(--line);
    cursor:pointer; transition:.15s; user-select:none;
  }
  .tab.active{background:var(--green); color:#fff; border-color:var(--green)}

  section{padding:8px 16px 40px}
  .hidden{display:none}

  /* Search */
  .searchbox{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:8px}
  .searchbox label{font-size:13px; font-weight:700; color:var(--muted); display:block; margin-bottom:8px}
  .inrow{display:flex; gap:8px}
  #nameInput{
    flex:1; padding:13px 14px; font-size:16px; border:1.5px solid var(--line);
    border-radius:12px; outline:none; background:#fff; font-family:inherit;
  }
  #nameInput:focus{border-color:var(--green)}
  .btn{
    padding:0 18px; background:var(--green); color:#fff; border:none; border-radius:12px;
    font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;
  }
  .btn:active{background:var(--green-d)}
  .hint{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6}

  /* Personal summary */
  .summary{
    margin-top:14px; background:var(--green-l); border:1px solid #cfe8d8; border-radius:16px; padding:14px 16px;
  }
  .summary .who{font-size:19px; font-weight:800; color:var(--green-d)}
  .summary .stats{display:flex; gap:16px; margin-top:8px; flex-wrap:wrap}
  .stat{font-size:13px; color:#2c5a3e}
  .stat b{font-size:17px; display:block; font-variant-numeric:tabular-nums}

  /* Rail cards */
  .rail{margin-top:14px; position:relative; padding-left:6px}
  .card{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px 13px 16px; margin-bottom:11px; border-left:5px solid var(--line);
  }
  .card.v-heping{border-left-color:var(--heping)}
  .card.v-track{border-left-color:var(--track)}
  .card.v-daan{border-left-color:var(--daan)}
  .ctop{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .ctime{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink)}
  .ctime small{font-size:11px; font-weight:700; color:var(--muted); display:block; letter-spacing:1px}
  .vtag{font-size:11px; font-weight:800; padding:4px 9px; border-radius:20px; white-space:nowrap; color:#fff}
  .vtag.v-heping{background:var(--heping)} .vtag.v-track{background:var(--track)} .vtag.v-daan{background:var(--daan)}
  .cname{font-size:17px; font-weight:800; margin-top:8px}
  .cmeta{font-size:13px; color:var(--muted); margin-top:4px}
  .cmeta .loc{font-weight:600; color:#3a4a3f}
  .pnote{font-size:12.5px; margin-top:6px; color:var(--tight); font-weight:600}

  .flag{
    margin-top:9px; padding:9px 11px; border-radius:10px; font-size:12.5px; font-weight:600; line-height:1.5;
    display:flex; gap:7px; align-items:flex-start;
  }
  .flag.hard{background:var(--warn-bg); color:var(--warn)}
  .flag.tight{background:var(--tight-bg); color:var(--tight)}
  .flag .ic{font-weight:900}

  /* empty */
  .empty{text-align:center; padding:36px 20px; color:var(--muted)}
  .empty .big{font-size:40px; margin-bottom:8px}
  .empty h3{font-size:16px; color:var(--ink); margin-bottom:6px}

  /* Full flow */
  .legend{display:flex; gap:14px; flex-wrap:wrap; padding:12px 2px 4px; font-size:12.5px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:6px; font-weight:600}
  .dot{width:11px; height:11px; border-radius:50%}
  .dot.v-heping{background:var(--heping)} .dot.v-track{background:var(--track)} .dot.v-daan{background:var(--daan)}
  .filters{display:flex; gap:7px; flex-wrap:wrap; padding:6px 0 12px}
  .fchip{
    font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--muted); cursor:pointer; user-select:none;
  }
  .fchip.on{background:var(--ink); color:#fff; border-color:var(--ink)}

  .fcard{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    margin-bottom:10px; border-left:5px solid var(--line);
  }
  .fcard.v-heping{border-left-color:var(--heping)}
  .fcard.v-track{border-left-color:var(--track)}
  .fcard.v-daan{border-left-color:var(--daan)}
  .fcard.forfeit{opacity:.55}
  .ftop{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .ftime{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums}
  .fname{font-size:16px; font-weight:800; margin-top:6px}
  .fstore{font-size:11px; font-weight:800; color:var(--green-d); background:var(--green-l); padding:3px 8px; border-radius:6px; margin-left:6px; white-space:nowrap}
  .fmeta{font-size:12.5px; color:var(--muted); margin-top:4px}
  details{margin-top:8px}
  summary{font-size:12.5px; font-weight:700; color:var(--green-d); cursor:pointer; list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ "; }
  details[open] summary::before{content:"▾ "}
  .roster{font-size:12.5px; color:#3a4a3f; margin-top:7px; line-height:1.7}
  .roster b{color:var(--green-d)}
  .forfeit-tag{font-size:12px; font-weight:800; color:var(--warn); background:var(--warn-bg); padding:3px 9px; border-radius:6px}

  footer{padding:18px 20px 30px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.7}
</style>
</head>

</div>

/* ---------- tabs ---------- */
function switchTab(which){
  const mine=which==='mine';
  document.getElementById('viewMine').classList.toggle('hidden',!mine);
  document.getElementById('viewAll').classList.toggle('hidden',mine);
  document.getElementById('tabMine').classList.toggle('active',mine);
  document.getElementById('tabAll').classList.toggle('active',!mine);
  if(!mine) renderAll();
  window.scrollTo(0,0);
}

/* ---------- personal search ---------- */
function doSearch(){
  const raw=document.getElementById('nameInput').value.trim().replace(/\s/g,'');
  const box=document.getElementById('mineResult');
  if(!raw){box.innerHTML='';return;}
  let mine=EV.filter(e=>e.people.some(p=>p.n===raw));
  if(!mine.length) mine=EV.filter(e=>e.people.some(p=>p.n.includes(raw)));
  if(!mine.length){
    box.innerHTML=`<div class="empty"><div class="big">🔍</div>
      <h3>名單裡查不到「${raw}」</h3>
      <p>可能是候補、或名字打法不同。<br>可從輸入框的建議清單挑選，或問窗口確認。</p></div>`;
    return;
  }
  mine=[...mine].sort((a,b)=>a.arr-b.arr);

  // stats
  const earliest=mine[0].t;
  const venues=[...new Set(mine.map(e=>e.venue))];
  const vNames=venues.map(v=>V[v].name).join('、');

  // conflict detection between consecutive events
  const flags={}; // eventIndex -> [flag]
  for(let i=1;i<mine.length;i++){
    const a=mine[i-1], b=mine[i];
    const gap=b.arr-a.end;
    if(b.arr < a.end){
      pushFlag(flags,i,'hard',`與「${a.name}」時間重疊，需擇一或安排替補`);
    }else if(a.venue!==b.venue && gap<20){
      pushFlag(flags,i,'tight',`從「${a.name}」（${V[a.venue].name}）趕到這裡只有約 ${gap} 分鐘，且要換場館`);
    }
  }

  let html=`<div class="summary">
    <div class="who">${raw}</div>
    <div class="stats">
      <div class="stat"><b>${mine.length}</b>項比賽</div>
      <div class="stat"><b>${earliest}</b>最早到場</div>
      <div class="stat"><b>${venues.length}</b>個場館</div>
    </div>
    <div class="stat" style="margin-top:8px">場館：${vNames}</div>
  </div><div class="rail">`;

  mine.forEach((e,i)=>{
    const me=e.people.find(p=>p.n===raw)||e.people.find(p=>p.n.includes(raw));
    const vc=V[e.venue].cls;
    html+=`<div class="card ${vc}">
      <div class="ctop">
        <div class="ctime"><small>最早到場</small>${e.t}</div>
        <div class="vtag ${vc}">${V[e.venue].name}</div>
      </div>
      <div class="cname">${e.name}</div>
      <div class="cmeta"><span class="loc">📍 ${e.loc}</span></div>
      <div class="cmeta">🕐 ${e.detail}</div>
      <div class="cmeta">👤 代表：${me?me.s:''}${me&&me.s!==e.store?`（窗口：${e.store}）`:''}</div>
      ${me&&me.note?`<div class="pnote">※ ${me.note}</div>`:''}
      ${(flags[i]||[]).map(f=>`<div class="flag ${f.lv}"><span class="ic">${f.lv==='hard'?'⚠':'⏱'}</span><span>${f.msg}</span></div>`).join('')}
    </div>`;
  });
  html+=`</div>`;
  box.innerHTML=html;
}
function pushFlag(o,i,lv,msg){(o[i]=o[i]||[]).push({lv,msg});}

/* ---------- full flow ---------- */
let activeFilter='all';
function renderFilters(){
  const box=document.getElementById('filters');
  const items=[['all','全部'],['heping','和平'],['track','田徑場'],['daan','大安']];
  box.innerHTML=items.map(([k,l])=>
    `<div class="fchip ${activeFilter===k?'on':''}" onclick="setFilter('${k}')">${l}</div>`).join('');
}
function setFilter(k){activeFilter=k; renderFilters(); renderAll();}
function renderAll(){
  renderFilters();
  const box=document.getElementById('allResult');
  const list=EV.filter(e=>activeFilter==='all'||e.venue===activeFilter);
  box.innerHTML=list.map(e=>{
    const vc=V[e.venue].cls;
    const roster=groupRoster(e.people);
    return `<div class="fcard ${vc} ${e.forfeit?'forfeit':''}">
      <div class="ftop">
        <div class="ftime">${e.t}</div>
        ${e.forfeit?'<span class="forfeit-tag">棄權</span>':`<span class="fstore">窗口 ${e.store}</span>`}
      </div>
      <div class="fname">${e.name}</div>
      <div class="fmeta">📍 ${e.loc}　·　🕐 ${e.detail}</div>
      <div class="fmeta">需求 ${e.need} 人${e.note?'　·　'+e.note:''}</div>
      ${e.people.length?`<details><summary>看名單（${e.people.length}）</summary><div class="roster">${roster}</div></details>`:''}
    </div>`;
  }).join('');
}
function groupRoster(people){
  const g={};
  people.forEach(p=>{(g[p.s]=g[p.s]||[]).push(p.n+(p.note?`（${p.note}）`:''));});
  return Object.entries(g).map(([s,ns])=>`<b>${s}</b>：${ns.join('、')}`).join('　');
}

renderFilters();
</script>
